# Zig from ziglang.org. Unmanaged toolchain: another version is another layer
# definition selected as `zig@<version>` (ADR 0062, B5). The x86_64 and
# aarch64 artifacts are listed explicitly; sha256
# values are the `shasum` entries of https://ziglang.org/download/index.json.
# Zig's global cache defaults under the provider's $HOME.
name: zig
version: 0.16.0
tier: shared
provides: [toolchain:zig, toolchain:zig@0.16.0]
requires: []
pins:
  zig:
    version: 0.16.0
    artifacts:
      amd64:
        url: https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz
        sha256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        unpack: tar.xz
      arm64:
        url: https://ziglang.org/download/0.16.0/zig-aarch64-linux-0.16.0.tar.xz
        sha256: ea4b09bfb22ec6f6c6ceac57ab63efb6b46e17ab08d21f69f3a48b38e1534f17
        unpack: tar.xz
probe: |
  set -eu
  test "$(zig version)" = 0.16.0
  zig env >/dev/null
context_files: []
build_secrets: []
