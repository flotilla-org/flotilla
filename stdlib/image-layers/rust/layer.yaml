# Rust through rustup: the manager plus a read-only default toolchain
# (ADR 0062, B5). A repo's rust-toolchain.toml stays the single source of
# truth; other versions install on demand under the provider's $HOME. The
# runtime design is described in Dockerfile.fragment and prelude.d/40-rust.sh.
#
# Per-architecture artifacts list each URL and sha256 explicitly; the
# generator supplies the target architecture's entry to the fragment.
name: rust
version: 1.99.0
tier: shared
provides: [toolchain:rust, toolchain:rust@1.99.0]
requires: []
pins:
  rustup:
    version: 1.29.1
    artifacts:
      amd64:
        url: https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init
        sha256: dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71
        unpack: file
      arm64:
        url: https://static.rust-lang.org/rustup/archive/1.29.1/aarch64-unknown-linux-gnu/rustup-init
        sha256: 15f6e4ce9f583b929c996c91562bad6d4454f3281de858b02cdfdef615fac433
        unpack: file
  rust:
    # The channel manifest rustup reads for this release. Checking it pins
    # the component hashes rustup then verifies on every download.
    version: 1.99.0
    artifacts:
      any:
        url: https://static.rust-lang.org/dist/channel-rust-1.99.0.toml
        sha256: ce6dddc886364f8d786514771212cebe9b731ba82d6b859951c6b0ccc516b6a2
        unpack: file
probe: |
  set -eu
  test "$(rustc --version | cut -d ' ' -f 2)" = 1.99.0
  rustup --version >/dev/null
  cargo --version
  cargo clippy --version
  cargo fmt --version
  work="$(mktemp -d)"
  printf 'fn main() {\n    println!("rust toolchain ready");\n}\n' > "$work/main.rs"
  rustfmt --check "$work/main.rs"
  rustc --edition 2021 -o "$work/main" "$work/main.rs"
  "$work/main"
  # A checkout pinning the baked release and components must resolve offline
  # through the seeded $HOME, without downloading.
  printf '[toolchain]\nchannel = "1.99.0"\nprofile = "minimal"\ncomponents = ["rustfmt", "clippy", "llvm-tools-preview"]\ntargets = ["wasm32-unknown-unknown"]\n' > "$work/rust-toolchain.toml"
  printf 'pub fn ready() {}\n' > "$work/lib.rs"
  (cd "$work" && test "$(rustc --version | cut -d ' ' -f 2)" = 1.99.0 \
      && rustc --edition 2021 --crate-type rlib --target wasm32-unknown-unknown -o "$work/libready.rlib" lib.rs)
  rm -rf "$work"
context_files:
  - prelude.d/40-rust.sh
build_secrets: []
