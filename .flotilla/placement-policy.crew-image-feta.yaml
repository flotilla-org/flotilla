apiVersion: flotilla.work/v1
kind: PlacementPolicy
metadata:
  name: docker-crew-image-feta
  namespace: flotilla
# No `image`: the vessel runs its composed image, selected by the Project's
# `image:` block, its leg needs and its crews' harnesses (ADR 0062).
spec:
  pool: cleat
  docker_per_vessel:
    host_ref: d783f8a7-6b6f-44a9-bd04-5e6e2d43f878
    memory_policy:
      host_memory_percent: 50
      expected_concurrent_crews: 4
      swap_bytes: 0
    pull_policy: always
    agent_adapters:
      - claude-code
      - codex
    default_cwd: /workspace
    env: {}
    checkout:
      worktree_on_host_and_mount:
        mount_path: /workspace
