apiVersion: flotilla.work/v1
kind: EnvironmentProvider
metadata:
  # <host>.<realisation>: the settings of udder's Docker provider (ADR 0058).
  name: b2aac222-c72f-458e-baa0-b089c52c16af.docker_per_vessel
  namespace: flotilla
# How udder's Docker provider runs every per-vessel crew, whichever fulfilment
# kind placed it. These were docker-crew-image-udder's settings (#3824 layer 4).
spec:
  host_ref: b2aac222-c72f-458e-baa0-b089c52c16af
  realisation: docker_per_vessel
  memory_policy:
    host_memory_percent: 50
    expected_concurrent_crews: 4
    swap_bytes: 0
  pull_policy: always
  default_cwd: /workspace
  env: {}
  checkout:
    worktree_on_host_and_mount:
      mount_path: /workspace
