apiVersion: flotilla.work/v1
kind: PlacementPolicy
metadata:
  name: docker-crew-image-udder
  namespace: flotilla
# No `image`: the vessel runs its composed image, selected by the Project's
# `image:` block, its leg needs and its crews' harnesses (ADR 0062).
# `agent_adapters` is omitted too: it constrains only literal images, and a
# composed image carries exactly the harness layers its roles resolve to.
spec:
  pool: cleat
  docker_per_vessel:
    host_ref: b2aac222-c72f-458e-baa0-b089c52c16af
    memory_policy:
      host_memory_percent: 50
      expected_concurrent_crews: 4
      swap_bytes: 0
    pull_policy: always
    default_cwd: /workspace
    env: {}
    checkout:
      worktree_on_host_and_mount:
        mount_path: /workspace
