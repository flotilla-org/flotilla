apiVersion: flotilla.work/v1
kind: PlacementPolicy
metadata:
  name: docker-crew-image-udder
  namespace: flotilla
  annotations:
    flotilla.work/image-recipe: .flotilla/Dockerfile.crew
spec:
  pool: cleat
  docker_per_vessel:
    host_ref: b2aac222-c72f-458e-baa0-b089c52c16af
    image:
      image_baseline_ref: fleet-crew
    pull_policy: always
    agent_adapters:
      - claude-code
      - codex
    default_cwd: /workspace
    env: {}
    checkout:
      worktree_on_host_and_mount:
        mount_path: /workspace
