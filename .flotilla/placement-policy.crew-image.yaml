apiVersion: flotilla.work/v1
kind: PlacementPolicy
metadata:
  name: docker-crew-image-kiwi
  namespace: flotilla
  annotations:
    flotilla.work/image-recipe: .flotilla/Dockerfile.crew
spec:
  pool: cleat
  docker_per_vessel:
    host_ref: d49f4c59-811f-44aa-a4ca-d4cac66cf2a3
    image:
      image_baseline_ref: fleet-crew
    memory_policy:
      host_memory_percent: 50
      expected_concurrent_crews: 4
      swap_bytes: 0
    pull_policy: always
    agent_adapters:
      - claude-code
      - codex
    default_cwd: /workspace
    env: {}
    checkout:
      worktree_on_host_and_mount:
        mount_path: /workspace
