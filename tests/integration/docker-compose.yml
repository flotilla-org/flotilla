services:
  node-a:
    build:
      context: ../..
      dockerfile: tests/integration/docker/base/Dockerfile
      target: ${FLOTILLA_BASE_TARGET:-full}
      args:
        FLOTILLA_BIN_DIR: ${FLOTILLA_BIN_DIR:-target/release}
    hostname: node-a
    volumes:
      - shared-keys:/shared-keys

  node-b:
    build:
      context: ../..
      dockerfile: tests/integration/docker/base/Dockerfile
      target: ${FLOTILLA_BASE_TARGET:-full}
      args:
        FLOTILLA_BIN_DIR: ${FLOTILLA_BIN_DIR:-target/release}
    hostname: node-b
    volumes:
      - shared-keys:/shared-keys

volumes:
  shared-keys:
