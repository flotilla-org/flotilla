[package]
name = "flotilla-protocol"
version = "0.1.0"
edition = "2021"
license.workspace = true

[build-dependencies]
sha2 = "0.10"

[features]
# Keep helper features uniform across build/workspace/package commands on stable.
default = []

[dependencies]
base64 = "0.22"
bon = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
indexmap = { workspace = true, features = ["serde"] }
gethostname = "1.1.0"
tracing = { workspace = true }
url = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
serde_yml = "0.0.12"
sha2 = "0.10"
tempfile = "3"

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
