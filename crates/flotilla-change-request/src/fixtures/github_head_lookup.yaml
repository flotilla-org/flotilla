    body: '[{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2506","id":4725663371,"node_id":"PR_kwDORel_088AAAABGavmiw","html_url":"https://github.com/flotilla-org/flotilla/pull/2506","diff_url":"https://github.com/flotilla-org/flotilla/pull/2506.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2506.patch","issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2506","number":2506,"state":"closed","locked":false,"title":"fix: classify observer rate limits and wait for fresh evidence","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"body":"The observer treated secondary rate-limit responses as primary exhaustion and cached their unrelated hourly reset. The operator measured 11/5000 primary points used while feta was still reporting a different reset deadline. Completion reads could also bypass the cached cooldown.\n\nInstrument every production observer GraphQL batch/history call with response status, quota headers, Retry-After, error types/messages, shape, subject count, cost and latency, plus a cycle aggregate that distinguishes missing cost data. Transport failures record an explicit unknown HTTP status. Classify errors from error fields and remaining quota; use the actual Retry-After/primary reset, with an explicitly labeled one-minute secondary fallback when GitHub supplies no delay. Stop history follow-ups during a cooldown and apply it to fresh completion reads and newly admitted subjects.\n\nA rate-limited `crew complete` now states a timed wait and the CLI retries the same claim at the deadline without adding refusal strikes or marking Done. Readiness gates still require fresh evidence. Landing keeps its exit gates and treats the observed maker as pending until the retry deadline. The CLI owns the live retry; interruption requires resubmitting the claim. TUI displays the wait and permits resubmission.\n\nThe operator-authorized reduced scope leaves fleet cost/secondary-trigger attribution for acceptance after deployment. Earlier nine-subject queries measured on the separate injected App identity cost 2+1+1+1; no historical 5000-point expenditure is claimed. `docs/github-observer-diagnostics.md` describes the trace and acceptance procedure. No stored resource shapes change; no out-of-repository resource authors need updates.\n\nCloses #2499.\n\nValidation:\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` using default TMPDIR\n- Real GitHub replay re-recorded with `REPLAY=record`; classifier properties, pagination, telemetry secrecy/aggregation, in-memory completion and landing, and paused-clock CLI retry coverage.\n\n### Mutation check\n\n- Invert the zero-remaining primary comparison: the secondary-backoff property fails by selecting the unrelated primary reset.\n- Let fresh completion bypass its cooldown: the in-process wait scenario fails on an extra network call.\n- Remove the history cooldown: the generated multi-subject pagination property detects follow-up calls during the limit.\n- Allow zero-duration cache expiry: the simultaneous UTC/monotonic boundary test fails.\n- Keep a stale claim-time error after recovery: the in-memory refresher recovery test fails.\n\nAll mutations were reverted. The secondary-backoff property also failed against the original implementation before the fix.\n\nFollow-up from review: #2510 tracks typed observation errors across lifecycle consumers and mixed limited-plus-hard-error completion coverage.\n","created_at":"2026-10-03T09:55:44Z","updated_at":"2026-10-03T16:03:12Z","closed_at":"2026-10-03T11:50:43Z","merged_at":"2026-10-03T11:50:43Z","merge_commit_sha":"228f70cffde51ca9fa49093f3ca2349d65e09011","assignees":[],"requested_reviewers":[],"requested_teams":[],"labels":[],"milestone":null,"draft":false,"commits_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2506/commits","review_comments_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2506/comments","review_comment_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/comments{/number}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2506/comments","statuses_url":"https://api.github.com/repos/flotilla-org/flotilla/statuses/9e7375041a0169c232cac531ec5dcd4963ba7173","head":{"label":"flotilla-org:fix/observer-budget","ref":"fix/observer-budget","sha":"9e7375041a0169c232cac531ec5dcd4963ba7173","user":{"login":"flotilla-org","id":269690888,"node_id":"O_kgDOEBMoCA","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-org","html_url":"https://github.com/flotilla-org","followers_url":"https://api.github.com/users/flotilla-org/followers","following_url":"https://api.github.com/users/flotilla-org/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-org/gists{/gist_id}",