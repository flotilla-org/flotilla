[package]
name = "flotilla-credentials"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
aws-lc-provider = ["flotilla-core/aws-lc-provider", "flotilla-tls/aws-lc-provider"]
skip-no-sandbox-tests = ["flotilla-core/skip-no-sandbox-tests", "flotilla-store/skip-no-sandbox-tests"]

[dependencies]
flotilla-tls = { path = "../flotilla-tls" }
flotilla-store = { path = "../flotilla-store" }
flotilla-core = { path = "../flotilla-core" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
async-trait = { workspace = true }
bon = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
serde = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
url = { workspace = true }
tempfile = "3"
futures = "0.3"

[dev-dependencies]
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-credentials-testkit = { path = "../flotilla-credentials-testkit" }
flotilla-discovery-testkit = { path = "../flotilla-discovery-testkit" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
flotilla-store-testkit = { path = "../flotilla-store-testkit" }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
http = "1"
hegeltest = "=0.48.1"

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-hmac = { path = "../flotilla-build-features-hmac" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-signing = { path = "../flotilla-build-features-signing" }
flotilla-build-features-sqlite = { path = "../flotilla-build-features-sqlite" }
flotilla-build-features-time = { path = "../flotilla-build-features-time" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
