# Maintenance: see docs/measurements/2747-build-graph.md (Maintaining the feature anchors).
[package]
name = "flotilla-build-features-http"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Static feature selections only; every consumer already uses these dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
form_urlencoded = { version = "1" }
futures-channel = { version = "0.3", features = ["sink"] }
futures-task = { version = "0.3", default-features = false, features = ["std"] }
futures-util = { version = "0.3", features = ["channel", "io", "sink"] }
getrandom = { version = "0.2", default-features = false, features = ["std"] }
hashbrown = { version = "0.16", features = ["raw-entry"] }
hyper = { version = "1", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "native-tokio", "ring", "tls12"] }
hyper-util = { version = "0.1", features = ["client-legacy", "client-proxy-system", "http1", "http2", "server", "service", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
libc = { version = "0.2" }
log = { version = "0.4", default-features = false, features = ["std"] }
memchr = { version = "2" }
mio = { version = "1", features = ["net", "os-ext", "os-poll"] }
once_cell = { version = "1", features = ["std"] }
percent-encoding = { version = "2" }
rand = { version = "0.9", features = ["small_rng"] }
reqwest = { version = "0.13", default-features = false, features = ["charset", "http2", "json", "query", "rustls-no-provider", "stream", "system-proxy"] }
ring = { version = "0.17", features = ["std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_core = { version = "1", features = ["alloc"] }
serde_json = { version = "1", features = ["raw_value"] }
smallvec = { version = "1", default-features = false, features = ["const_generics", "const_new"] }
subtle = { version = "2" }
tokio = { version = "1", features = ["full"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-util = { version = "0.7", features = ["codec", "io", "rt"] }
tower = { version = "0.5", default-features = false, features = ["make", "retry", "timeout", "util"] }
tracing = { version = "0.1" }
tracing-core = { version = "0.1" }
zeroize = { version = "1", features = ["derive"] }

[dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
