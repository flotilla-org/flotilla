[package]
name = "flotilla-store-testkit"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[features]
default = []
skip-no-sandbox-tests = []

[dependencies]
flotilla-store-sqlite = { path = "../flotilla-store-sqlite" }
flotilla-store-memory = { path = "../flotilla-store-memory" }
flotilla-store = { path = "../flotilla-store" }
flotilla-protocol = { path = "../flotilla-protocol" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
futures = "0.3"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
uuid = { workspace = true, features = ["v4"] }

flotilla-resources = { path = "../flotilla-resources" }

[lints]
workspace = true

[dev-dependencies]
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
tracing.workspace = true
rusqlite = { version = "0.37", features = ["bundled", "functions"] }
serde_yml = "0.0.12"
hegeltest = "=0.48.1"
rstest.workspace = true
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

tokio = { workspace = true, features = ["test-util"] }
