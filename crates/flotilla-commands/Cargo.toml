[package]
name = "flotilla-commands"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-protocol = { path = "../flotilla-protocol" }
bon = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4", features = ["derive", "string"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hegeltest = "=0.48.1"
tempfile = "3"

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
