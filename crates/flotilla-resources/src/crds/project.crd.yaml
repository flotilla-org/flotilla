apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: projects
    singular: project
    kind: Project
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [display_name, repositories]
              properties:
                charter:
                  type: object
                  nullable: true
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [inline, repository]
                    documents:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    files:
                      type: object
                      additionalProperties:
                        type: string
                    repo:
                      type: string
                      minLength: 1
                    branch:
                      type: string
                      minLength: 1
                    path:
                      type: string
                parent:
                  type: string
                  nullable: true
                  minLength: 1
                display_name:
                  type: string
                  minLength: 1
                default_workflow_ref:
                  type: string
                role_definitions:
                  type: object
                  additionalProperties:
                    type: object
                    properties:
                      agent: {type: string}
                      model: {type: string}
                      workflow: {type: string}
                      brief_template: {type: string}
                charter_prose:
                  type: object
                  additionalProperties: {type: string}
                supervision:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                issue_source:
                  type: object
                  required: [service, scope]
                  properties:
                    service:
                      type: string
                    scope:
                      type: string
                dispatch_policy:
                  type: object
                  properties:
                    overlap_policy:
                      type: object
                      nullable: true
                      required: [land_after_threshold]
                      properties:
                        land_after_threshold: {type: integer, minimum: 1}
                    enabled:
                      type: boolean
                      default: true
                    project_share:
                      type: integer
                      minimum: 1
                      default: 1
                    routine_lane:
                      type: string
                      minLength: 1
                      default: routine
                    lanes:
                      type: array
                      items:
                        type: object
                        required: [mission, labels]
                        properties:
                          mission:
                            type: string
                          labels:
                            type: array
                            items: {type: string}
                    missions:
                      type: array
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            minLength: 1
                          issue:
                            type: object
                            nullable: true
                            x-kubernetes-preserve-unknown-fields: true
                          attributes:
                            type: object
                            properties:
                              value: {type: number}
                              class_of_service:
                                type: string
                                enum: [expedite, standard, background]
                              crew_limit:
                                type: integer
                                nullable: true
                                minimum: 0
                    stale_after_seconds:
                      type: integer
                      minimum: 1
                      default: 3600
                repositories:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [repo]
                    properties:
                      repo:
                        type: string
                      alias:
                        type: string
                        minLength: 1
                      roles:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
                          enum: [code, ops, knowledge]
                      subpath:
                        type: string
                      charter_store:
                        type: object
                        required: [host, source]
                        properties:
                          host:
                            type: string
                          source:
                            type: object
                            required: [kind]
                            properties:
                              kind:
                                type: string
                                enum: [repository, local_directory]
                              repo:
                                type: string
                              branch:
                                type: string
                              path:
                                type: string
                              directory:
                                type: string
                      default_branch:
                        type: string
            status:
              type: object
              properties:
                declaration_refused:
                  type: object
                  required: [entry_path, message, since, observed_at]
                  properties:
                    entry_path:
                      type: string
                    message:
                      type: string
                    since:
                      type: string
                      format: date-time
                    observed_at:
                      type: string
                      format: date-time
                dispatch_queue:
                  type: array
                  items:
                    type: object
                    required: [issue, title, issue_as_of, ready_observed_at, observed_at, provenance]
                    properties:
                      score:
                        type: object
                        nullable: true
                        x-kubernetes-preserve-unknown-fields: true
                      issue:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      title:
                        type: string
                      issue_as_of:
                        type: string
                        format: date-time
                      ready_observed_at:
                        type: string
                        format: date-time
                      observed_at:
                        type: string
                        format: date-time
                      provenance:
                        type: string
                dispatch_queue_error:
                  type: string
                dispatch_queue_attention:
                  type: object
                  required: [count, oldest_ready_observed_at, stale_since, observed_at]
                  properties:
                    count:
                      type: integer
                      minimum: 1
                    oldest_ready_observed_at:
                      type: string
                      format: date-time
                    stale_since:
                      type: string
                      format: date-time
                    observed_at:
                      type: string
                      format: date-time
