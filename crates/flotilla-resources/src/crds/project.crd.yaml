apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: projects.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: projects
    singular: project
    kind: Project
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [display_name, default_workflow_ref, repositories]
              properties:
                display_name:
                  type: string
                  minLength: 1
                default_workflow_ref:
                  type: string
                  minLength: 1
                issue_source:
                  type: object
                  required: [service, scope]
                  properties:
                    service:
                      type: string
                    scope:
                      type: string
                dispatch_policy:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: true
                    max_concurrent:
                      type: integer
                      minimum: 1
                      default: 3
                    placement_policy:
                      type: string
                      minLength: 1
                    stance_preference:
                      type: string
                      enum: [trusted, workspace-write, contained]
                      default: contained
                repositories:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [repo]
                    properties:
                      repo:
                        type: string
                      alias:
                        type: string
                        minLength: 1
                      roles:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
                          enum: [code, ops, knowledge]
                      subpath:
                        type: string
                      default_branch:
                        type: string
            status:
              type: object
              properties:
                dispatch_attention:
                  type: object
                  required: [issue, issue_as_of, policy, reason, observed_at]
                  x-kubernetes-preserve-unknown-fields: true
