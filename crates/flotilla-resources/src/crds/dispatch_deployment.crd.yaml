apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dispatchdeployments.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: dispatchdeployments
    singular: dispatchdeployment
    kind: DispatchDeployment
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [issue, installation, revision, deployed_at]
              properties:
                issue:
                    type: object
                    required: [source, id]
                    properties:
                      id: {type: string}
                      source:
                        type: object
                        required: [service, scope]
                        properties:
                          service: {type: string}
                          scope: {type: string}
                installation: {type: string, minLength: 1}
                revision: {type: string, minLength: 1}
                deployed_at: {type: string, format: date-time}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
