apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: workflowtemplates
    singular: workflowtemplate
    kind: WorkflowTemplate
    shortNames:
      - wft
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vessels
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                exit:
                  oneOf:
                    - type: string
                      enum: [claim]
                    - type: object
                      minProperties: 1
                      additionalProperties:
                        type: string
                        pattern: '^\$cr\.[^ ]+ (==|!=|<|<=|>|>=) .+$'
                turn_delivery:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                      - on
                      - to
                      - brief
                      - hold
                    properties:
                      on:
                        type: string
                        pattern: '^\$cr\.(checks|review\.actionable-at-head|mergeable) (==|!=) .+$'
                      to:
                        type: object
                        required:
                          - vessel
                          - role
                        properties:
                          vessel:
                            type: string
                            minLength: 1
                          role:
                            type: string
                            minLength: 1
                      brief:
                        type: string
                        minLength: 1
                      hold:
                        type: object
                        required:
                          - kind
                          - body
                        properties:
                          kind:
                            type: string
                            enum: [change-request-comment]
                          body:
                            type: string
                            minLength: 1
                vessels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - crew
                    properties:
                      name:
                        type: string
                        minLength: 1
                      stance:
                        type: string
                        enum: [trusted, workspace-write, contained]
                        default: trusted
                      repository_refs:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      credential_refs:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
                          minLength: 1
                      credential_scopes:
                        type: object
                        additionalProperties:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                      depends_on:
                        type: array
                        items:
                          type: string
                      crew:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                            - role
                          properties:
                            role:
                              type: string
                              minLength: 1
                            selector:
                              type: object
                              required:
                                - capability
                              properties:
                                capability:
                                  type: string
                                  minLength: 1
                            prompt:
                              type: string
                            command:
                              type: string
                          oneOf:
                            - required:
                                - selector
                              not:
                                required:
                                  - command
                            - required:
                                - command
                              not:
                                anyOf:
                                  - required:
                                      - selector
                                  - required:
                                      - prompt
