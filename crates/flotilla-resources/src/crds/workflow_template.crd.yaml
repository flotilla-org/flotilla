apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: workflowtemplates.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: workflowtemplates
    singular: workflowtemplate
    kind: WorkflowTemplate
    shortNames:
      - wft
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - vessels
              properties:
                inputs:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                exit:
                  oneOf:
                    - type: string
                      enum: [claim]
                    - type: object
                      minProperties: 1
                      additionalProperties:
                        type: string
                        pattern: '^\$cr\.[^ ]+ (==|!=|<|<=|>|>=) .+$'
                turn_delivery:
                  type: object
                  additionalProperties:
                    type: object
                    required:
                      - on
                      - to
                      - brief
                      - hold
                    properties:
                      on:
                        type: string
                      to:
                        type: object
                        required:
                          - vessel
                          - role
                        properties:
                          vessel:
                            type: string
                            minLength: 1
                          role:
                            type: string
                            minLength: 1
                      brief:
                        type: string
                        minLength: 1
                      hold:
                        type: object
                        required:
                          - kind
                          - body
                        properties:
                          kind:
                            type: string
                            enum: [change-request-comment]
                          body:
                            type: string
                            minLength: 1
                stall_nudges:
                  type: object
                  additionalProperties:
                    type: object
                    required: [max_per_episode]
                    properties:
                      max_per_episode:
                        type: integer
                        minimum: 0
                      idle_grace_seconds:
                        type: integer
                        minimum: 0
                      max_refusals:
                        type: integer
                        minimum: 1
                supervision:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                vessels:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - crew
                    properties:
                      name:
                        type: string
                        minLength: 1
                      stance:
                        type: string
                        enum: [trusted, workspace-write, contained]
                        default: trusted
                      repository_refs:
                        type: array
                        minItems: 1
                        items:
                          type: string
                          minLength: 1
                      credential_refs:
                        type: array
                        uniqueItems: true
                        items:
                          type: string
                          minLength: 1
                      credential_scopes:
                        type: object
                        additionalProperties:
                          type: array
                          uniqueItems: true
                          items:
                            type: string
                            minLength: 1
                      credential_permissions:
                        type: object
                        additionalProperties:
                          type: object
                          additionalProperties:
                            type: string
                      depends_on:
                        type: array
                        items:
                          type: string
                      crew:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          required:
                            - role
                          properties:
                            role:
                              type: string
                              minLength: 1
                            promises:
                              type: array
                              items:
                                type: object
                                required: [kind, owner]
                                properties:
                                  kind:
                                    type: string
                                    enum: [pr, decision-ledger]
                                  owner:
                                    type: string
                            promise_exclusions:
                              type: array
                              items:
                                type: string
                                enum: [pr, decision-ledger]
                            deliverer:
                              type: boolean
                            legacy_checks:
                              type: array
                              items:
                                type: object
                                x-kubernetes-preserve-unknown-fields: true
                            # ADR 0047: remove after the roll following #2986.
                            completion_expectations:
                              type: array
                              items:
                                type: string
                                enum: [decision-ledger, change-request-ready]
                            completion_conditions:
                              type: array
                              items:
                                type: object
                                required: [subject, field_path, operator, literal]
                                oneOf:
                                  - required: [producer, kind, about]
                                    properties:
                                      subject:
                                        enum: [artifact]
                                  - properties:
                                      subject:
                                        enum: [change-request]
                                properties:
                                  subject:
                                    type: string
                                    enum: [artifact, change-request]
                                  producer:
                                    type: string
                                  kind:
                                    type: string
                                  about:
                                    type: string
                                    enum: [convoy, change-request-head]
                                  field_path:
                                    type: string
                                  operator:
                                    type: string
                                    enum: ['==', '!=', '<', '<=', '>', '>=']
                                  literal:
                                    type: string
                                  optional_when_absent:
                                    type: boolean
                            selector:
                              type: object
                              required:
                                - capability
                              properties:
                                capability:
                                  type: string
                                  minLength: 1
                            prompt:
                              type: string
                            command:
                              type: string
                          oneOf:
                            - required:
                                - selector
                              not:
                                required:
                                  - command
                            - required:
                                - command
                              not:
                                anyOf:
                                  - required:
                                      - selector
                                  - required:
                                      - prompt
