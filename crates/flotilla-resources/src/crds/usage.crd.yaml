apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: usages.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: usages
    singular: usage
    kind: Usage
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [account]
              properties:
                account:
                  type: string
            status:
              type: object
              required: [provider, windows, observed_at]
              properties:
                provider:
                  type: string
                plan:
                  type: string
                organization:
                  type: string
                windows:
                  type: array
                  items:
                    type: object
                    required: [name, used_percent]
                    properties:
                      name:
                        type: string
                      label:
                        type: string
                      used_percent:
                        type: number
                      resets_at:
                        type: string
                        format: date-time
                      window_minutes:
                        type: integer
                        minimum: 0
                pace:
                  type: array
                  items:
                    type: object
                    required: [window, stage, delta_percent, expected_used_percent, will_last_to_reset]
                    properties:
                      window:
                        type: string
                      stage:
                        type: string
                      delta_percent:
                        type: number
                      expected_used_percent:
                        type: number
                      will_last_to_reset:
                        type: boolean
                      eta_seconds:
                        type: integer
                        minimum: 0
                      run_out_probability:
                        type: number
                provider_cost:
                  type: object
                  required: [used, limit, currency_code]
                  properties:
                    used:
                      type: number
                    limit:
                      type: number
                    currency_code:
                      type: string
                    period:
                      type: string
                    resets_at:
                      type: string
                      format: date-time
                    balance:
                      type: number
                reset_credits_available:
                  type: integer
                  minimum: 0
                observed_at:
                  type: string
                  format: date-time
