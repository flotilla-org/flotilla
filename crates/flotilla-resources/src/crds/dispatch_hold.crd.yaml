apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: dispatchholds.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: dispatchholds
    singular: dispatchhold
    kind: DispatchHold
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [project_ref, issue, land_after, reason, author, clear_when]
              properties:
                project_ref: {type: string, minLength: 1}
                issue:
                    type: object
                    required: [source, id]
                    properties:
                      id: {type: string}
                      source:
                        type: object
                        required: [service, scope]
                        properties:
                          service: {type: string}
                          scope: {type: string}
                land_after:
                    type: object
                    required: [source, id]
                    properties:
                      id: {type: string}
                      source:
                        type: object
                        required: [service, scope]
                        properties:
                          service: {type: string}
                          scope: {type: string}
                land_after_work:
                  type: object
                  nullable: true
                  x-kubernetes-preserve-unknown-fields: true
                reason: {type: string, minLength: 1}
                author: {type: string, minLength: 1}
                clear_when:
                  type: object
                  required: [kind]
                  properties:
                    kind: {type: string, enum: [landed, deployed]}
                    installation: {type: string, minLength: 1}
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
