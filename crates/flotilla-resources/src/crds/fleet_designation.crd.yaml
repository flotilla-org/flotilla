apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fleetdesignations.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: fleetdesignations
    singular: fleetdesignation
    kind: FleetDesignation
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [project]
              properties:
                project:
                  type: string
                  minLength: 1
