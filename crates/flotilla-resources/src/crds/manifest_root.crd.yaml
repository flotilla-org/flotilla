apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: manifestroots.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: manifestroots
    singular: manifestroot
    kind: ManifestRoot
    shortNames: [manifestroot]
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [host, path, source]
              properties:
                host:
                  type: string
                path:
                  type: string
                source:
                  type: string
                binding:
                  type: object
                  required: [kind]
                  properties:
                    kind:
                      type: string
                      enum: [repository, local_directory]
                    repo:
                      type: string
                    branch:
                      type: string
                    path:
                      type: string
                    directory:
                      type: string
                suspended:
                  type: array
                  items:
                    type: string
                resolutions:
                  type: object
                  additionalProperties:
                    type: object
                    required: [action, token, requested_by]
                    properties:
                      action:
                        type: string
                        enum: [sync, adopt]
                      token:
                        type: string
                      requested_by:
                        type: string
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
