apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: forges.flotilla.work
spec:
  group: flotilla.work
  scope: Namespaced
  names:
    plural: forges
    singular: forge
    kind: Forge
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-validations:
            - rule: "self.metadata.name == self.spec.forge_id"
              message: "Forge resource name must equal forge_id"
          properties:
            spec:
              type: object
              required: [forge_id, kind, hosts, https_url, git_ssh_host]
              properties:
                forge_id:
                  type: string
                  minLength: 1
                kind:
                  type: string
                  enum: [github, forgejo]
                hosts:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    minLength: 1
                https_url:
                  type: string
                  pattern: '^https://[^/]+/?$'
                git_ssh_host:
                  type: string
                  minLength: 1
