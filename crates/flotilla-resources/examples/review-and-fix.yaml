apiVersion: flotilla.work/v1
kind: WorkflowTemplate
metadata:
  name: review-and-fix
  namespace: flotilla
spec:
  exit:
    merged: $cr.state == merged
    closed-unmerged: $cr.state == closed
  turn_delivery:
    actionable-review:
      on: $cr.review.actionable-at-head == true
      to:
        vessel: implement
        role: coder
      brief: Address the actionable review at the bound head, push the durable fix, and file a fresh settlement claim.
      hold:
        kind: change-request-comment
        body: Flotilla paused automatic turn delivery after repeated actionable-review episodes; human attention is required.
  inputs:
    - name: feature
      description: Brief description of the feature to implement
    - name: branch
      description: Target git branch
  vessels:
    - name: implement
      crew:
        - role: coder
          selector:
            capability: code
          prompt: |
            Convoy {{workflow.name}} - implement {{inputs.feature}} on
            branch {{inputs.branch}}. Push commits as you go.
        - role: build
          command: cargo watch -x check
    - name: review
      depends_on:
        - implement
      crew:
        - role: reviewer
          selector:
            capability: code-review
          prompt: Review branch {{inputs.branch}} for correctness and style.
        - role: tests
          command: cargo test --watch
