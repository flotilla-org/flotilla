[package]
name = "flotilla-state-machines"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Storage-free gated state machines (ADR 0064): declarations, the single writer, records and judgements"

# ci/build-graph/check.py: this crate reaches no other flotilla workspace crate,
# and no production crate depends on it until the composition-root switch.
[dependencies]
strum = { workspace = true }

# Feature anchors (docs/measurements/2747-build-graph.md), local because this
# crate may not reach the flotilla-build-features crates: the host proc-macro
# and dev selections match the base layer's, so builds and tests reuse them.
[build-dependencies]
syn = { version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[dev-dependencies]
hegeltest = { workspace = true }
smallvec = { version = "1", default-features = false, features = ["const_generics", "const_new"] }

[lints]
workspace = true
