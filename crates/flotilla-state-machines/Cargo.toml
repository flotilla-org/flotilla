[package]
name = "flotilla-state-machines"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Backend-free gated state machines (ADR 0064): declarations, stored kinds, the single writer, records and judgements"

# ci/build-graph/check.py: this crate reaches only flotilla-schema and what
# flotilla-schema may reach, and no production crate depends on it until the
# composition-root switch.
[dependencies]
flotilla-schema = { path = "../flotilla-schema" }
serde = { workspace = true }
strum = { workspace = true }

[dev-dependencies]
flotilla-quint-testkit = { path = "../flotilla-quint-testkit" }
hegeltest = { workspace = true }
# ITF traces and exported graphs are JSON; production code never decodes them.
serde_json = { workspace = true }
# Test-only feature anchor (docs/measurements/2747-build-graph.md): hegeltest reaches smallvec
# through parking_lot; select the features the base layer already uses. The host proc-macro
# and serde selections come through flotilla-schema's flotilla-build-features anchors.
smallvec = { version = "1", default-features = false, features = ["const_generics", "const_new"] }

[lints]
workspace = true
