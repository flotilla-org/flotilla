[package]
name = "flotilla-verbs"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Native verbs: declarations, the handler trait, presentation and the registry declaring crates fill (#4267)"

# Light by rule (ci/build-graph/check.py): a crate declaring verbs takes this without reaching
# storage, the daemon or any capability crate.
[dependencies]
async-trait = { workspace = true }
flotilla-address = { path = "../flotilla-address" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-schema-derive = { path = "../flotilla-schema-derive" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# Test-only feature anchor: match the workspace's test context for tokio, which the protocol reaches.
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
