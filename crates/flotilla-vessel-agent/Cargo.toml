[package]
name = "flotilla-vessel-agent"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }

[lints]
workspace = true

# Feature-only anchors keep package-local builds aligned with workspace builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
