-resources` types, but future tests could accidentally pass incompatible core types.\n\nPlan:\n1. Move the two-daemon delivery regression to an integration test in `flotilla-daemon`, which already depends on core and controllers in the ordinary direction.\n2. Expose the needed delivery trigger through the existing public daemon or leaf-engine behavior, using the normal turn-delivery path; share test setup only where it reduces duplication.\n3. Remove the `flotilla-controllers` dev-dependency and its Cargo.lock entry from core, then run the full workspace CI gates.\n\nKeep the current regression until the relocated test exercises the same reconciler, nudge, delivery, and resume path.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2330/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2330/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_commen