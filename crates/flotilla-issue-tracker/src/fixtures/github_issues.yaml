l_blocking":0},"body":"## Re-scoped 2026-08-15 (backlog rationalisation)\n\nThe original mechanism failure is fixed by #1529: environment re-adoption (`reconcile_provisioned_environments`) restores the handle so `DockerEnvironmentRuntime::destroy` finds it and `forget_environment` runs. What remains is the cleanup for directories that were **already orphaned** — credential-runtime directories whose environment no longer exists at all.\n\n## What to do\n\nA periodic (or startup) sweep: enumerate credential-runtime directories, delete those whose environment id matches no live Environment record and no running backing. Log each deletion.\n\n## Acceptance criteria\n\n- [ ] Orphaned directories from pre-#1529 incidents are removed on the next daemon start.\n- [ ] A directory belonging to a live environment is never touched (test).","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1161/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"h