ges","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T12:07:09Z","updated_at":"2026-10-01T14:03:20Z","closed_at":"2026-10-01T14:03:20Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":1,"total_blocking":1},"body":"Enacts ADR 0051 (PR #2373: presentation metadata entities, subject edges, readiness and roles).\n\n## Add an entity-reference metadata value\n\nAdd `MetadataValue::EntityRefs(Vec<EntityRef>)` to the metadata wire model (`crates/flotilla-manifest/src/wire.rs`, and wherever the presentation-manager stream is encoded and decoded, including `pm connect`). Edges can then point at other entities in both directions (ADR 0051 §6). Group paths stay for containment.\n\nWire formats change freely (ADR 0047), but andamento and wheelhouse consume this stream, so coordinate: the andamento connector ticket and the wheelhouse sidebar ticket ship in the same roll. Old consumers must ignore unknown value kinds without breaking; verify that, or make it so.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2374/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2374/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792/events","html_url":"https://github.com/flotilla-org/flotilla/issues/792","id":4942467126,"node_id":"I_kwDORel_088AAAABJpgQNg","number":792,"title":"fix: project-page header click drills tab in place and drilled address is what persists — tab strands as scoped view after restart","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10393671168,"node_id":"LA_kwDORel_088AAAACa4LWAA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/ui","name":"ui","color":"C5DEF5","default":false,"description":"UI/UX and rendering","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-07-21T19:38:07Z","updated_at":"2026-10-01T14:00:52Z","closed_at":"2026-10-01T14:00:52Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happens\n\nThe recurring \"my project tab turned into the issues tab\" during #666 dogfood (2026-07-21). Reproduced mechanism, two components that combine into a trap:\n\n1. **A click on a project-page panel header drills the whole tab in place** to that panel''s scoped view (`crates/flotilla-tui/src/widgets/project_page.rs:346-348`; Enter with the header focused does the same via `active_action`, `:191-196`). One stray click on the Issues header and the project tab *is* now `issues?project=…`. Rows one line below the header merely select — the header line silently navigates.\n\n2. **Persistence stores only each tab''s current address, not its drill history** (`crates/flotilla-tui/src/app/open_views.rs:115-119`, `:298`). Live, Esc/back pops the drill stack and recovers the project page — but after a TUI restart the tab restores *as* the drilled address with an empty stack. The project tab is stranded as a full-screen issues view with no way back except `:open project/…` (which, without palette completion — #789 — you have to type blind).\n\nThis is exactly what produced the earlier `open-views.toml` state where `issues?project=flotilla%2Fflotilla` existed and `project/flotilla/flotilla` was missing.\n\n## Fix shape\n\nTwo units:\n\n- **Persist the drill stack per tab** (root-first address list) and restore it, so a restart reproduces the tab exactly, back stack included. ADR 0013 makes in-place navigation with a back stack part of the view model — the stack is view state worth persisting. (Persisting only the root address is the simpler fallback; it loses the drilled position but never strands the tab.)\n- **Make header clicks focus, not drill.** Clicking a panel header should activate that panel (like row clicks select); drilling to the scoped view should need an explicit affordance — the `›` target chevron, a double-click, or Enter on the focused header. Keyboard Enter-on-header can stay a drill since it''s deliberate.\n\n## Acceptance criteria\n\n- [ ] After drilling a tab and restarting the TUI, the tab restores with its drill history; back returns to the root view\n- [ ] A single click on a panel header never changes the tab''s address\n- [ ] An explicit drill affordance on the header still opens the scoped view\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/792/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null}]'
