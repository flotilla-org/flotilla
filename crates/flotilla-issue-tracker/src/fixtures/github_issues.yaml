l":"https://github.com/flotilla-org/flotilla/pull/2427.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2427.patch","merged_at":"2026-10-02T09:35:17Z"},"body":"## Summary\n\n- Move the two-host nudge and resume regression into a `flotilla-daemon` integration test that obtains its terminal session from `VesselReconciler`. Remove the corresponding core test; core already lost its `flotilla-controllers` dev-dependency in #2348.\n- Add a deterministic `InProcessDaemon` abandonment race: the test changes the Convoy to `Landed` after the status patch''s first read, forcing an optimistic write conflict and retry. The command returns the retryable phase-change error and preserves the concurrent outcome.\n- Give SQLite restart cleanup a ten-second CI-load bound. The restarted controller''s initial primary list enqueues the pending vessel, and cleanup requires separate child and vessel writes. The prior one-second wall-clock bound could expire under shared-runner scheduling. The assertion still requires both records to be deleted.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n- SQLite cleanup regression: 50 isolated runs passed before the bound change, each about 0.05–0.10 s; one focused run passed after.\n\nCloses #2330.\nCloses #2311.\nCloses #2329.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url"