ually runs with crew credentials.\n3. Then the governor ops-file PRs, `agents: [governor=claude-code:claude-opus-5-5]`. Existing crews keep their pinned image.\n\nhttps://claude.ai/code/session_011gkmBquphESrqV3R5jpMb9\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2433/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2433/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2421","id":5675152035,"node_id":"PR_kwDORel_088AAAABGQJhUA","number":2421,"title":"fix: terminate timed-out command process groups","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":15,"created_at":"2026-10-02T08:53:55Z","updated_at":"2026-10-02T11:00:12Z","closed_at":"2026-10-02T11:00:08Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2421","html_url":"https://github.com/flotilla-org/flotilla/pull/2421","diff_url":"https://github.com/flotilla-org/flotilla/pull/2421.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2421.patch","merged_at":"2026-10-02T11:00:08Z"},"body":"Closes #346.\n\n## Change\n\n- Add `CommandRunner::run_with_timeout` and forward deadlines through Docker, SSH, recording, and replay runners.\n- Spawn short-lived process commands with `kill_on_drop` in an isolated Unix process group. On cancellation, use `libc::killpg` to terminate the group, including local descendants. Docker and SSH client termination cannot guarantee that commands in the container or remote host have stopped.\n- Replace Zellij''s semaphore and local timeout wrapper with the runner deadline. The semaphore is no longer needed because timed-out commands are terminated.\n- Keep replay fixture shapes unchanged; execution policy is not recorded as command input.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (including the stored-record corpus)\n- Regression test confirms a timed-out shell''s background child exits; focused tests cover Docker and SSH deadline forwarding and Zellij timeout reporting.\n\nBuild timing with concurrent crews: the latest Clippy run took about 1m 39s; the latest workspace test build took about 3m 24s before tests ran. No infrastructure failure occurred.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2421/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/events","html_url":"https://github.com/flotilla-org/flotilla/issues/346","id":4076988432,"node_id":"I_kwDORel_087zAegQ","number":346,"title":"Add timeout and kill-on-drop support to CommandRunner","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-03-14T23:02:59Z","updated_at":"2026-10-02T11:00:10Z","closed_at":"2026-10-02T11:00:10Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`ProcessCommandRunner::run()` uses `Command::output()` which spawns a child without `kill_on_drop`. When a caller wraps the call in `tokio::time::timeout`, the timed-out child process lingers indefinitely — the future is dropped but the child is never killed.\n\nCurrently the Zellij workspace manager works around this with a semaphore (limiting to one outstanding child) and a timeout (so callers give up), but the child itself leaks.\n\n## Proposed solution\n\nAdd optional timeout and kill policy to `CommandRunner`:\n\n- `Command::spawn()` + `child.kill_on_drop(true)` + `child.wait_with_output()` so dropping the future actually kills the child\n- Optional per-call timeout parameter (or a builder/options struct)\n- Migrate `zellij_action` to use the new facility instead of its own `tokio::time::timeout` wrapper\n\nThis would benefit any provider that shells out to potentially unresponsive processes (workspace managers, git operations on slow remotes, etc).\n\n## Context\n\nDiscovered when a deadlocked Zellij server caused `query-tab-names` children to pile up. See PR #340 for the current workaround.","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2430","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2430/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2430/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2430/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2430","id":5675545053,"node_id":"PR_kwDORel_088AAAABGQdomw","number":2430,"title":"fix: clean abandoned staging, recovered recordings, and pr