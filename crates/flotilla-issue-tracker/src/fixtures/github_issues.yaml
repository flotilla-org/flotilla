s/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T10:33:44Z","updated_at":"2026-10-02T10:34:00Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Observation\n\nIn the feta load run (2026-10-02, #2389 part 2), the remaining I/O pressure peaks (PSI some 50–64%, full up to 53%) came at **low** load, with no D-state threads, while scratch usage **fell** by about 44 GB in about 10 minutes. They''re bursts of mass deletion: several landed convoys'' checkouts, each with a 30–60 GB `target/`, removed at the same time. The daemon was unaffected (its store is on a separate device), but crews compiling on the same filesystem compete with the deletes.\n\n## Idea (owner, 2026-10-02)\n\nQueue teardown deletions **per filesystem** (by device ID of the checkout path), so at most N large removals run concurrently on one device. Removals on different devices proceed in parallel. Measure before building: if a daemon-wide limit of one or two concurrent removals is enough, use that.\n\n## Acceptance\n\n- [ ] Concurrent teardowns on one filesystem are bounded, by a per-device or daemon-wide limit, chosen by measurement.\n- [ ] A test showing removals queue rather than run all at once.\n- [ ] A feta load-run comparison of I/O PSI during a teardown burst, before and after.\n\nLow priority: the daemon is already isolated from this. Related: #2324 / #2416 (archive work off the controller loop), #2389.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2389","id":5663565733,"node_id":"I_kwDORel_088AAAABUZMnpQ","number":2389,"title":"Cap per-vessel build and link parallelism on shared hosts","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-10-01T14:11:15Z","updated_at":"2026-10-02T10:07:42Z","closed_at":"2026-10-01T17:57:33Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nEvery Rust crew on a shared host assumes it owns the whole machine. cargo defaults to one job per core (32 on feta), and each `rust-lld` invocation spawns roughly one thread per core. When several crews link test binaries at once, the host''s disk saturates.\n\nObserved on feta at 2026-10-01 15:10, with 6 work crews and 2 governors running:\n\n- load average about 490;\n- `/proc/pressure/io` full about 58% and cpu about 2%;\n- **425 of 459 D-state threads were `rust-lld`**;\n- 255 MB of dirty pages.\n\nThe flotillad daemon on that host then times out on `convoy explain` (over 30s, see #2383), and the crews slow down together. A burst of identical work, such as asking every crew to rebase onto a new main, synchronizes their full rebuilds and makes this worse.\n\n## What to build\n\nEach vessel environment on a shared host gets a bounded share of build parallelism, set by flotilla from the host and its capacity, never baked into an image:\n\n- `CARGO_BUILD_JOBS` from the vessel''s share of host cores;\n- linker threads capped to match, e.g. `-C link-arg=-Wl,--threads=N` through the vessel''s cargo config or `CARGO_TARGET_<triple>_RUSTFLAGS`. Pick a mechanism that composes with a repo''s own `.cargo/config.toml` and `RUSTFLAGS` rather than clobbering them;\n- a container `--cpus` limit as the backstop, so parallelism a tool chooses for itself stays bounded too.\n\nThe share is a per-host fulfilment setting with a sane default, such as cores divided by the expected number of concurrent Rust crews, minimum 2. Its source of truth sits next to the capacity facts that #2361 decides; this ticket consumes those facts and doesn''t redefine them.\n\n## Acceptance\n\n- [ ] A contained crew on feta sees `CARGO_BUILD_JOBS` and capped linker threads, verified inside a live vessel, not only in unit tests.\n- [ ] A repo''s own `RUSTFLAGS` and `.cargo/config.toml` still apply; there''s a test for this.\n- [ ] Host-direct crews get the same caps through the environment flotilla injects.\n- [ ] With four crews running `cargo test --workspace` concurrently, the count of `rust-lld` threads in D state stays bounded, and `flotilla convoy explain` on that host answers in under 5s. Spot-check and record the numbers in the PR.\n\n## Related\n\n#2361 (capacity facts that pace dispatch), #2383 (daemon unresponsive under disk I/O), and the planned feta crew-scratch partition, which separates crew checkouts from the daemon store.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2389/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2429","id":5675539331,"node_id":"PR_kwDORel_088AAAABGQdVhA","number":2429,"title":"fix: harden credential delivery and runtime cleanup","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":5,"created_at":"2026-10-02T09:30:07Z","updated_at":"2026-10-02T10:07:18Z","closed_at":"2026-10-02T09:59:52Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2429","html_url":"https://github.com/flotilla-org/flotilla/pull/2429","diff_url":"https://github.com/flotilla-org/flotilla/pull/2429.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2429.patch","merged_at":"2026-10-02T09:59:51Z"},"body":"## Changes\n\n- Publish credential tokens, helpers, and review-store files with final permissions in the atomic runner write. Direct, SSH, and Docker runners keep content out of argv; temporary files are private before rename.\n- Serialize GitHub App writes per environment and credential name. Independent preparations can finish during a slow preflight; stale refreshes still cannot overwrite a newer registration.\n- Sweep Docker credential-runtime directories at daemon startup after checking Environment records and running backings. New directories encode their environment owner. Legacy flat directories have no recorded owner, so the sweep preserves them when a live environment or backing might own one.\n\nThe legacy format cannot identify which environment owns a directory when live and orphaned environments coexist. This conservative handling protects live directories, but ambiguous legacy orphans may remain until no live environment or backing remains. Reviewers should assess this limit against #1161''s acceptance criteria.\n\n## Tests\n\n- `cargo +nightly-2026-03-12 fmt --check` (passed)\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` (passed)\n- `cargo test --workspace --locked` (passed, including stored-record corpus)\n\nWorkspace tests took about four minutes locally; most of that was compilation with several crews building concurrently.\n\nCloses #1563.\nCloses #1564.\nCloses #1161.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2429/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1564","id":5161466458,"node_id":"I_kwDORel_088AAAABM6W6Wg","number":1564,"title":"Scope GitHub App delivery serialization per registration","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-08-15T21:46:20Z","updated_at":"2026-10-02T09:59:54Z","closed_at":"2026-10-02T09:59:54Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #1560 re-review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/1560#issuecomment-5304378426\n\nGitHub App initial delivery currently holds the credential store''s global `github_app_deliveries` mutex across file/helper writes and the `gh api installation/repositories` preflight. This correctly serializes initial writes against refresh commits and closes the stale-refresh race, but a slow preflight for one environment can temporarily delay unrelated GitHub App preparations and the periodic refresh pass.\n\nReplace the global write serialization with per-registration or per-delivery-key coordination while preserving the generation invariant from PR #1560: a refresh minted for an old registration must never write after a same-key re-prepare. Add concurrency coverage for independent environment/name keys and retain the controlled same-key stale-refresh test.\n\nContext: the current behavior is bounded by the HTTP timeout and is not blocking correctness; this issue tracks scaling and heartbeat-latency hardening if fleets provision many GitHub App-backed environments concurrently.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1564/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1563","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1563/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1563/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1563/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1563","id":5161437751,"node_id":"I_kwDORel_088AAAABM6VKNw","number":1563,"title":"Write credential delivery files with final permissions atomically","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-08-15T21:38:01Z","updated_at":"2026-10-02T09:59:53Z","closed_at":"2026-10-02T09:59:53Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #1560 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/1560#issuecomment-5304338325\n\nCredential adapters currently call the secure atomic `CommandRunner::write_file` and then apply `chmod 0600` or `0700` in a separate command. Under a permissive runner umask, the newly renamed file can briefly have broader permissions before `chmod` completes.\n\nExtend the runner/file-delivery seam so callers can request final permissions as part of the atomic replacement, then migrate both GitHub App and Forgejo token/helper delivery to it. Preserve the existing guarantee that credential material never appears in argv or command transcripts, and cover direct and namespace-crossing runner implementations.\n\nContext: this is a pre-existing cross-adapter hardening concern, not a regression introduced by PR #1560.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwitta