"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #1784 review by @claude: https://github.com/flotilla-org/flotilla/pull/1784#issuecomment-5403154223\n\n`flotilla project list` currently derives its single `issue_source` display column from the first raw `ProjectSpec.issue_sources` declaration. With source-keyed add/filter/exclude declarations, that entry can be excluded or otherwise unrepresentative of the project''s resolved sources.\n\nDefine the intended compact display semantics for zero, one, and multiple resolved issue bindings, then derive the list entry from resolved bindings (or an explicit summary) so excluded declarations cannot be presented as active sources.\n\nContext: this is cosmetic and predates the multi-source binding work''s functional paths; resolution, materialization, dispatch, and creation selection are unaffected.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":