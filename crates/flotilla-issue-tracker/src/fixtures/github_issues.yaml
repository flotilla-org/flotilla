id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"PR #2414 adds `consumer.actor_login` to GitHub App CredentialSpec declarations. The project-map credential manifests are an out-of-repo author of these specs and need a companion update before the fleet roll.\n\nSet the full REST App bot login (for example `flotilla-crew[bot]`) on each crew GitHub App credential manifest. Verify the rendered CredentialSpec on each host after replication. Existing stored specs decode without this field, but crews without it receive no `PR_SHEPHERD_AS` and their address markers cannot be attributed by change-request observation.\n\nThis issue tracks the companion change because PR #2414''s crew credential is scoped to flotilla-org/flotilla and cannot write project-map.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2377","id":5661862734,"node_id":"I_kwDORel_088AAAABUXkrTg","number":2377,"title":"feat: project change requests and issues as entities with subject edges, orphans and standing-role attempts","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-10-01T12:07:16Z","updated_at":"2026-10-02T13:32:18Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":3,"blocking":0,"total_blocking":0},"body":"Enacts ADR 0051 (PR #2373: presentation metadata entities, subject edges, readiness and roles).\n\n## Rework the metadata projection\n\nIn `crates/flotilla-manifest/src/projection.rs`:\n1. **Entities:** project **`change_request`** and **`issue`** entities from the replicated `ChangeRequest` and `Issue` records. Include the ADR 0051 §2 fields and the derived readiness.\n2. **Forward edges on the convoy:** one fact per relationship kind (`flotilla.subject.produces`, `adopts`, `works_on`, `supersedes`, `references`), from **replicated `status.subjects`** plus declared spec subjects.\n3. **Reverse edges:** `flotilla.subject_of` on each change request and issue, naming the convoys and roles linking it, with relationship.\n4. **Scope:** subjects of live convoys, a 24-hour window after landing, and **orphans** (an open change request whose convoy is gone, flagged `orphaned` until merged or closed).\n5. **Standing roles:** role entities (`project_standing_role`) gain `flotilla.role.current_attempt` and `flotilla.role.attempts` edges, plus lifted current-attempt facts (phase, attention and message, crew session, subject edges) and role-level facts (desired state, held or active, restart and backoff).\n6. **Single source of truth:** stop publishing `ConvoyRow.change_request` and the per-host branch-lookup cache as a fact source (part of #2183). Remove `change_request.number` once consumers have moved.\n\n7. **Labels describe their own entity (owner ruling, 2026-10-02).** The convoy''s `display.label` (and its `.medium`/`.short` tiers) is the convoy''s name only. **Revert #2411''s `convoy_label` change** in `flotilla-core/src/awareness_projection.rs`, which appended subject short references (`name · flotilla!2411`). Presentation managers learn a convoy''s change requests from the subject edges, not from its label.\n8. **Short references are each subject entity''s own label.** Each `change_request` and `issue` entity publishes its short reference as its own `display.label` tiers. Examples: `flotilla!2411`, `c!281`, a forge-qualified form when needed. Flotilla computes these because picking the alias needs the project''s reference context (ADR 0049 §2). The parts are published too (repository alias, number, kind), so a surface can compose its own.\n9. **URLs.** The `forge` entity (ADR 0051) carries the facts a surface needs to build a change request or issue URL. Each subject entity links to its forge.\n\nConsumer: wheelhouse renders convoy rows with their subject entities (placement, icons, readiness badge, click to URL). That template change is filed on wheelhouse once this lands.\n\nTests: a convoy with two PRs across repos, a PR shared by successive generations, an orphan, and a role re-pointing to a new attempt. Every host projects the same entities. The convoy''s label carries no subject references, and each subject entity''s label tiers match the reference context.\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2441","id":5677384063,"node_id":"I_kwDORel_088AAAABUmYBfw","number":2441,"title":"Stall supervisor nudges working Claude Code crews in a loop (Stop per response = fresh idle; episode resets defeat the cap)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-10-02T12:29:07Z","updated_at":"2026-10-02T13:05:44Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nThe stall supervisor repeatedly nudges a Claude Code crew that is actively working. platform-vocab (claude-code:claude-opus-5-5, 2026-10-02) received **11 nudges in about 15 minutes** while making a tool call roughly every minute (12:13–12:28 UTC). Two arrived 6 seconds apart. Each says \"You owe a settlement claim… run `crew complete` or `crew stall`\" and interrupts real work. A codex crew dispatched at the same time received **0**.\n\n## Mechanism\n\n1. `ClaudeCodeParser` maps the **`stop`** hook to `AgentEventType::Idle` (`flotilla-core/src/agents/hooks.rs`). Claude Code fires `Stop` at the end of *every* response turn, not when the task is done. A crew that queues input, or replies to a delivered message, produces many `Stop` events while still mid-task. Session attention samples show `working` (source `screen`) flipping to `idle` (source `hook`) for one sample and straight back.\n2. The supervisor (`leaf_engine.rs`, the actor-row nudge branch) nudges on any **fresh** non-stale idle (`idle_at > last nudge`) while the crew owes a settlement claim.\n3. The nudge is delivered and Claude replies to it. That''s a new turn ending in `Stop`, so there''s another fresh idle and another nudge.\n4. The per-episode cap (`max_per_episode`, default 2) doesn''t bound this. When attention returns to `working` the stall condition clears, and the next idle starts a new episode with an empty `nudge_history`.\n\nCodex isn''t affected: its `notify` hook reports idle (`agent-turn-complete`) only when the whole task turn ends.\n\n## What to build\n\n- **Idle must persist before it counts.** Nudge only after the crew has been continuously idle (no `working` sample, no tool or hook activity) for a grace window, configurable with a sane default of a few minutes. A one-sample `Stop` flicker never qualifies.\n- **A nudge''s own reply isn''t new idleness.** Idle observed within the grace window after a delivered nudge, or after any operator or owner message, belongs to the same episode.\n- **Budget per obligation, not per episode.** The nudge count and backoff are keyed to the unmet obligation (this actor row and leaf) and reset only by real progress evidence: a new commit or push, a claim, or a stall declaration. They are never reset by an attention flicker. Back off exponentially between nudges.\n- Consider whether Claude''s `Stop` should map to a weaker \"response ended\" signal than `Idle`, and leave \"idle\" to screen evidence plus duration.\n\n## Acceptance\n\n- [ ] Scenario test with a Claude-like event sequence (`stop` events between tool activity, a reply to a delivered nudge) that produces **no** nudge while activity continues.\n- [ ] Scenario test: a genuinely idle crew owing a claim gets at most the configured nudges, with backoff, and then escalates to the operator.\n- [ ] Live: a Claude crew on feta working for 30 minutes receives 0 nudges.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2438","id":5677126522,"node_id":"I_kwDORel_088AAAABUmITeg","number":2438,"title":"Refused project refreshes are silent: three governor projects stopped converging for five days","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T12:05:55Z","updated_at":"2026-10-02T12:06:14Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nOn 2026-10-02 `flotilla project refresh` for katzensteg, porthole and ghostty failed with:\n\n```\nerror: operational entry refused: ops/governor.ensure.md: invalid ensure entry `governor`: unknown field `stance`\n```\n\n`stance` was retired from ensure entries by #2105 (2026-09-27), but those three ops repos still declared it. So **every refresh of those projects has been refused since then.** The failure only shows up as a CLI error on an explicit refresh. Nothing surfaced it on the Project or ConvoyEnsure, to the governor or to the operator. It came to light only because a model change (`agents:` → Opus 5.5) didn''t take effect. Wheelhouse''s ops file never declared `stance`, so it kept converging.\n\nThe CLAUDE.md rule for out-of-repo manifests is \"stay compatible, or ship the project-map/ops manifest update in the same roll\". #2105''s companion change didn''t cover these ops repos, and nothing checks that.\n\n## What to build\n\n- **Make the refusal visible.** A refused operational entry records a typed condition on the Project (and the owning ConvoyEnsure): `DeclarationRefused` with the entry path and parser error. It raises an attention row, so the governor and `convoy list`/`project list` show it. A project whose declaration hasn''t converged for longer than a threshold is flagged.\n- **Check before the roll.** The pre-roll validation (`resource validate`, live-store decode) also parses every registered project''s ops entries with the candidate. A schema change that would refuse a live declaration fails the roll check, the way stored records do (#2167, #2169).\n- **Ops-entry compatibility.** Decide whether retired ops-entry fields get the same one-generation accept-and-drop treatment as stored data (ADR 0047), or whether ops entries stay strict and the pre-roll check is the gate. Record the ruling.\n\n## Acceptance\n\n- [ ] A test: an ops entry with an unknown field yields a visible Project condition and attention, not just a CLI error.\n- [ ] The pre-roll check parses registered projects'' ops entries with the candidate and fails on refusal.\n- [ ] The compatibility ruling is recorded (ADR 0047 amendment or a CLAUDE.md note).\n\nFixing the three ops files: robert/katzensteg-ops, porthole-ops and ghostty-ops, PR \"drop the retired stance field\".\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2437","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2437/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2437/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2437/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2437","id":5676654592,"node_id":"PR_kwDORel_088AAAABGRWQKg","number":2437,"title":"fix: continue host-ref migration after policy conflicts","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubuserc