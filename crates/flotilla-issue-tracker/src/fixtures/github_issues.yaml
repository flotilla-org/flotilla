issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2423 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2423#issuecomment-5948755102\n\nThe GitHub change-request observer shares a bounded follow-up pagination budget across PRs and traverses bound PRs in a stable order. If one or more early PRs are persistently very busy, later truncated PRs can repeatedly receive honest budget errors without making progress.\n\nAdd fair scheduling across PRs (for example, round-robin page fetches or a rotating start position) while keeping one shared query and node budget and preserving per-PR errors when a history cannot be completed in a cycle. Verify that later PRs eventually receive pages under sustained load.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2417","id":5671040099,"node_id":"I_kwDORel_088AAAABUgU0Yw","number":2417,"title":"Bound remote checkout archive retention sweeps per root","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar