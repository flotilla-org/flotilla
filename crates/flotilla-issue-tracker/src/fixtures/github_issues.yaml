om-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-29T23:34:39Z","updated_at":"2026-10-02T10:38:11Z","closed_at":"2026-10-02T10:38:11Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2251 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2251#issuecomment-5901082138\n\nWhen a TerminalSession recovers from a dead cleat daemon generation, Flotilla launches the replacement under a fresh cleat session ID. The old generation may retain a recreatable recording. That recording is intentionally preserved for recovery evidence, but it has no cleanup path once the replacement is healthy.\n\nDefine retention and cleanup for recordings left by dead generations. Preserve the session log for the claim and turn-delivery durability fence, then garbage collect it when the policy permits. Cover repeated daemon deaths so retained recordings do not grow without bound.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","star