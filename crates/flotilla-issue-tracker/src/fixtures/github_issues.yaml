zations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T12:07:14Z","updated_at":"2026-10-02T09:59:29Z","closed_at":"2026-10-02T09:59:29Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":1,"total_blocking":1},"body":"Enacts ADR 0051 (PR #2373: presentation metadata entities, subject edges, readiness and roles).\n\n## Derive change-request readiness in flotilla\n\nCompute one readiness value per `change_request` (ADR 0051 §3): `ready_to_merge`, `awaiting_review_response`, `ci_failing`, `conflicting`, `draft`, `merged_not_landed` or `closed`. Define the precedence when several apply.\n\n- **Inputs:** the observed state, checks, mergeability and review decision (from the observation ticket), `review.actionable_at_head` (#2300), and convoy landing state (settlement).\n- **Shape:** one pure function with a table test covering every combination that matters. `ready_to_merge` means green, mergeable, review settled (no actionable feedback, not changes-requested) and not draft.\n- **Where it lives:** expose it to the projection; don''t store it if it can be computed.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2376/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2376/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2426","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2426/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2426/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2426/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2426","id":5675441162,"node_id":"PR_kwDORel_088AAAABGQYTvw","number":2426,"t