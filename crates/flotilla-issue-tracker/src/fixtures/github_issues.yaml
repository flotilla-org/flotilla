":4,"created_at":"2026-10-01T11:44:52Z","updated_at":"2026-10-01T16:01:34Z","closed_at":"2026-10-01T12:11:50Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2372","html_url":"https://github.com/flotilla-org/flotilla/pull/2372","diff_url":"https://github.com/flotilla-org/flotilla/pull/2372.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2372.patch","merged_at":"2026-10-01T12:11:49Z"},"body":"Closes #2343.\n\n## Change\n\n- Wake the checkout authority for a replicated convoy transition using the local checkout''s convoy label, including older convoys whose snapshot has no checkout reference. The checkout authority requests deletion and runs its own cleanup finalizer. The convoy authority keeps its teardown finalizer until the federated checkout disappears.\n- Match an annotated checkout to a local convoy when its recorded source root is the local authority root. This restores the same-host owner lookup without accepting a same-named convoy from another origin.\n- Retry failed finalizers independently of status writes. A repeated cleanup error can leave the status unchanged, so the controller now schedules another attempt instead of waiting for the full resync.\n- Cover old cross-home teardown through the two-host command router harness, including both finalizers, and assert that the domain command-target resolver sends an explicit child delete to the child''s home.\n\n## Adoption check\n\n`ConvoyStart`, including `--pr`, now resolves admission to the selected placement host in `resolve_command_target` before execution. The adoption-specific workflow selection does not select the dispatching host, so new `--pr` convoys are born on the selected placement host. This fixes the wrong-birth path for new admissions; the test covers cleanup for convoys born before #2339.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n- `cargo test -p flotilla-daemon --locked --test request_session_pair deleting_mis_homed_convoy_finalizes_checkout_at_its_home`\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2372/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2372/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2392","id":5663719880,"node_id":"PR_kwDORel_088AAAABGHASpg","number":2392,"title":"feat: observe Forgejo pull review decisions","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":16,"created_at":"2026-10-01T14:21:39Z","updated_at":"2026-10-01T15:31:40Z","closed_at":"2026-10-01T15:31:37Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2392","html_url":"https://github.com/flotilla-org/flotilla/pull/2392","diff_url":"https://github.com/flotilla-org/flotilla/pull/2392.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2392.patch","merged_at":"2026-10-01T15:31:37Z"},"body":"Follow-up to #2382. The operator requested a Forgejo review read after that PR merged.\n\n## Change\n\n- Read Forgejo''s paged `GET /repos/{owner}/{repo}/pulls/{index}/reviews` endpoint for each bound pull request. The pull response still supplies title, author, draft, and requested reviewer facts.\n- Derive a review decision from each reviewer''s latest decisive review. Dismissed reviews do not revive older decisions; stale approvals are treated conservatively, while stale changes requests still count, matching Forgejo''s rejection check. Changes requested takes precedence over review required, then approved. Empty review lists produce no decision; failed or malformed reads leave only the decision Unknown and preserve the pull status.\n- Use Forgejo''s total-count header to finish after the last populated page, with an empty-page fallback when the header is absent. A 100-page cap leaves the decision Unknown if a server keeps repeating pages.\n- Test review precedence, re-requests, stale and dismissed reviews, multi-page total counts, short pages without a count header, page limits, malformed responses, the extra request, and review-read failure.\n\nThis deliberately adds one request per bound pull request in the common case, with more requests when a review list spans pages. The operator authorized the change from #2382''s original request budget.\n\nForgejo''s [review API and pagination](https://code.forgejo.org/forgejo/forgejo/src/branch/forgejo/routers/api/v1/repo/pull_review.go) and [review states](https://code.forgejo.org/forgejo/forgejo/src/branch/forgejo/modules/structs/pull_review.go) define the response used here. The manifest wire and stored status schema are unchanged. No existing replay fixture covers bound Forgejo review reads; mocked HTTP tests cover the new sequence.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2392/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2382","id":5662626315,"node_id":"PR_kwDORel_088AAAABGGHPdA","number":2382,"title":"feat: enrich change request and issue observations","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":9,"created_at":"2026-10-01T13:06:01Z","updated_at":"2026-10-01T15:06:26Z","closed_at":"2026-10-01T14:04:11Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2382","html_url":"https://github.com/flotilla-org/flotilla/pull/2382","diff_url":"https://github.com/flotilla-org/flotilla/pull/2382.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2382.patch","merged_at":"2026-10-01T14:04:11Z"},"body":"Closes #2375.\n\n## Changes\n\n- Add time-stamped title, author, review decision, and operator review-request observations to ChangeRequest status. Draft was already represented by `ObservedChangeRequestState::Draft`.\n- Add time-stamped title and assignee observations to Issue status, carrying assignees through the existing issue provider data path.\n- Read GitHub PR fields in the existing batched GraphQL query and issue fields in existing REST responses. Read Forgejo PR fields in its existing bound pull reads, with no additional requests per PR.\n- Preserve other GitHub PR observations when review requests exceed one page; report only the operator request as Unknown. Team review requests remain Unknown when operator membership is unavailable.\n- Distinguish GitHub `REVIEW_REQUIRED` from an explicit null decision, which means no review decision.\n- Add `change_request.operator_login` configuration; an unset identity produces Unknown for the operator review-request observation.\n- Default new stored fields to Unknown when decoding previous-generation statuses. The stored-record corpus remains unchanged.\n\nForgejo''s standard pull response does not expose an aggregate review decision. The field stays Unknown until Forgejo exposes an aggregate decision in the existing pull response. This preserves the existing request budget rather than adding a per-PR review fetch.\n\nNo out-of-repo sources author ChangeRequest or Issue resource statuses; the provider writers are in this repository. The manifest wire is unchanged. No replay request sequence changed, so no fixture was re-recorded.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo +1.99.0 clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n\n## CI toolchain compatibility\n\nThe first CI run used Rust 1.99 and found `double_must_use` on `async_trait` generated futures across existing crates. A separate commit allows that generated-code lint at affected crate roots, with comments describing when it can be removed. Main has since fixed the unrelated controller test deprecation in #2387. This keeps the stable-toolchain Clippy gate green without changing workflow files.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2382/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2393","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2393/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2393/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2393/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2393","id":5664004398,"node_id":"PR_kwDORel_088AAAABGHPO4A","number":2393,"title":"fix: resolve nested bare repositories per level in the host git config guard","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T14:40:53Z","updated_at":"2026-10-01T14:53:05Z","closed_at":"2026-10-01T14:53:04Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2393","html_url":"https://github.com/flotilla-org/flotilla/pull/2393","diff_url":"https://github.com/flotilla-org/flotilla/pull/2393.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2393.patch","merged_at":"2026-10-01T14:53:03Z"},"body":"## Problem\n\nThe host-clone Git config guard (#2237) located the repository by walking **every** ancestor for a `.git` entry first, and only then checked whether the working directory itself was a bare repository. Git does it per level: at each directory it checks `.git`, then the directory as a bare repo, then moves up.\n\nSo for a bare repository nested anywhere under a checkout, the guard inspected the *outer* checkout''s config, not the config Git would actually load. The consequences:\n\n- **A guard bypass.** A nested bare repository with `core.fsmonitor` (or any other disallowed key) passed the guard whenever the outer checkout was clean. The new test proves it: against the old discovery the guard returns `Ok`.\n- **A test that depended on the environment.** `bare_repository_config_is_checked` failed whenever `TMPDIR` was inside a git checkout. That''s exactly what CLAUDE.md''s Codex-sandbox command sets (`TMPDIR=\"$PWD/.codex-tmp\"`), and what the store-latency crew (#2383) did on kiwi.\n\n## Fix\n\n`discovered_git_entry` resolves each level the way Git does: `.git` first, then the directory as a bare repository (`HEAD`, `config`, `objects` and `refs` all present). The walk now uses it at every ancestor.\n\n## Tests\n\n- New `bare_repository_nested_in_a_checkout_is_inspected_itself`. It fails against the old discovery (negative control run locally) and passes now.\n- All 7 guard tests pass with the default `TMPDIR` and with `TMPDIR` inside the checkout.\n- `cargo +1.99.0 clippy -p flotilla-core --all-targets -D warnings` and fmt check are clean.\n\nhttps://claude.ai/code/session_011gkmBquphESrqV3R5jpMb9\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2393/reactions",