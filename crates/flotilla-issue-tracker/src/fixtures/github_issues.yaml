ers/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-10-01T15:55:58Z","updated_at":"2026-10-02T13:48:35Z","closed_at":"2026-10-02T13:48:35Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Follow-up from PR #2397 review: measure and tune the fresh-seed Hegel coverage profile after it lands.\n\nThe operator''s manual [Coverage run 36891170311](https://github.com/flotilla-org/flotilla/actions/runs/36891170311) on the 120-case profile passed its Coverage job in **17m 38s**, compared with a recent main baseline of about 8 minutes. PR #2397 reduces the nightly case budget to 40 in `hegel.toml` while retaining 12 fixed-seed CI cases. The complete manual workflow failed only because the PR branch was barred from the `github-pages` deployment environment; Coverage and Dylint passed.\n\nAfter the change lands, record the first scheduled Coverage job duration, compare it with the main baseline, and adjust the fresh-seed case budget against an agreed runtime target if needed. Workflow edits require the operator push path during this convoy.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2399/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2399/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2415/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2415","id":5670620030,"node_id":"I_kwDORel_088AAAABUf7Lfg","number":2415,"title":"Update projec