gs only after a replacement TerminalSession launches successfully. Remove marked recordings after seven days during cleat maintenance, with dead-generation and dead-PID checks.\n- Evict change-request provider instances on Repository watch deletions and reconcile the cache after a watch restart, preserving ETag state for live repositories.\n\n## Tests\n\n- Each cleanup has a boundary test that keeps live work intact.\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n\n## Build timing\n\nThe first workspace test compilation in this vessel took about 3 minutes 40 seconds; a clippy run took about 1 minute 12 seconds. These were slow builds, with no infrastructure error.\n\nCloses #2252. Closes #2254. Closes #1727.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2430/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"t