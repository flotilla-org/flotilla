move the test runner''s `du` failure shim and assert the exact manifest content.\n\nCloses #2419.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2420/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2420/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2419","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2419/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2419/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2419/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2419","id":5674889311,"node_id":"I_kwDORel_088AAAABUj_wXw","number":2419,"title":"Drop du from the teardown archive manifest: list excluded ignored paths without sizes","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null},{"id":10393665220,"node_id":"LA_kwDORel_088AAAACa4K-xA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/quick-win","name":"quick-win","color":"2EA44F","default":false,"description":"Small, well-scoped tasks suitable for agent batches","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T08:28:18Z","updated_at":"2026-10-02T09:30:41Z","closed_at":"2026-10-02T09:30:41Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n#2416 (closing #2324) records the ignored paths the teardown archive excludes, with sizes measured by running `du -sk -- <path>` for each one through the checkout''s `CommandRunner` (`flotilla-core/src/vcs.rs`, `force_remove_materialised_checkout`). That has three costs:\n- it reads metadata for every file in each ignored tree, for example a 100 GB `target/`, with no timeout, once per ignored directory;\n- it assumes a POSIX `du` in the checkout''s environment, which blocks a Windows port;\n- the sizes aren''t needed for recovery. They were a convenience in the #2324 contract.\n\n## What to build\n\n- Remove the `du` calls. `excluded-ignored.txt` lists the excluded ignored paths (from `git ls-files --others --ignored --exclude-standard --directory -z`), one per line, with no sizes.\n- Remove the `du` handling from the fake runner in tests, and update the tests that assert sizes or `(size unavailable)`.\n- Update the manifest header comment to match.\n\n## Not in scope (owner direction, 2026-10-01)\n\nIf per-checkout sizes are wanted for real later, for capacity facts or disk pressure, don''t count them synchronously at teardown. Monitor them proactively and accept some staleness: a crate that keeps directory sizes up to date from filesystem notifications or polling, or our own equivalent, feeding a host/checkout fact. That would be its own design item, platform-neutral including Windows.\n\n## Acceptance\n\n- [ ] No `du` invocation remains in flotilla-core.\n- [ ] The archive manifest lists the excluded ignored paths, and the tests cover it.\n","closed_by":{"log