    status: 200
    body: '[{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2447","id":5678889138,"node_id":"PR_kwDORel_088AAAABGTIIuw","number":2447,"title":"fix: prevent convoy admission and adopted create races","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T14:32:29Z","updated_at":"2026-10-02T14:32:29Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2447","html_url":"https://github.com/flotilla-org/flotilla/pull/2447","diff_url":"https://github.com/flotilla-org/flotilla/pull/2447.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2447.patch","merged_at":null},"body":"Simultaneous first admissions on different origins can author the same home-bound placement snapshot before replication, causing an authorship collision. Prepared placement snapshots now hash their authoring origin along with their contents, so each origin owns and retains its own frozen policy. This applies to convoy-wide, per-vessel, and ensured-convoy snapshots, including when a remote replica is already visible.\n\nConcurrent adopted-convoy creates previously prepared checkout resources before entering the admission transaction. The losing create removed its durable checkout but left an orphan observed projection. Creation now holds the existing admission guard from the identity check through checkout writes and the Convoy commit, so a duplicate is rejected before writing a checkout.\n\nTwo separate commits address the two issues. Both regressions were reproduced with failing tests before the fixes. Coverage includes two-origin admission before replication, admission with an existing replica, snapshot lifetime while remote references are in flight, synchronized duplicate adopted creates through InProcessDaemon, local/remote duplicate-create router scenario rows, and routed snapshot ownership.\n\nNo resource specs or statuses change shape. Existing snapshot names remain decodable; no out-of-repo resource authors require updates.\n\nValidation:\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (including the stored-record corpus)\n- Generated router admission test with `HEGEL_DEFAULT_PROFILE=ci`\n\nCloses #2249.\nCloses #636.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2447/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2446","id":5678824128,"node_id":"I_kwDORel_088AAAABUnv6wA","number":2446,"title":"Review the crew skill set: rebase the skills fork, cut what doesn''t fit autonomous crews, evaluate tdd vs property-based testing","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T14:27:09Z","updated_at":"2026-10-02T14:27:20Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Owner direction, 2026-10-02, after a wave in which three of five crews stalled on the same skill.\n\n## Problems observed\n\n- **The tdd skill assumes a human in the loop.** It requires \"user-confirmed test seams\" (\"No test is written at an unconfirmed seam\"). Under flotilla there''s no interactive user, so tui-tidy, decl-drift and observe-cadence all stalled for a `decision` asking the operator to confirm seams. The operator unblocked them by delegating the seam decision to the crew.\n- **Test quality.** It''s doubtful tdd is producing good tests: the usual complaints about agent-written tests, which are often example-shaped, coupled to implementation, assert what the code does rather than what it should, and miss the interesting cases. The property-based route, Hegel (#2368, merged as #2397''s scenario gate) and proptest, has looked more promising.\n- **The skills fork has drifted.** `flotilla-org/mattpocock-skills` is a fork, pinned in fleet generations at `862f01fd`, and hasn''t been rebased on upstream recently.\n\n## What to do\n\n1. **Rebase the fork** on upstream and review what changed. Keep fixes and improvements, and drop what doesn''t fit.\n2. **Audit every skill in the crew set** against flotilla''s operating model:\n   - autonomous crews with no interactive user;\n   - stall-not-fail;\n   - decisions recorded in the decision ledger;\n   - review via pr-shepherd.\n\n   For each skill, decide: keep as is, adapt (rewrite \"ask the user\" steps as \"decide and record in the decision ledger\"), or drop from the crew set. Decide per role (code crew, shepherd, governor) where it makes sense (#1790 skill requirements per project or role).\n3. **Research (subagent):** what produces good tests from LLM agents?\n   - evidence on TDD-by-agent test quality: mutation scores, defect detection, brittleness;\n   - property-based and model-based testing by agents;\n   - what to write into a crew skill so tests come out behavioural and falsifying.\n\n   Output: a recommendation for flotilla''s crew testing skill (replace tdd, adapt it, or pair it with a property-based skill), grounded in sources.\n4. Decide, then make the change in the fork (or in rjw-skills for flotilla-specific skills) and pin it in the next generation.\n\nRelated: #1790 (skill requirements per project or role), #2400 (review-point tracking), #1953 (control-plane state-machine testing), #2368/#2397 (Hegel scenario engine).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2446/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2445","id":5678822736,"node_id":"I_kwDORel_088AAAABUnv1UA","number":2445,"title":"Orphaned change requests need convoy provenance on ChangeRequest records","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T14:27:02Z","updated_at":"2026-10-02T14:27:19Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015454,"node_id":"IT_kwDOEBMoCM4B6IRe","name":"Feature","description":"A request, idea, or new functionality","color":"blue","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Split from #2377 (owner-approved scope cut, 2026-10-02). ADR 0051 asks presentation projection to flag **orphans**: an open change request whose producing convoy is gone, flagged `orphaned` until merged or closed. The #2377 crew found this can''t be done projection-only:\n- `ChangeRequest` records carry no historical convoy provenance (which convoys and roles linked them);\n- the refresher deletes ChangeRequest records on last-demand release, so once the convoy is gone the record is too.\n\n## What to build\n\n- Record provenance on the ChangeRequest record, such as `status.subject_of` history (convoy identity, role, relationship, last seen). It''s stored data, so it needs a serde default (ADR 0047), with a decision on whether it replicates.\n- Retain an open ChangeRequest whose provenance names a convoy that no longer exists, as long as the PR is open, instead of deleting it on last-demand release. Bound the retention, and drop it on merge or close.\n- Projection: flag `orphaned` and keep the reverse edge to the departed convoy identity.\n\n## Acceptance\n\n- [ ] Test: convoy produces PR, convoy deleted, PR still open: the projected change_request is `orphaned`, with a reverse edge to the old convoy identity.\n- [ ] Test: the PR merges and the orphan entity leaves the projection.\n- [ ] Stored-record corpus still decodes.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2445/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2444","id":5678822316,"node_id":"I_kwDORel_088AAAABUnvzrA","number":2444,"title":"Tests fail with TMPDIR inside a git checkout; CLAUDE.md sandbox TMPDIR recipe misapplied outside the Codex sandbox","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T14:27:00Z","updated_at":"2026-10-02T14:27:18Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`flotilla-daemon` `runtime::tests::checkout_runtime_removes_unregistered_worktree_path_with_embedded_repository` passes with the default `TMPDIR` and fails with `DirtyCheckout` when `TMPDIR` is inside a git checkout (reproduced on main, 2026-10-02):\n\n```\nTMPDIR=\"$PWD/.codex-tmp\" cargo test -p flotilla-daemon runtime::tests::checkout_runtime_removes_unregistered_worktree_path_with_embedded_repository\nstale worktree path should be removed: \"checkout …/.codex-tmp/…/flotilla.feature-cleanup preserved: DirtyCheckout\"\n```\n\nThe fixture''s checkout inspection walks up into the enclosing repository and reads its state. This is the same class as #2393 (nested bare repositories in the host-config guard). Two crews (admission-races, subject-entities) stalled on it because they followed CLAUDE.md''s Codex-sandbox recipe (`TMPDIR=\"$PWD/.codex-tmp\"`) while **not** in the Codex sandbox (`CODEX_SANDBOX` unset).\n\n## What to build\n\n- Make the fixture hermetic. Set `GIT_CEILING_DIRECTORIES` for its git operations, or make the inspection stop at the expected checkout root, so an enclosing repository can''t leak in. Check whether production code has the same discovery hazard (a checkout root nested under another repository) and fix it there if so, not just in the test.\n- Sweep for other tests that fail under an in-checkout `TMPDIR`: run the workspace suite once with `TMPDIR` inside the checkout.\n- Clarify CLAUDE.md: the `.codex-tmp` recipe applies only inside the Codex sandbox (`CODEX_SANDBOX` set). Everywhere else, use the default `TMPDIR`.\n\n## Acceptance\n\n- [ ] The test passes with `TMPDIR` inside a git checkout.\n- [ ] A sweep run with an in-checkout `TMPDIR` is green, or the remaining failures are fixed.\n- [ ] CLAUDE.md wording is updated.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2444/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2442","id":5678039751,"node_id":"PR_kwDORel_088AAAABGScwJQ","number":2442,"title":"fix: debounce crew idle nudges and preserve obligation budgets","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":4,"created_at":"2026-10-02T13:24:03Z","updated_at":"2026-10-02T14:24:36Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2442","html_url":"https://github.com/flotilla-org/flotilla/pull/2442","diff_url":"https://github.com/flotilla-org/flotilla/pull/2442.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2442.patch","merged_at":null},"body":"Claude Stop events currently trigger immediate nudges, and Working flickers replenish the per-episode cap. This change requires three minutes of continuous idle evidence by default and persists the budget per actor obligation. Nudges back off exponentially and eventually escalate to the operator.\n\nDelivered-message replies preserve the existing idle clock and budget, so a crew that remains idle can receive later nudges. Claude tool hooks carry separate activity provenance, including when Working/Stop observations coalesce; actual work cancels the quiet window without replenishing the budget. Commit/push observations, claims, and declared stalls reset accounting. Operator briefs retain delivery priority.\n\nStop remains candidate Idle, qualified by duration and tool activity. `idle_grace_seconds` is optional per crew nudge policy; historical `max_per_episode` retains its name with obligation semantics. External project-map/ops WorkflowTemplate authors require no companion update. Convoy, Checkout, and TerminalSession status are daemon/controller-authored, with decoder defaults for one-generation compatibility; stored corpus files remain unchanged.\n\nValidation: scenario regressions were introduced first and demonstrated the failures. Pinned formatting and workspace clippy pass. Full workspace tests and the unchanged stored-record corpus pass with the prescribed sandbox command and `GIT_CEILING_DIRECTORIES=\"$PWD\"` to isolate Git fixture discovery. The operator authorized tracking the 30-minute host-direct Claude acceptance and hook latency checks separately in #2443.\n\nCloses #2441.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2442/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2443","id":5678704604,"node_id":"I_kwDORel_088AAAABUnon3A","number":2443,"title":"validate idle supervision with a host-direct Claude crew on feta","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T14:17:20Z","updated_at":"2026-10-02T14:17:38Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Follow-up to #2441 and PR #2442. The operator authorized finishing the code change and tracking live acceptance separately because the coder vessel runs in Docker without host-direct access to feta.\n\nRun this work with a host-direct crew on feta, or move the crew to a host-direct vessel through the supervisor. Do not attempt SSH from the Docker vessel or bypass host trust. Coordinate the updated fleet generation through the normal deployment workflow.\n\nAcceptance:\n- Regenerate Claude crew settings so PreToolUse/PostToolUse subscriptions are installed; document that already-running crews retain their old hooks until restart/settings regeneration.\n- Observe a Claude crew actively working for 30 minutes on feta; expect zero idle nudges. Capture tool hooks, attention observations, and convoy obligation history.\n- Observe a genuinely idle crew owing a claim: grace precedes the first nudge; reply echoes preserve the clock; subsequent nudges back off, respect the cap, and escalate. Verify real command/background activity cancels idle time and commits/pushes/claims/stalls reset the budget.\n- Measure PreToolUse/PostToolUse hook overhead. The current hook command is a one-shot client waiting synchronously for a daemon RPC acknowledgement, with no dedicated RPC timeout. Check daemon-unavailable behavior and file/implement bounded or asynchronous delivery if needed without losing activity evidence.\n- Confirm operator/resume briefs retain delivery priority.\n\nRecord duration, fleet generation, hook settings, observations, and results. Report any observed discrepancy as a linked bug.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2443/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2377","id":5661862734,"node_id":"I_kwDORel_088AAAABUXkrTg","number":2377,"title":"feat: project change requests and issues as entities with subject edges, orphans and standing-role attempts","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-10-01T12:07:16Z","updated_at":"2026-10-02T13:32:18Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":3,"blocking":0,"total_blocking":0},"body":"Enacts ADR 0051 (PR #2373: presentation metadata entities, subject edges, readiness and roles).\n\n## Rework the metadata projection\n\nIn `crates/flotilla-manifest/src/projection.rs`:\n1. **Entities:** project **`change_request`** and **`issue`** entities from the replicated `ChangeRequest` and `Issue` records. Include the ADR 0051 §2 fields and the derived readiness.\n2. **Forward edges on the convoy:** one fact per relationship kind (`flotilla.subject.produces`, `adopts`, `works_on`, `supersedes`, `references`), from **replicated `status.subjects`** plus declared spec subjects.\n3. **Reverse edges:** `flotilla.subject_of` on each change request and issue, naming the convoys and roles linking it, with relationship.\n4. **Scope:** subjects of live convoys, a 24-hour window after landing, and **orphans** (an open change request whose convoy is gone, flagged `orphaned` until merged or closed).\n5. **Standing roles:** role entities (`project_standing_role`) gain `flotilla.role.current_attempt` and `flotilla.role.attempts` edges, plus lifted current-attempt facts (phase, attention and message, crew session, subject edges) and role-level facts (desired state, held or active, restart and backoff).\n6. **Single source of truth:** stop publishing `ConvoyRow.change_request` and the per-host branch-lookup cache as a fact source (part of #2183). Remove `change_request.number` once consumers have moved.\n\n7. **Labels describe their own entity (owner ruling, 2026-10-02).** The convoy''s `display.label` (and its `.medium`/`.short` tiers) is the convoy''s name only. **Revert #2411''s `convoy_label` change** in `flotilla-core/src/awareness_projection.rs`, which appended subject short references (`name · flotilla!2411`). Presentation managers learn a convoy''s change requests from the subject edges, not from its label.\n8. **Short references are each subject entity''s own label.** Each `change_request` and `issue` entity publishes its short reference as its own `display.label` tiers. Examples: `flotilla!2411`, `c!281`, a forge-qualified form when needed. Flotilla computes these because picking the alias needs the project''s reference context (ADR 0049 §2). The parts are published too (repository alias, number, kind), so a surface can compose its own.\n9. **URLs.** The `forge` entity (ADR 0051) carries the facts a surface needs to build a change request or issue URL. Each subject entity links to its forge.\n\nConsumer: wheelhouse renders convoy rows with their subject entities (placement, icons, readiness badge, click to URL). That template change is filed on wheelhouse once this lands.\n\nTests: a convoy with two PRs across repos, a PR shared by successive generations, an orphan, and a role re-pointing to a new attempt. Every host projects the same entities. The convoy''s label carries no subject references, and each subject entity''s label tiers match the reference context.\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2377/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2441","id":5677384063,"node_id":"I_kwDORel_088AAAABUmYBfw","number":2441,"title":"Stall supervisor nudges working Claude Code crews in a loop (Stop per response = fresh idle; episode resets defeat the cap)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-10-02T12:29:07Z","updated_at":"2026-10-02T13:05:44Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nThe stall supervisor repeatedly nudges a Claude Code crew that is actively working. platform-vocab (claude-code:claude-opus-5-5, 2026-10-02) received **11 nudges in about 15 minutes** while making a tool call roughly every minute (12:13–12:28 UTC). Two arrived 6 seconds apart. Each says \"You owe a settlement claim… run `crew complete` or `crew stall`\" and interrupts real work. A codex crew dispatched at the same time received **0**.\n\n## Mechanism\n\n1. `ClaudeCodeParser` maps the **`stop`** hook to `AgentEventType::Idle` (`flotilla-core/src/agents/hooks.rs`). Claude Code fires `Stop` at the end of *every* response turn, not when the task is done. A crew that queues input, or replies to a delivered message, produces many `Stop` events while still mid-task. Session attention samples show `working` (source `screen`) flipping to `idle` (source `hook`) for one sample and straight back.\n2. The supervisor (`leaf_engine.rs`, the actor-row nudge branch) nudges on any **fresh** non-stale idle (`idle_at > last nudge`) while the crew owes a settlement claim.\n3. The nudge is delivered and Claude replies to it. That''s a new turn ending in `Stop`, so there''s another fresh idle and another nudge.\n4. The per-episode cap (`max_per_episode`, default 2) doesn''t bound this. When attention returns to `working` the stall condition clears, and the next idle starts a new episode with an empty `nudge_history`.\n\nCodex isn''t affected: its `notify` hook reports idle (`agent-turn-complete`) only when the whole task turn ends.\n\n## What to build\n\n- **Idle must persist before it counts.** Nudge only after the crew has been continuously idle (no `working` sample, no tool or hook activity) for a grace window, configurable with a sane default of a few minutes. A one-sample `Stop` flicker never qualifies.\n- **A nudge''s own reply isn''t new idleness.** Idle observed within the grace window after a delivered nudge, or after any operator or owner message, belongs to the same episode.\n- **Budget per obligation, not per episode.** The nudge count and backoff are keyed to the unmet obligation (this actor row and leaf) and reset only by real progress evidence: a new commit or push, a claim, or a stall declaration. They are never reset by an attention flicker. Back off exponentially between nudges.\n- Consider whether Claude''s `Stop` should map to a weaker \"response ended\" signal than `Idle`, and leave \"idle\" to screen evidence plus duration.\n\n## Acceptance\n\n- [ ] Scenario test with a Claude-like event sequence (`stop` events between tool activity, a reply to a delivered nudge) that produces **no** nudge while activity continues.\n- [ ] Scenario test: a genuinely idle crew owing a claim gets at most the configured nudges, with backoff, and then escalates to the operator.\n- [ ] Live: a Claude crew on feta working for 30 minutes receives 0 nudges.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2441/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2438","id":5677126522,"node_id":"I_kwDORel_088AAAABUmITeg","number":2438,"title":"Refused project refreshes are silent: three governor projects stopped converging for five days","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T12:05:55Z","updated_at":"2026-10-02T12:06:14Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nOn 2026-10-02 `flotilla project refresh` for katzensteg, porthole and ghostty failed with:\n\n```\nerror: operational entry refused: ops/governor.ensure.md: invalid ensure entry `governor`: unknown field `stance`\n```\n\n`stance` was retired from ensure entries by #2105 (2026-09-27), but those three ops repos still declared it. So **every refresh of those projects has been refused since then.** The failure only shows up as a CLI error on an explicit refresh. Nothing surfaced it on the Project or ConvoyEnsure, to the governor or to the operator. It came to light only because a model change (`agents:` → Opus 5.5) didn''t take effect. Wheelhouse''s ops file never declared `stance`, so it kept converging.\n\nThe CLAUDE.md rule for out-of-repo manifests is \"stay compatible, or ship the project-map/ops manifest update in the same roll\". #2105''s companion change didn''t cover these ops repos, and nothing checks that.\n\n## What to build\n\n- **Make the refusal visible.** A refused operational entry records a typed condition on the Project (and the owning ConvoyEnsure): `DeclarationRefused` with the entry path and parser error. It raises an attention row, so the governor and `convoy list`/`project list` show it. A project whose declaration hasn''t converged for longer than a threshold is flagged.\n- **Check before the roll.** The pre-roll validation (`resource validate`, live-store decode) also parses every registered project''s ops entries with the candidate. A schema change that would refuse a live declaration fails the roll check, the way stored records do (#2167, #2169).\n- **Ops-entry compatibility.** Decide whether retired ops-entry fields get the same one-generation accept-and-drop treatment as stored data (ADR 0047), or whether ops entries stay strict and the pre-roll check is the gate. Record the ruling.\n\n## Acceptance\n\n- [ ] A test: an ops entry with an unknown field yields a visible Project condition and attention, not just a CLI error.\n- [ ] The pre-roll check parses registered projects'' ops entries with the candidate and fails on refusal.\n- [ ] The compatibility ruling is recorded (ADR 0047 amendment or a CLAUDE.md note).\n\nFixing the three ops files: robert/katzensteg-ops, porthole-ops and ghostty-ops, PR \"drop the retired stance field\".\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2438/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2432","id":5676196654,"node_id":"I_kwDORel_088AAAABUlPjLg","number":2432,"title":"Pace checkout teardown deletions per filesystem","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T10:33:44Z","updated_at":"2026-10-02T10:34:00Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Observation\n\nIn the feta load run (2026-10-02, #2389 part 2), the remaining I/O pressure peaks (PSI some 50–64%, full up to 53%) came at **low** load, with no D-state threads, while scratch usage **fell** by about 44 GB in about 10 minutes. They''re bursts of mass deletion: several landed convoys'' checkouts, each with a 30–60 GB `target/`, removed at the same time. The daemon was unaffected (its store is on a separate device), but crews compiling on the same filesystem compete with the deletes.\n\n## Idea (owner, 2026-10-02)\n\nQueue teardown deletions **per filesystem** (by device ID of the checkout path), so at most N large removals run concurrently on one device. Removals on different devices proceed in parallel. Measure before building: if a daemon-wide limit of one or two concurrent removals is enough, use that.\n\n## Acceptance\n\n- [ ] Concurrent teardowns on one filesystem are bounded, by a per-device or daemon-wide limit, chosen by measurement.\n- [ ] A test showing removals queue rather than run all at once.\n- [ ] A feta load-run comparison of I/O PSI during a teardown burst, before and after.\n\nLow priority: the daemon is already isolated from this. Related: #2324 / #2416 (archive work off the controller loop), #2389.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2432/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2428","id":5675492283,"node_id":"I_kwDORel_088AAAABUkkjuw","number":2428,"title":"Remove vestigial TUI active-repo state after repo View retirement","user":{"