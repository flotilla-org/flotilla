","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-29T11:15:22Z","updated_at":"2026-10-02T11:59:07Z","closed_at":"2026-10-02T11:59:07Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2201 follow-up review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2201#issuecomment-5889014447\n\nClarify the `Adopt` resolution failure mode in `ResourceManifestReconciler`: adoption can rewrite the manifest source, then detect a changed live spec during final verification. The resulting `Failed` status is at-most-once and requires operator inspection and a new token to retry.\n\nAdd a short code comment at the final verification step, and consider whether `flotilla manifest status` should make this partial-write possibility more explicit when reporting a failed adoption. Keep spec and status ownership unchanged.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2203/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2203/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2434","id":5676207552,"node_id":"PR_kwDORel_088AAAABGQ_YbQ","number":2434,"title":"refactor: extract convoy admission as one transaction-owning unit","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":9,"created_at":"2026-10-02T10:34:52Z","updated_at":"2026-10-02T11:58:50Z","closed_at":"2026-10-02T11:58:48Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2434","html_url":"https://github.com/flotilla-org/flotilla/pull/2434","diff_url":"https://github.com/flotilla-org/flotilla/pull/2434.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2434.patch","merged_at":"2026-10-02T11:58:48Z"},"body":"Closes #2219.\n\n## Change\n\n- Extract convoy admission, allocation, addressing, placement, brief creation, and the guarded creation transactions into `convoy_admission.rs`.\n- Inject a narrow change-request query port into the observation source, removing its daemon callback. Give issue observation an injected query port as well so admission has no daemon back-pointer.\n- Keep command handlers and the ensure reconciler delegating to the admission service, preserving existing command results and serialized records.\n- Move admission unit tests beside the new module and add port and need-composition contract coverage.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n- `cargo dylint --all -- --all-targets`\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2434/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2219","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2219/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2219/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2219/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2219","id":5632693656,"node_id":"I_kwDORel_088AAAABT7wVmA","number":2219,"title":"refactor: extract convoy admission as one transaction-owning unit","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-29T15:09:36Z","updated_at":"2026-10-02T11:58:50Z","closed_at":"2026-10-02T11:58:50Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2212","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":3,"blocking":3,"total_blocking":3},"body":"Slice 7 of #2212; that issue records the rulings.\n\n## Goal\n\nExtract convoy admission as one unit that owns the `convoy_admission` transaction guard. This is the substrate cut behind ADR 0046: prune → allocate → place. It is the largest and highest-value slice, and the most frequently changed code.\n\n## First step (ruling 5)\n\nBreak the circular callback. `ProviderChangeRequestObservationSource` currently gets a `Weak<InProcessDaemon>` through `self_weak` / `OnceLock` and calls back into the daemon. Replace that with an injected narrow port, e.g. `Arc<dyn ChangeRequestQueryPort>`.\n\n## What moves\n\nAll of it moves together into `convoy_admission.rs`:\n- **Allocation:** `ConvoyStartTask`, `ConvoyAdmission`, `AllocationRole`, `expand_allocation_roles`, `allocate_roles`, `refresh_crossed_handoffs`, `allocation_credential_grants`.\n- **Addressing:** `RoleAddress`, `allocate_convoy_generation`, `resolve_convoy_candidate_indices`, `ConvoyStartKey` / `ConvoyStartSubject`.\n- **Change-request resolution:** `resolve_convoy_change_request*`, `repository_change_request_candidates`, `discover_repository_change_request`, `resolve_observed_convoy_change_request`.\n- **The pipeline:** `resolve_convoy_issue`, `prepare_convoy_admission*`, `compose_convoy_needs`, `resolve_capability_placement`, `admit_convoy_start`.\n- **Creation and briefs:** `create_convoy_with_workflow_snapshot`, `write_admission_briefs`, `prepare_vessel_placement_annotations`, `create_convoy_with_annotations`, the regard emitters, the free-space floors.\n- **The guard and pending-start state:** the `convoy_admission` `Mutex<()>` and `pending_convoy_starts`.\n- **Placement and fulfilment helpers** that only admission uses: `FulfilmentDecider` / `StaticFulfilmentDecider`, `PlacementResolution`, `KindCandidate`. Where `placement_policy.rs` already has the logic, consolidate into it rather than keeping two copies.\n\n## Transaction discipline (ruling 6)\n\nThe guard moves with every method it serializes. Do not leave it behind in `InProcessDaemon`, and do not split the read-modify-write sequence across modules.\n\n## Interface\n\n`ConvoyAdmission` takes:\n- the backend;\n- the `FulfilmentDecider`;\n- the brief artifact writer;\n- the `EventSink`;\n- the change-request port;\n- the clock.\n\nIt exposes roughly `admit(intent)`, `compose_needs` and `resolve_change_request`.\n\n`run_convoy_start` and `supervise_convoy_start` delegate to it. The ensure reconciler keeps calling admission through the same `admit` primitive, which the next slice relies on.\n\n## Before starting\n\nDispatch this only once in-flight admission, fulfilment and brief PRs have landed (ruling 4). Never run it at the same time as the crew-operations slice.\n\n## Done when\n\n- Admission code lives only in the new module, and `in_process.rs` delegates.\n- `self_weak` is gone, or has no remaining admission or observation user.\n- The admission need-composition, allocation-matrix, handoff-refusal and change-request tests are contract tests on the unit with fakes.\n- The daemon-level admit and start scenarios pass.\n\n## Rules for every slice of this decomposition\n\n- **Keep behaviour exactly the same.** This is a code move plus narrow interfaces: no functional changes and no serialized-shape changes. If a move seems to need a shape change, stop and escalate; that is out of scope.\n- **Leave `InProcessDaemon` as the composition root.** It keeps implementing `DaemonHandle`, and its existing `pub` methods become thin delegations to the extracted service. Callers in `flotilla-daemon` stay unchanged unless this issue says otherwise.\n- **The new unit owns its fields.** Pass collaborators in: namespace, backends, clock, host registry, and so on. Don''t hand it `&InProcessDaemon` or a `Weak` back-pointer. Follow the repo conventions: no `std::env`, VCS only through `crate::vcs::Vcs`, and `use` imports rather than long inline paths (Dylint).\n- **Tests move with the code.** Pure-function tests go next to the module as contract tests. `InProcessDaemon`-level scenario tests stay scenario tests, and can move to a per-area file under `in_process/`. The total test count must not drop.\n- **Hands off shared fixtures:**\n  - Never regenerate the golden decode corpus (#2169).\n  - Never accept `insta` snapshots.\n- **Anchor on functions, not line numbers.** Line ranges in the plan are approximate and drift with every merge. Find the functions and types by name.\n- **Before pushing, pass the exact CI gates:**\n  - `cargo +nightly-2026-03-12 fmt --check`\n  - `cargo clippy --workspace --all-targets --locked -- -D warnings`\n  - `cargo test --workspace --locked`\n  - `cargo dylint --all -- --all-targets`\n- **Rebase on `origin/main` right before opening the PR.** `in_process.rs` is the repo''s top churn hotspot. Resolve conflicts by re-applying the move, not by hand-merging moved bodies.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","