0T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From the final static review of PR #2250 by the claude-review bot: https://github.com/flotilla-org/flotilla/pull/2250\n\nPR #2250 canonicalized fulfilment host references. These non-blocking points from the final review weren''t addressed before merge.\n\n1. **Deduplicate the ownership check.** `crates/flotilla-daemon/src/runtime.rs` repeats a pattern in several places: a fast path on `host_ref == kind.spec.host_ref`, then a `canonical_host_id` fallback with a warning on ambiguity. Extract one helper, e.g. `kind_belongs_to_host(hosts, kind, host_ref) -> bool`, that warns on ambiguity, and use it at every site.\n2. **Let one conflict not block the whole migration pass.** `migrate_live_placement_policies` updates with the `resource_version` read at list time, and propagates a `Conflict` with `?`, aborting the remaining policies and kinds until the next heartbeat. On `Conflict`, `warn!` and `continue`, and let the next pass re-read that item. Add a test with one conflicting policy next to one healthy policy.\n3. **Test the new human output.** `resource` human output now renders exact host-ID values as `display name (host id)` (`replace_host_ids` in `src/main.rs`). No test pins this format. Add an assertion, including the case where a `metadata.name` value is itself a host ID, which the PR''s decision ledger accepted.\n\nNo serialized-shape changes.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}