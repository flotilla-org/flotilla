 from PR review feedback","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T18:36:43Z","updated_at":"2026-10-02T00:41:51Z","closed_at":"2026-10-02T00:41:51Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2320 final review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5917369952\n\n`CREW_GITHUB_LOGIN` in the change-request observer is a hard-coded GitHub GraphQL login. It identifies whose `pr-shepherd-addresses:` markers are trusted. The current deployment has one crew App, but another crew App identity would leave its markers unrecognized and could repeatedly wake crews.\n\nWhen multiple crew App identities are supported, pass the active credential''s GraphQL actor login into the observer rather than using the constant. Cover marker acceptance for the configured crew identity and rejection of markers from other actors.\n\nThis is distinct from `change_request.review_bot_login`, which identifies the bot whose review comments count as feedback.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2331/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2331/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2293","id":5647243968,"node_id":"I_kwDORel_088AAAABUJoawA","number":2293,"title":"Set PR_SHEPHERD_AS for crews so pr-shepherd works under the App token","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T13:29:32Z","updated_at":"2026-10-02T00:41:51Z","closed_at":"2026-10-02T00:41:51Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Follow-up to #2108 and #2279. Those issues were moved to rjwittams/rjw-skills#5, which is now fixed by rjwittams/rjw-skills#6 (merged as `0965516`).\n\n## Background\n\nThe pr-shepherd helper used to find out who \"we\" are by calling `/user`. A GitHub App installation token can''t make that call. It now accepts the identity explicitly, through `--as <login>` or the `PR_SHEPHERD_AS` environment variable. When set:\n\n- The identity is resolved to a numeric user id once, via `users/<login>`. A typo fails loudly rather than silently matching nobody.\n- `/user` is skipped, so `wait-for-checks --check-reviews` and `new-reviews` no longer fail with a 403.\n- `status` treats that account''s comments as our own. On a crew-authored PR this happens even without the variable, because `status` now takes the PR author from REST and compares numeric ids. On #2283 the old helper reported 5 actionable comments, all of them the crew''s own; the fixed helper reports 0.\n\nIf neither `--as` nor `PR_SHEPHERD_AS` is set and `/user` returns a 403, the helper now fails with an error naming both options.\n\n## Ask\n\n1. **Set `PR_SHEPHERD_AS=flotilla-crew[bot]` in every crew''s environment.** It fits naturally next to the crew git identity fragments in `crates/flotilla-daemon/src/vessel_config.rs` (`crew_git_identity_environment_fragments`, which already derives from `CREW_GIT_USER_NAME`). Prefer this to a line in the crew brief, so no crew has to remember to set it.\n2. **Bump the pinned rjw-skills revision** (`FLEET_RJW_SKILLS_SHA`) to at least `0965516` so that fleet generations pick up the fix. That revision also contains rjwittams/rjw-skills#4, which moved the helper into `skills/pr-shepherd/scripts/`. Before #4, skill staging, which copies only `plugins/rjw-sdlc/skills/*`, never shipped the helper to crews at all.\n3. Once both are live, the workaround no longer needs to be recorded in decision ledgers (wheelhouse#99, #101, #116, #127).\n\n## Done when\n\nA crew on a GitHub destination runs `wait-for-checks --check-reviews` and `status --brief` on its own PR with no 403. Its own replies are not listed as actionable, and it records no pr-shepherd workaround in its ledger.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2293/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2417","id":5671040099,"node_id":"I_kwDORel_088AAAABUgU0Yw","number":2417,"title":"Bound remote checkout archive retention sweeps per root","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T00:24:52Z","updated_at":"2026-10-02T00:24:52Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Context\n\nPR #2416 moves checkout archive retention into its own hourly task. A remote archive root can still hang during `find` or `rm`, preventing later roots from being swept in that task''s current pass.\n\n## Desired behavior\n\nBound each remote root sweep with a timeout and continue to the next root after recording a warning. Verify cancellation behavior for the remote command runner so timeout does not leave a long-running process behind.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2417/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2411","id":5670090083,"node_id":"PR_kwDORel_088AAAABGMLjag","number":2411,"title":"Support multiple convoy change request subjects","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":9,"created_at":"2026-10-01T22:29:09Z","updated_at":"2026-10-01T23:42:25Z","closed_at":"2026-10-01T23:42:22Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2411","html_url":"https://github.com/flotilla-org/flotilla/pull/2411","diff_url":"https://github.com/flotilla-org/flotilla/pull/2411.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2411.patch","merged_at":"2026-10-01T23:42:22Z"},"body":"## Summary\n\n- Make the convoy''s declared and discovered subject set the source for settlement, published rows, explanations, fleet output, and the TUI. Multiple produced or adopted change requests remain active together; a superseded request is released.\n- Settle only when every active change request reaches a world terminal. Remove plural-produces attention while retaining attention for contradictory relationships on the same request.\n- Persist claim and checkout-discovered subjects before completion or settlement checks, and record a successful branch scan so a convoy with no request can settle after discovery. Checkout inspection probes a known request and avoids an immediate retry loop while association remains unavailable.\n- Keep `ConvoyStatus` decodable across one generation with serde defaults on `branch_subject_scan_at` and `branch_subject_scan_error`. Failed branch lookups remain visible in `convoy explain`. Convoy status is authored by the in-repo daemon/controllers; I found no out-of-repo source that authors this resource kind.\n\n## Snapshot change\n\nThe curated TUI snapshot changes `#815 open` and `#812 merged` to `!815` and `!812`. The PR cell now renders the convoy''s subject identity. Forge state is no longer copied from a separate singular change-request cache, which could disagree with the plural subject set. The row details show each subject''s relationship and URL.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n\nCloses #2183.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2411/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2183","id":5617970744,"node_id":"I_kwDORel_088AAAABTttuOA","number":2183,"title":"Settlement and surfaces read the convoy subject set per repository; retire the four PR derivations (ADR 0049)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10393671168,"node_id":"LA_kwDORel_088AAAACa4LWAA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/ui","name":"ui","color":"C5DEF5","default":false,"description":"UI/UX and rendering","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-28T16:35:44Z","updated_at":"2026-10-01T23:42:23Z","closed_at":"2026-10-01T23:42:23Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015454,"node_id":"IT_kwDOEBMoCM4B6IRe","name":"Feature","description":"A request, idea, or new functionality","color":"blue","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"Implements ADR 0049 §5, and §4 as amended in #2402. #2182 is done.\n\n**Ruling (owner, 2026-10-01): no one-change-request limit.** A convoy can produce or adopt any number of change requests in any repository. Several `produces` subjects are normal and must each reach a world terminal. The \"conflicting produced change requests … link one as supersedes or unlink one\" attention row (`leaf_engine.rs`) is removed for that case. Conflict attention remains only for contradictions about a single subject. Evidence: crosshome-teardown (#2372, #2394) blocked settlement today; cr-observation (#2382, #2392) and homing-regression (#2339, #2342) hit the same marker.\n\n## What to build\n\n- **Settlement:**\n  - `expected_change_request_leaves` derives from the subject set: every `produces` or `adopts` change request must reach a world terminal, per repository, and `supersedes` releases the superseded one;\n  - `works_on` issues follow declared conditions only (ADR 0043).\n- **Published row:** `ConvoyRow.change_request` becomes `subjects` (a set with relationships), fed from convoy status, not the aggregator''s private cache.\n- **Retire** the aggregator branch-enrichment cache as a source of truth (it becomes a discovery writer only), the claim-parse-only landing path, and the checkout-level `gh pr list` fallback.\n- **Surfaces:**\n  - the CLI (`convoy list`, `convoy explain`) and the TUI render subjects in the short form, grouped by relationship;\n  - copy actions yield URLs;\n  - the view-model exposes the full set so wheelhouse can compact (`!281`, `c!281`) as ADR 0049 §2 allows.\n\n## Acceptance\n\n- A convoy with PRs in two repositories lands only when both are terminal.\n- A superseded PR doesn''t block landing.\n- A convoy that produced a PR and a follow-up PR in the same repository lands when both are terminal, with no conflict attention and no operator link needed.\n- The row, `convoy explain` and settlement agree on the set in every scenario test.\n- Any change to the TUI `insta` snapshots is investigated and justified.\n\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2183/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2412","id":5670193416,"node_id":"I_kwDORel_088AAAABUfhJCA","number":2412,"title":"Show observed state for each convoy change request subject","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T22:39:22Z","updated_at":"2026-10-01T22:39:22Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2411 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2411#issuecomment-5941968910\n\nThe convoy table now derives PR identities from its plural subject set. It no longer shows the previous singular cache''s open/merged text in the PR cell. The subject URL opens the forge state, but the TUI could show each subject''s observed state directly.\n\nAdd per-subject observed state to the convoy detail view using ChangeRequest resource observations, while keeping the convoy subject set as the only source of subject identity and preserving the plural layout. Include unknown/stale handling and a snapshot that shows multiple requests with different states.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2409","id":5668908883,"node_id":"PR_kwDORel_088AAAABGLOfSA","number":2409,"title":"fix: let surviving repository annotations win in the forge identity sweep","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T20:45:12Z","updated_at":"2026-10-01T20:56:46Z","closed_at":"2026-10-01T20:56:44Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2409","html_url":"https://github.com/flotilla-org/flotilla/pull/2409","diff_url":"https://github.com/flotilla-org/flotilla/pull/2409.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2409.patch","merged_at":"2026-10-01T20:56:44Z"},"body":"## Problem\n\nAfter feta rebooted (2026-10-01), its two ensure-managed governors (katzensteg, porthole) could not be re-admitted. Every ensure pass refused:\n\n```\ndriver admission refused: repository i3vjvo88…: Repository metadata annotation `flotilla.work/project-bootstrap-commit` conflicts during forge identity sweep\n```\n\nThe forge identity sweep (`sweep_split_forge_repositories`) merges split Repository records (manchego-keyed versus logical forgejo-keyed, #1955) into the forge-identity record, and rewrites Project, ConvoyEnsure and workflow references. It aborted on **any** differing annotation. But Repository annotations are bookkeeping about each record: `project-bootstrap-commit`, `last-synced-at`, `origin-root`, `project-declaration-file`. Records bootstrapped and synced separately always differ. The katzensteg Project and ConvoyEnsure still reference the stale manchego-keyed record, so the merge has to happen, and the governors stayed down.\n\n## Fix\n\nFor annotations, the surviving record''s values win, and a source only fills annotations the survivor lacks. Labels keep the strict conflict check, and alias conflicts are still reported before anything changes. That''s unchanged and covered by `forge_identity_sweep_reports_conflicting_aliases_before_changing_repositories`.\n\n## Tests\n\n- New `forge_identity_sweep_merges_records_whose_bookkeeping_annotations_differ` reproduces the incident. It fails on main and passes with the fix.\n- All four `forge_identity_sweep*` tests pass.\n- `cargo +1.99.0 clippy -p flotilla-core --all-targets --features test-support -D warnings` is clean, and fmt check passes.\n\nThis is wanted in the next fleet generation so the feta governors re-admit.\n\nhttps://claude.ai/code/session_011gkmBquphESrqV3R5jpMb9\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2409/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2408","id":5667956504,"node_id":"PR_kwDORel_088AAAABGKdPIA","number":2408,"title":"fix: shrink debug command dispatch stack frames","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":5,"created_at":"2026-10-01T19:30:33Z","updated_at":"2026-10-01T20:41:07Z","closed_at":"2026-10-01T20:41:05Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2408","html_url":"https://github.com/flotilla-org/flotilla/pull/2408","diff_url":"https://github.com/flotilla-org/flotilla/pull/2408.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2408.patch","merged_at":"2026-10-01T20:41:05Z"},"body":"## Change\n\nExtracted the inline `CommandAction` bodies from `InProcessDaemon::execute_impl` into separate async methods. Each dispatch arm boxes the call inside a boxed async block; the inner box keeps construction of the large helper future off the caller''s poll frame. Extracted all 18 `Request` arms from `dispatch_inner` and the remote command branch from `dispatch_execute_for_caller`. The two blob read buffers now use heap-backed vectors.\n\nRemoved the 32 MB wrappers from `request_session_pair.rs`. A new test runs the paired three-host cross-host request on a 1 MB thread and aborts on stack overflow.\n\n## Debug stack measurements (aarch64 macOS)\n\nLLDB stack-pointer deltas in the debug `request_session_pair` binary. The before run used `1f273506` and stopped at a 2 MB overflow. The after run used this branch rebased onto `6f791cd2`, with breakpoints in the same functions:\n\n| Poll frame | Before | After |\n| --- | ---: | ---: |\n| `InProcessDaemon::execute_impl` | 1,060,016 B | 26,512 B |\n| `RemoteCommandRouter::dispatch_execute_for_caller` | 216,016 B | 53,328 B |\n| `RequestDispatcher::dispatch_inner` | 207,904 B | 68,240 B |\n| `RequestDispatcher::dispatch` | 202,016 B | 4,624 B |\n\nA single direct `Box::pin(helper(...))` left `execute_impl` at 346,144 B. The extra boxed async boundary brought it below the 64 KB acceptance limit.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`: passed.\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`: passed.\n- `RUST_MIN_STACK=2097152 cargo test -p flotilla-daemon --test request_session_pair --locked`: 37 passed, including the 1 MB regression test.\n- `cargo test --workspace --locked`: passed on current `main`, including stored-record decoding. An earlier run on the prior `main` hit the known macOS #2395 test failure; #2404 landed during this work and resolved it.\n\n\n## Resource schema changes\n\nNo resource schema change.\n\n## Decision ledger (not recorded: #2390)\n\nThe decision ledger remains in `.flotilla/decision-ledger-2407.md` on this host. I chose the existing paired three-host trace for the 1 MB test, boxed the action future at two boundaries after measuring the direct-box result, and extracted every `dispatch_inner` request branch to keep one dispatch pattern. `flotilla artifact put` is unavailable for host-direct macOS crew under #2390.\n\nCloses #2407.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2408/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2407","id":5666886338,"node_id":"I_kwDORel_088AAAABUcXSwg","number":2407,"title":"Debug-build stack overflow: execute_impl''s poll frame is ~1 MB; split command arms out of the giant async matches","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null},{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T18:11:16Z","updated_at":"2026-10-01T20:41:07Z","closed_at":"2026-10-01T20:41:07Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`crates/flotilla-daemon/tests/request_session_pair.rs` overflows its stack in debug builds. CI failed this way on main and on every crew branch between the #2396 merge and #2401. #2401 then wrapped the *generated* scenario tests in a 32 MB worker thread (`with_large_test_stack`). That hides the problem without fixing it. On a Mac, at the default 2 MB test stack, ordinary tests in the same file still overflow: `convoy_creation_attributes_provenance_and_regard_to_the_surface_principal`, `agent_abandon_is_attributed_to_the_acting_principal`, and others.\n\n## Measurement (main at c7921785, debug, aarch64-darwin)\n\nOverflow caught in lldb at `RUST_MIN_STACK=2097152`: 107 frames spanning 2.1 MB. Stack per function:\n\n| Bytes | Function |\n|---|---|\n| **1,041,744** | `InProcessDaemon::execute_impl::{closure}`: one poll frame |\n| 203,280 | `RemoteCommandRouter::dispatch_execute_for_caller::{closure}` |\n| 198,256 | `RequestDispatcher::dispatch_inner::{closure}` |\n| 186,096 | `RequestDispatcher::dispatch::{closure}` |\n| 82,912 | `InProcessDaemon::create_convoy_with_annotations::{closure}` |\n| 69,728 | `InProcessDaemon::create_convoy_with_workflow_snapshot::{closure}` |\n| 66,656 | `InProcessDaemon::execute_for_caller::{closure}` |\n\n`execute_impl` (`flotilla-core/src/in_process.rs`) is a single 1,332-line async fn with about 50 inline `CommandAction` branches. `dispatch_inner` is 335 lines with many inline `Request` arms. In debug codegen, rustc doesn''t share stack slots between match arms, so the poll function reserves space for every arm''s locals and temporaries at once. Release builds overlap the slots, which is why fleet daemons haven''t shown this.\n\nFuture size is a separate and smaller problem. `clippy::large_futures` finds 179 futures over 16 KB in flotilla-daemon and about 30 KB futures on `execute` in flotilla-core. The worst are two `[0_u8; 65536]` read buffers held across `.await` in `blob_store.rs` (64 KiB futures, added in #2091). Those sit behind `async_trait` boxing, so moving them to the heap didn''t change the overflow; it was tested.\n\n## What to build\n\n1. **Split the giant matches.** Each `CommandAction` arm in `execute_impl` becomes a call to its own async method, boxed (`Box::pin(self.convoy_start(..)).await`), so each arm''s locals live in its own frame and future. The same for `dispatch_inner`''s `Request` arms and `dispatch_execute_for_caller`. This lines up with #2212 (decompose in_process.rs into services) and #2353''s domain command routing. Do the arm extraction here as the minimal correct cut, and leave the service moves to #2212.\n2. **Heap read buffers** in `blob_store.rs`: `vec![0; 65536]` (or a `BytesMut`) instead of arrays held across `.await`.\n3. **Remove `with_large_test_stack`** from `request_session_pair.rs` once the frames are small. The generated three-host world must pass at the default test stack. That is the regression gate.\n4. **Guard against regression.** Add a test that runs a representative cross-host request at a deliberately reduced stack (for example 1 MB, on a spawned thread) and fails loudly if the in-process call stack grows back. Optionally enable `clippy::large_futures` with a project threshold once the outliers are fixed.\n\n## Acceptance\n\n- [ ] `RUST_MIN_STACK=2097152 cargo test -p flotilla-daemon --test request_session_pair` passes on macOS aarch64 and Linux in debug builds, with `with_large_test_stack` removed.\n- [ ] The `execute_impl` poll frame is under 64 KB in debug builds. Measure the same way (lldb SP deltas at a breakpoint or overflow, or `-Z emit-stack-sizes`) and record before/after in the PR.\n- [ ] The reduced-stack regression test exists and passes.\n\nRelated: #2401 (where the stack bump landed), #2397 (generated scenarios that exposed it), #2212.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2407/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2404","id":5666293732,"node_id":"PR_kwDORel_088AAAABGJGlqw","number":2404,"title":"fix: use reserved platform capacity when no alternative covers needs","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":10,"created_at":"2026-10-01T17:24:13Z","updated_at":"2026-10-01T18:34:28Z","closed_at":"2026-10-01T18:34:26Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2404","html_url":"https://github.com/flotilla-org/flotilla/pull/2404","diff_url":"https://github.com/flotilla-org/flotilla/pull/2404.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2404.patch","merged_at":"2026-10-01T18:34:26Z"},"body":"## Summary\n\n- Make fixture host-platform detection deterministic through the injected discovery environment; the `project_cli` fixture declares Linux.\n- Reserve macOS and Windows fulfilments only while an unreserved candidate covers the needs. When reserved capacity is the only fit, admit without escalation and persist the fallback reason for `convoy explain`.\n- Cover Linux preference, reserved-only fallback, and macOS pin escalation. Decode previous-generation allocation status without the new reason field.\n- Give the ordinary multi-host convoy creation scenario sufficient stack after the mainline scenario test stack repair in #2401.\n\nCloses #2395.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check` — passed.\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` — passed.\n- `cargo test --workspace --locked` — passed on the rebased branch, including daemon runtime and scenario suites.\n\n## Stored data and manifests\n\n`FulfilmentAllocation.reservation_reason` is optional with a serde default, so previous-generation convoy statuses decode. No out-of-repo source authors this admission status field; the in-process daemon writes it.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2404/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2395","id":5664269514,"node_id":"I_kwDORel_088AAAABUZ3kyg","number":2395,"title":"project_cli ops-entries test fails on macOS: real host OS makes host-direct capacity ''reserved''","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T14:58:15Z","updated_at":"2026-10-01T18:34:27Z","closed_at":"2026-10-01T18:34:27Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`crates/flotilla-daemon/tests/project_cli.rs::ops_entries_materialize_by_frontmatter_scope_with_provenance_and_converge_drift` fails on every macOS host and passes on Linux CI. Reproduced on main (193e4cbb) on kiwi:\n\n```\nstart ensured standing convoy: \"...admission refused...: no fulfilment covers role `verify` need : no fulfilment kind covers needs without consuming reserved macOS or Windows capacity\"\n```\n\nThe in-process daemon''s host-direct fulfilment gets its platform grant from the real host: `host_summary.rs` uses `std::env::consts::OS`. On a Mac that grant is `macos`. The reservation from #2185 (`PlacementTieBreak::reserved`) then refuses to place an unpinned `verify` crew there. This blocked the store-latency crew''s (#2383) exact workspace gate on kiwi.\n\n## What to build\n\n- Make the test hermetic. The fixture declares its host platform, Linux unless the test is about reservation, through an injected seam rather than `std::env::consts::OS`, so the result doesn''t depend on which OS runs `cargo test`.\n- Sweep the other daemon and integration tests for the same dependency on the real host OS.\n\n## Ruling (owner, 2026-10-01): relative reservation\n\nScarce platform capacity (macOS, Windows) is held back from unrequested work **only while an unreserved candidate also covers the needs**. When reserved capacity is the only thing that covers them, admission places the work there without a pin or escalation reason. It records in the admission decision (`convoy explain`) that reserved capacity was used because nothing unreserved was available. Fleet-wide reservation judgement, such as holding a Mac for a known upcoming need, belongs to the Quartermaster (#1394), not this rule. ADR 0046 §4 is amended to match.\n\n## What to build (ruling)\n\n- In the placement tie-breaker, partition out reserved candidates only when the unreserved set is non-empty after the partition. Otherwise keep the reserved candidates and mark the decision `reserved_for_platform: true` with a reason such as \"no unreserved capacity covers the needs\".\n- A pin to reserved capacity while unreserved capacity exists still requires an escalation reason, as today.\n- Scenario tests:\n  - Linux and macOS candidates both present: Linux is chosen.\n  - Only macOS present: macOS is chosen, with no escalation reason, and the decision records the fallback.\n  - Pin to macOS while Linux is present: still needs an escalation reason.\n\n## Acceptance\n\n- [ ] The test passes on macOS and Linux.\n- [ ] Relative reservation is implemented and covered by the three scenario tests above.\n\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2395/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2402","id":5666265468,"node_id":"PR_kwDORel_088AAAABGJFHww","number":2402,"title":"docs: let convoys produce any number of change requests in adr 0049","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-10-01T17:21:51Z","updated_at":"2026-10-01T18:29:39Z","closed_at":"2026-10-01T18:29:37Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2402","html_url":"https://github.com/flotilla-org/flotilla/pull/2402","diff_url":"https://github.com/flotilla-org/flotilla/pull/2402.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2402.patch","merged_at":"2026-10-01T18:29:37Z"},"body":"Owner ruling (2026-10-01): there is no one-change-request limit. Change requests are subjects, and a convoy can produce or adopt any number of them.\n\n- §4 no longer treats several `produces` subjects as a disagreement. All of them are recorded, and §5 already requires each to reach a terminal state.\n- What remains a disagreement is a contradiction about a single subject: a rediscovered unlink, or incompatible relationships for one change request.\n- `supersedes` still means \"replaces\", releasing the replaced change request.\n\nEvidence: three convoys today produced a follow-up PR and hit the conflict marker:\n- crosshome-teardown (#2372, #2394), whose settlement blocked;\n- cr-observation (#2382, #2392);\n- homing-regression (#2339, #2342).\n\nThe implementation is #2183, whose body now carries this ruling.\n\nhttps://claude.ai/code/session_011gkmBquphESrqV3R5jpMb9","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2402/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2403","id":5666270205,"node_id":"I_kwDORel_088AAAABUbxr_Q","number":2403,"title":"Generated paired-world scenario test stack-overflows on main","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-10-01T17:22:16Z","updated_at":"2026-10-01T18:23:23Z","closed_at":"2026-10-01T18:23:23Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"`generated_paired_world_host_independence`, added by #2397, deterministically stack-overflows on unmodified `origin/main` (`31302f8cd`) in this Linux container.\n\nReproduction:\n\n```bash\ncargo test -p flotilla-daemon --locked --test request_session_pair generated_paired_world_host_independence -- --exact\n```\n\nResult: `thread ''generated_paired_world_host_independence'' has overflowed its stack`, then SIGABRT. The same failure occurs in the full `cargo test --workspace --locked` gate. This was verified in a separate detached worktree at `origin/main`, so it is unrelated to #2395.\n\nInvestigate whether the generated `hegel::test` case, shrinking, or the paired-world trace exceeds the test thread stack, and make the scenario gate pass on the standard CI invocation.\n","closed_by":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2403/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2405","id":5666333969,"node_id":"PR_kwDORel_088AAAABGJIrSQ","number":2405,"title":"fix: preserve crew resume briefs through stall nudges","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":11,"created_at":"2026-10-01T17:27:34Z","updated_at":"2026-10-01T18:15:42Z","closed_at":"2026-10-01T18:15:39Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2405","html_url":"https://github.com/flotilla-org/flotilla/pull/2405","diff_url":"https://github.com/flotilla-org/flotilla/pull/2405.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2405.patch","merged_at":"2026-10-01T18:15:39Z"},"body":"Closes #2391.\n\n## Change\n\n- Preserve session messages in delivery order. Competing writes retry on resource-version conflicts, remote turns carry an enqueue sequence, and the terminal reconciler advances after each confirmed message.\n- Tie resume grace to the new brief''s message ID. Stall supervision waits for confirmed delivery and a later idle observation before sending a nudge; a new declared stall resumes supervision immediately.\n- Report resumed briefs as queued until the agent confirms delivery. Convoy explain output lists pending operator briefs. A direct nudge to a declared stall acknowledges the report and asks what changed.\n- Give one large daemon integration scenario an explicit 8 MiB test thread and set an 8 MiB test-thread stack through repository Cargo configuration for generated multi-host scenarios to prevent deterministic test-harness stack overflows on the installed Rust toolchain.\n- Bound resume grace when delivery cannot be confirmed and safely ignore a repeat of an already delivered standing turn.\n- Use portable atomic compare-exchange in the existing checkout-reconciler test, since local Rust rejects `try_update` and CI Rust deprecates `fetch_update`.\n- Keep previous-generation TerminalSession messages and Convoy crew statuses decodable through serde defaults. The session record writes the queue tail in its new shape. These resources are authored by Flotilla controllers; no project-map or ops manifest authors are known.\n\n## Verification\n\n- Added scenarios for a declared stall followed by resume, concurrent operator/nudge writes, ordered agent delivery, and delayed remote acknowledgments.\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `RUST_MIN_STACK=8388608 CARGO_BUILD_JOBS=2 cargo test --workspace --locked` (workspace gate with a larger test-thread stack for unchanged generated integration tests in this environment)\n\nStored queue-history pruning is tracked in #2406.\n\nLive kiwi host-direct validation remains to be run against a deployed candidate. The current vessel is on feta and the kiwi daemon is running the previous version.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2405/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2391","id":5663671258,"node_id":"I_kwDORel_088AAAABUZTD2g","number":2391,"title":"convoy resume brief is silently overwritten by the stall nudge it triggers; stalled crew loops re-stalling","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T14:18:21Z","updated_at":"2026-10-01T18:15:41Z","closed_at":"2026-10-01T18:15:41Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`flotilla convoy resume` on a crew that declared a stall reports \"brief delivered now\", but the crew never receives the brief. It gets the generic stall nudge instead, re-stalls, and the cycle repeats on every resume.\n\nObserved on 2026-10-01 with store-latency (convoy-f1e423b8…, kiwi host-direct, codex). The crew''s codex rollout shows no trace of either operator brief. Instead it received `[flotilla · nudge] You owe a settlement claim…` at 14:09:53 and again at 14:12:48, each a few seconds after an operator resume. Each time it re-ran `crew stall` with the same evidence. It only recovered when the owner typed into the session directly.\n\n## Mechanism\n\n1. `convoy_resume_with_sender_internal` (`flotilla-core/src/in_process.rs`) calls `resume_crew_work`. That reopens crew work to `Working`, clearing the crew''s declared stall. It then writes the brief into the TerminalSession''s single `spec.source.message` slot (`queue_pending_crew_message`) and returns `Delivered`.\n2. On its next pass, the leaf engine''s stall supervision (`leaf_engine.rs`, the `idle_at.filter(|_| declared.is_none())` branch) sees an actor row that is unsatisfied and idle, with no declared stall. It fires `stall-nudge-N` through turn delivery.\n3. Turn delivery (`in_process.rs`, `*message = Some(delivery_message)`) overwrites the same slot. The operator brief is lost before the session delivers it, and `delivered_message_id` ends up as the nudge.\n4. The nudge''s text only offers `crew complete` or `crew stall`, so a crew that is still blocked stalls again. The next resume repeats the whole cycle.\n\n## What to build\n\n- **No lossy slot.** Crew messages queue in order; a write never silently replaces an undelivered message. If a priority rule is wanted, operator and owner briefs outrank nudges, and the nudge is dropped, not the brief.\n- **A resume is not idleness.** Reopening crew work with a fresh operator brief puts the stall episode in a grace state. No nudge fires until that brief has been delivered **and** the crew has finished a turn after it.\n- **Truthful delivery result.** `ConvoyBriefDelivered` means the message reached the agent, i.e. the session''s `delivered_message_id` matches it. Otherwise the CLI reports `queued`, and the explain or status surface shows any brief still pending or displaced.\n- **Nudges that fit a declared stall.** A nudge to a crew with a declared stall (if any is still sent) acknowledges the stall and asks what changed, not \"you owe a claim\".\n\n## Acceptance\n\n- [ ] Scenario test: crew declares a stall, then the operator resumes with a brief. The brief text is what the crew receives, and no nudge is delivered before the crew''s next turn ends.\n- [ ] Scenario test: an operator brief and a nudge race for an idle session. Both are delivered in order, or the nudge is dropped; the brief is never lost.\n- [ ] The CLI distinguishes a brief merely queued from one delivered to the agent.\n- [ ] Reproduced on a live host-direct crew on kiwi.\n\n## Related\n\n#2390 (the macOS caller-identity bug that caused the original stall), #2383.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2391/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2401","id":5665945799,"node_id":"PR_kwDORel_088AAAABGI0cPA","number":2401,"title":"fix: cap per-vessel Rust build and linker parallelism","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":10,"created_at":"2026-10-01T16:57:24Z","updated_at":"2026-10-01T17:57:34Z","closed_at":"2026-10-01T17:57:32Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2401","html_url":"https://github.com/flotilla-org/flotilla/pull/2401","diff_url":"https://github.com/flotilla-org/flotilla/pull/2401.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2401.patch","merged_at":"2026-10-01T17:57:32Z"},"body":"Closes #2389.\n\n## Change\n\n- Add `HostSpec.expected_concurrent_rust_crews` (default 4, with a previous-generation serde default). Provisioning divides available host cores by this setting, with a two-job floor, and injects `CARGO_BUILD_JOBS` for contained and host-direct terminals, including Tool sessions that may run Cargo.\n- Stage a Rust compiler workspace wrapper from the daemon state and mount it into contained vessels. It passes an lld `--threads=N` link argument while preserving repository Cargo rustflags and `RUSTFLAGS`; explicit non-lld linkers are left alone. The linker cap currently applies on x86_64 Linux; other architectures still receive `CARGO_BUILD_JOBS` and the Docker CPU quota. The agentless SSH wrapper is staged atomically in a private remote directory and reused when unchanged; an unset cap variable passes through to rustc. Cargo can nest this workspace wrapper with an existing `rustc-wrapper` such as sccache. On host-direct terminals, fulfilment replaces any preexisting `RUSTC_WORKSPACE_WRAPPER`.\n- Pass the same share to Docker `--cpus` as a backstop.\n\n## Capacity seam and stored data\n\n#2361 has not settled host capacity facts. This change keeps only the expected concurrent Rust crew count on the Host spec and uses local host parallelism at provisioning. #2361 can replace that source with its decided capacity facts later. Host resources are registered by the daemon; no out-of-repo Host manifest author was found for this field. Existing stored Host specs decode with the default.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` (Rust 1.99)\n- `cargo test --workspace --locked` with `CARGO_BUILD_JOBS=2`, `FLOTILLA_LINKER_THREADS=2`, and the branch''s workspace wrapper set while running on feta. Includes the stored-record corpus.\n- A real Cargo build fixture proves `.cargo/config.toml` rustflags and `RUSTFLAGS` still apply and records the `-Wl,--threads=2` argument reaching rustc. A fake compiler test covers explicit linker and target selection; a host-direct launch test covers Agent and Tool sessions. The generated paired-world test added on current main overflowed the default harness thread stack locally; the three generated scenarios and the partition-heal scenario now run on scoped 32 MiB worker stacks. The previous CI Test job failed on a generated scenario; all 36 request-session tests pass locally with the normal command, and the CI workflow remains unchanged.\n\n## Live feta evidence and deployment check\n\nThis coding vessel is on feta, but its running daemon is the pre-change version. Its existing container has no provisioned `CARGO_BUILD_JOBS` or linker wrapper, so the new environment values cannot yet be read from a newly provisioned vessel. A branch wrapper smoke build completed inside this real container. During a capped daemon test link, `rust-lld` had three threads total (two in D state); the prior incident counted 425 D-state linker threads. An uncapped local link coincided with a 30-second `convoy explain` timeout. A capped compilation interval gave 0.058 seconds, while another explain during an active capped link exceeded eight seconds amid continued host I/O pressure. These are spot checks, not the required four-crew acceptance run.\n\nBefore merge, deploy the candidate daemon to feta, provision a fresh contained crew, inspect its `CARGO_BUILD_JOBS`, `RUSTC_WORKSPACE_WRAPPER`, `FLOTILLA_LINKER_THREADS`, and Docker CPU quota, then run four concurrent crew builds and record linker D-state count and `convoy explain` latency. The vessel container has neither the host Docker socket nor working SSH credentials to perform that deployment from here.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2401/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2400","id":5665568445,"node_id":"I_kwDORel_088AAAABUbG2vQ","number":2400,"title":"brainstorm: deterministic review-point tracking: extracted findings as visible obligations for the crew","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T16:28:31Z","updated_at":"2026-10-01T17:37:59Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nReview handling depends on each crew re-reading free-text review comments and judging which points matter. It drops points in a recurring pattern. On 2026-10-01 alone:\n\n- **#2394**: the bot review''s three minor points went unanswered. The PR had been opened by the operator on the crew''s behalf, and no shepherding pass ran.\n- **#2396**: the first review was answered fully. The follow-up review 2 minutes later raised three \"minor, non-blocking\" points that never got a reply.\n- **#2397**: two points were \"addressed\" with weak pushback. A suggested helper was declined as an \"opaque predicate\", and a cost check was deferred as \"unmeasurable\" although the workflow can be run manually.\n\nEarlier skill and brief changes (\"every item gets a fix, reasoning or an issue number\"; \"wait for the re-review\") reduced this but didn''t eliminate it. The owner sees it at merge time, which is the most expensive place to catch it.\n\n## Direction to explore (not decided)\n\nAn internal, forge-neutral structure, rather than leaning on GitHub review threads. GitHub reviews need Actions changes everywhere and don''t obviously help.\n\n- A small, cheap model **extracts discrete findings** from each review (bot, human, or in-convoy reviewer): id, claim, location, severity, and source review/revision.\n- Findings become **first-class obligations visible to the crew** that owns the change, the way a stall or nudge is visible. A finding stays open until it has a disposition: fixed (commit), answered (reasoning), or deferred (issue link).\n- **Settlement reads them.** `crew complete` is refused while findings newer than the head''s push have no disposition. That turns \"wait for the re-review and handle it\" into a checked condition. Related: #2326 (head push time as cutoff), #2211 (typed refusal causes).\n- The same structure serves in-convoy review workflows (a reviewer vessel emits findings, the coder disposes of them) and PR review. ADR 0051 already anticipates review artifacts fitting the entity model; #1148 (review record as cargo).\n\n## Questions for research\n\n1. Prior art: how do Gerrit, Phabricator, Graphite and Reviewable, and AI review tools (CodeRabbit and similar), model review comments as trackable items with resolution state? Which carry a resolution state that tooling can read?\n2. How reliable is cheap-model extraction of discrete findings from long free-text bot reviews? Can the reviewing model emit structured findings directly, which avoids the extraction step for our own bot? (We control the claude-review prompt.)\n3. Where should findings live: resource kind, artifact, or convoy status? How do they key to revisions, so a finding against an old head isn''t silently dropped or double-counted?\n4. How do dispositions avoid becoming checkbox theatre? For example, should \"answered\" require reasoning a second pass can judge, under the reversal test from pr-shepherd?\n\n## Not in scope yet\n\nImplementation. This is research and design first.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2406","id":5666414154,"node_id":"I_kwDORel_088AAAABUb6eSg","number":2406,"title":"Bound stored TerminalSession message history after acknowledgments","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T17:33:59Z","updated_at":"2026-10-01T17:33:59Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nPR #2405 adds ordered `TerminalSession.spec.source.message.following` entries. Confirmed entries remain in the stored chain, so a long-lived session accumulates message history and each new enqueue rewrites it.\n\n## Desired behavior\n\nBound the stored history after delivery acknowledgments while preserving:\n\n- idempotent retries of a previously delivered turn;\n- `delivered_through` checks for remote supervisor-turn acknowledgment and resume grace;\n- delivery order and one-generation stored-record compatibility.\n\nA safe solution may need a compact acknowledged-ID or sequence marker before pruning the prefix. Add a long-running delivery test that exercises pruning and duplicate turn replay.\n\nFollow-up to #2391 and #2405.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2396","id":5664659395,"node_id":"PR_kwDORel_088AAAABGHxbEQ","number":2396,"title":"fix: keep WAL reads off the writer connection","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":8,"created_at":"2026-10-01T15:24:31Z","updated_at":"2026-10-01T17:12:51Z","closed_at":"2026-10-01T17:12:48Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2396","html_url":"https://github.com/flotilla-org/flotilla/pull/2396","diff_url":"https://github.com/flotilla-org/flotilla/pull/2396.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2396.patch","merged_at":"2026-10-01T17:12:48Z"},"body":"## Summary\n\n- Give file-backed SQLite resource stores a separate read-only WAL connection for ordinary get/list and replica reads.\n- Return a store-busy error after a two-second store-read deadline, and cap interactive daemon requests at five seconds.\n- Log store operations exceeding 100 ms and include Linux I/O PSI ten-second averages in local host capabilities.\n- Test reads against a writer held in a fake slow-fsync operation.\n\nResource list rows and their `resource_version` now come from one read transaction, so a concurrent writer cannot make the returned cursor newer than the items. Corrupt-row cleanup is dispatched after a valid read and does not delay the response. Repeated reads coalesce cleanup for the same store and operation, and cleanup rechecks the row before deleting or quarantining anything.\n\n## Diagnosis\n\nBefore this change, `SqliteBackend` submitted both reads and writes to one `tokio_rusqlite::Connection`. Its single worker executes calls serially, so a writer waiting in SQLite durability work also held up queued reads. The backend''s watcher mutex protects subscriber maps and is not held across SQLite calls. In the fake slow-fsync test, another writer operation waits on that worker while resource get/list complete on the read connection.\n\n## Controller status writes\n\n`update_status_typed` already commits an object''s status row, event, and compaction in one transaction. The controller loop writes at most one object status per pass. Batching across objects could delay their watch notifications and change reconciliation order, so this PR retains the existing per-object transaction.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check` — passed.\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` — passed.\n- `cargo test --workspace --locked` on kiwi — stopped at the known `project_cli::ops_entries_materialize_by_frontmatter_scope_with_provenance_and_converge_drift` failure on macOS, tracked in #2395. It fails on main too.\n- To cover every later suite, `RUST_MIN_STACK=16777216 cargo test --workspace --locked -- --skip ops_entries_materialize_by_frontmatter_scope_with_provenance_and_converge_drift` passed. Without the larger macOS test-thread stack, an unrelated `request_session_pair` test overflows; that isolated test passes with the larger stack. Linux CI is the authoritative workspace gate.\n- The focused SQLite latency tests and all 76 SQLite integration tests passed after the review changes.\n\nNo resource kind''s serialized schema changes. Out-of-repo schema authors: none. The new `io_pressure` entry uses the existing open-ended host capabilities map.\n\n## Decision ledger (not recorded: #2390)\n\nThe full ledger is in an untracked local file because artifact calls from host-direct macOS crews fail (#2390). Choices: retain the existing per-object status transaction rather than batch across objects; return a bounded busy error rather than a stale response; use one read-only connection rather than a pool; recheck corrupt rows before writer-side cleanup; dispatch and coalesce cleanup without waiting for the writer; exclude subscription setup from the cancellable request deadline; keep interactive classification in the daemon; expose only parsed Linux PSI averages through host capabilities. The local ledger records alternatives and questions for each.\n\nCloses #2383.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2396/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2383","id":5662632896,"node_id":"I_kwDORel_088AAAABUYTrwA","number":2383,"title":"Daemon becomes unresponsive under disk I/O pressure: reads queue behind writer fsync; requests hang instead of answering stale","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T13:06:31Z","updated_at":"2026-10-01T17:12:50Z","closed_at":"2026-10-01T17:12:50Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened (feta, 2026-10-01 ~13:00Z)\n\nWith nine crews compiling, feta''s daemon stopped answering in time. A wheelhouse agent''s `flotilla attach` timed out after 30s. On feta itself:\n- `convoy list` and `host list` took more than 30s;\n- `resource list host` took 16.6s.\n\n**Cause: disk I/O, not CPU.**\n- `/proc/pressure/io` reported `full avg10≈50`, so half the time every runnable task was stalled on disk. CPU pressure was about 1.4%; the load average of around 120 was I/O wait.\n- `flotillad`''s main thread was in btrfs `wait_current_trans`, and its 32 tokio workers were in `futex_wait`.\n- The daemon''s SQLite store (`~/.local/state/flotilla/resources.sqlite`, WAL mode) is on the same btrfs filesystem (zstd, CoW, commit=120) as about 214 GB of crew checkouts and `target/` directories.\n\nSo every read request queued behind the writer''s `fsync`, which queued behind every crew''s compile writes.\n\n## Ask\n\n1. **Reads must not wait for writer durability:** use separate read connections (WAL allows concurrent readers), or a read path that doesn''t take the writer''s lock. Measure where requests actually block today (single connection mutex? a backend-wide lock?), and say so in the PR.\n2. **Bounded request latency:** interactive requests (attach resolution, list, get, explain) answer within a deadline. If the store is busy, return a \"store busy\" error, or the last-known answer clearly marked stale. Never hang until the client''s 30s timeout.\n3. **Fewer `fsync`s per reconcile pass:** batch controller status writes where safe, and keep durability for anything that must be durable.\n4. **Diagnosability:** log when a store operation exceeds a threshold, with which operation and how long. Expose I/O-stall evidence (e.g. a PSI snapshot) in host diagnostics.\n5. **Tests:** a fake slow-fsync backend, where a read request completes within its deadline while a write is stalled.\n\nRelated: host capacity facts (#2361, now including PSI), the feta storage layout (host config, tracked outside this repo), and the earlier controller-queue deadlock (#2225).\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2383/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2397","id":5664690830,"node_id":"PR_kwDORel_088AAAABGHzFKg","number":2397,"title":"Build generated multi-host control-plane scenario gate","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":11,"created_at":"2026-10-01T15:26:35Z","updated_at":"2026-10-01T17:03:49Z","closed_at":"2026-10-01T17:02:42Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2397","html_url":"https://github.com/flotilla-org/flotilla/pull/2397","diff_url":"https://github.com/flotilla-org/flotilla/pull/2397.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2397.patch","merged_at":"2026-10-01T17:02:42Z"},"body":"Closes #2368.\n\n## What changed\n\n- Pin Hegel exactly. The CI profile uses a reproducible 12-case seed; the nightly profile runs 40 cases with a fresh seed. Hegel attaches a replay blob on failure.\n- Add a three-host in-memory request mesh with a client on every host.\n- Generate routing and lifecycle scenarios for convoy admission, resume/nudge, forced deletion, resource deletion, stable peer-session partitions, heal, and request-runtime restart. Each generated transition creates and deletes a new resource. Compare normalized command outputs and authored resource state from a home client and a remote desk in independent worlds.\n- Cover #2335, #2288, #2318, and #2343 as fixed regression rows. The #2343 row is active after #2372 landed.\n- Add generator-coverage negative controls that prove the CI draws remote-home cases for origin-first targeting and local-only TerminalSession lookup. A separate manual source mutation of #2335 previously shrank through the generated router scenario.\n- Share a generic `eventually` polling helper across request-session tests.\n- Scan every registered local resource kind for deleting records with stranded finalizers after settlement, with a negative control proving the scan detects one.\n\nThe partition scenarios cut and rebuild peer sessions. They cover tombstone persistence across re-peering and request-runtime restarts; they do not model in-flight packet loss or reordering.\n\n## Validation\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` (Rust 1.99)\n- `cargo test --workspace --locked` (`CARGO_BUILD_JOBS=2` locally)\n\n\n## Coverage cost\n\nManual run 36891170311 passed Coverage in 17m 38s with the earlier 120-case profile, versus roughly 8 minutes on main. The 40-case nightly budget is proposed in `hegel.toml`; #2399 tracks measurement after landing. The manually dispatched run failed only at Pages deployment because its environment protection rule disallows this branch.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2397/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2368","id":5660995337,"node_id":"I_kwDORel_088AAAABUWvvCQ","number":2368,"title":"Build the generated multi-host scenario engine (Hegel) on the router harness","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null},{"id":11617992378,"node_id":"LA_kwDORel_088AAAACtHx-ug","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:task","name":"wayfinder:task","color":"D93F0B","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:53:59Z","updated_at":"2026-10-01T17:02:43Z","closed_at":"2026-10-01T17:02:43Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question (task: build slice)\n\nBuild the **generated multi-host scenario engine** recommended by \"Research: property/model-based and formal testing options for the control plane\" (#2363, doc on `research/control-plane-testing`). Extend the router-level harness from #2338 / PR #2353.\n\nFirst slice, as a single convoy:\n1. **Hegel gate:** `hegeltest` (pinned exact version) builds in CI and on the crew image, and shrinks a deliberately reintroduced #2335 router-ordering bug. If not, use `proptest-state-machine` with the same harness.\n2. **Three-host mesh:** extend `spawn_in_memory_request_topology` to three hosts with a client per host. Use paused time on a single-threaded runtime, and wait for a settled state rather than sleeping.\n3. **First commands:** convoy start (generated placement), convoy delete --force, resume, nudge, resource delete, partition, heal, restart.\n4. **First checks:**\n   - a convoy''s home is its placement host;\n   - single authorship;\n   - host independence (a command issued from host X has the same result as from the home);\n   - forced teardown completes within a bound;\n   - no finalizer left without a controller.\n5. **Fixed rows** for #2335 (dispatch from the desk, a governor and the placement host), #2288, #2318 and #2343 (convoy on A, checkout on B).\n6. **Deliberate faults the engine must catch within the CI budget:** the #2335 router ordering, and a local-only TerminalSession lookup.\n7. **Budget:** a small CI budget, a larger nightly run, and a replay seed printed on failure. Add a CLAUDE.md Testing Philosophy line.\n\nLater slices (separate tickets when this lands): port `convergence_property.rs`, a generated stored-record corpus, generated checkout states for #2298, `Clock` threading, and the Quint spec.\n\nBlocked by #2338.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2368/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2394","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2394/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2394/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2394/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2394","id":5664254908,"node_id":"PR_kwDORel_088AAAABGHcWqA","number":2394,"title":"fix: back off repeated finalizer failures","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":4,"created_at":"2026-10-01T14:57:17Z","updated_at":"2026-10-01T16:15:44Z","closed_at":"2026-10-01T16:15:41Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2394","html_url":"https://github.com/flotilla-org/flotilla/pull/2394","diff_url":"https://github.com/flotilla-org/flotilla/pull/2394.diff","patch_url":"https://github.com/flo