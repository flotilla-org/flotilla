-02T09:59:30Z","closed_at":"2026-10-02T09:59:28Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2422","html_url":"https://github.com/flotilla-org/flotilla/pull/2422","diff_url":"https://github.com/flotilla-org/flotilla/pull/2422.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2422.patch","merged_at":"2026-10-02T09:59:28Z"},"body":"Closes #2376.\n\nDerive the ADR 0051 change request readiness value from replicated observation fields and linked-convoy landing state. The pure function and wire spelling live at the presentation projection boundary for the entity projection in #2377. Documented precedence is terminal state, draft, conflict, failing checks, then unsettled review or incomplete evidence. `ready_to_merge` requires known passing checks, known mergeability, no actionable feedback, and an approved or explicitly none review decision.\n\nThe table test covers competing conditions and unknown observations. No change request observer code or stored resource shape changes.\n\nValidation on rebased main:\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings` (1m 19s)\n- `cargo test --workspace --locked` (about 4m including build)\n\nThe first full workspace run took about 3m including a clean dependency build; no failures.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/s