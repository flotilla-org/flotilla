one":null,"comments":9,"created_at":"2026-10-01T13:14:10Z","updated_at":"2026-10-01T14:35:33Z","closed_at":"2026-10-01T14:33:56Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2384","html_url":"https://github.com/flotilla-org/flotilla/pull/2384","diff_url":"https://github.com/flotilla-org/flotilla/pull/2384.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2384.patch","merged_at":"2026-10-01T14:33:56Z"},"body":"## Summary\n\n- Route stalled project crew to the live governor attempt, preferring the convoy owned by its ConvoyEnsure and otherwise the highest live generation.\n- Record a named governor absence when project supervision falls through to the operator.\n- Add regressions for an abandoned earlier generation, no live governor, and ConvoyEnsure ownership priority.\n\nCloses #2378.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes the stored-record corpus)\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2384/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2384/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2381","id":5662579309,"node_id":"PR_kwDORel_088AAAABGGE3cA","number":2381,"title":"TUI: complete view address navigation","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":9,"created_at":"2026-10-01T13:02:07Z","updated_at":"2026-10-01T14:34:46Z","closed_at":"2026-10-01T14:00:50Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2381","html_url":"https://github.com/flotilla-org/flotilla/pull/2381","diff_url":"https://github.com/flotilla-org/flotilla/pull/2381.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2381.patch","merged_at":"2026-10-01T14:00:50Z"},"body":"Closes #789\nCloses #792\n\n## What changed\n\n- Complete `:open` with openable ambient, convoy, project, and project-scoped addresses. The project list loads asynchronously, refreshes when a new palette opens, and keeps cached choices available while refreshing. Labels use decoded `human_label()` text; selection inserts the canonical address.\n- Save each tab''s root-first drill history in `open-views.toml` and restore it on startup. A plain project panel header click focuses the panel; clicking its visible chevron/address drills in place. Enter on the focused header still drills.\n\n## Compatibility and consumers\n\n`OpenViewEntry.history` is optional with a serde default, so the previous `open-views.toml` shape remains readable. The TUI is the only author of this local file; there are no out-of-repo authors of this stored shape. No resource schema or wire format changed. The transient Rust 1.99 Clippy failure was fixed on main by #2387; this PR uses the ordinary CI workflow.\n\nRepository view addresses are intentionally absent from completion because the current TUI rejects retired `Repo` views. The decision ledger records this contract drift.\n\n## Verification\n\n- Red/green tests for persisted back navigation, header click behavior, and `:open` completions.\n- Pinned nightly formatting check, workspace Clippy with warnings denied on Rust 1.98.1, and 430 TUI library tests passed locally. The latest GitHub CI run passed all seven checks, including the full workspace Test gate.\n- Existing insta snapshots are unchanged.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2381/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2378","id":5661978772,"node_id":"I_kwDORel_088AAAABUXrwlA","number":2378,"title":"Stall supervision targets an abandoned governor generation instead of the live one","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T12:16:27Z","updated_at":"2026-10-01T14:33:58Z","closed_at":"2026-10-01T14:33:58Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened (r399, 2026-10-01)\n\nWheelhouse crew `ingress-workdirs` (convoy-ae83853a) stalled with reason `decision` at 12:08. Its stall went straight to the operator rung (`supervisor: null`, `supervision_exhausted: true`). The live wheelhouse governor (`convoy-f1cdb7bb`, generation 2, Active) never received it, and its `turn_deliveries` is empty.\n\n## Cause\n\nThe default supervision chain (`crates/flotilla-core/src/leaf_engine.rs`, around lines 1333–1385) is a bosun, then `ProjectCrew { convoy_role: \"governor\", role: \"governor\" }`. The `ProjectCrew` lookup does:\n\n```rust\navailable_convoys.iter().map(|s| &s.object).find(|candidate|\n    candidate.spec.project_ref == convoy.spec.project_ref\n        && candidate.spec.role == *convoy_role\n        && candidate.metadata.name != convoy.metadata.name)\n```\n\nIt takes the **first** match, with no phase filter and no generation preference. For wheelhouse that''s `convoy-44ce83f4`: generation 1, **Abandoned** since 2026-09-26, still recording a `govern/governor` crew. The supervisor target therefore pointed at a dead convoy, delivery skipped it (it''s not among the live convoys), and the ladder fell through to the operator. Any project with an earlier abandoned or landed governor generation still in the store is affected.\n\n## Ask\n\n- **Candidate selection:** `ProjectCrew` considers only non-terminal convoys (not Abandoned, Landed or Failed) and prefers the **current attempt** of the standing role: the convoy its ConvoyEnsure currently owns, or failing that the highest generation that is live. That matches ADR 0051''s role-entity \"current attempt\" concept; share the logic if it exists.\n- If no live candidate exists, fall through to the next rung, as today, and record why in the stall (e.g. \"no live governor for project wheelhouse\").\n- Tests: a project with an abandoned generation-1 governor and a live generation-2 governor delivers the stall turn to generation 2; with only an abandoned governor, it falls through to the operator with the named reason.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2378/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2380","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2380/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2380/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2380/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2380","id":5662089423,"node_id":"PR_kwDORel_088AAAABGFr6VQ","number":2380,"title":"feat: carry entity refs in presentation metadata","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":11,"created_at":"2026-10-01T12:24:56Z","updated_at":"2026-10-01T14:21:15Z","closed_at":"2026-10-01T14:03:18Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2380","html_url":"https://github.com/flotilla-org/flotilla/pull/2380","diff_url":"https://github.com/flotilla-org/flotilla/pull/2380.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2380.patch","merged_at":"2026-10-01T14:03:18Z"},"body":"## Summary\n\n- Add `MetadataValue::EntityRefs(Vec<EntityRef>)` with the tagged `entity-refs` JSON wire shape from ADR 0051.\n- Send entity-reference facts in separate metadata patches through both `pm connect` transports, so older consumers can reject the unknown value kind without losing existing facts in the same patch.\n- Cover JSON round trips and both Zellij pipe and Wheelhouse HTTP/UDS delivery.\n\n## Compatibility and rollout\n\nThis changes the presentation-manager wire stream, not stored resource data. The current Andamento controller rejects an unknown value kind for one patch and continues processing subsequent messages; isolating edge facts keeps familiar facts available to that controller. Wheelhouse''s HTTP endpoint returns 422 for a rejected patch, also leaving the earlier familiar-facts patch applied. The two consumers need coordinated updates: [andamento#115](https://github.com/flotilla-org/andamento/issues/115) and [wheelhouse#137](https://github.com/flotilla-org/wheelhouse/issues/137).\n\nThis PR does not change ChangeRequest or Issue observation (#2375).\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (including stored-record corpus)\n\nCloses #2374.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/r