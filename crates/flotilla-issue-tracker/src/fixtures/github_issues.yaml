0T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2426 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2426#issuecomment-5949088530\n\nAfter repo Views retired, production `App::sync_active_view` always sets `TuiModel.active_repo` to `None`. The field and its helpers still feed legacy repo-scoped palette completion, status-bar task filtering, file-picker defaults, and command constructors across several TUI modules. Remove this vestigial path as one coherent cleanup, including tests that currently inject `active_repo` directly, and verify the intended context for project or checkout Views before changing those interactions.\n\n`TuiRepoModel::has_unseen_changes` is only initialized and reset to `false` now; no path sets it to `true`. Remove its obsolete tab marker as part of the cleanup.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2428/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2425","id":5675376088,"node_id":"I_kwDORel_088AAAABUkdd2A","number":2425,"title":"brainstorm: fleet-level declaration with cascading defaults (agent/model, workflows) and straight-through processing","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T09:14:50Z","updated_at":"2026-10-02T09:14:58Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Owner thoughts, 2026-10-02, prompted by moving all governors to Opus 5.5. That needed four separate `ops/governor.ensure.md` edits in four repos, plus PRs, plus a `project refresh` each. Along the way it turned out the live Fable overrides had been set out-of-band, and a refresh would have reverted them.\n\n## Threads\n\n**a) Cascading rules for agent, model and workflow choice.** \"Which harness and model a role uses\" should be a cascading rule, fleet → project (→ convoy and dispatch overrides), declared once. For example, \"the default governor\" is defined in one place, and projects only state where they differ. This is template-like configuration, probably the same mechanism as the workflow ideas: the selection of workflow, roles and steps is also a cascade. The resolved rules feed a decision layer rather than being the decision. A static cascade is the floor, and a dynamic decider such as a jev-style router can refine it. Related: #1927 (durable per-role default model), #1928 (admission-time decision layer), #2144 (full-fat workflows and the pruning decider).\n\n**b) Is per-project `ops/` the wrong cut?** Operational declarations are currently spread across each project''s repo: ensures, workflows, verification commands, and the ops repos for katzensteg, porthole and ghostty. Increasingly they look like **fleet**-level concerns: one repository that declares the fleet. The value of different installations sharing these declarations is now doubtful. This needs a review of everything currently in `ops/` and project-map to decide what is genuinely project-owned (it travels with the code) and what is fleet-owned (how *this* fleet runs it).\n\n**c) Who changes it, and how.** Maintaining this declaration is plausibly the Quartermaster''s job (#1394), or another standing agent. For many installations a PR workflow is the wrong interface. They''d want good views in wheelhouse and straight-through processing: the change is applied and recorded with provenance, with review optional rather than the mechanism. A PR is one possible approval path, not the default.\n\n## Questions to work through (later)\n\n1. What is the cascade''s shape (fleet, project, role, dispatch) and its merge semantics? Is it the same engine as workflow templating?\n2. Inventory today''s `ops/` and project-map contents into fleet-owned and project-owned. What moves?\n3. One fleet declaration repo, or fleet-level resources with no repo (and history recorded via the record/ledger work, #1951)?\n4. What does straight-through processing need: approval policy, audit, and wheelhouse views? How does it relate to the grant-limiting decision model (#2360)?\n5. Migration from the current per-project ops and project-map without a flag day.\n\nNot urgent. Captured so the next governor or model change doesn''t get solved with one more out-of-band patch.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2425/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2424","id":5675346733,"node_id":"I_kwDORel_088AAAABUkbrLQ","number":2424,"title":"Fairly schedule paginated change-request observations","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-02T09:12:04Z","updated_at":"2026-10-02T09:12:09Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2423 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2423#issuecomment-5948755102\n\nThe GitHub change-request observer shares a bounded follow-up pagination budget across PRs and traverses bound PRs in a stable order. If one or more early PRs are persistently very busy, later truncated PRs can repeatedly receive honest budget errors without making progress.\n\nAdd fair scheduling across PRs (for example, round-robin page fetches or a rotating start position) while keeping one shared query and node budget and preserving per-PR errors when a history cannot be completed in a cycle. Verify that later PRs eventually receive pages under sustained load.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2424/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2418","id":5671314167,"node_id":"PR_kwDORel_088AAAABGNJd7Q","number":2418,"title":"fix: recover standing convoys after lost backing","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":9,"created_at":"2026-10-02T01:00:56Z","updated_at":"2026-10-02T08:54:00Z","closed_at":"2026-10-02T08:50:34Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2418","html_url":"https://github.com/flotilla-org/flotilla/pull/2418","diff_url":"https://github.com/flotilla-org/flotilla/pull/2418.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2418.patch","merged_at":"2026-10-02T08:50:34Z"},"body":"## Summary\n\n- Keep ensure-managed standing work recoverable when a vessel fails: interrupt its work, retire the failed vessel, and admit one replacement in the same convoy. A missing vessel observation stalls the work without creating a duplicate.\n- Treat absent backing on the convoy''s home host as dead only after a complete local post-startup Docker observation and a fresh container listing. Remote absence remains unverified.\n- Record a host-verified missing managed worktree as `CheckoutPhase::Gone`, let teardown accept Gone, and retire a Gone checkout before a vessel attempts to recreate it.\n\n## Tests\n\n- InProcessDaemon reboot scenario recreates the daemon against the persisted backend, models a stopped governor vessel with no checkout observation, and verifies one replacement vessel with no second convoy or duplicate admission.\n- Unit and controller tests cover absent backing before and after observation, remote-host refusal, Gone versus unknown teardown evidence, and recovery of a removed worktree.\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n\n`CheckoutPhase::Gone` is written by the checkout controller. No out-of-repo manifest authors write Checkout status. A live feta restart was not possible from this checkout; the daemon test covers the recovery path locally.\n\nCloses #2410\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2418/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2410","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2410/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2410/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2410/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2410","id":5669370233,"node_id":"I_kwDORel_088AAAABUeu5eQ","number":2410,"title":"Ensure-managed standing convoys don''t survive a host reboot: Failed on stopped container, then wedged on missing evidence","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T21:22:57Z","updated_at":"2026-10-02T08:50:35Z","closed_at":"2026-10-02T08:50:35Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nAfter a clean reboot of feta (2026-10-01), its two ensure-managed governors (katzensteg, porthole) didn''t come back. Recovery took three manual operator steps:\n\n1. **The convoys went `Failed`.** The status read \"Docker container flotilla-env-…-govern is not running (status: Stopped)\". A container stopped by a host reboot is environmental, and under \"crews stall, never fail\" it should be re-provisioned rather than failed. The convoy is standing work, so it should never be \"failed\" for environmental loss.\n2. **The ensure reconciler refused to admit replacements.** Every pass said \"no backing environment evidence is available\" (`StandingConvoyBackingInspector::verify_backing_dead`, runtime.rs). The Environment records and containers were already gone, so nothing could prove the backing dead, and the double-admit guard held forever.\n3. **`convoy delete` refused** with \"not safe to delete: missing checkout integration evidence\". Checkout records are ephemeral observations, and the governor worktrees were gone, so the evidence could never arrive. The operator verified on disk that nothing remained, then used `convoy delete --force`.\n\nA fourth, unrelated blocker (forge identity sweep annotation conflicts) was fixed in #2409.\n\n## What to build\n\n- **Re-provision, don''t fail.** A standing convoy whose container or vessel disappears for environmental reasons (host reboot, container stopped, daemon restart) re-provisions in place or stalls with an infra reason. It never goes `Failed`.\n- **Absence is evidence on the home host.** When the backing Environment records and their containers are absent on the convoy''s own home host, after the daemon has completed a full observation pass since startup, that absence is positive evidence of death for `verify_backing_dead`. It is not missing evidence. Remote-host backing still needs that host''s evidence.\n- **Checkout evidence that can''t arrive.** Teardown safety for a checkout whose worktree no longer exists on its host (verified by the host''s own path check) shouldn''t wait forever for an observation. Record it as `Gone`, which is distinct from unknown.\n- **Scenario test:** a standing governor ensure, a host restart that removes its containers and ephemeral checkout observations, then exactly one replacement admitted with no operator action, and no double-admit.\n\n## Acceptance\n\n- [ ] Reboot scenario test passes with InProcessDaemon or the router harness.\n- [ ] Live check: restart feta''s daemon with a governor container stopped, and the governor returns with no operator steps.\n\nRelated: #1939 cluster, #1894, #2390 (unrelated). Memory: an earlier feta reboot (2026-09-23) failed hand-started governors; ensure-managed ones then self-healed, so this is a regression in the evidence guards added since.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","