olor":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-29T23:17:47Z","updated_at":"2026-10-02T10:38:10Z","closed_at":"2026-10-02T10:38:10Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2248 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2248#issuecomment-5900736777\n\nA hard-killed staging shell can leave its PID-suffixed `.flotilla-staging.*` and `.flotilla-sources.*` directories, and a one-shot skill-source token file, because shell traps do not run on SIGKILL. The concurrency fix removes the permanent cache lock and protects the cache, but these abandoned files still need bounded cleanup on a later staging or daemon maintenance pass.\n\nDesign cleanup so it cannot delete a live staging''s files. Cover a simulated stale staging and token with a behavior test.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.c