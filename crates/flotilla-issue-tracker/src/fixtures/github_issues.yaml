stone":null,"comments":0,"created_at":"2026-10-01T22:39:22Z","updated_at":"2026-10-01T22:39:22Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2411 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2411#issuecomment-5941968910\n\nThe convoy table now derives PR identities from its plural subject set. It no longer shows the previous singular cache''s open/merged text in the PR cell. The subject URL opens the forge state, but the TUI could show each subject''s observed state directly.\n\nAdd per-subject observed state to the convoy detail view using ChangeRequest resource observations, while keeping the convoy subject set as the only source of subject identity and preserving the plural layout. Include unknown/stale handling and a snapshot that shows multiple requests with different states.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2412/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2400","id":5665568445,"node_id":"I_kwDORel_088AAAABUbG2vQ","number":2400,"title":"brainstorm: deterministic review-point tracking: extracted findings as visible obligations for the crew","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T16:28:31Z","updated_at":"2026-10-01T17:37:59Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nReview handling depends on each crew re-reading free-text review comments and judging which points matter. It drops points in a recurring pattern. On 2026-10-01 alone:\n\n- **#2394**: the bot review''s three minor points went unanswered. The PR had been opened by the operator on the crew''s behalf, and no shepherding pass ran.\n- **#2396**: the first review was answered fully. The follow-up review 2 minutes later raised three \"minor, non-blocking\" points that never got a reply.\n- **#2397**: two points were \"addressed\" with weak pushback. A suggested helper was declined as an \"opaque predicate\", and a cost check was deferred as \"unmeasurable\" although the workflow can be run manually.\n\nEarlier skill and brief changes (\"every item gets a fix, reasoning or an issue number\"; \"wait for the re-review\") reduced this but didn''t eliminate it. The owner sees it at merge time, which is the most expensive place to catch it.\n\n## Direction to explore (not decided)\n\nAn internal, forge-neutral structure, rather than leaning on GitHub review threads. GitHub reviews need Actions changes everywhere and don''t obviously help.\n\n- A small, cheap model **extracts discrete findings** from each review (bot, human, or in-convoy reviewer): id, claim, location, severity, and source review/revision.\n- Findings become **first-class obligations visible to the crew** that owns the change, the way a stall or nudge is visible. A finding stays open until it has a disposition: fixed (commit), answered (reasoning), or deferred (issue link).\n- **Settlement reads them.** `crew complete` is refused while findings newer than the head''s push have no disposition. That turns \"wait for the re-review and handle it\" into a checked condition. Related: #2326 (head push time as cutoff), #2211 (typed refusal causes).\n- The same structure serves in-convoy review workflows (a reviewer vessel emits findings, the coder disposes of them) and PR review. ADR 0051 already anticipates review artifacts fitting the entity model; #1148 (review record as cargo).\n\n## Questions for research\n\n1. Prior art: how do Gerrit, Phabricator, Graphite and Reviewable, and AI review tools (CodeRabbit and similar), model review comments as trackable items with resolution state? Which carry a resolution state that tooling can read?\n2. How reliable is cheap-model extraction of discrete findings from long free-text bot reviews? Can the reviewing model emit structured findings directly, which avoids the extraction step for our own bot? (We control the claude-review prompt.)\n3. Where should findings live: resource kind, artifact, or convoy status? How do they key to revisions, so a finding against an old head isn''t silently dropped or double-counted?\n4. How do dispositions avoid becoming checkbox theatre? For example, should \"answered\" require reasoning a second pass can judge, under the reversal test from pr-shepherd?\n\n## Not in scope yet\n\nImplementation. This is research and design first.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2400/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2406","id":5666414154,"node_id":"I_kwDORel_088AAAABUb6eSg","number":2406,"title":"Bound stored TerminalSession message history after acknowledgments","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T17:33:59Z","updated_at":"2026-10-01T17:33:59Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nPR #2405 adds ordered `TerminalSession.spec.source.message.following` entries. Confirmed entries remain in the stored chain, so a long-lived session accumulates message history and each new enqueue rewrites it.\n\n## Desired behavior\n\nBound the stored history after delivery acknowledgments while preserving:\n\n- idempotent retries of a previously delivered turn;\n- `delivered_through` checks for remote supervisor-turn acknowledgment and resume grace;\n- delivery order and one-generation stored-record compatibility.\n\nA safe solution may need a compact acknowledged-ID or sequence marker before pruning the prefix. Add a long-running delivery test that exercises pruning and duplicate turn replay.\n\nFollow-up to #2391 and #2405.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2406/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2388","id":5663382448,"node_id":"I_kwDORel_088AAAABUZBbsA","number":2388,"title":"TUI: show persistent hint when open project completion query fails","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T13:59:13Z","updated_at":"2026-10-01T13:59:13Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nWhen the TUI''s asynchronous project-list query fails while the `open` palette is active, `ProjectAddressState::Failed` leaves ambient completions available but shows no persistent indication that project completions are missing. The error status is transient. The palette retries the query when reopened, not on each keypress.\n\n## Desired behavior\n\nShow a short status hint in the active `open` palette when project completions are unavailable, ideally with the reopen-to-retry affordance. Keep existing ambient completions usable. Add a focused rendering test.\n\nFollow-up from review of #2381, which implements #789 and #792.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2388/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2361","id":5660891822,"node_id":"I_kwDORel_088AAAABUWparg","number":2361,"title":"Decide the host capacity facts that pace dispatch (v1)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-10-01T10:44:55Z","updated_at":"2026-10-01T13:06:34Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhat host capacity facts does the governor pace dispatch by (v1, hosts only)?\n\n- **Facts:** CPU headroom (load against cores), memory, disk free, and running vessel count per host, published in Host status. Evidence from 2026-09-30: feta was about four times CPU-oversubscribed with seven Rust crews, while memory was fine.\n- **Limits:** vessel-slot limits on fulfilment kinds, which today report unbounded. Is admission capacity-aware (wait or refuse), or is pacing left to the governor?\n- **Per-crew caps:** `CARGO_BUILD_JOBS` and docker `--cpus` per vessel, so concurrent builds share a host instead of each taking every core.\n- What \"capacity available\" means to the governor''s dispatch loop.\n\nSubscription and model-quota capacity stays in the fog for now. Grilling ticket (HITL).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2361/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2340","id":5652484563,"node_id":"I_kwDORel_088AAAABUOoR0w","number":2340,"title":"Unify convoy start placement routing and admission resolution","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-09-30T20:18:24Z","updated_at":"2026-10-01T11:14:57Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"From PR #2339 review by claude bot: https://github.com/flotilla-org/flotilla/pull/2339#issuecomment-5918842466\n\n`ConvoyStart` must choose a primary placement host before it can route admission. Its routing preflight currently repeats project, workflow, placement, and credential resolution on the dispatching host. The authoritative admission path has separate capability allocation logic. These paths can drift, and stale replicas at the dispatcher may reject a start that the placement host would accept.\n\nDesign a shared placement decision seam for routing and admission. Keep destination admission authoritative, including capacity and credential checks. Cover explicit and automatic placement when dispatcher replicas lag, and preserve the one-generation stored-data decoder contract if any persisted shape changes.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2340/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2356","id":5660883591,"node_id":"I_kwDORel_088AAAABUWo6hw","number":2356,"title":"Map: flotilla''s own day-to-day runs on an in-flotilla governor","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992232,"node_id":"LA_kwDORel_088AAAACtHx-KA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:map","name":"wayfinder:map","color":"6F42C1","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:10Z","updated_at":"2026-10-01T10:54:03Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":10,"completed":2,"percent_completed":20},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Destination\n\nThe working system: a standing **flotilla governor**, managed by an ensure and chartered in a **flotilla ops repo** like the other projects, runs flotilla''s day-to-day:\n- continuous dispatch from the DAG ready queue, paced by real capacity facts and checked for overlap with in-flight work;\n- shepherding crews through review and settlement, and handling routine stalls itself;\n- requesting fleet rolls as a workflow the owner approves;\n- escalating rulings and judgement calls to the owner over a good two-way channel.\n\nThe operator agent is left for rulings, exceptions and design. **Merges stay with the owner.**\n\n## Notes\n\n- **This map carries execution** (owner, 2026-10-01). Decision tickets block the build slices they shape. Build slices go to convoys through the normal crew workflow (PR, shepherd, owner merges), and what a build turns up comes back as tickets or fog. **No rush**: hold duties back until there''s a clear idea, and keep the operator in the loop through the transition.\n- **Research tickets run as in-session subagents, not convoys.** Grilling tickets are HITL with the owner.\n- **Substrate work** (CLAUDE.md \"Design and Substrate Work\"): prefer the considered cut, with no YAGNI reflex. Rulings end with an \"ADR carry:\" line.\n- **Dependencies being fixed outside this map:**\n  - #2338, domain-owned command targeting plus the router-level multi-host harness;\n  - #2349, crews stalling after an accepted completion;\n  - #2343, teardown across homes;\n  - #2298 / #2322, forced teardown.\n- **Where things stand:**\n  - The operator agent dispatches continuously at about four Rust crews on feta, its limit taken from CPU load.\n  - `scripts/dag-fetch` gives \"unblocked\"; \"body is a contract\" and overlap are operator judgement.\n  - The fleet cycle is hand-run over SSH (lab CI → raclette promote → comte sign → finalize → `fleet-install` ×3 → smoke from two hosts).\n  - Crews stall rather than fail (#2308), are woken for review feedback (#2320), and settle without operator help (#2316).\n  - Fulfilment kinds report unbounded slots.\n- Related ideas: Quartermaster (`project_meta_agents_vision`), dynamic model routing and decision models (#1927, #1928, jev-router), model-based control-plane testing (#1953), compose integration on PRs (#2336 / #2344 / #2345 / #2351).\n\n## Decisions so far\n\n- [Research: property/model-based and formal testing options for the control plane](https://github.com/flotilla-org/flotilla/issues/2363). Bugs appear when the issuing host or record home varies. Build #2338''s harness as a generated scenario engine (Hegel, gated; proptest-state-machine fallback) checking homing, single authorship, host independence and bounded teardown. Build slice: #2368.\n\n- **Charter home** (owner, 2026-10-01): a flotilla **ops repo**, like the other projects, not ops entries inside the flotilla repo.\n- **Grant limiting comes before capability** (owner, 2026-10-01): the crew GitHub App, and other credentials such as porthole and lab Forgejo, can be given *more* ceiling (for example Workflows write) once a good, reliable system decides and limits what each crew is actually granted. The same limiting mechanism is needed in many places, not just GitHub. That system is the subject of \"Decide how crews get per-convoy grants decided by request\".\n\n## Not yet specified\n\n- **Subscription and model-quota capacity:** Claude and Codex subscription budgets and rate limits as capacity facts alongside host capacity. Ties to the Quartermaster and decision models (#1927, #1928).\n- **Transition and cutover criteria:** which duties move from the operator agent to the governor, in what order, and how each handover is judged ready.\n- **Continuous rolls:** rolls as routine as dispatch, needing back-compatibility care at every level (wire, stored data, skills, briefs, workflows) beyond today''s ADR 0047 window.\n- **Ready-queue evolution beyond the minimal predicate**, once the governor runs on it.\n\n## Out of scope\n\n- **Merges and merge integration into wheelhouse:** merges stay with the owner, and wheelhouse merge UX is a separate effort.\n- **Governors for other projects:** these already exist.\n- **The eventual ready-queue or portfolio integration:** owner: \"eventually it needs more integration (maybe not in flotilla itself)\". This map only evolves what exists.\n- **Rolls without owner approval.**\n- **Other installations and multi-fleet setups.**\n\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2360","id":5660891599,"node_id":"I_kwDORel_088AAAABUWpZzw","number":2360,"title":"Decide the general system for limiting per-crew grants, so credential ceilings can be broader","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:54Z","updated_at":"2026-10-01T10:46:56Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhat is the **general, reliable system for limiting what each crew is granted**, so that credential ceilings (the crew GitHub App, porthole, lab Forgejo, and others) can safely be broader?\n\nOwner direction (2026-10-01): we can give the flotilla crew App more access, for example Workflows write, *if* we have a good, reliable system that limits what each crew actually gets. And we need the same thing in many places. So the question is the limiting mechanism, not one credential:\n\n- **One model across credential kinds and capabilities:** GitHub App permissions per minted token (flotilla already mints scoped installation tokens; see `capped_github_app_permissions`), Forgejo tokens, porthole access, GUI or display, host devices, network.\n- **How a grant is decided per convoy:** from the brief or issue, the governor''s assessment, or a decision model (#1928), and when (admission, or a mid-flight `access` stall that a supervisor decides).\n- **How this maps onto ADR 0044 grants and ADR 0046 fulfilment needs.** Do static role grants become just the default floor of the request?\n- **Reliability:**\n  - least privilege by default;\n  - an audit trail of who asked, who decided and why;\n  - expiry;\n  - tests proving a crew can''t exceed its decision even when the ceiling is broad.\n- **Raising ceilings safely:** what changes, and in what order, once the limiting system exists (e.g. adding Workflows write to the crew App''s default mint).\n\nGrilling ticket (HITL).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2360/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2365","id":5660892814,"node_id":"I_kwDORel_088AAAABUWpejg","number":2365,"title":"Create the flotilla ops repo and held governor ensure","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992378,"node_id":"LA_kwDORel_088AAAACtHx-ug","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:task","name":"wayfinder:task","color":"D93F0B","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:45:01Z","updated_at":"2026-10-01T10:45:01Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":2,"total_blocked_by":2,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question (task: execution)\n\nCreate the flotilla ops repo and the governor''s standing ensure, once its charter and channel are decided:\n- the repo (location: GitHub flotilla-org or lab Forgejo, matching the other ops repos);\n- `project.yaml` membership for flotilla and its portfolio repos as decided;\n- `ops/governor.md` and `ops/governor.ensure.md` built from the charter ticket;\n- a project-map declaration and an issue-source binding for flotilla''s tracker.\n\nStart it **held** (no autonomous dispatch) until the owner turns duties on. Done when the governor runs as a single standing convoy and answers over the agreed channel.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2365/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2364","id":5660892535,"node_id":"I_kwDORel_088AAAABUWpddw","number":2364,"title":"Decide the upgrade-safety gates for a candidate generation","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:59Z","updated_at":"2026-10-01T10:44:59Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":1,"total_blocking":1},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhich gates must a candidate generation pass before and during a roll, so upgrades produce fewer surprises?\n\nToday: stored-record decode against each live store, then health after install with automatic rollback, then a smoke dispatch from the desk and a governor host. Compose integration now runs on relevant PRs (#2344 / #2345 / #2351). On 2026-09-30, r393 still shipped a homing regression (#2335) that only the post-roll smoke caught.\n\nOptions:\n- **Required pre-merge gates:** compose and the router-level harness (#2338).\n- **A canary host first:** install on one host, smoke, then the rest.\n- **A pre-roll branch-build smoke** on one host.\n- **Back-compatibility checks** beyond stored data (wire, briefs and skills, workflow templates).\n- **A standard smoke matrix.**\n- **Rollback rules.**\n\nGrilling ticket (HITL). Informed by the testing research ticket.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2364/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2362","id":5660892059,"node_id":"I_kwDORel_088AAAABUWpbmw","number":2362,"title":"Decide the minimal dispatchable predicate by evolving dag-fetch","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:56Z","updated_at":"2026-10-01T10:44:56Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhat is the minimal \"dispatchable\" predicate the governor applies, built by evolving `scripts/dag-fetch`?\n\n- \"Unblocked\" already exists. Add **\"body is a contract\"**: a triage label (`ready`) or a heuristic? The 2026-09-30 triage sweep showed many unblocked tickets aren''t contracts.\n- **Overlap with in-flight work:** files or modules from open PRs and running convoys, against a ticket''s likely touch set. Is a heuristic enough, or do tickets declare touch areas?\n- **Serialisation edges:** when and how the governor wires `blocked_by`.\n- How the governor reads it: a script in the ops repo, or a skill.\n\nGrilling ticket (HITL). Larger ready-queue integration is out of scope.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2362/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2359","id":5660891335,"node_id":"I_kwDORel_088AAAABUWpYxw","number":2359,"title":"Decide how a fleet roll becomes a governor-requested, owner-approved workflow","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:52Z","updated_at":"2026-10-01T10:44:52Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nHow does a fleet roll become a workflow the governor can request and the owner approves?\n\n- **Steps to automate:** pin sources at their heads, check the lab mirror, dispatch candidates, validate stored records against live stores, promote (raclette), sign Darwin (comte, which needs a GUI login), finalize, `fleet-install` on each host in order, check health and governor singletons, and smoke-dispatch from the desk and from a governor host.\n- **Who executes:** a lab service, a daemon-run workflow, or a host-direct crew with a narrow grant. Where the secrets and SSH stay.\n- **Approval:** an attention item with the diff of merged changes since the last generation, the gates'' results and a rollback plan. The owner approves once.\n- **Failure handling:** automatic rollback (fleet-install already rolls back on health failure), stopping between hosts, and reporting.\n\nGrilling ticket (HITL). Blocked by the upgrade-safety gates decision.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2359/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2358","id":5660891068,"node_id":"I_kwDORel_088AAAABUWpXvA","number":2358,"title":"Decide the two-way channel between the flotilla governor and the owner","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:51Z","updated_at":"2026-10-01T10:44:51Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":1,"total_blocking":1},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhat is the two-way channel between the flotilla governor and the owner?\n\n- **Governor to owner:** attention items or convoy attention, how they show up in wheelhouse and the TUI, their format (question, recommendation, options, evidence links), and their urgency levels.\n- **Owner to governor:** how an answer, ruling or \"go\" reaches the governor: a reply on the attention item, `convoy resume`, an issue comment, or something new. How it records the answer, for example with an ADR carry.\n- **Batching:** a daily digest versus interrupts, and quiet hours.\n- **The operator agent during transition:** does it relay, observe, or get out of the way?\n\nGrilling ticket (HITL). The owner wants a good channel in both directions before any duty moves.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2358/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2357","id":5660890853,"node_id":"I_kwDORel_088AAAABUWpW5Q","number":2357,"title":"Decide what the flotilla governor does alone versus escalates (stall authority, verbs, dispatch scope)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T10:44:49Z","updated_at":"2026-10-01T10:44:49Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2356","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":1,"total_blocking":1},"body":"Part of #2356 (Map: flotilla''s own day-to-day runs on an in-flotilla governor).\n\n## Question\n\nWhat does the flotilla governor do on its own, and what does it escalate?\n\n- **Stall authority:**\n  - which stalls it resolves alone: resume with guidance, force-complete when a ledger comment and green PR are evidence, adopt an orphaned PR into a review convoy, clear a teardown wedge after verifying the head is pushed or merged;\n  - which it escalates.\n- **The verbs that needs.** `--force`, convoy delete and resource delete are operator-principal actions today. Do we add a governor role with a bounded set, and is each use audited?\n- **Dispatch authority:** may it dispatch any DAG-ready contract, or only from labels or lists the owner curates? Who wires `blocked_by`?\n- **Hand-pushing workflow-file commits for crews,** using the governor''s token per the ruling.\n- **What it must never do:** merge, roll without approval, weaken tests, close issues on judgement alone.\n\nGrilling ticket (HITL). Ground it in the 2026-09-30 operator log of manual interventions (force-completes, adoptions, worktree removals, workflow pushes).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2357/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2325","id":5650289116,"node_id":"I_kwDORel_088AAAABUMiR3A","number":2325,"title":"Represent convoy teardown waits with typed internal reasons","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T17:16:33Z","updated_at":"2026-09-30T17:16:33Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2322 review by claude[bot]: https://github.com/flotilla-org/flotilla/pull/2322#issuecomment-5915972805\n\nThe convoy finalizer recognizes checkout preservation waits through free-text error messages, then copies the reason into status.message for the row and explain surfaces. The current string contract is internal, but future wording changes could break wait recognition, and multiple checkout waits are joined into one message.\n\nIntroduce a typed internal wait reason and render it at the status boundary. Keep existing stored records decodable for one generation if a serialized status field is introduced (ADR 0047).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2325/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/events","html_url":"https://github.com/flotilla-org/flotilla/issues/742","id":4883287603,"node_id":"I_kwDORel_088AAAABIxEOMw","number":742,"title":"ADR 0016 residue: delete the FleetReplicaSnapshot broadcast path (9 call sites)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-07-14T13:01:30Z","updated_at":"2026-09-30T16:26:51Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"## Goal\n\nFinish ADR 0016: overlay replication is the mechanism, so retire the `FleetReplicaSnapshot` path (the SSH-fetched per-host snapshot and its broadcast).\n\n## Why this takes two steps (re-scoped 2026-09-30)\n\n- It''s larger than \"nine call sites\". There are about 47 references across `flotilla-core` (`fleet.rs` has 17, plus `in_process.rs`, `executor.rs`), `flotilla-daemon` (`aggregator.rs`), `flotilla-protocol` (`commands.rs`, `query.rs`, `lib.rs`) and `flotilla-tui` (`app/executor.rs`, `cli.rs`).\n- It has a **live consumer**. `flotilla fleet` health and list, and the TUI fleet surfaces, read these snapshots. A straight deletion would stop at the escalation rule.\n- `fleet.rs` is the `FleetService` extracted in #2215. Under ruling 1 of #2212 it is a named service pending the Tender extraction (#1861). Removing it also removes an SSH consumer before the Tender cut.\n\n## What to do\n\n1. **Move the fleet view onto replicated Host resources.** `flotilla fleet health` / `list` and the TUI fleet surfaces read replicated `Host` records (status, facts, heartbeat, daemon generation), not SSH snapshots. Add to Host status anything the view shows that replication doesn''t already carry, keeping its stored shape additive (ADR 0047). Keep the fleet view''s current contract: disagreements are shown, not collapsed (ADR 0023).\n2. **Delete `FleetReplicaSnapshot`**, its SSH fetch, its broadcast and cache in `FleetService`, and its protocol variants. Wire formats change freely.\n\nStandard deletion-contract escalation rule: an unexpected live consumer is an escalation (stop that piece, report it here, deliver the rest), never a re-homing done without asking.\n\n## Acceptance\n\n- [ ] `flotilla fleet health` / `list` output is unchanged in content, sourced from replicated Hosts, with a test over an in-memory multi-host backend.\n- [ ] No `FleetReplicaSnapshot` references remain, or every surviving site is escalated here by name.\n- [ ] Replication behaviour is covered by the existing overlay and convergence tests, unchanged.\n\n## Depends on\n\n#2236 (tighten FleetService cache access and refresh work) lands first, because it''s the same code.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/reactions","total_count":