id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":5,"created_at":"2026-10-02T00:03:27Z","updated_at":"2026-10-02T08:24:07Z","closed_at":"2026-10-02T08:24:04Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2416","html_url":"https://github.com/flotilla-org/flotilla/pull/2416","diff_url":"https://github.com/flotilla-org/flotilla/pull/2416.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2416.patch","merged_at":"2026-10-02T08:24:04Z"},"body":"Closes #2324.\n\n## Change\n\n- Snapshot only modified tracked paths and untracked paths Git does not ignore; record excluded ignored paths with sizes in `excluded-ignored.txt`.\n- Keep the Git bundle and patch, but skip `worktree.tar.gz` when no snapshot paths exist.\n- Run forced and landed checkout teardown in at most two background finalizers. The controller requeues pending finalizers without marking them failed, so other checkouts and its heartbeat keep progressing.\n- Record the archive path in a `CheckoutArchived` event. An hourly sweep prunes archives after `checkout_archive_retention_days` (default 14), using a durable archive-root catalog so custom roots remain discoverable after Checkout and Clone deletion.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n- On feta, the focused forced-removal test used an 8 GiB ignored `target/big.bin`. Removal took 26 ms, wrote no tarball, and feta''s Host resource remained `ready: true` with an advancing heartbeat. The running daemon was not replaced for this check; the controller scheduling behavior is covered by the in-memory controller-loop scenario.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2416/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2416/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2324","id":5650285080,"node_id":"I_kwDORel_088AAAABUMiCGA","number":2324,"title":"Bound forced checkout archive size and define retention","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T17:16:12Z","updated_at":"2026-10-02T08:24:05Z","closed_at":"2026-10-02T08:24:05Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2322 review by claude[bot]: https://github.com/flotilla-org/flotilla/pull/2322#issuecomment-5915972805. Scope expanded by a live incident on feta, 2026-10-01; evidence in the comments.\n\n## Problem\n\nForced checkout teardown (`force_remove_materialised_checkout`, `flotilla-core/src/vcs.rs`) writes `history.bundle`, `changes.patch` and a `tar -czf` of the **entire** worktree, including ignored build output. On 2026-10-01 it tarred a 101 GB `target/`, after more than 9 minutes the archive was at 6.2 GB of gzip, and nothing in it was worth keeping: the patch was empty and the work was merged. The tar runs **synchronously inside the Checkout controller loop**, so the loop made no progress, feta''s heartbeat went `DEGRADED: ControllerLoop/Checkout`, and every dispatch to feta was refused. On failure the step deletes the partial archive and retries the same tar.\n\n## What to build\n\n1. **The snapshot keeps work, not build output.** Archive tracked-modified files and untracked files that aren''t ignored, using git''s own view (`git ls-files --others --exclude-standard`, plus the diff and patch). Leave `.gitignore`d paths out: `target/`, `node_modules/` and the like. Record the list of excluded top-level ignored paths and their sizes in a small manifest in the archive, so an operator can see what was dropped.\n2. **Skip the snapshot when there''s nothing to save.** A clean worktree with an empty patch, whose HEAD is contained in a pushed or landed ref, gets no tarball. The bundle is still written for history.\n3. **Keep archive I/O off the controller loop.** It must never block the loop that host readiness depends on. Run it as bounded background work the reconcile awaits by token, or with a hard timeout that requeues. A slow archive delays that one checkout''s teardown, not the host.\n4. **Retention.** Archives older than a configurable age (default 14 days) are pruned by the existing sweep. `flotilla` can show where a convoy''s archive lives, for example in `convoy explain` or teardown events.\n\n## Acceptance\n\n- [ ] Test: a worktree with a large ignored dir produces an archive without it, and the manifest names it.\n- [ ] Test: a clean, landed checkout produces no tarball.\n- [ ] Test or scenario: a slow archive doesn''t stall other checkouts'' reconciliation or the host heartbeat.\n- [ ] Retention pruning is covered.\n- [ ] Live: on feta, force-teardown a landed checkout with a large `target/`, and teardown finishes in seconds while the host stays ready.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2324/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2413","id":5670365010,"node_id":"PR_kwDORel_088AAAABGMZomQ","number":2413,"title":"fix: recover macOS crew caller identity","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":8,"created_at":"2026-10-01T22:59:38Z","updated_at":"2026-10-02T08:20:46Z","closed_at":"2026-10-02T08:20:44Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2413","html_url":"https://github.com/flotilla-org/flotilla/pull/2413","diff_url":"https://github.com/flotilla-org/flotilla/pull/2413.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2413.patch","merged_at":"2026-10-02T08:20:44Z"},"body":"Closes #2390.\n\n## Changes\n- Read macOS socket peer executable with `proc_pidpath` and argv/environment with `sysctl(KERN_PROCARGS2)` behind `caller_from_peer`.\n- Identify a crew from a child process that connects through a Unix socket on Linux and macOS; add a macOS CI job for those tests.\n- Explain unsupported-platform peer identity failures in artifact put/get refusals.\n\n## Validation\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n- macOS peer identity test: CI job `macOS peer identity` (added here)\n\nThe live acceptance check is an operator-run `flotilla artifact put` from a kiwi host-direct crew after deployment. It cannot be run in this Linux container and does not block this PR.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2413/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2390","id":5663585813,"node_id":"I_kwDORel_088AAAABUZN2FQ","number":2390,"title":"Crew caller identity is Linux-only: artifact put/get refused for every host-direct crew on macOS","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-10-01T14:12:35Z","updated_at":"2026-10-02T08:20:45Z","closed_at":"2026-10-02T08:20:45Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nThe daemon identifies the calling crew by reading the socket peer''s environment from `/proc/<pid>/environ`. See `caller_from_peer` and `read_environ` in `crates/flotilla-daemon/src/server/caller.rs`. macOS has no `/proc`, so on a Mac host `CommandCaller.crew` is always `None`.\n\nEvery crew-scoped request is then refused:\n- `ArtifactPut`: \"artifact put requires a calling crew session\" (`server/request_dispatch.rs:310`);\n- `ArtifactGet` (`:451`);\n- anything else gated on `caller.crew`, including decision-ledger writes.\n\nObserved on 2026-10-01: store-latency (#2383) ran on kiwi host-direct (macOS). Its decision-ledger and test-artifact puts failed twice, and the crew stalled with reason `infra` and `supervision_exhausted`. The operator first misread this as transient.\n\n## What to build\n\nGive macOS peer identity parity with Linux, behind the existing `caller_from_peer` seam:\n\n- **Process environment:** read it with `sysctl` `KERN_PROCARGS2` for the peer pid. This needs the same uid, which the socket already guarantees. It gives exec-time environment, the same semantics as `/proc/<pid>/environ`. A maintained crate such as `sysinfo` or `libproc` is fine.\n- **Executable and argv:** `proc_pidpath` and the same `KERN_PROCARGS2` buffer. `container` stays `None` on macOS.\n- **Contract test:** the existing peer-credential test is `#[cfg(target_os = \"linux\")]`. Make it run on macOS too, and assert that crew identity is recovered from a child spawned with `FLOTILLA_*` variables, on both platforms.\n- **Diagnosable failures:** when crew identity can''t be established on a platform, the refusal names the cause (\"peer identity unavailable on <os>\"), not the generic \"requires a calling crew session\".\n\n## Acceptance\n\n- [ ] On a macOS host, `flotilla artifact put` run inside a host-direct crew succeeds, verified live on kiwi.\n- [ ] The cross-platform contract test passes in the macOS CI or validation job and on Linux.\n- [ ] On an unsupported platform, the refusal states the real cause.\n\n## Related\n\n#1900 (macOS validation for peer credentials), #2091 (artifacts), #2383 (where this surfaced).\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2390/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2414","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2414/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2414/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2414/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2414","id":5670512969,"node_id":"PR_kwDORel_088AAAABGMhEnw","number":2414,"title":"fix: derive crew GitHub actor from credential declaration","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":13,"created_at":"2026-10-01T23:17:00Z","updated_at":"2026-10-02T00:41:52Z","closed_at":"2026-10-02T00:41:49Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2414","html_url":"https://github.com/flotilla-org/flotilla/pull/2414","diff_url":"https://github.com/flotilla-org/flotilla/pull/2414.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2414.patch","merged_at":"2026-10-02T00:41:49Z"},"body":"## Summary\n\n- Add `consumer.actor_login` to GitHub App credential declarations, with a serde default for stored specs from the previous fleet generation.\n- Export the declared REST bot login as `PR_SHEPHERD_AS` through the shared credential delivery path used by contained and host-direct crews.\n- Use the active bound convoy''s granted credential declaration when recognizing GraphQL address markers; keep this identity separate from `change_request.review_bot_login`.\n- Cover configured actor markers, markers from another actor, old spec decoding, and credential delivery.\n\n## Stored schema and out-of-repo authors\n\n`CredentialSpec` gains the optional `consumer.actor_login` field. The out-of-repo author is the **project-map credential manifests**. Those manifests must set the crew GitHub App bot login (including `[bot]`) for each crew App credential in the same fleet roll. This PR does not change that separate repository; the companion update is tracked by #2415 and must land before the fleet roll.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (including stored-record corpus)\n\nCloses #2293.\nCloses #2331.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2414/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/