raft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2398","html_url":"https://github.com/flotilla-org/flotilla/pull/2398","diff_url":"https://github.com/flotilla-org/flotilla/pull/2398.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2398.patch","merged_at":"2026-10-01T16:04:23Z"},"body":"Records the owner''s ruling on #2395 in ADR 0046 §4.\n\n- Scarce platform capacity (macOS, Windows) is held back only while an unreserved candidate also covers the needs.\n- When reserved capacity is the only cover, admission uses it without an escalation and records the fallback.\n- A pin to reserved capacity while unreserved capacity exists still needs an escalation reason; that''s unchanged.\n- Reservation judgement beyond the current admission belongs to the Quartermaster (#1394).\n\nThe implementation and tests are #2395.\n\nhttps://claude.ai/code/session_011gkmBquphESrqV3R5jpMb9","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2398/reactions","total_count"