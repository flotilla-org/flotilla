ttps://api.github.com/repos/flotilla-org/flotilla/pulls/2440","html_url":"https://github.com/flotilla-org/flotilla/pull/2440","diff_url":"https://github.com/flotilla-org/flotilla/pull/2440.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2440.patch","merged_at":"2026-10-02T14:11:52Z"},"body":"## Summary\n\nTwo commits, one per issue:\n\n- **Centralize platform vocabulary (#2209).** New `flotilla_resources::Platform` (`linux`, `macos`, `windows`) with `ALL`, `as_str`, `FromStr`/`Display`, `is_reserved()` (macOS and Windows are scarce per ADR 0046 §4; the relative-reservation logic from #2404 is unchanged) and `MATRIX_PLACEHOLDER` (`$matrix`). Project matrix validation, capability-need parsing, `PlacementTieBreak::reserved` and admission''s `$matrix` handling now all read from it, so validation and admission can''t drift apart.\n- **Align cost class names (#2210).** `FulfilmentCostClass` gains `ALL`, `as_str` and `Display`. `convoy explain` allocations use them instead of the hand-written match in convoy admission (as extracted in #2434). A contract test checks that serde''s `snake_case` name equals `as_str` for every variant and round-trips the decode. An exhaustive match in the test forces a new variant into `ALL`.\n\nTests were written first: `tests/platform_vocabulary.rs`, a cost-class contract test in `tests/fulfilment_kind.rs`, and the core tie-breaker test now iterates `Platform::ALL` (Linux is asserted unreserved).\n\n## Stored data\n\nNo serialized shape changes. `CapabilityNeed::Platform` and `FulfilmentGrant::Platform` remain `String`s, so existing stored records decode unchanged (ADR 0047); the stored-record corpus passes. There is no resource schema change, so there are no out-of-repo sources to update.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`: passed\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`: passed\n- `cargo test --workspace --locked`: passed (89 suites, including `stored_corpus`)\n\nCloses #2209. Closes #2210.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2440/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2440/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2210","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2210/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2210/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2210/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2210","id":5631774169,"node_id":"I_kwDORel_088AAAABT64N2Q","number":2210,"title":"Keep fulfilment cost display names aligned with serialized names","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEn