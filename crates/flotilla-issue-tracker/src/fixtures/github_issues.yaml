eived_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null},{"id":10420764475,"node_id":"LA_kwDORel_088AAAACbSA_Ow","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/protocol","name":"protocol","color":"D4A017","default":false,"description":"Wire protocol, message format, handshake","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T17:39:42Z","updated_at":"2026-10-02T11:58:33Z","closed_at":"2026-10-02T11:58:33Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2317 follow-up review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2317#issuecomment-5915941297\n\nThe fleet list now reads replicated resources. `FleetReplicaStatus.skipped_records` and `first_parse_error` describe the retired SSH snapshot parser, so the resource-backed projection always emits `0` and `None`. The CLI still has branches that display these fields and `FleetStaleness::Unreachable`; resource replication failures instead appear in `FleetReplicaStatus.message` with `reachable = false`. The TUI does not branch on `FleetStaleness::Unreachable`.\n\nUpdate the fleet-list wire response and CLI formatting to represent resource replication health directly, without SSH parse diagnostics. Decide whether `FleetStaleness::Unreachable` remains useful for resource-backed rows or should be retired after the remaining FleetReplicaSnapshot consumers move under #742. Preserve N→N+1 decoding where stored data is affected; wire types may change freely under ADR 0047.\n\nAcceptance:\n- Remove or redefine the obsolete parse diagnostic fields in the fleet-list response and CLI.\n- Specify and test how a resource replication failure appears for a host and its rows, including the last successful sync.\n- Keep the remaining snapshot consumers under #742 working until their migration is complete.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2328/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2328/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/578","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/578/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/578/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/578/events","html_url":"https://github.com/flotilla-org/flotilla/issues/578","id":4257330447,"node_id":"I_kwDORel_0879wbUP","number":578,"title":"cli: add default list behavior for noun commands","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10393665220,"node_id":"LA_kwDORel_088AAAACa4K-xA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/quick-win","name":"quick-win","color":"2EA44F","default":false,"description":"Small, well-scoped tasks suitable for agent batches","archived_at":null,"archived_by":null},{"id":10420764676,"node_id":"LA_kwDORel_088AAAACbSBABA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/cli","name":"cli","color":"0E8A16","default":false,"description":"CLI commands and output formatting","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-04-13T19:22:35Z","updated_at":"2026-10-02T11:58:32Z","closed_at":"2026-10-02T11:58:32Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nMost CLI noun commands (`checkout`, `cr`, `issue`, `agent`, `workspace`, `repo`) error when invoked without a verb. Only `host` has a `list` subcommand. The natural convention is \"noun with no verb = list\" (like `kubectl get pods`).\n\n## Proposal\n\nWhen a noun is invoked with no verb, default to listing items of that type:\n\n| Noun | Default list shows |\n|------|-------------------|\n| `repo` | Tracked repos |\n| `checkout` | Active checkouts |\n| `cr` | Open PRs |\n| `issue` | Open issues |\n| `agent` | Active sessions |\n| `workspace` | Active workspaces |\n\nThis should use the existing query infrastructure where available (`QueryIssues`, snapshot data, etc.) and respect `--json` formatting.","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/sta