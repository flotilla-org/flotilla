[package]
name = "flotilla-tui"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
humantime = "2"
bon = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flotilla-client = { path = "../flotilla-client" }
flotilla-commands = { path = "../flotilla-commands" }
flotilla-core = { path = "../flotilla-core" }
flotilla-manifest = { path = "../flotilla-manifest" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
tokio = { workspace = true }
tracing = { workspace = true }
color-eyre = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
tui-input = "0.15"
unicode-width = "0.2.2"
dirs = "6"
catppuccin = { version = "2", features = ["ratatui"] }
crokey = "1.4"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
time = { version = "0.3.47", features = ["local-offset"] }
futures = "0.3"
comfy-table = "7.2.2"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
indexmap = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tracing-subscriber = { version = "0.3.22", features = ["json"] }
async-trait = { workspace = true }
flotilla-core = { path = "../flotilla-core", features = ["test-support"] }
flotilla-protocol = { path = "../flotilla-protocol", features = ["test-support"] }
insta = "1"
tempfile = "3"

[target.'cfg(unix)'.dev-dependencies]
flotilla-daemon = { path = "../flotilla-daemon", features = ["test-support"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
