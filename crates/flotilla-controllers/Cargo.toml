[package]
name = "flotilla-controllers"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-core = { path = "../flotilla-core" }
flotilla-manifest = { path = "../flotilla-manifest" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
tokio = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
tracing = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
dirs = "6"
sha2 = "0.10"
serde_json = { workspace = true }

[dev-dependencies]
flotilla-resources = { path = "../flotilla-resources", features = ["test-support"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
rstest = { workspace = true }
tempfile = "3"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
