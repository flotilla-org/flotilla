# ADR 0060: agent harness adapters; no composition-root or store dependencies.
[package]
name = "flotilla-agent"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-discovery-api = { path = "../flotilla-discovery-api" }
flotilla-paths = { path = "../flotilla-paths" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-terminal = { path = "../flotilla-terminal" }
flotilla-vcs = { path = "../flotilla-vcs" }
async-trait.workspace = true
minijinja.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
# Workspace builds select toml_edit with serde through toml; keep this crate on the same feature set.
toml_edit = { version = "0.22", features = ["serde"] }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
flotilla-config = { path = "../flotilla-config" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
hegeltest = "=0.48.1"
insta = "1"
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[lints]
workspace = true
