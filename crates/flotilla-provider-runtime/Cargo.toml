[package]
name = "flotilla-provider-runtime"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-tls = { path = "../flotilla-tls" }
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "json", "system-proxy"] }
http = { workspace = true }
bytes = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(not(unix))'.dependencies]
sysinfo = "0.38.4"

[dev-dependencies]
hegeltest = "=0.48.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[lints]
workspace = true
