[package]
name = "flotilla-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
cleat-environment-contract = []
aws-lc-provider = ["flotilla-resources/aws-lc-provider"]
replay = []
skip-no-sandbox-tests = ["flotilla-resources/skip-no-sandbox-tests"]
test-support = ["flotilla-protocol/test-support", "flotilla-resources/test-support", "dep:axum"]

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"], optional = true }
flotilla-manifest = { path = "../flotilla-manifest" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-relay-protocol = { path = "../flotilla-relay-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
dirs = "6"
toml = "0.8"
toml_edit = "0.22"
reqwest = { workspace = true, features = ["charset", "http2", "json", "system-proxy"] }
http = "1"
bytes = "1"
minijinja = "2"
serde_yml = "0.0.12"
futures = "0.3"
urlencoding = "2"
url = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = "0.38.4"
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
flotilla-controllers = { path = "../flotilla-controllers" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hegeltest = "=0.48.1"
flotilla-protocol = { path = "../flotilla-protocol", features = ["test-support"] }
flotilla-resources = { path = "../flotilla-resources", features = ["test-support"] }
tempfile = "3"
insta = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[test]]
name = "in_process_daemon"
required-features = ["test-support"]

[[example]]
name = "environment_checkout"
test = false

[[example]]
name = "list_sessions"
test = false

[lints]
workspace = true
