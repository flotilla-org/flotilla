[package]
name = "flotilla-core"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
aws-lc-provider = ["flotilla-tls/aws-lc-provider"]
skip-no-sandbox-tests = ["flotilla-executor/skip-no-sandbox-tests", "flotilla-store/skip-no-sandbox-tests", "flotilla-cloud-agent/skip-no-sandbox-tests", "flotilla-ai-utility/skip-no-sandbox-tests"]

[dependencies]
flotilla-admission = { path = "../flotilla-admission" }
flotilla-schema-sqlite = { path = "../flotilla-schema-sqlite" }
flotilla-address = { path = "../flotilla-address" }
flotilla-messaging = { path = "../flotilla-messaging" }
flotilla-observation = { path = "../flotilla-observation" }
flotilla-projections = { path = "../flotilla-projections" }
flotilla-executor = { path = "../flotilla-executor" }
flotilla-capability-contract = { path = "../flotilla-capability-contract" }
flotilla-config = { path = "../flotilla-config" }
flotilla-forge-forgejo = { path = "../flotilla-forge-forgejo" }
flotilla-environment = { path = "../flotilla-environment" }
flotilla-ai-utility = { path = "../flotilla-ai-utility" }
flotilla-change-request = { path = "../flotilla-change-request" }
flotilla-issue-tracker = { path = "../flotilla-issue-tracker" }
flotilla-forge-github = { path = "../flotilla-forge-github" }
flotilla-vcs = { path = "../flotilla-vcs" }
flotilla-charter = { path = "../flotilla-charter" }
flotilla-terminal = { path = "../flotilla-terminal" }
flotilla-cloud-agent = { path = "../flotilla-cloud-agent" }
flotilla-agent = { path = "../flotilla-agent" }
flotilla-discovery = { path = "../flotilla-discovery" }
flotilla-discovery-api = { path = "../flotilla-discovery-api" }
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
flotilla-store-sqlite = { path = "../flotilla-store-sqlite" }
flotilla-store-memory = { path = "../flotilla-store-memory" }
flotilla-tls = { path = "../flotilla-tls" }
flotilla-store = { path = "../flotilla-store" }
flotilla-paths = { path = "../flotilla-paths" }
flotilla-daemon-api = { path = "../flotilla-daemon-api" }
flotilla-manifest = { path = "../flotilla-manifest" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-relay-protocol = { path = "../flotilla-relay-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
async-trait = { workspace = true }
bon = { workspace = true }
tracing = { workspace = true }
indexmap = { workspace = true }
reqwest = { workspace = true, features = ["charset", "http2", "json", "system-proxy"] }
http = { workspace = true }
bytes = { workspace = true }
minijinja.workspace = true
serde_yml = { workspace = true }
futures.workspace = true
url = { workspace = true }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
sysinfo = "0.38.4"
tokio-util = { workspace = true, features = ["rt"] }
uuid = { workspace = true, features = ["v4"] }
sha2 = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
flotilla-forgejo-providers = { path = "../flotilla-forgejo-providers" }
flotilla-github-providers = { path = "../flotilla-github-providers" }
flotilla-store-http = { path = "../flotilla-store-http" }
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-protocol-testkit = { path = "../flotilla-protocol-testkit" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
flotilla-store-testkit = { path = "../flotilla-store-testkit" }
flotilla-discovery-testkit = { path = "../flotilla-discovery-testkit" }
tokio = { workspace = true, features = ["test-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
hegeltest = { workspace = true }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
tempfile = { workspace = true }
insta = "1"
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[[example]]
name = "environment_checkout"
test = false

[[example]]
name = "list_sessions"
test = false

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-hmac = { path = "../flotilla-build-features-hmac" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-signing = { path = "../flotilla-build-features-signing" }
flotilla-build-features-sqlite = { path = "../flotilla-build-features-sqlite" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
