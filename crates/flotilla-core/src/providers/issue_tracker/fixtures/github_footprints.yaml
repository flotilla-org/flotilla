ps://github.com/acme/widgets/issues/99\".into())\n+            .updated_at(String::new())\n+            .labels(vec![\"value:2\".into(), \"crew-limit:0\".into()])\n+            .blocked_by(vec![])\n+            .pull_requests(vec![])\n+            .build();\n+        let mut boards = issues.boards(&backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\")).await.expect(\"board\");\n+        boards[0].issues.push(tracking);\n+        *issues.board_override.lock().expect(\"board\") = Some(boards.clone());\n+        reconciler.reconcile_once().await.expect(\"first pass\");\n+        let first = backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n+        let score = first.dispatch_queue[0].score.as_ref().expect(\"score\");\n+        assert_eq!(f64::from(score.attributes.value), 2.0);\n+        assert_eq!(score.attributes.crew_limit, Some(0));\n+        assert_eq!(score.project_share, 3);\n+        assert_eq!(score.project_active_crews, 0);\n+        boards[0].issues.last_mut().expect(\"tracking\").mission_fields.value = Some(7.5.try_into().expect(\"value\"));\n+        *issues.board_override.lock().expect(\"board\") = Some(boards);\n+        clock.advance(Duration::seconds(60));\n+        reconciler.reconcile_once().await.expect(\"re-rank pass\");\n+        let second = backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n+        assert_eq!(second.dispatch_queue[0].ready_observed_at, first.dispatch_queue[0].ready_observed_at);\n+        let score = second.dispatch_queue[0].score.as_ref().expect(\"score\");\n+        assert_eq!(f64::from(score.attributes.value), 7.5);\n+        assert_eq!(score.attribute_sources[\"value\"], \"issue_field\");\n+        assert!(second.dispatch_queue_attention.is_some());\n+    }\n+\n     #[tokio::test]\n     async fn ready_unblocked_issues_are_proposed_without_creating_any_convoys() {\n         let ready = issue(\"2\", &[READY_ISSUE_LABEL], None, IssueState::Open);\n@@ -772,6 +949,8 @@ mod tests {\n         assert_eq!(outcome.observations_recorded, 0);\n         let status = backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n         assert_eq!(status.dispatch_queue.iter().map(|entry| &entry.issue).collect::<Vec<_>>(), vec![&waiting.reference]);\n+        assert_eq!(status.dispatch_queue[0].score.as_ref().expect(\"score\").project_active_crews, 1);\n+        assert_eq!(status.dispatch_queue[0].score.as_ref().expect(\"score\").mission_active_crews, 1);\n         assert_eq!(status.dispatch_queue_attention.expect(\"stale attention\").count, 1);\n     }\n \n@@ -818,6 +997,48 @@ mod tests {\n         assert_eq!(second.metadata.resource_version, first.metadata.resource_version);\n     }\n \n+    #[tokio::test]\n+    async fn malformed_mission_publishes_error_preserves_queue_and_recovers() {\n+        use flotilla_resources::DispatchMission;\n+        let mut dispatch_policy = policy(60);\n+        dispatch_policy.missions =\n+            vec![DispatchMission::builder().name(\"routine\".into()).issue(IssueRef { source: source(), id: \"2\".into() }).build()];\n+        let (backend, issues, _, reconciler) =\n+            harness(vec![issue(\"2\", &[READY_ISSUE_LABEL], None, IssueState::Open)], vec![], dispatch_policy).await;\n+        let projects = backend.using::<Project>(NAMESPACE);\n+        reconciler.reconcile_once().await.expect(\"initial pass\");\n+        let before = projects.get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n+        let mut boards = issues.boards(&projects.get(\"widgets\").await.expect(\"project\")).await.expect(\"board\");\n+        boards[0].issues[0].labels.push(\"value:abc\".into());\n+        *issues.board_override.lock().expect(\"board\") = Some(boards);\n+        assert_eq!(reconciler.reconcile_once().await.expect(\"invalid pass\").project_errors, 1);\n+        let failed = projects.get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n+        assert_eq!(failed.dispatch_queue, before.dispatch_queue);\n+        assert!(failed.dispatch_queue_error.as_deref().expect(\"visible error\").contains(\"value\"));\n+        *issues.board_override.lock().expect(\"board\") = None;\n+        reconciler.reconcile_once().await.expect(\"recovery\");\n+        let recovered = projects.get(\"widgets\").await.expect(\"project\").status.expect(\"status\");\n+        assert_eq!(recovered.dispatch_queue, before.dispatch_queue);\n+        assert!(recovered.dispatch_queue_error.is_none());\n+    }\n+\n+    #[tokio::test]\n+    async fn attention_uses_oldest_entry_even_when_it_is_not_first() {\n+        let (backend, _, _, reconciler) = harness(\n+            vec![issue(\"1\", &[READY_ISSUE_LABEL], None, IssueState::Open), issue(\"2\", &[READY_ISSUE_LABEL], None, IssueState::Open)],\n+            vec![],\n+            policy(60),\n+        )\n+        .await;\n+        reconciler.reconcile_once().await.expect(\"queue\");\n+        let mut queue = backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\").status.expect(\"status\").dispatch_queue;\n+        queue[1].ready_observed_at -= Duration::seconds(120);\n+        let oldest = queue[1].ready_observed_at;\n+        let attention = dispatch_queue_attention(&queue, &policy(60), None, queue[0].ready_observed_at).expect(\"stale\");\n+        assert_eq!(attention.oldest_ready_observed_at, oldest);\n+        assert_eq!(attention.count, 2);\n+    }\n+\n     #[tokio::test]\n     async fn source_outage_preserves_aging_and_deduplicates_errors_then_recovers() {\n         let (backend, issues, clock, reconciler) ="},{"sha":"ac7bdeff325532b6c56b0c8d3769df0528e2ef6f","filename":"crates/flotilla-protocol/src/dispatch.rs","status":"added","additions":110,"deletions":0,"changes":110,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Fdispatch.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Fdispatch.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-protocol%2Fsrc%2Fdispatch.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -0,0 +1,110 @@\n+//! Shared ordering contract for CLI reads and subscribed ready result sets.\n+use std::cmp::{Ordering, Reverse};\n+\n+use serde::{Deserialize, Serialize};\n+\n+use crate::{DispatchQueueRow, IssueRef};\n+\n+#[derive(Debug, Clone, Copy, Default, PartialEq, Eq, PartialOrd, Ord, Serialize, Deserialize)]\n+#[serde(rename_all = \"snake_case\")]\n+pub enum ClassOfService {\n+    Expedite,\n+    #[default]\n+    Standard,\n+    Background,\n+}\n+\n+/// Finite numeric mission value with a total order and canonical zero.\n+#[derive(Debug, Clone, Copy, Default, PartialEq, Serialize, Deserialize)]\n+#[serde(try_from = \"f64\", into = \"f64\")]\n+pub struct MissionValue(f64);\n+impl TryFrom<f64> for MissionValue {\n+    type Error = String;\n+    fn try_from(value: f64) -> Result<Self, Self::Error> {\n+        if !value.is_finite() {\n+            return Err(\"mission Value must be finite\".into());\n+        }\n+        Ok(Self(if value == 0.0 { 0.0 } else { value }))\n+    }\n+}\n+impl From<MissionValue> for f64 {\n+    fn from(value: MissionValue) -> Self {\n+        value.0\n+    }\n+}\n+impl Eq for MissionValue {}\n+impl Ord for MissionValue {\n+    fn cmp(&self, other: &Self) -> Ordering {\n+        self.0.total_cmp(&other.0)\n+    }\n+}\n+impl PartialOrd for MissionValue {\n+    fn partial_cmp(&self, other: &Self) -> Option<Ordering> {\n+        Some(self.cmp(other))\n+    }\n+}\n+\n+#[derive(Debug, Clone, Default, PartialEq, Eq, Serialize, Deserialize)]\n+#[serde(default)]\n+pub struct MissionAttributes {\n+    pub value: MissionValue,\n+    pub class_of_service: ClassOfService,\n+    /// None means unlimited; zero explicitly pauses mission admission.\n+    pub crew_limit: Option<u32>,\n+}\n+\n+#[derive(Debug, Clone, Default, PartialEq, Eq, Serialize, Deserialize)]\n+pub struct MissionFields {\n+    pub value: Option<MissionValue>,\n+    pub class_of_service: Option<ClassOfService>,\n+    pub crew_limit: Option<u32>,\n+}\n+\n+#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, bon::Builder)]\n+pub struct DispatchScore {\n+    pub mission: String,\n+    pub mission_issue: Option<IssueRef>,\n+    pub attributes: MissionAttributes,\n+    pub membership: String,\n+    pub attribute_sources: std::collections::BTreeMap<String, String>,\n+    pub unblock_count: usize,\n+    pub conflict_penalty: u64,\n+    /// Admission inputs, not a work-queue priority term.\n+    pub project_share: u32,\n+    pub project_active_crews: usize,\n+    pub mission_active_crews: usize,\n+}\n+\n+/// Lexicographic ruling order. Fair share gates admission separately (#2785).\n+/// Stable identity breaks exact ties without relying on hash iteration order.\n+pub fn compare_dispatch_rows(left: &DispatchQueueRow, right: &DispatchQueueRow) -> Ordering {\n+    let terms = |row: &DispatchQueueRow| {\n+        let score = row.score.as_ref();\n+        (\n+            score.map_or(ClassOfService::Standard, |s| s.attributes.class_of_service),\n+            Reverse(score.map_or(MissionValue::default(), |s| s.attributes.value)),\n+            Reverse(score.map_or(0, |s| s.unblock_count)),\n+            row.ready_observed_at,\n+            score.map_or(0, |s| s.conflict_penalty),\n+        )\n+    };\n+    terms(left).cmp(&terms(right)).then_with(|| left.key().cmp(&right.key()))\n+}\n+\n+#[cfg(test)]\n+mod tests {\n+    use super::*;\n+\n+    // Serialization preserves decimal priority values and rejects nonfinite ones.\n+    #[test]\n+    fn mission_values_are_finite_and_zero_is_canonical() {\n+        for value in [-1.5, 0.0, -0.0, 3.25, f64::MAX] {\n+            let value = MissionValue::try_from(value).expect(\"finite\");\n+            assert_eq!(serde_json::from_str::<MissionValue>(&serde_json::to_string(&value).expect(\"encode\")).expect(\"decode\"), value);\n+        }\n+        assert_eq!(MissionValue::try_from(-0.0).expect(\"zero\").cmp(&MissionValue::default()), Ordering::Equal);\n+        for value in [f64::NAN, f64::INFINITY, f64::NEG_INFINITY] {\n+            assert!(MissionValue::try_from(value).is_err());\n+        }\n+    }\n+}"},{"sha":"f70832240870ab9e1ce05078423a3033bca6a0d9","filename":"crates/flotilla-protocol/src/lib.rs","status":"modified","additions":2,"deletions":0,"changes":2,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Flib.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Flib.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-protocol%2Fsrc%2Flib.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -1,3 +1,5 @@\n+pub mod dispatch;\n+pub use dispatch::{compare_dispatch_rows, ClassOfService, DispatchScore, MissionAttributes, MissionFields, MissionValue};\n pub mod arg;\n pub mod attach_plan;\n pub mod commands;"},{"sha":"0c836c73bb2857d0292205d69ff4c7dcb742564a","filename":"crates/flotilla-protocol/src/query.rs","status":"modified","additions":7,"deletions":1,"changes":8,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Fquery.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-protocol%2Fsrc%2Fquery.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-protocol%2Fsrc%2Fquery.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -20,6 +20,8 @@ pub struct DispatchQueueResponse {\n \n #[derive(Deb