            type: integer\n+                      minimum: 1\n+                      default: 1\n+                    routine_lane:\n+                      type: string\n+                      minLength: 1\n+                      default: routine\n+                    lanes:\n+                      type: array\n+                      items:\n+                        type: object\n+                        required: [mission, labels]\n+                        properties:\n+                          mission:\n+                            type: string\n+                          labels:\n+                            type: array\n+                            items: {type: string}\n+                    missions:\n+                      type: array\n+                      items:\n+                        type: object\n+                        required: [name]\n+                        properties:\n+                          name:\n+                            type: string\n+                            minLength: 1\n+                          issue:\n+                            type: object\n+                            nullable: true\n+                            x-kubernetes-preserve-unknown-fields: true\n+                          attributes:\n+                            type: object\n+                            properties:\n+                              value: {type: number}\n+                              class_of_service:\n+                                type: string\n+                                enum: [expedite, standard, background]\n+                              crew_limit:\n+                                type: integer\n+                                nullable: true\n+                                minimum: 0\n                     stale_after_seconds:\n                       type: integer\n                       minimum: 1\n@@ -156,6 +199,10 @@ spec:\n                     type: object\n                     required: [issue, title, issue_as_of, ready_observed_at, observed_at, provenance]\n                     properties:\n+                      score:\n+                        type: object\n+                        nullable: true\n+                        x-kubernetes-preserve-unknown-fields: true\n                       issue:\n                         type: object\n                         x-kubernetes-preserve-unknown-fields: true"},{"sha":"c4668bb2d4e42dbf7a967d249f566642a28781c9","filename":"crates/flotilla-resources/src/lib.rs","status":"modified","additions":5,"deletions":4,"changes":9,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-resources%2Fsrc%2Flib.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-resources%2Fsrc%2Flib.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-resources%2Fsrc%2Flib.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -191,10 +191,11 @@ pub use principal_attention::{\n     Regard, RegardExpiryPolicy, RegardSource, RegardSpec, RegardStatus, RegardStatusPatch,\n };\n pub use project::{\n-    normalize_issue_source, normalize_project_spec, resolve_project_issue_sources, DeclarationRefusedCondition, DispatchPolicy,\n-    DispatchQueueAttention, DispatchQueueEntry, IssueFieldValue, IssueFilter, IssueSource, IssueSourceBindingSpec, IssueSourceResolution,\n-    IssueSourceUnavailable, OperationalEntriesCondition, Project, ProjectRepositoryRole, ProjectRepositorySpec, ProjectSpec, ProjectStatus,\n-    ProjectStatusPatch, ResolvedIssueSourceBinding, DEFAULT_DISPATCH_QUEUE_STALE_AFTER_SECONDS,\n+    normalize_issue_source, normalize_project_spec, resolve_project_issue_sources, DeclarationRefusedCondition, DispatchLane,\n+    DispatchMission, DispatchPolicy, DispatchQueueAttention, DispatchQueueEntry, IssueFieldValue, IssueFilter, IssueSource,\n+    IssueSourceBindingSpec, IssueSourceResolution, IssueSourceUnavailable, OperationalEntriesCondition, Project, ProjectRepositoryRole,\n+    ProjectRepositorySpec, ProjectSpec, ProjectStatus, ProjectStatusPatch, ResolvedIssueSourceBinding,\n+    DEFAULT_DISPATCH_QUEUE_STALE_AFTER_SECONDS,\n };\n pub use project_hierarchy::ProjectHierarchy;\n pub use provisioning_identity::{canonicalize_repo_url, clone_key, descriptive_repo_slug, forge_clone_key, forge_repo_key, repo_key};"},{"sha":"2e73fbcb5734a6e34b2a303b44418bc8d0b2dd92","filename":"crates/flotilla-resources/src/project.rs","status":"modified","additions":69,"deletions":1,"changes":70,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-resources%2Fsrc%2Fproject.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-resources%2Fsrc%2Fproject.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-resources%2Fsrc%2Fproject.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -169,6 +169,19 @@ pub struct ResolvedIssueSourceBinding {\n \n #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, bon::Builder)]\n pub struct DispatchPolicy {\n+    // Previous-generation policies omit these (ADR 0047). Defaults also define optional charter inputs and remain after the roll.\n+    #[builder(default)]\n+    #[serde(default)]\n+    pub missions: Vec<DispatchMission>,\n+    #[builder(default)]\n+    #[serde(default)]\n+    pub lanes: Vec<DispatchLane>,\n+    #[builder(default = \"routine\".into())]\n+    #[serde(default = \"default_routine_lane\")]\n+    pub routine_lane: String,\n+    #[builder(default = 1)]\n+    #[serde(default = \"default_project_share\")]\n+    pub project_share: u32,\n     #[builder(default = true)]\n     #[serde(default = \"default_true\")]\n     pub enabled: bool,\n@@ -177,6 +190,29 @@ pub struct DispatchPolicy {\n     pub stale_after_seconds: u64,\n }\n \n+fn default_routine_lane() -> String {\n+    \"routine\".into()\n+}\n+fn default_project_share() -> u32 {\n+    1\n+}\n+\n+#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize, bon::Builder)]\n+pub struct DispatchMission {\n+    pub name: String,\n+    pub issue: Option<flotilla_protocol::IssueRef>,\n+    #[builder(default)]\n+    #[serde(default)]\n+    pub attributes: flotilla_protocol::MissionAttributes,\n+}\n+\n+#[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n+pub struct DispatchLane {\n+    pub mission: String,\n+    /// All labels must match. Empty rules deliberately catch all remaining work.\n+    pub labels: BTreeSet<String>,\n+}\n+\n #[derive(Debug, Clone, Default, PartialEq, Eq, Serialize, Deserialize)]\n pub struct ProjectStatus {\n     #[serde(default, skip_serializing_if = \"Option::is_none\")]\n@@ -209,6 +245,9 @@ pub struct OperationalEntriesCondition {\n \n #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]\n pub struct DispatchQueueEntry {\n+    // Previous-generation status omits the score; remove after one roll (ADR 0047).\n+    #[serde(default)]\n+    pub score: Option<flotilla_protocol::DispatchScore>,\n     pub issue: flotilla_protocol::IssueRef,\n     pub title: String,\n     pub issue_as_of: DateTime<Utc>,\n@@ -494,7 +533,36 @@ pub fn normalize_project_spec(mut spec: ProjectSpec) -> Result<ProjectSpec, Stri\n             pair[0].repo\n         ));\n     }\n-    if let Some(policy) = &spec.dispatch_policy {\n+    if let Some(policy) = &mut spec.dispatch_policy {\n+        for mission in &mut policy.missions {\n+            if let Some(reference) = &mut mission.issue {\n+                reference.source = normalize_issue_source(&reference.source);\n+                if reference.source.service == \"github\" {\n+                    reference.source.service = \"https://github.com\".into();\n+                }\n+                if reference.source.service == \"https://github.com\" {\n+                    reference.source.scope = reference.source.scope.to_ascii_lowercase();\n+                }\n+            }\n+        }\n+        if policy.project_share == 0 || policy.routine_lane.trim().is_empty() {\n+            return Err(\"dispatch project_share must be positive and routine_lane nonempty\".into());\n+        }\n+        let mut names = BTreeSet::new();\n+        let mut issues = BTreeSet::new();\n+        for mission in &policy.missions {\n+            if mission.issue.as_ref().is_some_and(|issue| {\n+                issue.id.trim().is_empty() || issue.source.service.trim().is_empty() || issue.source.scope.trim().is_empty()\n+            }) || mission.name.trim().is_empty()\n+                || !names.insert(&mission.name)\n+                || mission.issue.as_ref().is_some_and(|i| !issues.insert(i))\n+            {\n+                return Err(\"dispatch mission names and tracking issues must be unique and nonempty\".into());\n+            }\n+        }\n+        if policy.lanes.iter().any(|lane| !names.contains(&lane.mission)) {\n+            return Err(\"dispatch lane must name a declared mission\".into());\n+        }\n         if policy.stale_after_seconds == 0 {\n             return Err(\"dispatch policy stale_after_seconds must be at least 1\".to_string());\n         }"},{"sha":"2b8beb99d6d52372eef2bd0e6b5f8b88fccce621","filename":"crates/flotilla-tui/src/cli.rs","status":"modified","additions":11,"deletions":1,"changes":12,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-tui%2Fsrc%2Fcli.rs","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/crates%2Fflotilla-tui%2Fsrc%2Fcli.rs","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/crates%2Fflotilla-tui%2Fsrc%2Fcli.rs?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -323,11 +323,21 @@ fn format_dispatch_queue_human(response: &flotilla_protocol::DispatchQueueRespon\n     }\n     let mut table = Table::new();\n     table.load_preset(UTF8_FULL_CONDENSED);\n-    table.set_header(vec![\"Project\", \"Issue\", \"Ready For\", \"Attention\", \"Title\"]);\n+    table.set_header(vec![\"Project\", \"Issue\", \"Mission\", \"Priority\", \"Ready For\", \"Attention\", \"Title\"]);\n     for entry in &response.entries {\n         table.add_row(vec![\n             Cell::new(format!(\"{}/{}\", entry.namespace, entry.project)),\n             Cell::new(format!(\"{}#{}\", entry.issue.source.scope, entry.issue.id)),\n+            Cell::new(entry.score.as_ref().map_or(\"unranked\", |score| score.mission.as_str())),\n+            Cell::new(entry.score.as_ref().map_or_else(String::new, |score| {\n+                format!(\n+                    \"{:?} value={} unblocks={} conflict={}\",\n+                    score.attributes.class_of_service,\n+                    f64::from(score.attributes.value),\n+                    score.unblock_count,\n+                    score.conflict_penalty\n+                )\n+            })),\n             Cell::new(format!(\"{}s\", entry.age_seconds)),\n             Cell::new(if entry.attention { \"! stale\" } else { \"\" }),\n             Cell::new(&entry.title),"},{"sha":"19b3ca81b27a6ce23fb95f330b5b3a6902a9b8e8","filename":"docs/dispatch-readiness.md","status":"modified","additions":104,"deletions":0,"changes":104,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/docs%2Fdispatch-readiness.md","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/docs%2Fdispatch-readiness.md","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/docs%2Fdispatch-readiness.md?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -65,3 +65,107 @@ Each repository reports `observed_at`, `age_seconds`, and `refresh_error`; a fai\n A board is complete for its selected sources: partial repositories are not served when any selected source has no successful observation. Other Projects with healthy sources remain queryable. Removed sources are evicted after a successful complete source-inventory pass; re-adding one starts a new observation. Loader panics are reported as refresh errors and retried after backoff.\n \n The runtime flotilla Project policy was enabled as part of #2782. Its live record is managed by whole-repository project materialisation, which preserves an existing dispatch policy. If an external charter later owns that field, carry the enabled policy into that charter; this change does not author an out-of-scope charter repository. New DispatchHold and DispatchDeployment specs have no existing out-of-repo manifest authors. Project''s new unavailable condition is daemon-authored status, with one-generation decoder compatibility.\n+\n+## Missions, lanes and ordering\n+\n+Ready rows carry a `score` with normalized mission attributes, the source of each\n+attribute, membership reason, unique DAG descendant count, conflict penalty, and\n+admission inputs. CLI JSON and `DispatchReady` snapshots use the same global\n+lexicographic order: expedite/standard/background, descending mission value,\n+descending descendant count, oldest continuously observed readiness, then lowest\n+conflict penalty. Namespace, Project and source-qualified issue break exact ties.\n+The conflict term starts at zero; #2784 supplies it. Deltas carry changed scores;\n+clients apply them by row identity and use the shared comparator to materialize\n+order. Attention uses the oldest readiness clock, independent of priority.\n+\n+Native map ancestry (nearest map, including nested sub-issues) takes precedence\n+over the first matching charter lane. A map is identified by its Map issue type\n+or a label whose final colon-separated segment is `map` (case-insensitive).\n+This follows the same reserved ideation-label convention as readiness. Lane rules require all their labels and preserve\n+charter declaration order. An empty label set is an intentional catch-all; place\n+it after more specific lanes. Unmatched work belongs to `routine_lane`, default\n+`routine`. A mission may reference a tracking issue or use charter attributes\n+alone. Map missions without a charter name use the source-qualified map identity.\n+\n+Author the policy in `project.yaml` or Project''s `spec.dispatch_policy`:\n+\n+```yaml\n+dispatch_policy:\n+  enabled: true\n+  project_share: 2\n+  routine_lane: routine\n+  missions:\n+    - name: stability\n+      issue:\n+        source: {service: ''https://github.com'', scope: flotilla-org/flotilla}\n+        id: ''<stability-lane-issue-number>''\n+      attributes: {value: 5, class_of_service: standard, crew_limit: 2}\n+    - name: routine\n+      attributes: {value: 1, class_of_service: background}\n+  lanes:\n+    - mission: stability\n+      labels: [bug]\n+```\n+\n+Each attribute resolves independently from the tracking issue''s native field,\n+then `value:N`, `cos:expedite|standard|background`, or `crew-limit:N` label, then\n+charter defaults (value 0, standard, unlimited). Value is a finite number and may\n+be fractional or negative. Crew limit is a nonnegative u32; zero pauses future\n+admission. Duplicate or invalid explicit attributes in a published scoring snapshot make\n+readiness unavailable. A failed field observation retains the last-good snapshot\n+and exposes its refresh error, as other board observations do.\n+A present native field overrides its label, even if that label is stale. Native\n+fields with null values fall back. Tracking issues must be in the observed sources.\n+\n+GitHub fields use the [documented issue-field-values endpoint](https://docs.github.com/en/rest/issues/issue-field-values)\n+with pagination and exact field names `Value`, `Class of service`, and `Crew limit`.\n+Unsupported/not-present (404/410) responses permit fallback; authentication,\n+rate-limit and server failures retain their error. Native parents and issue types\n+come from the recorded `gh issue list` board. Field reads are part of that shared\n+background refresh, including every Project''s declared tracking issues; ready\n+reads never query mission fields. Re-ranking becomes visible after the next\n+successful board refresh and dispatch reconciliation. Last-good observations\n+remain available during a failed refresh, with the board''s age/error evidence.\n+\n+Fair share is a positive per-Project relative weight, separate from the work\n+ordering terms. Scores expose it alongside the Project''s live crew count and the\n+mission''s live crew count/limit for #2785 whole-convoy admission. Counts include\n+replicated live convoys and count crew roles once per convoy. Pending, Working, Interrupted and Stalled roles count;\n+Done, HandedBack and Failed roles release their share even before landing. A live convoy that\n+has not published crew state contributes one provisional crew. A batch spanning\n+missions contributes to each mission it serves, without duplicating a convoy\n+within one mission. Terminal convoys contribute zero. This PR supplies inputs;\n+reservation, quota/borrowing and admission enforcement belong to #2785.\n+\n+### Companion owner actions\n+\n+In the flotilla-org organization, define `Value` as a number, `Class of service`\n+as a single select with `expedite`, `standard`, `background`, and `Crew limit` as\n+a number containing nonnegative integers. These are organization owner actions;\n+no organization settings are changed by this PR. Create tracking issues titled\n+`Lane: stability` and `Lane: routine`, label them `dispatch:lane` (never `ready`),\n+and wire their returned numbers into the flotilla Project charter as above.\n+Labels or charter-only attributes work before those owner actions.\n+\n+Project specs are authored outside this repository by project-map/ops\n+`project.yaml` declarations and registered charter Project manifests. The new\n+policy inputs are optional; old declarations retain the existing materialized\n+policy and need no companion migration. Owners add the shown fields to the\n+flotilla charter when selecting lanes. Queue scores are daemon-authored status;\n+previous-generation records decode with `score: None` and preserve old FIFO\n+semantics until the next successful reconciliation. The stored golden corpus\n+is unchanged.\n+\n+On a host running the candidate with configured lanes and ready work, run\n+`scripts/accept-dispatch-missions` for a read-only check of the global ordering\n+and score breakdown. Change a mission field/label, wait for the next successful\n+background refresh and reconciler pass, and rerun to inspect the updated rank.\n+The container tests use injected tracker collaborators and in-memory stores;\n+this operator check needs a running daemon, without Docker requirements.\n+\n+Malformed mission attributes, parent cycles, malformed blocker URLs or missing\n+tracking sources fail the Project closed. `status.dispatch_queue_error` exposes\n+the reason; the last queue and readiness clocks remain stored but unavailable\n+until a successful reconciliation clears the error. Live-convoy membership uses\n+the current board with frozen issue labels, so mission accounting follows current\n+ancestry and charter while retaining the admitted label snapshot."},{"sha":"abcf1d6ddfc9f58d4c0cd35e4a81aeed6f8b7bb0","filename":"docs/http-request-contract-audit.md","status":"modified","additions":1,"deletions":1,"changes":2,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/docs%2Fhttp-request-contract-audit.md","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/docs%2Fhttp-request-contract-audit.md","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/docs%2Fhttp-request-contract-audit.md?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -6,7 +6,7 @@ I searched all Rust sources for `tls::client`, `client_builder`, `reqwest`, requ\n \n | Boundary / call sites | Coverage or justification |\n | --- | --- |\n-| Dispatch native dependencies, closing PRs and board metadata (`issue_tracker/github.rs`) | Authenticated live record/replay fixtures `github_dispatch_facts.yaml` and `github_dispatch_board.yaml` cover paginated native blocked-by REST requests, issue type, closing PR merge state and gh board JSON fields. Client tests prohibit direct gh access. |\n+| Dispatch native dependencies, closing PRs and board metadata (`issue_tracker/github.rs`) | Authenticated live record/replay fixtures `github_dispatch_facts.yaml`, `github_dispatch_board.yaml` and `github_mission_fields.yaml` cover paginated native blocked-by REST requests, issue type, closing PR merge state and gh board JSON fields, native parents/types and the issue-field-values request. Pure mission normalization tests cover documented numeric/select values and source precedence. Client tests prohibit direct gh access. |\n | GitHub App installation discovery and token mint (`credential.rs`) | New loopback HTTP stand-in runs the real minter and HTTP executor, checks routing, required headers, RS256 signature with the existing test key, issuer and timing claims, repositories and permissions. Negative cases prove the stand-in refuses malformed requests. No live recording or real App material. |\n | Forgejo issues and pull requests (`providers/issue_tracker/forgejo.rs`, `providers/change_request/forgejo.rs`) | Existing recorded HTTP fixtures: `forgejo_issues.yaml`, `forgejo_pulls.yaml`, `forgejo_ghostty_governor.yaml`, `forgejo_head_filter_capability.yaml`. |\n | Claude cloud sessions (`providers/coding_agent/claude.rs`) | Exemption beside the Claude factory tests: unpublished `ccr-byoc` consumer-session contract and keychain OAuth material. Legacy `claude_*.yaml` files have no active test references and are not claimed as current coverage. This remains a coverage gap. |"},{"sha":"0d257f24dd8785142e4c7fa5d498953691aca095","filename":"scripts/accept-dispatch-missions","status":"added","additions":29,"deletions":0,"changes":29,"blob_url":"https://github.com/flotilla-org/flotilla/blob/4fe646f9b5f50f3db944f85ae0729372fe7eac33/scripts%2Faccept-dispatch-missions","raw_url":"https://github.com/flotilla-org/flotilla/raw/4fe646f9b5f50f3db944f85ae0729372fe7eac33/scripts%2Faccept-dispatch-missions","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/scripts%2Faccept-dispatch-missions?ref=4fe646f9b5f50f3db944f85ae0729372fe7eac33","patch":"@@ -0,0 +1,29 @@\n+#!/usr/bin/env bash\n+# Read-only real-host acceptance after installing the candidate and configuring lanes.\n+set -euo pipefail\n+snapshot=$(mktemp)\n+trap ''rm -f \"$snapshot\"'' EXIT\n+flotilla dispatch ready --json > \"$snapshot\"\n+python3 - \"$snapshot\" <<''PY''\n+import datetime\n+import json\n+import sys\n+\n+with open(sys.argv[1]) as source:\n+    rows = json.load(source)[\"entries\"]\n+assert rows, \"configure a ready ticket in a controlled Project first\"\n+classes = {\"expedite\": 0, \"standard\": 1, \"background\": 2}\n+def key(row):\n+    score = row[\"score\"]\n+    attributes = score[\"attributes\"]\n+    assert score[\"project_share\"] > 0\n+    assert set(score[\"attribute_sources\"]) == {\"value\", \"class_of_service\", \"crew_limit\"}\n+    return (classes[attributes[\"class_of_service\"]], -attributes[\"value\"],\n+            -score[\"unblock_count\"], datetime.datetime.fromisoformat(row[\"ready_observed_at\"].replace(\"Z\", \"+00:00\")),\n+            score[\"conflict_penalty\"], row[\"namespace\"], row[\"project\"],\n+            row[\"issue\"][\"source\"][\"service\"], row[\"issue\"][\"source\"][\"scope\"], row[\"issue\"][\"id\"])\n+assert rows == sorted(rows, key=key), \"ready work is not in the ruling order\"\n+for row in rows:\n+    print(f''{row[\"project\"]} #{row[\"issue\"][\"id\"]}: {row[\"score\"]}'')\n+print(f\"Verified mission breakdown and global ordering for {len(rows)} ready tickets\")\n+PY"}]'
