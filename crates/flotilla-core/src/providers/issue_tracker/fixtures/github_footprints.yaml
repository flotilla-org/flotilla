    status: 200
    body: '{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853","id":4767230553,"node_id":"PR_kwDORel_088AAAABHCYqWQ","html_url":"https://github.com/flotilla-org/flotilla/pull/2853","diff_url":"https://github.com/flotilla-org/flotilla/pull/2853.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2853.patch","issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2853","commits_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853/commits","review_comments_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853/comments","review_comment_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/comments{/number}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2853/comments","statuses_url":"https://api.github.com/repos/flotilla-org/flotilla/statuses/4fe646f9b5f50f3db944f85ae0729372fe7eac33","number":2853,"state":"open","locked":false,"title":"feat: rank dispatch work by missions and lanes","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"body":"## Summary\n\nReady work now has normalized missions and an explainable global order. Native map ancestry wins over ordered charter lane rules, then routine. Each attribute resolves independently from issue fields, labels, then charter defaults; partial field setup works without losing label values.\n\n```text\nbackground source board + native mission fields\n  → MissionBoard (map ancestry, lane matching, unique descendants)\n  → Project ready proposals with score and admission inputs\n  → shared class/value/unblocks/age/conflict comparator\n  → CLI and DispatchReady snapshots/deltas\n```\n\nProject share and observed Project/mission crew counts accompany each score for #2785 admission. Conflict penalty starts at zero for #2784. Changing a mission field re-ranks work after the next observation/reconciliation without resetting readiness aging. Human CLI output shows mission and score terms; JSON includes attribute provenance.\n\nCloses #2783\n\n## Evidence\n\n- **Before:** ready snapshots sorted by Project/issue identity; CLI proposals sorted by Project and readiness age, without mission attributes or ranking explanation.\n  **After:** both use one global comparator; Hegel properties independently exercise every ordering term and field/label/charter precedence. Native-graph scenarios cover nested maps, first-match lanes, routine fallback and diamond descendant deduplication. In-memory reconciliation verifies re-ranking retains readiness age and attention and supplies fair-share inputs. Exhaustive crew-phase cases verify settled roles release share before convoy landing. Review regressions verify malformed mission evidence publishes a recoverable Project error without losing age, catch-all lane matching, and attention with a non-first oldest entry. Descendant counts are memoized per board.\n- GitHub board metadata was re-recorded against the authenticated tracker with native parent/type fields; a new authenticated field-request fixture covers the documented endpoint. No fixture was hand-edited and the stored golden corpus is unchanged.\n- Local validation: `cargo +nightly-2026-03-12 fmt --check`; `cargo clippy --workspace --all-targets --locked -- -D warnings`; `cargo test --workspace --locked` (4,613 passing); Git boundary check plus all 10 checker tests; `ci/toolchain/assert.sh`. Default TMPDIR, no skipped sandbox feature.\n- Real-host acceptance: on a candidate host with configured missions and ready work, run `scripts/accept-dispatch-missions`; change a mission field/label, wait for a successful background refresh and reconciliation, and rerun to inspect changed rank. The script is read-only and needs a running daemon. Container behavior tests use injected tracker collaborators and real in-memory stores; no Docker is required.\n\n### Mutation check\n\n1. Dropped native Value selection: `sources_normalize_per_attribute` failed (expected native 0, received charter -999), then reverted.\n2. Reversed mission-value order to ascending: `lexicographic_rank_and_breakdown` failed (Greater instead of Less on the value axis), then reverted.\n\n## Merge Danger\n\n**Door:** one-way stored shape, two-way wire/presentation changes.\n\n**Blast Radius:** dispatch.\n\nProject policy and stored ready entries gain optional fields with one-generation defaults. Existing records decode and keep FIFO-compatible defaults until reconciliation. An unavailable initial board makes readiness unavailable; failed background refreshes preserve last-good metadata with age/error evidence. Malformed explicit attributes in the serving snapshot fail closed; failed field refreshes retain the last-good board with an error. Project share/crew-limit enforcement and reservations remain #2785 responsibilities.\n\n## Resource schema changes\n\nProject specs: out-of-repo authors are project-map/ops `project.yaml` declarations and registered charter Project manifests. All new policy fields are optional; no required manifest migration or companion repository edit. Project materialization now accepts charter-authored policy while preserving existing policy when omitted. Queue scores are daemon-authored Project status, defaulting to absent for previous-generation records. CRD schema is updated.\n\nCompanion owner actions (not enacted by this PR): define organization issue fields `Value` (number), `Class of service` (single select: expedite/standard/background), and `Crew limit` (nonnegative integer-valued number). Create flotilla tracking issues `Lane: stability` and `Lane: routine`, label them `dispatch:lane` without `ready`, and put their returned issue numbers and desired defaults/rules into the Project charter. Labels or charter-only attributes work before these owner actions. Exact configuration and source precedence are documented in `docs/dispatch-readiness.md`.\n","labels":[],"milestone":null,"active_lock_reason":null,"created_at":"2026-10-07T02:44:14Z","updated_at":"2026-10-07T03:08:14Z","closed_at":null,"merged_at":null,"merge_commit_sha":"e418e431331391597b5069e57d7b8272fc41702e","assignee":null,"assignees":[],"requested_reviewers":[],"requested_teams":[],"head":{"label":"flotilla-org:convoy/dispatch","ref":"convoy/dispatch","repo":{"id":1172930515,"node_id":"R_kgDORel_0w","name":"flotilla","full_name":"flotilla-org/flotilla","owner":{"login":"flotilla-org","id":269690888,"node_id":"O_kgDOEBMoCA","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-org","html_url":"https://github.com/flotilla-org","followers_url":"https://api.github.com/users/flotilla-org/followers","following_url":"https://api.github.com/users/flotilla-org/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-org/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-org/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/