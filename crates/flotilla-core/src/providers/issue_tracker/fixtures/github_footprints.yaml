s_url":"https://api.github.com/users/flotilla-org/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-org/received_events","type":"Organization","user_view_type":"public","site_admin":false}},"_links":{"comments":{"href":"https://api.github.com/repos/flotilla-org/flotilla/issues/2853/comments"},"commits":{"href":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853/commits"},"statuses":{"href":"https://api.github.com/repos/flotilla-org/flotilla/statuses/4fe646f9b5f50f3db944f85ae0729372fe7eac33"},"html":{"href":"https://github.com/flotilla-org/flotilla/pull/2853"},"issue":{"href":"https://api.github.com/repos/flotilla-org/flotilla/issues/2853"},"review_comments":{"href":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853/comments"},"review_comment":{"href":"https://api.github.com/repos/flotilla-org/flotilla/pulls/comments{/number}"},"self":{"href":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2853"}},"author_association":"CONTRIBUTOR","auto_merge":null,"draft":false,"merged":false,"mergeable":true,"rebaseable":false,"mergeable_state":"clean","merged_by":null,"comments":3,"review_comments":0,"maintainer_can_modify":false,"commits":2,"additions":1223,"deletions":28,"changed_files":24}'
