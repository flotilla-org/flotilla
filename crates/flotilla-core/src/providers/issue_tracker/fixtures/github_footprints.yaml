         }\n+            // A revert can restore the identical revision and overlap. Historical\n+            // cleared holds stay cleared, but a new relationship must block again.\n+            *issues.board_override.lock().expect(\"board\") = Some(original);\n+            let recurrent = reconciler.reconcile_once().await.expect(\"recurrent pass\");\n+            assert_eq!(recurrent.blocked, usize::from(threshold <= 5));\n+            assert_eq!(recurrent.queued, usize::from(threshold > 5));\n+            let holds = backend.using::<DispatchHold>(NAMESPACE).list().await.expect(\"holds\").items;\n+            assert_eq!(\n+                holds.iter().filter(|h| !h.status.as_ref().is_some_and(|s| s.cleared_at.is_some())).count(),\n+                usize::from(threshold <= 5)\n+            );\n+            // A telemetry storage failure must neither unblock a required hold nor\n+            // withhold an otherwise-ready proposal. This real backend rejects an\n+            // invalid URL before I/O, isolating the evidence-store failure boundary.\n+            let mut telemetry_failure = reconciler;\n+            telemetry_failure.overlap_backend =\n+                ResourceBackend::Http(flotilla_resources::HttpBackend::new(flotilla_resources::tls::client(), \"invalid URL\"));\n+            let survived = telemetry_failure.reconcile_once().await.expect(\"telemetry failure pass\");\n+            assert_eq!(survived.project_errors, 0);\n+            assert_eq!(survived.blocked, recurrent.blocked);\n+            assert_eq!(survived.queued, recurrent.queued);\n         }\n     }\n \n+    // Evidence retention is bounded independently of sliding-window/revision\n+    // churn. Identical passes and initial disjoint pairs create no extra records;\n+    // unknown/clear transitions and standalone outcomes remain distinguishable.\n+    #[tokio::test]\n+    async fn overlap_evidence_retention_and_sparse_pairs() {\n+        use flotilla_protocol::FootprintTarget;\n+        let (backend, _, clock, reconciler) = harness(vec![], vec![], policy(60)).await;\n+        let project = backend.using::<Project>(NAMESPACE).get(\"widgets\").await.expect(\"project\");\n+        let candidate = issue(\"1\", &[READY_ISSUE_LABEL], None, IssueState::Open).reference;\n+        let measurement = ConflictMeasurement {\n+            outcome: false,\n+            source: source(),\n+            target: FootprintTarget::Convoy { name: \"other\".into() },\n+            candidate_actual: false,\n+            target_actual: true,\n+            revision: \"first\".into(),\n+            conflicts: None,\n+            weight: 0,\n+            files: vec![],\n+        };\n+        let observations = backend.using::<DispatchOverlap>(NAMESPACE);\n+        reconciler.record_overlaps(&project, vec![(candidate.clone(), measurement.clone())], clock.now()).await.expect(\"disjoint\");\n+        assert!(observations.list().await.expect(\"empty evidence\").items.is_empty());\n+        let mut overlapping = measurement.clone();\n+        overlapping.weight = 1;\n+        overlapping.files = vec![\"src/a.rs\".into()];\n+        reconciler.record_overlaps(&project, vec![(candidate.clone(), overlapping.clone())], clock.now()).await.expect(\"overlap\");\n+        reconciler.record_overlaps(&project, vec![(candidate.clone(), overlapping)], clock.now()).await.expect(\"identical\");\n+        assert_eq!(observations.list().await.expect(\"dedup\").items.len(), 1);\n+        reconciler\n+            .record_overlaps(&project, vec![(candidate.clone(), measurement.clone())], clock.now())\n+            .await\n+            .expect(\"disjoint transition\");\n+        assert_eq!(observations.list().await.expect(\"transition\").items.len(), 2);\n+        let mut conflict = measurement.clone();\n+        conflict.conflicts = Some(true);\n+        let mut outcome = measurement.clone();\n+        outcome.outcome = true;\n+        reconciler\n+            .record_overlaps(&project, vec![(candidate.clone(), conflict), (candidate.clone(), outcome)], clock.now())\n+            .await\n+            .expect(\"conflict and outcome\");\n+        assert_eq!(observations.list().await.expect(\"evidence\").items.len(), 4);\n+        let samples = (0..=OVERLAP_RECORD_LIMIT)\n+            .map(|index| {\n+                let mut sample = measurement.clone();\n+                sample.weight = (index % 61) as u64 + 1;\n+                sample.files = vec![\"src/a.rs\".into()];\n+                sample.revision = format!(\"revision-{index}\");\n+                (candidate.clone(), sample)\n+            })\n+            .collect();\n+        clock.advance(Duration::seconds(1));\n+        reconciler.record_overlaps(&project, samples, clock.now()).await.expect(\"history churn\");\n+        assert_eq!(observations.list().await.expect(\"bounded evidence\").items.len(), OVERLAP_RECORD_LIMIT);\n+        clock.advance(Duration::days(OVERLAP_RETENTION_DAYS + 1));\n+        reconciler.record_overlaps(&project, vec![], clock.now()).await.expect(\"expiry\");\n+        assert!(observations.list().await.expect(\"expired evidence\").items.is_empty());\n+        let mut renewed = measurement;\n+        renewed.weight = (OVERLAP_RECORD_LIMIT % 61) as u64 + 1;\n+        renewed.files = vec![\"src/a.rs\".into()];\n+        renewed.revision = format!(\"revision-{}\", OVERLAP_RECORD_LIMIT);\n+        reconciler.record_overlaps(&project, vec![(candidate, renewed)], clock.now()).await.expect(\"renew expired evidence\");\n+        assert_eq!(observations.list().await.expect(\"fresh evidence\").items.len(), 1);\n+    }\n+\n     #[tokio::test]\n     async fn mission_scores_reconcile_and_retain_readiness_age() {\n         use flotilla_resources::DispatchMission;"},{"sha":"6414c01b243887b46be2863862851c16527e3f09","filename":"docs/dispatch-readiness.md","status":"modified","additions":16,"deletions":3,"changes":19,"blob_url":"https://github.com/flotilla-org/flotilla/blob/eaaa3a0eb83f98c93a578e2b2a45b980f811a0f8/docs%2Fdispatch-readiness.md","raw_url":"https://github.com/flotilla-org/flotilla/raw/eaaa3a0eb83f98c93a578e2b2a45b980f811a0f8/docs%2Fdispatch-readiness.md","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/docs%2Fdispatch-readiness.md?ref=eaaa3a0eb83f98c93a578e2b2a45b980f811a0f8","patch":"@@ -181,7 +181,12 @@ all previous-generation manifests decode without this optional input.\n \n A ticket declares repository-relative paths, directory prefixes or trailing `*`\n globs as bullets in a `## Touches` section. The section ends at the next level-two\n-heading. Without it, the first heuristic matches paths and unique basenames in\n+heading, including indented headings. Only bullets contribute paths; prose is ignored.\n+Globs support exactly one trailing `*`; mid-path patterns such as `src/**/*.rs`,\n+`?` and character classes are unsupported. Unsupported or unmatched globs emit\n+a debug diagnostic and contribute no invented paths. Absolute paths and `..`\n+components are rejected. A new literal file is retained even before it appears\n+in observation history. Without a Touches section, the heuristic matches paths and unique basenames in\n the ticket title/body against files seen in recent merges or active work. An\n empty prediction is reported as empty evidence, not a claim of disjointness.\n For a multi-repository Project, declared paths are interpreted conservatively\n@@ -204,7 +209,9 @@ Below the configured per-target threshold, summed overlap becomes the last order\n `land_after_work` convoy or PR target. `land_after` remains the candidate issue\n anchor for stored-shape compatibility; explicit work targets take precedence.\n Automatic holds clear when overlap drops, a target leaves flight, or landing is\n-observed. Refresh failures retain last-good observations and their age/error;\n+observed. If identical overlap returns after clearing (for example a revert push),\n+a fresh immutable hold is created; a cleared historical hold cannot bypass it.\n+Refresh failures retain last-good observations and their age/error;\n an initial missing footprint observation makes this Project unavailable. Manual\n work-addressed holds require positive merged-PR or Landed-convoy evidence.\n \n@@ -223,7 +230,13 @@ merge-conflict evidence even after its overlapping work has landed; pair records\n use `outcome: false` and contain shared paths. `conflicts: true` means a conflict was observed; false means the applicable\n work has confirmed clear mergeability, and null preserves unknown evidence. Their stable content\n identity deduplicates identical passes; changed diffs and conflict evidence add\n-records. They are daemon-authored and have no out-of-repo manifest author.\n+records. Initial disjoint pairs without an observed conflict are omitted; the\n+transition from positive overlap to zero is retained. Each Project pass reads the\n+evidence inventory once, avoiding per-pair backend reads. Evidence is best-effort:\n+a read/write/GC failure is logged and cannot interrupt hold evaluation or queue\n+publication. Retention is 30 days with at most 2,048 records per Project; oldest\n+records are deleted on reconciliation, including when overlap policy is disabled.\n+Export tuning data before this window if longer history is needed. They are daemon-authored and have no out-of-repo manifest author.\n \n On a candidate host, run `scripts/accept-dispatch-footprints NAME` to inspect\n observations and reports. Use two ready tickets declaring the same rare path,"}]}'
