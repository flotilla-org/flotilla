    status: 200
    body: '{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2858","id":4769606585,"node_id":"PR_kwDORel_088AAAABHEpruQ","html_url":"https://github.com/flotilla-org/flotilla/pull/2858","diff_url":"https://github.com/flotilla-org/flotilla/pull/2858.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2858.patch","issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2858","commits_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2858/commits","review_comments_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2858/comments","review_comment_url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/comments{/number}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2858/comments","statuses_url":"https://api.github.com/repos/flotilla-org/flotilla/statuses/f2c97ba5d9beddc24c312e1f62d26116fed6e532","number":2858,"state":"closed","locked":false,"title":"fix: verify effective git identity in fleet canary","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"body":"## Summary\n\nThe r588 fleet canary reached a Running crew but falsely rejected its Git identity because user.name/user.email were empty. Production crews receive identity through GIT_AUTHOR_* and GIT_COMMITTER_* environment variables; their effective Git identity is correct.\n\n```diff\n stub report\n+  git var GIT_AUTHOR_IDENT / GIT_COMMITTER_IDENT\n verify_baseline\n-  require user.name / user.email config\n+  require effective author AND committer name/email\n   require push.default = current\n```\n\nKeep config values as diagnostic evidence, and check Git''s effective identity rather than where it was configured. The live-shaped report and real stub test use empty identity config, environment identity pairs, and GIT_CONFIG_* push/tracking settings. Validate author and committer independently; timestamps are not policy. A failed git var still produces the report with empty identity, allowing a named baseline refusal instead of a missing-report timeout.\n\nRefs #2854\n\n## Evidence\n\n- **Before:** The live-shaped report failed with `baseline git config user.name missing or incorrect`.\n  **After:** It passes, and the real stub reports effective author/committer identities under environment-only identity injection. A real-Git test with missing injection and user.useConfigOnly reproduced the missing-report bug and now verifies the named identity refusal. Wrong or missing names/emails remain refusals; push.default, handshake, skills, and credential-isolation checks remain covered.\n- `scripts/test-fleet-install.sh`, including the real-daemon pre-Docker contract.\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`, with default TMPDIR.\n- Git boundary checker and its 10 tests.\n\n### Mutation check\n\nOmitting the author check and omitting the committer check each made the invalid-effective-identity contract fail. Both mutants were reverted.\n\n## Merge Danger\n\n**Door:** two-way. **Blast Radius:** canary. The stub adds effective-identity fields to its private report; installer validation uses those fields and retains push.default. No production crew provisioning or daemon behavior changes. Live feta acceptance remains with the operator.\n\n## Resource schema changes\n\nNo resource schema change.\n","labels":[],"milestone":null,"active_lock_reason":null,"created_at":"2026-10-07T07:47:58Z","updated_at":"2026-10-07T08:02:07Z","closed_at":"2026-10-07T08:00:32Z","merged_at":"2026-10-07T08:00:32Z","merge_commit_sha":"f4162914c6d4df5784280907121b1d166a222837","assignee":null,"assignees":[],"requested_reviewers":[],"requested_teams":[],"head":{"label":"flotilla-org:fix/2854-canary-effective-identity","ref":"fix/2854-canary-effective-identity","repo":{"id":1172930515,"node_id":"R_kgDORel_0w","name":"flotilla","full_name":"flotilla-org/flotilla","owner":{"login":"flotilla-org","id":269690888,"node_id":"O_kgDOEBMoCA","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-org","html_url":"https://github.com/flotilla-org","followers_url":"https://api.github.com/users/flotilla-org/followers","following_url":"https://api.github.com/users/flotilla-org/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-org/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-org/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-org/subscriptions","organizations_url":"https://api.github.com/users/flotilla-org/orgs","repos_url":"https://api.github.com/users/flotilla-org/repos","events_url":"https://api.github.com/users/flotilla-org/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-org/received_events","type":"Organization","user_view_type":"public","site_admin":false},"private":