     ''git'': {key: subprocess.run([''git'', ''config'', ''--get'', key], capture_output=True, text=True).stdout.strip()\n-            for key in [''user.name'', ''user.email'', ''push.default'']},\n+            for key in [''user.name'', ''user.email'', ''push.default'']} | {\n+                key: subprocess.run([''git'', ''var'', key], capture_output=True, text=True).stdout.strip()\n+                for key in [''GIT_AUTHOR_IDENT'', ''GIT_COMMITTER_IDENT'']},\n     ''skills'': sorted(str(path.relative_to(home / ''skills''))\n                      for path in (home / ''skills'').rglob(''SKILL.md'')),\n }))"},{"sha":"393142b9b3b4d231d295d259fbb469f5a6edc643","filename":"scripts/fleet-canary.py","status":"modified","additions":9,"deletions":6,"changes":15,"blob_url":"https://github.com/flotilla-org/flotilla/blob/f2c97ba5d9beddc24c312e1f62d26116fed6e532/scripts%2Ffleet-canary.py","raw_url":"https://github.com/flotilla-org/flotilla/raw/f2c97ba5d9beddc24c312e1f62d26116fed6e532/scripts%2Ffleet-canary.py","contents_url":"https://api.github.com/repos/flotilla-org/flotilla/contents/scripts%2Ffleet-canary.py?ref=f2c97ba5d9beddc24c312e1f62d26116fed6e532","patch":"@@ -92,12 +92,15 @@ def verify_baseline(report):\n     env = report[''environment'']\n     if env.get(''RUSTUP_HOME'') != ''/usr/local/rustup'':\n         raise CanaryFailure(''baseline RUSTUP_HOME missing or incorrect'')\n-    expected = {''user.name'': ''flotilla-crew[bot]'',\n-                ''user.email'': ''309902803+flotilla-crew[bot]@users.noreply.github.com'',\n-                ''push.default'': ''current''}\n-    for key, value in expected.items():\n-        if report[''git''].get(key) != value:\n-            raise CanaryFailure(f''baseline git config {key} missing or incorrect'')\n+    expected_identity = ''flotilla-crew[bot] <309902803+flotilla-crew[bot]@users.noreply.github.com>''\n+    # git var reflects the identity Git will actually use, including injected\n+    # GIT_AUTHOR_* / GIT_COMMITTER_* overr