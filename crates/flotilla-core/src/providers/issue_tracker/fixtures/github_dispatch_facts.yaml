efault":false,"description":"Earned: body alone is a dispatchable contract — an agent can start NOW","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-08-04T12:40:50Z","updated_at":"2026-08-05T09:27:47Z","closed_at":"2026-08-05T09:27:47Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015454,"node_id":"IT_kwDOEBMoCM4B6IRe","name":"Feature","description":"A request, idea, or new functionality","color":"blue","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What to build (re-scoped 2026-08-04 — Robert: not ready to turn on auto-admission)\n\nThe original auto-admission scope is withdrawn: manual dispatch currently performs two judgment functions the machinery cannot yet — **(A) picking workflow and placement per issue** (neither decidable from nor encoded on issues today), and **(B) backpressure from real resources** (a vessel-demand queue with livelock hazards — depended-on vessels unschedulable — needing real design). Both are Quartermaster-design questions; see the Quartermaster brainstorm.\n\nv1 is therefore **propose-and-observe**:\n\n- The reconciler computes the **dispatchable set** — ready-labeled, unblocked (body-convention `## Blocked by` parse, unparseable = blocked), undispatched — per opted-in project, continuously.\n- It **surfaces** the set: a `flotilla dispatch queue` read verb (+ fleet-view section), and an attention flag when the set is non-empty past a staleness threshold. It **never admits convoys**.\n- It **observes**: when a dispatch happens (governor/human, by any path), and the issue was in the set, record the association — issue, chosen workflow, placement policy, stance, time-from-ready-to-dispatch — as durable observations. This is the \"observe real behaviour, then automate\" input the Quartermaster design consumes: the recorded distribution of A-decisions is what makes them automatable honestly.\n- Kill switch and provenance as originally specified, applied to the proposing/observing machinery.\n\n## Acceptance criteria\n\n- [ ] Ready+unblocked+undispatched issues appear in the queue within a pass; blocked/dispatched drop out\n- [ ] Zero convoys are ever created by this machinery (test asserts absence)\n- [ ] A manual dispatch of a queued issue records the observation with the A-decision fields\n- [ ] Queue staleness raises the attention flag; off switch immediate\n- [ ] Behavior tests through injected issue sources + in-memory backend\n\nRelates: the Quartermaster brainstorm (A/B design), #1375/#1380, ADR 0029.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1385/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eye