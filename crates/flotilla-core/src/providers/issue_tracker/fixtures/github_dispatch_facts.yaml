alse,"web_commit_signoff_required":false,"has_pull_requests":true,"pull_request_creation_policy":"collaborators_only","topics":[],"visibility":"public","forks":1,"open_issues":200,"watchers":1,"default_branch":"main","permissions":{"admin":false,"maintain":false,"push":false,"triage":false,"pull":false}},"body":"Implements the #1394 ruling (owner grill, 2026-10-06); see its numbered items.\n\n## Contract (ruling items 1 and 3)\n- **ADR:** write the new ADR named in #1394''s ADR carry line.\n- **Ready predicate:** one computed predicate per project in the daemon, exposed as a query result set (CLI `flotilla dispatch ready [--project]`, plus surfaces). An issue is dispatchable when it is:\n  - open;\n  - free of open native blocked-by edges;\n  - labelled `ready`;\n  - not a grill, map or brainstorm (by type or label);\n  - not already served by a live convoy or open PR;\n  - free of active soft holds.\n\n  It replaces #1385''s `## Blocked by` body parsing and dag-fetch''s \"unblocked\" meaning.\n- **Soft holds:** a \"land after #n\" relationship with a reason and author, separate from blocked-by. It clears automatically when #n lands, or, if marked deploy-dependent, when #n is deployed. Settable by governors and the operator, and later by deconfliction (#1394 item 5).\n- **dag-fetch** becomes a client of the result set; its board facts come from the daemon.\n- **Observations:** switch on #1385''s dispatch observation records for flotilla so dispatch decisions accumulate.\n- **Tests:** each predicate input; a land-after hold clearing on land and on deploy.\n","reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2782/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2782/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null}]'
