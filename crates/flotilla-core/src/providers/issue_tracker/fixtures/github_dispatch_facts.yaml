e opted-in Project dispatchable set from ready, unblocked, undispatched issues without admitting convoys\n- persist the dispatch queue and raise Project attention once its oldest entry crosses the configured staleness threshold\n- add `flotilla dispatch queue` with human and JSON output, and include the queue in the fleet health view\n- record immutable `DispatchObservation` resources when a human/governor convoy admits an issue that was queued, capturing workflow, placement policy, stance, dispatch time, and time from first ready observation\n- preserve conservative `## Blocked by` parsing, blocker re-observation, kill-switch behavior, and durable provenance\n\n## Safety invariant\n\nThe dispatch reconciler has no admission collaborator or admission call. Behavior coverage explicitly asserts that a ready, unblocked issue enters the queue while the Convoy store remains empty.\n\n## Validation\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- sandbox-safe locked workspace test suite with `flotilla-daemon/skip-no-sandbox-tests`\n\nCloses #1385\n","labels":[],"milestone":null,"active_lock_reason":null,"created_at":"2026-08-04T12:59:40Z","updated_at":"2026-08-05T09:27:48Z","closed_at":"2026-08-05T09:27:46Z","merged_at":"2026-08-05T09:27:46Z","merge_commit_sha":"0b4a60862235e91581ef56f83ee73ebefeb39587","assignee":null,"assignees":[],"requested_reviewers":[],"requested_teams":[],"head":{"label":"flotilla-org:feature/dispatch-reconciler","ref":"feature/dispatch-reconciler","repo":{"id":1172930515,"node_id":"R_kgDORel_0w","name":"flotilla","full_name":"flotilla-org/flotilla","owner":{"login":"flotilla-org","id":269690888,"node_id":"O_kgDOEBMoCA","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-org","html_url":"https://github.com/flotilla-org","followers_url":"https://api.github.com/users/flotilla-org/followers","following_url":