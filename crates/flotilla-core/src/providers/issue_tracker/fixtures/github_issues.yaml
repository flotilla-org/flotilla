otilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-25T09:53:33Z","updated_at":"2026-09-30T13:11:35Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":2,"blocking":0,"total_blocking":0},"body":"## Goal (operator task, re-scoped 2026-09-30)\n\nOnce flotilla derives lab forge transport from the `Forge` resource, remove the per-host workarounds and verify nothing depends on them.\n\nThe daemon half is covered elsewhere:\n- **#2261 / PR #2265:** convoy clone URLs and clone adoption come from the Forge''s transport.\n- **#2266:** Forge host aliases are canonicalised when remotes are recorded, so `forgejo-manchego` spellings stop becoming the live remote.\n\n## What remains here\n\n1. Remove `insteadOf` rules from the global git config on feta, udder and kiwi.\n2. Remove the `forgejo-manchego` / `manchego` SSH aliases from host git and SSH config on those hosts. This includes kiwi''s `~/dev/ghostty-ops` origin `forgejo-manchego:robert/ghostty-ops.git`: repoint it to the canonical forge URL, keeping an SSH push URL if needed.\n3. Verify: the ghostty, katzensteg and porthole governors provision and fetch with no `manchego` anywhere. Operator repair: `remove_remote` for stale alias remotes on Repository records.\n\n## Acceptance\n\n- `git config --global --get-regexp insteadof` is empty on feta, udder and kiwi.\n- No host git or SSH config names `forgejo-manchego`.\n- The lab-hosted governors provision cleanly.\n\nBackground: reports/lab-forge-transport-fix-2026-09-25.md (project-map); #1955, #1962.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1969/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1969/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2291","id":5646722826,"node_id":"I_kwDORel_088AAAABUJInCg","number":2291,"title":"Issue-tracker incremental refresh exhausts the operator''s GitHub quota: per-checkout duplicate polling, no conditional requests","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T12:51:30Z","updated_at":"2026-09-30T12:51:30Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\nOn 2026-09-30 the operator''s GitHub REST quota (user 752137, 5,000/hr) hit **0** at 12:44Z. After the 12:47 reset, usage ran at about **5,200/hr sustained** (129 calls in 90 seconds), so it refills and drains every hour.\n\nSampling `gh` child processes on each host shows the consumer is **kiwi''s flotillad** (`~/.local/opt/flotilla-fleet/current/bin/flotillad --timeout 0`, r375). Feta and udder showed none. The calls are the issue tracker''s incremental refresh:\n\n```\ngh api --include repos/<owner>/<repo>/issues?state=all&since=<~1 min ago>&sort=updated&direction=desc&per_page=50\n```\n\nIn a 30-second sample: `flotilla-org/cleat` ×4; `rjwittams/zellij`, `rjwittams/pi`, `rjwittams/katzensteg`, `rjwittams/ghostty` ×2 each; plus wheelhouse, spyglass, porthole, luchs, jackstay and others. **The same repo is polled several times with different `since` stamps within seconds**, which suggests one refresher per checkout or observation root, not one per repository identity.\n\n## Why it matters\n\n- Quota exhaustion blocks the operator''s own `gh` use and every daemon-side GitHub observation on that account. A daemon that can''t observe change requests doesn''t notice merges, so convoys don''t land. (The 2026-09-26 exhaustion was aggregator PR polling, fixed by #2047; this is the issue-tracker path.)\n- It scales with the number of observed checkouts, not with activity.\n\n## Ask\n\n1. Refresh issues **once per repository identity** (per forge repository), however many checkouts or observation roots map to it, and share the result.\n2. Use **conditional requests**: send `If-None-Match` / `If-Modified-Since` with the stored ETag. A 304 doesn''t count against the primary rate limit, and the replay fixtures already capture etags.\n3. **Budget and back off:** read `x-ratelimit-remaining` from the `--include` headers, back off below a threshold, and surface a host condition, not silence.\n4. Make the poll interval proportional to activity and demand: longer for repos nobody''s viewing or governing.\n5. A test with a replay or fake GitHub client: two checkouts of one repo, one refresh per interval, and a 304 path that consumes no quota.\n\nRelated: #2047 (the PR-polling version of this), ADR 0019 (forge access and demand-placed observation), the #2017–#2019 rate-limit cluster.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2288","id":5646030409,"node_id":"I_kwDORel_088AAAABUIeWSQ","number":2288,"title":"Mutations on replica copies silently no-op or revert; route to the record''s origin or refuse loudly","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T11:55:37Z","updated_at":"2026-09-30T11:57:56Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nWhether an operation works depends on which host you run it from, and running it from the wrong host fails **silently**. Every replicated record has an origin root (its home host), and only operations performed there take effect. Everywhere else acts on a replica copy, which the replicator then overwrites. From the operator''s side this looks like flakiness.\n\nSeen on 2026-09-30 alone:\n\n1. **`flotilla resource delete convoy <name>` from kiwi returned success**, but the convoy''s origin was feta. The convoy was still there an hour later, until it was deleted again with `--host feta`. Nothing warned that kiwi held only a replica.\n2. **Stall supervision (#2277):** `deliver_standing_turn` looked up the governor''s TerminalSession in the stalled convoy host''s *local* store and failed because the session lives on the governor''s host.\n3. **Vessel and placement-snapshot dual authorship (#2259):** the placement host authored records for a convoy it didn''t own.\n4. Known before today: TerminalSession deletes must run on the session''s home origin root, or the record re-federates back (project memory; #1894).\n\nThe operator also can''t easily predict where the origin is. Convoys dispatched from kiwi with `--fulfilment docker-crew-image-feta` got origin feta. The wheelhouse governor''s crews got origin udder, because the governor runs there.\n\n## Ask\n\nA consistent rule for mutations of replicated records, enforced in one place (the resource client or command layer), not per command:\n\n- **Route by default:** a mutating operation (delete, update, patch, operator actions like abandon, complete and force) addressed to a record whose origin is another host is forwarded to that origin, the same way `--host` works today. The result reports where it ran.\n- **Or refuse loudly** where routing isn''t possible (origin offline, partitioned): \"convoy X is a replica on kiwi; its origin is feta (offline). Retry when feta is reachable, or pass `--host feta`.\" Never report success for a write that will be undone.\n- `resource list` / `get` human output should show each record''s origin, so the operator can see it.\n- Audit controller code paths that do local-store lookups for records that may live elsewhere (the #2277 class), and route through the replica-aware view plus origin routing.\n\nTests: an InProcessDaemon two-host scenario where a delete issued on a non-origin host either takes effect at the origin or fails with the named origin, never silently succeeds and reverts.\n\nRelated: #2259, #2277, #1894, ADR 0016 (overlay replication), the Plane-A freeze (this belongs in resource replication, not peer-merge).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2267","id":5644948599,"node_id":"I_kwDORel_088AAAABUHcUdw","number":2267,"title":"Map: crew images as a flotilla-owned resource","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992232,"node_id":"LA_kwDORel_088AAAACtHx-KA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:map","name":"wayfinder:map","color":"6F42C1","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T10:22:31Z","updated_at":"2026-09-30T11:55:03Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":10,"completed":3,"percent_completed":30},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Destination\n\nThe working system: crews get their images from flotilla.\n- Images are composed from layers (base, harness, capability, per-project).\n- Each image is identified by its resolved inputs.\n- Images are built on demand for the architecture of the host that needs them.\n- Harness releases surface for auto-inclusion or operator approval.\n- The ad hoc lab Forgejo CI build (`.forgejo/workflows/crew-image.yml`), the unused arm64 builds, and the hand-edited `CrewImageBaseline` tag are retired.\n\nAn ADR records the model on the way. It is a milestone, not the end.\n\n## Notes\n\n- **This map carries execution** (owner, 2026-09-30). Decision tickets block the build slices they shape. Build slices go to convoys through the normal crew workflow: PR, shepherd, and Robert merges. Anything a build turns up comes back onto the map as a new ticket or as fog. Don''t stop at a plan.\n- **Substrate work.** Follow CLAUDE.md \"Design and Substrate Work\": prefer the considered cut, and no YAGNI reflex.\n- **Stored data (ADR 0047).** `CrewImageBaseline` and the convoy/vessel records that name images are stored data. The replacement must decode the previous generation. Name any out-of-repo authors (the `.flotilla/crew-image-baseline.yaml` manifest).\n- **Other installations are first-class.** Nothing may require our lab Forgejo CI, and a registry-less single-host installation must work.\n- Skills: `/grilling` and `/domain-modeling` for grilling tickets; `/research` for research tickets. Record rulings with an \"ADR carry:\" line.\n- **Starting point:**\n  - `.flotilla/Dockerfile.crew`: monolithic, multi-stage, ordered by change frequency;\n  - `.flotilla/crew-image-baseline.yaml`: a `CrewImageBaseline`, one tag;\n  - `crates/flotilla-controllers/src/reconcilers/vessel.rs`: resolves the baseline through `DefinitionResolver`;\n  - the Plane-A `ensure_image` in `crates/flotilla-core/src/providers/environment/docker.rs`: Dockerfile-hash tags, built per host;\n  - `FulfilmentGrant::Toolchain(String)`, `Gpu` and friends in `crates/flotilla-resources/src/fulfilment_kind.rs`.\n\n## Decisions so far\n\n- [Research: options for composing crew images from independently versioned layers](https://github.com/flotilla-org/flotilla/issues/2268). Digest-pinned chained images in dependency order (base/toolchains → utilities → harness → project), keeping Dockerfiles and Buildx. Look up prior builds by recipe key; the OCI digest is the identity.\n- [Research: inventory the current crew image](https://github.com/flotilla-org/flotilla/issues/2270). 6.0 GB amd64: toolchains 3.5 GB (cached across harness bumps), harness layer 635 MB. arm64 published but unused. Crew Forgejo credential can''t read the registry (401).\n\n- [Research: why the Plane-A on-demand image build rebuilt constantly](https://github.com/flotilla-org/flotilla/issues/2269). A fresh tag and build per ensure, fixed in April by #572. Rule: key images to complete resolved inputs, independent of invocation, checkout or host, and share them across hosts.\n\n## Not yet specified\n\n- **The ADR:** write it once identity, composition, build location, selection and update policy are decided. It becomes a ticket at that point.\n- **Build slices:** the slices beyond the proving slice (the headless display layer). The implementation order depends on the resource shape and the build-location decisions.\n- **Retirement and cutover:** retire `crew-image.yml`, arm64 and hand-editing the baseline. Plan how running crews move from the baseline tag to composed images, and how `CrewImageBaseline` decodes or migrates across one generation.\n- **Garbage collection:** retention and garbage collection of built images and layers on hosts and in any registry.\n\n## Out of scope\n\n- Non-Docker backends, e.g. Fly sprites or VMs, deferred until after the drydock extraction.\n- GPU passthrough: #2260 says to split it out when a ticket needs it.\n- Host-direct environments: the host is the environment, and there is no image.\n- macOS and Windows container images.\n\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2287","id":5645992392,"node_id":"I_kwDORel_088AAAABUIcByA","number":2287,"title":"Wake remote supervisor turn reconciliation from resource watches","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T11:52:20Z","updated_at":"2026-09-30T11:52:31Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2285 review by claude[bot]: https://github.com/flotilla-org/flotilla/pull/2285#issuecomment-5910198850\n\nRemote supervisor turns are consumed by a periodic pass at `controller_resync_interval`. Replication plus the pass can delay delivery and confirmation. Trigger the same idempotent reconciliation when a convoy replica or terminal-session status changes, while keeping the periodic pass as recovery after missed watches or restarts.\n\nKeep the durable pending turn and acknowledgment behavior from #2285. Add a multi-host test that verifies delivery after the relevant watch event without waiting for a full resync interval.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1859","id":5260563715,"node_id":"I_kwDORel_088AAAABOY3VAw","number":1859,"title":"Ownership vs access: convoy-scoped repo attachment and primacy-keyed governor attention","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-26T19:08:59Z","updated_at":"2026-09-30T11:33:45Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Observation (Robert, 2026-08-26)\n\nPre-agent development meant having all the repos checked out and developing on them together. Cross-repo work was frictionless because access wasn''t project-gated. The wheelhouse map effort (wheelhouse#17: nine tickets across four trackers, hand-threaded through per-project governors by the flotilla governor) is the live fixture showing where the current model rubs.\n\nPossible shapes he floated: ad-hoc repo paths added to convoys; more ephemeral projects; more laxity about which repos a project can access. \"Maybe the distinction is which project *owns* a repo path, but it can still get (and its governor should care about) PRs it didn''t decide to do.\"\n\n## What ADR 0020 already gives us\n\nThe ownership/access split exists and is deliberately dull: **primacy** = exactly-one-controller of the Repository (lifecycle, shared infra, default home); **membership claims** = access (any member claim dispatches); **association** = appearance, query-governed. Nothing here needs redesign.\n\n## The two actual gaps\n\n**a) Access is only grantable at standing-project granularity.** A convoy can only touch repos its project claims as members. There is no convoy- or effort-scoped attachment: \"this convoy also gets ~/dev/cleat at pin X\" with credentials via mint-time downscoping (#1792). This is the mechanism half of #1855''s expeditions — an effort borrows repos without the owning projects'' membership lists changing. Ephemeral projects are probably subsumed by expeditions rather than a separate feature.\n\n**b) Governor attention is not wired to primacy.** A PR on an owned repo that arose from another project''s convoy (or a human, or an expedition) should enter the *owning* governor''s attention queue — review duty follows ownership, not convoy origin. Today watcher rows file under the association of what they watch (ADR 0020), which covers appearance but not duty. Touches ADR 0030 (governor entry point) and the demands/attention machinery.\n\n## Relations\n\n- #1855 (efforts/expeditions + operator-seat split) — (a) is its grants half made concrete\n- ADR 0020 (membership, primacy, association), ADR 0030 (governor), #1792 (mint-time downscoped credentials)\n- wheelhouse#17 — the fixture that surfaced this\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1754","id":5235415965,"node_id":"I_kwDORel_088AAAABOA4bnQ","number":1754,"title":"Support Definitions-class CRUD through HTTP/Kubernetes backends","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T13:42:47Z","updated_at":"2026-09-30T11:33:42Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nAfter `WorkflowTemplate` moves to `ReplicationClass::Definitions` in #1747, its `TypedResolver::create`, `update`, and `delete` paths redirect through `DefinitionResolver`. Definition authoring currently requires `ResourceBackend::local_root()`, which rejects `ResourceBackend::Http` with `HTTP backends cannot author definitions`.\n\nAs a result, the real-Kubernetes paths in `crates/flotilla-resources/examples/k8s_crud.rs` and the ignored `k8s_integration.rs::convoy_controller_roundtrip_and_cel_validation` test can no longer perform `WorkflowTemplate` CRUD through `HttpBackend::from_kubeconfig`.\n\nThis is not exercised by normal CI and does not affect #1747''s local/replica reconciler fix, but it conflicts with real Kubernetes as an intended backing-store target.\n\n## Expected\n\nDefinitions-class CRUD should have a supported semantic for a pure HTTP/Kubernetes backend, and the example plus real-cluster integration test should exercise it.\n\n## Context\n\nFound by the final automated review on #1747: https://github.com/flotilla-org/flotilla/pull/1747#issuecomment-5396061143\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1750","id":5234848790,"node_id":"I_kwDORel_088AAAABOAV0Fg","number":1750,"title":"Compact deleted definition records for prepared workflow snapshots","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T12:44:44Z","updated_at":"2026-09-30T11:33:38Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nAfter #1742 moves `WorkflowTemplate` to `ReplicationClass::Definitions`, prepared workflow snapshot GC writes a convergent `$deleted` definition record instead of physically removing the local row. This is correct for fleet convergence and prevents replica resurrection, but every distinct content-addressed `workflow-snapshot-*` spec can leave durable causal state indefinitely.\n\n## Scope\n\nDesign safe compaction for deleted Definitions records once every relevant replica has observed the tombstone (or establish a bounded-retention alternative). This should cover local objects, replica rows, events, and tombstones without allowing an offline root to resurrect a deleted definition.\n\n## Context\n\nRaised during review of #1747. A raw hard-delete bypass in `PreparedSnapshotGarbageCollector` is not safe: another root can still retain and later replay the definition. This requires a definitions-level causal compaction policy rather than a snapshot-specific delete shortcut.","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1928","id":5552130498,"node_id":"I_kwDORel_088AAAABSu7Jwg","number":1928,"title":"Admission-time dispatch decision layer: one context bundle → model, harness, convoy topology, placement; pluggable deciders (static / router / reasoning)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-09-23T10:34:00Z","updated_at":"2026-09-30T11:33:34Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## The cut\n\nDispatch-time choices — which model, which harness/adapter, what convoy topology, which placement, how much review — are today each hardcoded or hand-passed in different ways (capability table for adapter, `--agent` for model, static workflow-template vessel set for topology). They are all the **same kind of thing**: a decision made at convoy admission, from context, that could be static, routed, or reasoned. We should set them up **similarly**, behind one layer, rather than growing a bespoke path per decision.\n\nRobert, 2026-09-23: \"we can use that kind of thing (with the right context about the whole task/fleet/model and harness guidance) decide quite a few things in one shot (convoy topology — ''do we need a windows test vessel''). … we don''t have to decide everything one way (periodically refreshed static dispatch could work fine for some stuff, a fuller reasoning llm maybe needed for more complex ones), but we probably want to set it all up similarly.\"\n\n## Shape\n\nAn **admission-time dispatch decision layer**: given a common **context bundle**, produce a **decision bundle**, via a **pluggable decider** per decision-class.\n\n**Context bundle** (assembled once at admission):\n- Task: issue body/labels, repo(s), change scope, cross-platform/vision/tool needs, prior-attempt outcomes.\n- Fleet: hosts, their OSes, capacity, which adapters/images each offers, current load.\n- Catalog + guidance: available models & harnesses and their guidance (cost/latency/capability), project/governor policy.\n\n**Decision bundle** (some or all, in one shot):\n- Crew **model** per capability — #1927 (governor→fable, code→opus static; Jev-routed later).\n- **Adapter/harness** per capability — generalizes today''s static capability table (code→codex; claude-code when codex pool broken).\n- **Convoy topology** — the vessel set: e.g. add a **Windows/macOS test vessel** when the task needs cross-platform verification, a review vessel, extra coders for a wide task.\n- **Placement policy** — which host/policy per vessel (OS/capability constraints, load).\n- Possibly: review stance, concurrency, retry-escalation.\n\n**Pluggable deciders (one interface, chosen per class / per complexity):**\n- **Static, periodically-refreshed** rules — cheap, deterministic; fine for stable decisions (the per-role model default is this).\n- **Fast router / classifier** — Jev-style (see #1927 comment): well-defined decision space, cheap, fast.\n- **Full reasoning LLM** — for complex/novel topology; plausibly the **governor** itself.\n- Common interface + **fallback chain** (reasoning → router → static floor), so a missing key/decider degrades to a sane default, never a hard fail. Mirrors jev-router''s `JevDecider`-else-`RulesDecider`.\n\n## Why one layer (substrate argument)\n\n- The context bundle is expensive to assemble and identical across decisions — assemble once, decide many.\n- A single decider call can make **jointly-consistent** choices (a Windows test vessel *and* a placement that has a Windows host *and* the right harness there) — separate paths can''t see each other''s choices.\n- Recording is uniform: the workflow snapshot already stores effective adapter/model at admission; extend it to the whole decision bundle for **audit/replay/determinism** (record decider identity + inputs + outputs).\n- Guardrails compose in one place: a decider can''t pick a host without the required OS/adapter, can''t exceed project policy.\n\n## Relationship to existing work\n- **#1927** — model selection — becomes the first decision-class instance (static default = the floor; Jev = the router decider).\n- **Capability table** (adapter selection) — folds in as another class (currently static; see [[feedback_dispatch_engine_from_table]]).\n- **Meta-agents** — this is squarely Quartermaster/Bosun territory (provisioning/topology decisions); see the meta-agent vision. The \"full reasoning decider\" may just be a meta-agent.\n- Adjacent: convoy topology is defined statically by the workflow template today; this makes it a decision.\n\n## Open questions\n- One decision call emitting the whole bundle, vs per-class calls sharing the context? (Lean: one bundle for consistency, but classes can opt into cheaper independent deciders.)\n- Where it lives: admission / a reconciler / a new `DispatchPlan` resource that the convoy admission consumes?\n- Is the governor the reasoning decider, or is it separate middleware the governor invokes?\n- How the decision bundle is represented and recorded (extend the workflow snapshot vs a first-class `DispatchPlan`).\n- Determinism & guardrails: bound the decider to policy; make decisions replayable.\n\n## Not yet\nBrainstorm — this is the framing/cut, not an implementation. First concrete slice is #1927''s static per-role default; topology-as-decision (the Windows-test-vessel case) is the second worth prototyping once the interface exists.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1879","id":5440075581,"node_id":"I_kwDORel_088AAAABRED3PQ","number":1879,"title":"Harness-specific behaviour as one adapter with named aspects, not per-command branching","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-13T12:38:24Z","updated_at":"2026-09-30T11:33:29Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What to design (Brainstorm — grill before building)\n\nPrompted by #1875: a codex background delegate ran `flotilla crew complete` and the daemon could not tell it from the top-level crew session. For codex there is a precise tell (`CODEX_THREAD_ID` on every exec''d command; the thread''s rollout opens with a `subagent.thread_spawn` source), but it is harness-specific, and the same will be true of the next facts crew verbs need from a harness: which session to resume after a premature exit, whether the caller is inside a tool call or between turns, which model/thread produced an artifact.\n\nThe repo already carries two harness-specific seams, both healthy in isolation:\n\n- `HarnessHookParser` (`crates/flotilla-core/src/agents/hooks.rs`) — normalises what a harness *emits* (native hook payloads → `AgentHookEvent`).\n- `AgentMaterialAdapter` (`crates/flotilla-daemon/src/agent_material.rs`) — provisions what a harness *needs* (config home, credentials, skills).\n\nThe risk is a third trait for what a harness *is doing at call time*, then a fourth, each with its own codex/claude/gemini impl and `match harness` branches inside individual commands. Robert''s framing (2026-09-13): harness-specific behaviour across commands needs a single hook-like aspect, not sprawl.\n\nShape to grill:\n\n- **One harness adapter per `AgentHarness`, several named aspects.** The adapter is the unit of registration; aspects are optional capabilities it may implement (material, hook parsing, caller context, session resume). A harness that lacks a tell for an aspect says so explicitly, and the consuming policy treats \"unknown\" as a first-class answer.\n- **Commands consume normalised facts, never harness identity.** A crew verb sees a `CallerContext { harness, session, class: TopLevel | Delegate | Unknown }` resolved once at the boundary where the contained launcher''s call enters the daemon; no command matches on \"codex\".\n- **Where resolution runs.** In the contained launcher (has the caller''s env, can read the rollout under the mounted codex home) versus in the daemon (trusts a context the CLI sends in its envelope). Same trust domain either way, but it decides whether the adapter code lives crew-side or daemon-side.\n- **Which existing seams fold in.** Does `HarnessHookParser` become the \"events\" aspect of the same adapter, and does the material adapter''s `requires_skills_for_prepare`-style policy move with it? Or do the two stay where they are and only the registry is shared?\n- **What the ledger invariant leaves for the hook.** #1875 makes ledger-less completion refusable without any harness knowledge. The harness aspect only improves the *message* and catches delegates that do post a ledger. Decide whether that is worth a resolution path at all, or whether \"unknown\" plus the ledger is the whole answer for non-codex harnesses.\n\nOut of scope: any new harness integration; the design is for how the existing three (codex, claude-code, gemini parser stub) and their aspects are organised.\n\nRelation: #1875 (ledger invariant, codex tell recorded there), #1876 (caller identity at the socket), #1216 (re-engagement / session resume is the next consumer of the same aspect).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1806","id":5245686430,"node_id":"I_kwDORel_088AAAABOKrSng","number":1806,"title":"Release pipeline phase: declarative generation deploys via project-map","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-25T12:12:36Z","updated_at":"2026-09-30T11:33:26Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Parent\n\nADR 0037 (PR #1801) §4 — **direction ruled, design deliberately deferred.**\n\nThe desired fleet generation becomes declared state in project-map; each host reconciles itself toward it (verify via the contract, self-install via the slice-2 handoff, restart, report). Deploy = manifest change; rollback = revert; sleeping hosts catch up on wake.\n\nNeeds its own grill before it becomes a contract: daemon-replacing-itself mechanics, interaction with in-flight crews (blocked on #1795''s restart-survival answer), rollout ordering across hosts, and how non-flotillad hosts (raclette, comte) join.\n\n## Blocked by\n\n- Slice 4 (#1805), #1795\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1806/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2165","id":5612181200,"node_id":"I_kwDORel_088AAAABToMW0A","number":2165,"title":"brainstorm: dehydrated crews, hive off a session and rehydrate it into a new vessel on the next turn","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-28T09:15:14Z","updated_at":"2026-09-30T11:33:22Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Prompt (Robert, 2026-09-28)\n\nRaised alongside #2164 (a live crew session is always ready to act). Later we might want a **dehydrated** state:\n- the session log and any useful temporary state are hived off, and the vessel is released;\n- the crew can be restored into a new vessel;\n- presentation managers show it;\n- adding a new turn either obviously or transparently rehydrates it;\n- it is never a live-but-unable crew.\n\n## What already exists\n\n- **ADR 0028 \"park depth\"** (#1340): warm process → suspended vessel → no vessel with logs archived. It says depth changes delivery latency, never what `Landing` means. It was never built as a lifecycle.\n- **The delivery ladder** (ADR 0028): warm session → adapter resume from the session log → fresh agent with a reconstructed brief. Rehydration is that ladder''s middle rung, run into a new vessel.\n- **ADR 0042 artifacts:** the session log, transcripts and briefs (#2092, briefs as artifacts) are natural artifact kinds for what gets hived off.\n- **ADR 0045:** a dehydrated crew owing an obligation is not stalled if rehydration is its wake. The row''s maker is \"rehydrate on demand\".\n- **ADR 0046:** rehydration is admission-like, so the fresh vessel is placed at least privilege and may land on a different host.\n- **#2164:** a live session is always ready. Dehydration is the only way a crew stops being live without being torn down.\n\n## Questions\n\n- **What gets hived off:** the harness session log (codex and claude resume formats), the workspace delta (uncommitted work, or is the durability fence enough), and scratch state. Is all of it an artifact bundle?\n- **Triggers:** idle past a threshold, capacity pressure (the Quartermaster, #2145), explicit operator action, or convoy park.\n- **Rehydration:** which delivery-ladder rung (adapter resume versus fresh agent with a reconstructed brief), how credentials get staged before the first turn, and what the latency is.\n- **Presentation:** how a dehydrated crew is shown, and whether typing into it transparently rehydrates or needs an explicit action.\n- **Relation to the vessel cache** (ADR 0028) and to warm hulls and primed prefixes (#939).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2165/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633/events","html_url":"https://github.com/flotilla-org/flotilla/issues/633","id":4810973027,"node_id":"I_kwDORel_088AAAABHsGfYw","number":633,"title":"M1: dogfood pass — real workloads, lid-close/reattach acceptance","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863894,"node_id":"LA_kwDORel_088AAAACactFlg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/testing","name":"testing","color":"1D76DB","default":false,"description":"Test coverage and testing infrastructure","archived_at":null,"archived_by":null},{"id":10420764676,"node_id":"LA_kwDORel_088AAAACbSBABA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/cli","name":"cli","color":"0E8A16","default":false,"description":"CLI commands and output formatting","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":8,"created_at":"2026-07-05T00:06:46Z","updated_at":"2026-09-30T11:33:19Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Parent\n#629\n\n## What to build\n(HITL.) Convert real daily sessions to convoy-launched vessels — rdg-dag rebase/ripple sessions, polaris slice maintenance, ordinary coding on flotilla/cleat/porthole/uishell — and run the acceptance test: **start a session from kiwi, close the lid, reattach the same crew from feta**. File every gap found as issues; report the first pass/failure to the portfolio brief channel.\n\n## Acceptance criteria\n- [ ] At least two real workloads running as adopted-vessel convoys for a working day\n- [ ] Lid-close / reattach-from-feta test passed (or failure analyzed + filed)\n- [ ] Cross-host listing verified truthful (including staleness) during the run\n- [ ] Gaps filed; status brief written back to the portfolio\n\n## Blocked by\n- #630\n- #631\n- #632","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/633/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/events","html_url":"https://github.com/flotilla-org/flotilla/issues/346","id":4076988432,"node_id":"I_kwDORel_087zAegQ","number":346,"title":"Add timeout and kill-on-drop support to CommandRunner","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-03-14T23:02:59Z","updated_at":"2026-09-30T11:33:15Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\n`ProcessCommandRunner::run()` uses `Command::output()` which spawns a child without `kill_on_drop`. When a caller wraps the call in `tokio::time::timeout`, the timed-out child process lingers indefinitely — the future is dropped but the child is never killed.\n\nCurrently the Zellij workspace manager works around this with a semaphore (limiting to one outstanding child) and a timeout (so callers give up), but the child itself leaks.\n\n## Proposed solution\n\nAdd optional timeout and kill policy to `CommandRunner`:\n\n- `Command::spawn()` + `child.kill_on_drop(true)` + `child.wait_with_output()` so dropping the future actually kills the child\n- Optional per-call timeout parameter (or a builder/options struct)\n- Migrate `zellij_action` to use the new facility instead of its own `tokio::time::timeout` wrapper\n\nThis would benefit any provider that shells out to potentially unresponsive processes (workspace managers, git operations on slow remotes, etc).\n\n## Context\n\nDiscovered when a deadlocked Zellij server caused `query-tab-names` children to pile up. See PR #340 for the current workaround.","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/346/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101/events","html_url":"https://github.com/flotilla-org/flotilla/issues/101","id":4037364383,"node_id":"I_kwDORel_087wpUqf","number":101,"title":"bug: llvm-cov SIGSEGV with branch coverage caused by async_trait desugaring","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-03-07T04:50:51Z","updated_at":"2026-09-30T11:33:11Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Summary\n\n`llvm-cov show -show-branches=count` crashes with SIGSEGV when processing Rust code compiled with `-Z coverage-options=branch` that uses the `async_trait` crate. The crash is in `llvm::coverage::CoverageMapping::getInstantiationGroups`.\n\nThis is the root cause behind #94 (branch coverage disabled in CI).\n\n## Minimal reproduction\n\n**15 lines of Rust:**\n\n```toml\n# Cargo.toml\n[package]\nname = \"repro\"\nversion = \"0.1.0\"\nedition = \"2021\"\n[dependencies]\nasync-trait = \"0.1\"\n```\n\n```rust\n// src/lib.rs\nuse async_trait::async_trait;\n\n#[async_trait]\ntrait T {\n    async fn f(&self) -> i32;\n}\n\nstruct S;\n\n#[async_trait]\nimpl T for S {\n    async fn f(&self) -> i32 {\n        if true { 1 } else { 0 }\n    }\n}\n```\n\n```bash\ncargo +nightly llvm-cov --html --branch\n# => signal: 11 (SIGSEGV)\n```\n\nA copy of this repro crate is in `bisect-llvm-crash/` in the repo root (not part of the workspace).\n\n## Environment\n\n- rustc 1.96.0-nightly (69370dc4a 2026-03-05)\n- LLVM 22.1.0\n- aarch64-apple-darwin\n- async-trait 0.1.89\n- cargo-llvm-cov 0.6.16\n\n## Root cause\n\n`async_trait` desugars `async fn` into a method returning `Pin<Box<dyn Future + Send + ''_>>`. When this desugared code is compiled with `-Z coverage-options=branch`, the LLVM coverage instrumentation emits branch coverage data that causes `llvm-cov show -show-branches=count` to crash in `getInstantiationGroups()`.\n\n### What crashes\n\n- Any `if`, `if let`, `match`, or other branch inside an `#[async_trait]` method\n\n### What does NOT crash\n\n| Variant | Result |\n|---------|--------|\n| `#[async_trait]` method with no branches (just `42`) | PASS |\n| Native async trait (`async fn` in trait, no macro) | PASS |\n| Inherent async method (not in a trait impl) | PASS |\n| Same code without `--branch` / `-show-branches=count` | PASS |\n\n## Impact on flotilla\n\nEvery provider trait (`Vcs`, `CodeReview`, `CodingAgent`, `IssueTracker`, `AiUtility`, `WorkspaceManager`) and `DaemonHandle` uses `#[async_trait]` for dyn-compatibility. This means branch coverage is unavailable for the entire codebase as long as these traits exist.\n\n## Workarounds\n\n1. **Current:** `--branch` is disabled in CI (see #94)\n2. **Migrate to native async traits** — would require giving up `dyn Trait` or using `trait_variant::make` / manual erased wrappers\n3. **Wait for upstream fix** — this is an LLVM bug in the coverage report renderer\n\n## Upstream reporting\n\nThis should be reported to:\n- **LLVM:** https://github.com/llvm/llvm-project/issues — SIGSEGV in `llvm-cov show` with `-show-branches=count`\n- **Rust:** https://github.com/rust-lang/rust/issues — branch coverage + `async_trait` interaction (the coverage instrumentation emitted by rustc is what confuses llvm-cov)\n- **cargo-llvm-cov:** https://github.com/taiki-e/cargo-llvm-cov/issues — for awareness, though the bug is in LLVM itself\n\nThe repro is pure Rust + one dependency (`async_trait`) and does not require flotilla.\n\n## Bisection notes\n\nThe crash was bisected from the full `flotilla-core` crate (8000+ lines) down to 15 lines through systematic module-level, file-level, function-level, and line-level elimination. The crash exists in multiple independent locations throughout the codebase — anywhere `#[async_trait]` methods contain branches.","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/101/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610/events","html_url":"https://github.com/flotilla-org/flotilla/issues/610","id":4710904968,"node_id":"I_kwDORel_088AAAABGMq0iA","number":610,"title":"tracking: shared view-model + provisioning extraction","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null},{"id":10393671168,"node_id":"LA_kwDORel_088AAAACa4LWAA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/ui","name":"ui","color":"C5DEF5","default":false,"description":"UI/UX and rendering","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-06-21T15:00:58Z","updated_at":"2026-09-30T11:33:08Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Parent\n#604\n\n## What to build\nTracking stub. Extract the ~30% surface-agnostic layer latent in `flotilla-tui` — the **Intent**/action engine (already cleanly separated), a style-agnostic `ColumnSpec` **View Model**, and the data→view-model **Aggregator** pipeline — so TUI / web / uishell are all thin **Surfaces** over it. Also evaluate and (if warranted) extract provisioning onto the **Tender**.\n\nDetail once the resource store + Aggregator API beneath it is stable.\n\n## Acceptance criteria\n- [ ] (stub) Surface-agnostic domain/view-model layer extracted; TUI renders it\n- [ ] Provisioning extraction evaluated against the Tender\n\n## Blocked by\nStable resource store + Aggregator (observer reshape) first.","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/610/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1984","id":5585584667,"node_id":"I_kwDORel_088AAAABTO1CGw","number":1984,"title":"Move crew-image baseline pin + placement-policy instances to project-map reconcile model","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null},{"id":11617992378,"node_id":"LA_kwDORel_088AAAACtHx-ug","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:task","name":"wayfinder:task","color":"D93F0B","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-25T16:31:42Z","updated_at":"2026-09-30T11:27:45Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":2,"total_blocked_by":2,"blocking":0,"total_blocking":0},"body":"The `CrewImageBaseline` pin (`.flotilla/crew-image-baseline.yaml` → `spec.image`) and the crew-image `PlacementPolicy` instances are **operational deployment state**, but they live in the flotilla source tree and are updated by hand-editing the source file + a one-shot `flotilla resource apply` + a source-repo PR to keep the committed copy in sync. That''s the wrong model, and it produces a live-vs-committed skew (the source file can drift from the live Definition and become a stale-revert landmine).\n\n**Precedent to adopt:** the credential specs/grants, project declarations, and repository declarations already live in `project-map/flotilla-manifests/` and reconcile onto the control plane via the `manifest-source: https://forgejo.lab.flotilla.work/robert/project-map` annotation. That''s a single source of truth: a change is a commit in project-map; the daemon converges the federated resource. The `CrewImageBaseline` (verified: no manifest-source, bare `operator` one-shot apply) and the `PlacementPolicy` instances are the conspicuous exceptions.\n\n## The cut\n- **Stays in flotilla (code):** `Dockerfile.crew` (recipe), `.forgejo/workflows/crew-image.yml` (build), the `CrewImageBaseline`/`PlacementPolicy` *types*.\n- **Moves to `project-map/flotilla-manifests/` (ops state), under the manifest-source reconcile model:** the baseline pin (`crew-image-baseline.json`) and the crew-image placement-policy instances (which carry `host_ref` deployment bindings). A routine image bump becomes: build → edit the pin in project-map → reconcile applies + federates. No flotilla PR, no skew.\n- Remove `.flotilla/crew-image-baseline.yaml` and `.flotilla/placement-policy.crew-image*.yaml` from flotilla once the reconcile path is authoritative.\n- Fix `docs/crew-image.md`, which currently instructs \"commit the new pin\" *to flotilla* — that guidance inverts once the pin lives in the reconcile path.\n\n## To verify during implementation\n- Whether the project-map reconcile **auto-discovers a new manifest file** in `flotilla-manifests/` or needs explicit registration.\n- Whether #1947 wired anything to read the flotilla-source baseline copy at startup (must not depend on the removed file).\n\n## Acceptance\n- Bumping the live crew image is a single commit in project-map; the fleet converges with no flotilla source change and no `resource apply` by hand.\n- The `CrewImageBaseline` and crew-image `PlacementPolicy` resources carry `manifest-source: …/project-map` like the credential grants.\n- No crew-image pin remains in the flotilla source tree; docs updated.\n\n## Refs\n#1947 (crew-image-baseline Definition — introduced it in `.flotilla/`), and the credential-grant manifests in project-map as the model to mirror.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1984/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/events","html_url":"https://github.com/flotilla-org/flotilla/issues/742","id":4883287603,"node_id":"I_kwDORel_088AAAABIxEOMw","number":742,"title":"ADR 0016 residue: delete the FleetReplicaSnapshot broadcast path (9 call sites)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-07-14T13:01:30Z","updated_at":"2026-09-30T11:25:06Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"## Goal\n\nFinish ADR 0016: overlay replication is the mechanism, so retire the `FleetReplicaSnapshot` path (the SSH-fetched per-host snapshot and its broadcast).\n\n## Why this takes two steps (re-scoped 2026-09-30)\n\n- It''s larger than \"nine call sites\". There are about 47 references across `flotilla-core` (`fleet.rs` has 17, plus `in_process.rs`, `executor.rs`), `flotilla-daemon` (`aggregator.rs`), `flotilla-protocol` (`commands.rs`, `query.rs`, `lib.rs`) and `flotilla-tui` (`app/executor.rs`, `cli.rs`).\n- It has a **live consumer**. `flotilla fleet` health and list, and the TUI fleet surfaces, read these snapshots. A straight deletion would stop at the escalation rule.\n- `fleet.rs` is the `FleetService` extracted in #2215. Under ruling 1 of #2212 it is a named service pending the Tender extraction (#1861). Removing it also removes an SSH consumer before the Tender cut.\n\n## What to do\n\n1. **Move the fleet view onto replicated Host resources.** `flotilla fleet health` / `list` and the TUI fleet surfaces read replicated `Host` records (status, facts, heartbeat, daemon generation), not SSH snapshots. Add to Host status anything the view shows that replication doesn''t already carry, keeping its stored shape additive (ADR 0047). Keep the fleet view''s current contract: disagreements are shown, not collapsed (ADR 0023).\n2. **Delete `FleetReplicaSnapshot`**, its SSH fetch, its broadcast and cache in `FleetService`, and its protocol variants. Wire formats change freely.\n\nStandard deletion-contract escalation rule: an unexpected live consumer is an escalation (stop that piece, report it here, deliver the rest), never a re-homing done without asking.\n\n## Acceptance\n\n- [ ] `flotilla fleet health` / `list` output is unchanged in content, sourced from replicated Hosts, with a test over an in-memory multi-host backend.\n- [ ] No `FleetReplicaSnapshot` references remain, or every surviving site is escalated here by name.\n- [ ] Replication behaviour is covered by the existing overlay and convergence tests, unchanged.\n\n## Depends on\n\n#2236 (tighten FleetService cache access and refresh work) lands first, because it''s the same code.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/742/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1861","id":5439433983,"node_id":"I_kwDORel_088AAAABRDcs_w","number":1861,"title":"Map: Tender contract and extraction path","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992232,"node_id":"LA_kwDORel_088AAAACtHx-KA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:map","name":"wayfinder:map","color":"6F42C1","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-13T10:09:27Z","updated_at":"2026-09-30T11:22:41Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":7,"completed":7,"percent_completed":100},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/608","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Destination\n\nAn implementation-ready Tender contract and extraction sequence, with exact initial implementation slices sufficient to prove existing-service forwarding, scoped container publication, and access through a configured intermediary. Implementation itself follows this map.\n\n## Notes\n\nPlanning map for [Extract the Tender](https://github.com/flotilla-org/flotilla/issues/608). Use wayfinder, codebase-design, and no-ai-slop; use grilling and domain-modeling for conversational decisions. Follow `docs/agents/issue-tracker.md` for claims, convoy dispatch, and governor settlement. Charting resolves no design ticket.\n\nThe September conversation and `docs/architecture/tender.md` are provisional inputs, not ratified decisions. The draft is currently an uncommitted local artifact in `/Users/robert/dev/flotilla`; tickets must be self-contained and must not depend on that path being present in a crew checkout.\n\nWorking baseline:\n- Per-user Tender instances, with dedicated service users on always-on machines. Instance identity differs from machine location.\n- Publish existing endpoints; discover permitted publications; open a stream or expose a stable local endpoint. Unix sockets and Windows named pipes are local adapters.\n- Applications retain their own object directories and protocol recovery. Cleat need not depend on Tender; preparation to make cleat an ideal ordinary service is allowed.\n- Container helpers publish outward with narrowly scoped grants. Explicit intermediaries support roaming publishers. Publication permission differs from browse/connect permission; trusted groups are a provisional convenience policy.\n- Identity, display name, and route are separate. Disconnect means unavailable, not withdrawn; broken streams are not replayed. Reconnect restores reachability.\n- Preserve daemonless remote execution: a local cleat session can run SSH into an ephemeral or locked-down target with no remote Tender/Flotilla. This does not promise remote process survival after SSH loss. Special sandbox integration is not an initial deliverable.\n- Stay independent of Flotilla domain types. Preserve the roadmap''s workspace-first, consumer-proven extraction and peer-layer freeze.\n- **Extraction is workspace-first; crews cannot create repos.** Tender begins as a crate in the flotilla workspace (extracted from the peer/transport layer), consumer-proven in-repo (prepared cleat, then porthole HTTP control). The split to a dedicated Tender repo is a later **operator** milestone (create repo, seed history, register Project + credential), never a crew slice — crew credentials carry only `contents`/`pull_requests` on existing repos, not `administration`. This constrains #1868: initial slices are in-workspace crate work with in-repo consumers; repo creation is an operator milestone, not a crew acceptance criterion.\n\n## Decisions so far\n\n- [Investigate ordinary-service forwarding contracts for Tender](https://github.com/flotilla-org/flotilla/issues/1862) — ordinary ordered byte forwarding is the first data-plane contract (SSH stream-local forwarding as initial transport; Unix sockets/named pipes as adapters); Tender owns identity, discovery, grants, stable names, lifecycle, diagnostics and byte-pump rules, never cleat spawn/cleanup; prove with prepared cleat, then porthole HTTP control; porthole capture transfer is out of reach of a plain forward. Ten open questions feed #1866–#1868.\n- [Establish Tender instance identity and bootstrap trust](https://github.com/flotilla-org/flotilla/issues/1863) — instance identity = a self-minted persisted keypair (fingerprint is the identity), distinct from SSH host key, OS account, machine, and Flotilla NodeId; per-user and location-independent, replaced only by explicit key assignment. Two layers: SSH authenticates transport (reuses ~/.ssh, ProxyJump), the Tender handshake authenticates the instance via a pinned fingerprint — SSH success alone never trusts an instance. Enrolment = a command taking an SSH destination + pasted fingerprint (`tender id` prints it); explicit pin default, TOFU optional. Daemonless `ssh <cmd>` bypasses Tender entirely. Jump host = pure transport; intermediary = a pinned instance (authority in #1864). Handshake is transport-independent.\n- [Define publication grants and intermediary authority](https://github.com/flotilla-org/flotilla/issues/1864) — three host-enforced capabilities (publish grant-gated; browse/connect trusted-group-gated), keyed on the caller''s pinned instance identity, default deny; the host enforces so publishers can''t widen audience and a scoped container grant can''t browse or open parent sockets. Grants bind grantee (ephemeral helper mints a startup key), namespace scope, a max-audience ceiling the host clamps to, a short expiry, and revocation. An intermediary is a pinned relay only, not a bypass; caller identity is authenticated end-to-end through it (never intermediary-asserted) and it''s explicitly trusted with plaintext. New connects block on expiry/revocation immediately; open streams run-to-close on expiry, tear down on revocation; revocation is best-effort/eventually-consistent, expiry-bounded. Tender access is a hard wall from application permission (porthole/cleat auth independently).\n- [Define publication identity and lifetime across failures](https://github.com/flotilla-org/flotilla/issues/1865) — a publication has its own stable host-assigned identity in the granted namespace, separate from mutable display name and from route; remembered metadata is never reachability; the local exposure binds to identity and is never silently substituted. Three states: Available; Unavailable (disconnect ≠ withdrawal — identity reserved and reclaimable); Withdrawn (explicit/expiry — identity retired). At most one live publisher (incumbent wins); reclaim needs authorization and stamps a new observable generation; container-replacement continuity is an explicit provisioner assignment, never name reuse. Restart remembers identities not routes (publications return Unavailable); reserved identities are retained then GC''d to Withdrawn, bounded by grant expiry; consumer exposures persist their identity binding; streams never replayed.\n\n- [Choose Tender stream and local-endpoint contracts](https://github.com/flotilla-org/flotilla/issues/1866) — **out-of-band control over a raw byte pipe** (no bytes ever injected into the data phase; failures are structural close, reason only in diagnostics); one connection = one transport channel, **reusing the transport''s native mux + per-stream flow control** (SSH channels now; contract stated as required capabilities; Tender''s own mux not precluded later); session-level pinned-fingerprint handshake (#1863) once + per-connection publication/#1864-grant preamble before the channel goes raw; proxy may accept locally then prompt-close on remote-open failure; **consumer-owned, identity-named local endpoint** (Unix socket / Windows pipe) that persists-but-dead across Unavailable and is never silently repointed; bounded connect deadline but **no idle timeout on established raw streams**, cooperative cancel, expiry-grandfathers / revocation-force-closes; **zero mandatory service prep** (ordinary services published unaware — no Tender import ever) with optional hygiene; out-of-band `tender` diagnostics surface. Feeds #1867/#1868.\n- [Choose Flotilla integration + preserve daemonless targets](https://github.com/flotilla-org/flotilla/issues/1867) — **the extraction seam**: BELOW→Tender (ssh stream-local forwarding + connection lifecycle + host-direct exec, re-typed off `PeerWireMessage` onto a raw byte pipe + generic handshake); **RETIRE** `manager.rs`''s overlay router (route table / TTL hop-forwarding / `RouteAdvertisement` gossip — dies with the peer layer, NOT a Tender feature); ABOVE→Flotilla (resource replication, domain command routing, topology, container/env exec, wire types). Relay = explicitly-configured/pinned intermediaries only (agent-settable at runtime, no route-flapping; roaming-kiwi→udder-via-Tailscale = pinned intermediary #1864), never a dynamic learned router. Daemonless: execution-target (ssh, no remote Tender) is first-class; **local-side publication for own routes, participating remote Tender for shared** (line = whose identity vouches). Load-bearing migration seam = resource replication already isolated behind `SocketPathSource`; peer transport deletes only after replication + generation-signal + routed-exec + topology rehome to federation. 4 runtime-experiment candidates feed #1868.\n\n- [Select Tender initial implementation slices + proof gates](https://github.com/flotilla-org/flotilla/issues/1868) — **initial dispatchable set**: slice 1 = new `crates/tender` (stream/publication interface + in-memory adapters + full contract suite; greenfield, no extraction) gated on contracts-green ([#2011](https://github.com/flotilla-org/flotilla/issues/2011), dispatched); a parallel throwaway spike proving raw ssh-forward carries bytes + replication rides a `SocketPathSource`-supplied endpoint ([#2012](https://github.com/flotilla-org/flotilla/issues/2012), dispatched); then slice 2 = publish a real cleat endpoint over ssh (first real adapter + the below-seam extraction) gated on cleat-speaks-through-the-exposure + survives-interruption. Later: container/intermediary publication, Flotilla-consumes-the-interface, second-app + Unix/Windows adapters, repo promotion only after consumers prove the seam. Workspace-first (crate, not repo).\n\n## Not yet specified\n\nThe exact package split and implementation task granularity depend on the service and transport contracts. Additional proof artifacts may become necessary where source evidence leaves behaviour uncertain. Those investigations will be charted when the missing evidence is identifiable.\n\n## Out of scope\n\nBuilding or deploying Tender; wholesale cleat redesign or a combined session browser; new cloud-sandbox integrations; automatic arbitrary topology; implementation of future HTTPS/WireGuard/DNS discovery; enterprise policy design; cross-host shared-memory/capture transport. Preserve appropriate seams and compatibility without turning these into initial deliverables.\n\n\n\n\n\n\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1861/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1951","id":5560085095,"node_id":"I_kwDORel_088AAAABS2gqZw","number":1951,"title":"brainstorm: permanent records vs live resources: what outlives reap, and where it lives (flotilla store, git-meta, dual-write)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":4,"created_at":"2026-09-23T22:02:07Z","updated_at":"2026-09-30T11:20:26Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## The question (reframed by the owner, 2026-09-30)\n\nFlotilla has a good model for **live resources**: desired and observed state, reconcilers, replication, and reap. It has no model for **permanent records**, meaning what should outlive the live resource and where that record lives. Today:\n\n- **Convoy records are thrown away when reaped.** The history of which work happened, who dispatched it, what was admitted, what it produced and how it settled disappears with the resource. We may well want to keep it.\n- **Decision ledgers** are now `decision-ledger` artifacts (ADR 0042/0043) in flotilla''s tiered blob store, with a PR-comment projection. The owner''s original intent for artifacts was **temporary evidence** (screenshots, recordings, build output), so it''s an open question whether a durable record belongs there.\n- **Nothing links code back to the work that produced it.** From a commit (after a squash merge) there''s no way to reach its convoy, change request and ledger.\n\nDesign a consistent model:\n\n1. **Record classes:** what is live state, what is evidence (retention-bound, disposable), and what is a permanent record (convoy history, decision ledgers, settlement outcomes, provenance)? Is a \"record\" a snapshot of a resource taken at reap, or a separate append-only kind?\n2. **Storage sinks, possibly several per record:**\n   - the flotilla store / artifact blob store;\n   - **git-meta (`refs/meta/*`)**, which *stays with the code*, travels with clones and survives flotilla''s own store;\n   - dual-write, or a per-project or per-kind choice. What is authoritative when there are two?\n3. **Keys:** convoy id as the stable change key. Post-merge, the control plane stamps the now-stable squash commit with the convoy id and ledger link (owner ruling, 2026-09-23: stamp after the merge, never trailers pushed through the squash). This is a control-plane action, not a crew action.\n4. **Read paths:** \"explain this commit\" (commit → convoy, change request, ledger), the PM sidebar (#1899), and history views of reaped convoys.\n5. **Retention and size:** logs and recordings are large (git-meta promisor fetch helps). Also who may write records (the crew-authorization boundary).\n\nGrill this before any build. Likely output: an ADR on record classes and sinks, plus enactment tickets (keep convoy records at reap, stamp the squash commit, implement a git-meta sink).\n\nSuperseded sub-question: the *interim* ghostty-ops convoy-keyed ledger (#1968) is closed. The decision-ledger artifact already gives PR-less convoys a durable home in the meantime.\n\n---\n\n## Original brainstorm (2026-09-23): git-meta as the ledger home\n\n## Problem\nCrew **decision ledgers** are currently posted as **PR comments**, and convoy/agent logs live in convoy status / ad hoc. After a **squash merge**, the ledger is effectively lost — buried in the comments of a merged PR, not discoverable from the code, the merged commit, or history. Robert: \"the decision ledger which is getting a bit lost currently in the PR comments of merged PRs.\" Same discoverability gap for agent/convoy logs and provenance.\n\n## Candidate: git-meta (https://git-meta.com/)\n\"A more performant, scalable, flexible and collaborative `git notes`.\" Structured, typed metadata stored as commits on **`refs/meta/*`** branches, exchanged by ordinary `git push`/`fetch` (no special server). Targets: **commits, branches, paths, change-IDs, or whole projects**. Typed values (strings/lists/sets) with deterministic merge; promisor-remote scale; metadata clones on-demand so code clones stay light. Designed for exactly our use cases — AI provenance, review status, attestations, logs.\n\n## The squash question (Robert''s open question: \"link through PR number or some other indirection?\")\nGitHub squash-merge **discards the crew''s branch commits and their SHAs** and mints a new squash commit on `main` (auto-suffixed `(#NNNN)`). So metadata keyed by a **pre-squash commit SHA is lost**. Resolution:\n- **Primary key = the convoy id (a stable change-ID).** Flotilla already mints `convoy-<id>` *before* the PR exists and it names the unit of work end-to-end. git-meta''s **change-ID / project targets** are made for this. Attach the decision ledger + convoy/agent logs to the convoy-id, not to commit SHAs → survives squash by construction.\n- **Record the convoy-id (and PR number) as a trailer in the squash commit** so the merged history points back to the metadata. PR number (`(#NNNN)`) is the *secondary*, GitHub-side indirection; convoy-id is the primary, flotilla-side key. Either resolves squash-commit → ledger.\n- This **unifies decision ledger + convoy/agent logs + provenance under one key** (the convoy = the change unit), instead of scattering them across PR comments and status blobs.\n\n## To decide (why this is a Brainstorm)\n- Where `refs/meta/*` lives / is authoritative (lab Forgejo vs GitHub vs both) and how it federates alongside our existing git infra.\n- Whether to also emit a stable change-ID trailer into crew commits (belt-and-suspenders) vs. rely solely on convoy-id.\n- Retention/size (logs can be large — promisor on-demand fetch helps) and who writes it (crew vs control-plane, given the #NNNN self-scuttle/authorization boundary — see the crew-authorization brainstorm).\n- Read path: surfacing a merged commit''s ledger in the TUI / PM sidebar (#1899) by resolving convoy-id → git-meta.\n\n## Refs\ngit-meta.com. Decision ledger in convoy status (`crates/flotilla-resources/src/convoy.rs`, `runtime.rs`), PM sidebar facts #1899, decision-layer #1928. Later work — capturing the approach + the squash resolution now.\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1951/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1186","id":4996424110,"node_id":"I_kwDORel_088AAAABKc9hrg","number":1186,"title":"Agentless SSH-only hosts as host-direct placement targets (Plane B)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-07-28T08:11:23Z","updated_at":"2026-09-30T11:11:42Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Goal\n\nMake an **SSH-only host** (comte, beaufort, brie, and similar) a **host-direct placement target**, so a crew can run directly on it (for example GUI and RAD work driving porthole) without a flotillad on that host.\n\n## Rulings this builds on (Map: host-direct crews on GUI-capable remote hosts, #1996, closed as decided)\n\n- **Transport and placement model (#2003):** this is not a new resource kind. It''s \"a contained/docker placement minus the container provisioning\". An SSH-only host is a `Host` with an agentless, SSH-reachable, host-direct-only profile. It reuses the existing Host and PlacementPolicy machinery, and the same vessel, checkout, terminal-pool and crew machinery, run directly on the host over the existing SSH transport. The crew runs as the GUI-session user; a dedicated user can come later.\n- **Ownership:** the host is **not a mesh peer**. Its *owning daemon* reaches it by direct SSH and drives actuation remotely. That avoids the peer command-routing gap (#2008). Health is probed, not self-reported: no store and no heartbeat.\n- **GUI:** porthole is the GUI-session, capture and auth substrate (#1997, #2002). The crew drives the host''s ambient porthole through its local per-uid socket with a porthole token or grant. Don''t reimplement porthole. Keep crew *session launch* (porthole → cleat-in-session) possible, but don''t build it (#2001 deferred).\n- **What exists today (#2000):** `RemoteHostConfig` and `ssh_destination` read a remote daemon''s replica snapshot and are *not* an agentless host. No SSH-only host-direct placement target exists yet.\n\n## To build\n\n1. An agentless `Host` profile: SSH endpoint, identity, owning daemon, and probed health and capability facts, including `gui_session` from porthole where present.\n2. Placement: agentless hosts are placeable with their reduced facts. Fulfilment kinds for them are host-direct only, and admission refuses needs they can''t meet.\n3. Actuation: the owning daemon provisions the checkout, terminal pool and crew on the host over SSH, through the injected `CommandRunner` and remote runner, never `std::process` directly.\n4. Tests: an `InProcessDaemon` scenario with a fake SSH runner, where a convoy placed on an agentless host provisions and starts its crew through the owning daemon.\n\n## Later (out of scope here)\n\n- Sandboxing parts of a crew with a porthole tunnel.\n- The concrete per-platform build → drive-UI → screenshot/video acceptance loop.\n- Multi-host fan-out and orchestration (#1394, #1928, #658).\n- A full per-platform flotillad port (macOS medium, Windows large).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1186/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2281","id":5645076882,"node_id":"I_kwDORel_088AAAABUHkJkg","number":2281,"title":"Add timestamped outgoing patch recording to pm connect for Andamento replay","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:34:05Z","updated_at":"2026-09-30T10:34:05Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Counterpart to flotilla-org/andamento#106 (record-and-replay harness). The outgoing tap belongs in `crates/flotilla-tui/src/pm_connect.rs::send_patches`, shared by `ConnectState::rebuild` diffs and `reassert` TTL heartbeats. Andamento''s scoped crew cannot deliver Flotilla code.\n\nAdd an opt-in `flotilla pm connect --record PATH` tap at that boundary, before transport delivery. Write one flushed JSON object per outgoing patch:\n\n```json\n{\"offset_ms\":0,\"patch\":{\"type\":\"metadata-patch\",\"target\":{\"kind\":\"entity\",\"value\":{\"kind\":\"role\",\"id\":\"example\"}},\"source_id\":\"flotilla-connector\",\"set\":{},\"unset\":[]}}\n```\n\nUse elapsed monotonic milliseconds from connector startup (nondecreasing; equal timestamps preserve send order), preserve complete wire patches including TTL, ordinal, source, precedence and unsets. Include initial snapshots, incremental updates, refresh heartbeats, reconnects and removals. Recording failures must be visible and must not silently produce a purported complete capture. Specify whether a send failure remains recorded (recommended: yes, this is the outgoing stream).\n\nAndamento supplies a Rust JSONL parser, monotonic recorder utility/CLI and stepped/real-time replay, with a scripted role roll generated by the pinned real manifest projection. No running fleet recording is available to that crew. Capture a real fleet roll with hold/re-admission and attempt handover, redact before checking it in, and attach the capture to andamento#105 for role-placement regression coverage. Wire the connector tap here; do not make Andamento core depend on Flotilla.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2281/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2280","id":5645053129,"node_id":"I_kwDORel_088AAAABUHisyQ","number":2280,"title":"Teardown gate refuses a merged, clean convoy: squash-merge with deleted branch reads Pushed=False, untouched siblings read N commits beyond a stale local main","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:31:54Z","updated_at":"2026-09-30T10:31:54Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\n`flotilla convoy delete precise-scrolling-2` (convoy-3dfae654280a46008e5ce2f803aebe26, wheelhouse#116, PR wheelhouse#127) refused with:\n\n```\ncheckout-…-andamento-b5b83c3195e5: Landed=False (no change request exists; 48 commits beyond main)\ncheckout-…-cleat-b5b83c3195e5:     Landed=False (no change request exists; 62 commits beyond main)\ncheckout-…-wheelhouse-b5b83c3195e5: Pushed=False (2 unpushed commits)\n```\n\nVerified state at 2026-09-30T10:30Z:\n\n- wheelhouse: PR #127 squash-merged at 09:45:43Z (merge commit `3842785`, PR commits `8515df9`, `ae226a3`); GitHub deleted `wheelhouse/precise-scroll-2` on merge. The checkout resource itself records `landed: true, PR #127 merged` and `pushed: false, 2 unpushed commits` at the same instant. This is the squash-merge case #1397 closed, with the extra twist that the remote branch is gone so nothing can ever become \"pushed\".\n- andamento: checkout at `389dccc`, which is `origin/main` HEAD; branch never touched. Reported as 48 commits beyond main.\n- cleat: checkout at `e233d6d`, which is `origin/main` HEAD; branch never touched. Reported as 62 commits beyond main.\n\nSo the sibling comparison is against a stale local `main` in the feta host clones (`clone-l3emp082…`, `clone-i2jica0u…`), not against the remote default branch. This is the untouched-secondary-checkout case #1154 and #1988 closed.\n\n## Why it matters\n\nBoth closed fixes have regressed or have a path they do not cover (branch deleted on merge; host clone main never fast-forwarded). The result is the charter''s worst case: a merged, clean, fully settled convoy that the gate will refuse forever, and the only exits are `--force` or hand-repair on the placement host. The governor cannot reach feta''s clones to fast-forward main.\n\n## Ask\n\n- Pushed: when the checkout''s change request is `merged` and the branch is clean, treat Pushed as satisfied by landing, regardless of remote-branch existence or squash shape.\n- Landed for untouched checkouts: compare against the remote default branch (fetch `origin/<base_ref>`) or against the checkout''s recorded base commit at creation, never against the host clone''s local `main`.\n- Fast-forward or ignore the host clone''s local `main` when creating worktrees so it cannot drift 48 commits behind.\n- Regression tests for both, using a squash-merge with branch auto-delete and a multi-repo convoy with untouched siblings on a stale clone.\n\nFiled by the wheelhouse standing governor. Related: #1397, #1154, #1988, #2278 (same convoy''s ledger projection failure), #2277.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2280/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2260","id":5644497651,"node_id":"I_kwDORel_088AAAABUHAy8w","number":2260,"title":"Crew image: bake a headless X11 display and software GL, advertise it as a fulfilment grant","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null},{"id":11617833324,"node_id":"LA_kwDORel_088AAAACtHoRbA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/needs-triage","name":"needs-triage","color":"e4e669","default":false,"description":"Maintainer needs to evaluate this issue","archived_at":null,"archived_by":null},{"id":11617992378,"node_id":"LA_kwDORel_088AAAACtHx-ug","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:task","name":"wayfinder:task","color":"D93F0B","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T09:46:39Z","updated_at":"2026-09-30T10:24:01Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015454,"node_id":"IT_kwDOEBMoCM4B6IRe","name":"Feature","description":"A request, idea, or new functionality","color":"blue","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":3,"total_blocked_by":3,"blocking":0,"total_blocking":0},"body":"## Problem\n\nWheelhouse is a native GUI application whose verification is a set of `--*_diagnostics` runs that need a display and a GL context. CI runs them under `xvfb-run` with `LIBGL_ALWAYS_SOFTWARE=1` (Mesa llvmpipe). The docker crew image advertises no display grant, so every crew that needs to run or investigate the GUI installs the same packages itself, and the repo''s `tools/run-linux-opengl-terminal-glyph-diagnostics.sh` spins up a throwaway container and apt-installs them on every run. The wheelhouse governor is about to dispatch several GUI investigations (drawing at pixel boundaries, sidebar button overflow, role placement) and each crew would repeat that setup. That is the \"same trap, every convoy\" pattern the charter says to fix at the source.\n\n## What to build\n\n1. Bake a headless display into the Linux crew image: `xvfb`, `xauth`, Mesa with llvmpipe (`libgl1-mesa-dri`, `libegl1`, `libgl1-mesa-dev`, `libegl1-mesa-dev`), `libx11-dev`, `libxext-dev`, `libfreetype6-dev`, `pkg-config`, `clang`. Match the package list in wheelhouse `.github/workflows/build.yml`, Linux job.\n2. Advertise it as a fulfilment grant (for example `display:headless-x11`) so a brief can name the need and admission can refuse a host that lacks it, the same way `gui_session` works for host-direct kinds.\n3. Set `LIBGL_ALWAYS_SOFTWARE=1` in the vessel environment when the grant is present, so software GL is the default and deterministic.\n4. Document in the crew brief that the display is headless and software-rendered, and that native acceptance stays pending.\n\nWheelhouse is X11 only (Xlib with GLX or EGL, OpenGL 3.3 core), so no Wayland compositor is needed; llvmpipe implements the profile fully.\n\n## Later, separate decision: GPU passthrough\n\nSome investigations (preview rebuild cost wheelhouse#103, blur regression coverage wheelhouse#41, cursor flicker wheelhouse#75) need a real GPU. On a Linux host with Intel or AMD graphics that is `--device /dev/dri` plus the render group; NVIDIA needs the container toolkit. Model it as an opt-in grant (for example `gpu:dri`) requested with `--need`, never the default, because it shares the operator''s GPU with their desktop session and makes pixel output non-deterministic. Not needed for any currently open wheelhouse issue; record the design here and split it out when a ticket needs it.\n\n## Acceptance criteria\n\n- [ ] A fresh crew vessel on the docker crew image runs `xvfb-run -a ./build/wheelhouse --sidebar_diagnostics` with no package installation.\n- [ ] `flotilla fulfilment list` shows the display grant on the docker crew kinds.\n- [ ] A brief with the need is refused on a kind without the grant, with the grant named.\n- [ ] `tools/run-linux-opengl-terminal-glyph-diagnostics.sh` in wheelhouse can drop its apt step when run on the crew image (follow-up on wheelhouse).\n\n## Related\n\nwheelhouse#116 (first crew that had to set this up), flotilla-org/flotilla#2258 (crew credential cannot push workflow edits, which is why CI wiring for new diagnostics is currently hand-applied).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2260/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2275","id":5644957817,"node_id":"I_kwDORel_088AAAABUHc4eQ","number":2275,"title":"Decide how per-project image layers are authored and trusted","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:23:20Z","updated_at":"2026-09-30T10:23:20Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":2,"total_blocked_by":2,"blocking":0,"total_blocking":0},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nHow are per-project layers authored and trusted?\n\n- **Authoring:** where a project declares its layer, for example a file under the project repo''s `.flotilla/`, or a project-map manifest.\n- **Pinning:** which revision a build uses.\n- **Trust:** project-authored build steps run on a fleet host. What sandboxing, network and credential scope does such a build get, and who approves a new or changed project layer?\n- **Relationship to the shared base:** what a project may add, and whether it may replace anything.\n- **First consumer:** wheelhouse''s GUI build dependencies (libx11-dev, freetype, and so on, from #2260).\n\nGrilling ticket (HITL), resolved in session with the owner.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2275/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2274","id":5644957469,"node_id":"I_kwDORel_088AAAABUHc3HQ","number":2274,"title":"Decide how harness and toolchain updates are noticed and adopted","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:23:18Z","updated_at":"2026-09-30T10:23:18Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":1,"blocking":0,"total_blocking":0},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nHow are harness and toolchain updates noticed and adopted?\n\n- **Noticing:** polling npm and GitHub releases for codex, claude-code, tea and cleat. Where does the poller run, and what state does it keep?\n- **Adoption:** per-input policy, either auto-include or raise an attention item for operator approval. Is rollback just re-selecting the previous pin?\n- **Running work:** interaction with running convoys. Does the image stay frozen at admission, and do standing governors pick up a new image only when re-admitted?\n- **Observed versions:** reconcile with the harness version facts hosts already report (`codex 0.157.1`, `claude-code 2.1.283` in `flotilla host list`) and with the harness minimum-version need.\n\nGrilling ticket (HITL), resolved in session with the owner.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2274/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2273","id":5644957211,"node_id":"I_kwDORel_088AAAABUHc2Gw","number":2273,"title":"Decide how a brief''s needs select a composed image and relate to fulfilment kinds","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:23:17Z","updated_at":"2026-09-30T10:23:17Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":1,"blocking":2,"total_blocking":2},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nHow does a brief''s needs select an image, and how does that relate to fulfilment kinds?\n\n- **Mapping:** how `--need` and issue-label needs (for example `toolchain:headless-x11`, a harness plus its minimum version) map to layers.\n- **Advertising:** does a fulfilment kind advertise what it has already built, or what it can build? Does admission refuse or wait when a needed layer isn''t built?\n- **Grants:** do we reuse the `FulfilmentGrant::Toolchain(String)` vocabulary or add variants (a stored-shape change under ADR 0047)?\n- **Isolation:** one composed image per distinct need-set, or a superset image? What stops the number of distinct images exploding?\n- **Runtime environment:** where vessel environment tied to a layer, such as `LIBGL_ALWAYS_SOFTWARE=1` for the display layer, is declared.\n\nGrilling ticket (HITL), resolved in session with the owner.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2273/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2272","id":5644956974,"node_id":"I_kwDORel_088AAAABUHc1Lg","number":2272,"title":"Decide where crew images are built, who triggers builds, and where results are cached","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:23:16Z","updated_at":"2026-09-30T10:23:16Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":2,"blocking":2,"total_blocking":2},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nWhere do images get built, who triggers a build, and where are the results cached?\n\n- **Build location:** the placement host builds for its own architecture, or a builder host does, or both depending on capacity. Udder has 4 GB and doesn''t take Rust crews.\n- **What a build is:** a flotilla job or vessel with presence and recording, or a daemon-internal action? How does admission wait for, or refuse on, an image that isn''t built yet? Does a build count against host capacity?\n- **Registry:** optional registry use. It should be the cache when present, with host-local images only when not. A registry-less installation must work.\n- **Credentials:** credentials for pull and push, fitting the ADR 0044 grant model.\n- **Failures:** failure surfacing, with no silent fallback to a stale image.\n\nGrilling ticket (HITL), resolved in session with the owner.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2272/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2271","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2271/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2271/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2271/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2271","id":5644956685,"node_id":"I_kwDORel_088AAAABUHc0DQ","number":2271,"title":"Decide the crew image resource shape and identity key","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992290,"node_id":"LA_kwDORel_088AAAACtHx-Yg","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:grilling","name":"wayfinder:grilling","color":"1D76DB","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T10:23:14Z","updated_at":"2026-09-30T10:23:14Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":3,"blocking":5,"total_blocking":5},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nWhat resource replaces `CrewImageBaseline`, and what is an image''s identity?\n\n- **Resource shape:** a recipe (base, ordered layers, pins) with a status holding the built digest for each architecture on each host or registry? Or separate kinds for a layer and a composed image?\n- **The key:** my lean is resolved inputs (base digest, layer content hashes, pinned harness versions), never Dockerfile text. Settle it in light of the Plane-A rebuild post-mortem.\n- **Authority:** is it a federated Definition, like `CrewImageBaseline` since #1947? Who authors it, the operator manifest or a controller?\n- **Stored data (ADR 0047):** how existing `CrewImageBaseline` records and the image references in convoy and vessel records decode for one generation.\n- **Admission:** what a convoy freezes at admission. Is it a digest, the way credential scope is fixed?\n\nGrilling ticket (HITL), resolved in session with the owner. The answer feeds the ADR.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2271/reactions","total_count":0,"+1