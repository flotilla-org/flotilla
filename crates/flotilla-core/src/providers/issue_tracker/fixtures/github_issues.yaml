otilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-25T09:53:33Z","updated_at":"2026-09-30T13:11:35Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":1,"total_blocked_by":2,"blocking":0,"total_blocking":0},"body":"## Goal (operator task, re-scoped 2026-09-30)\n\nOnce flotilla derives lab forge transport from the `Forge` resource, remove the per-host workarounds and verify nothing depends on them.\n\nThe daemon half is covered elsewhere:\n- **#2261 / PR #2265:** convoy clone URLs and clone adoption come from the Forge''s transport.\n- **#2266:** Forge host aliases are canonicalised when remotes are recorded, so `forgejo-manchego` spellings stop becoming the live remote.\n\n## What remains here\n\n1. Remove `insteadOf` rules from the global git config on feta, udder and kiwi.\n2. Remove the `forgejo-manchego` / `manchego` SSH aliases from host git and SSH config on those hosts. This includes kiwi''s `~/dev/ghostty-ops` origin `forgejo-manchego:robert/ghostty-ops.git`: repoint it to the canonical forge URL, keeping an SSH push URL if needed.\n3. Verify: the ghostty, katzensteg and porthole governors provision and fetch with no `manchego` anywhere. Operator repair: `remove_remote` for stale alias remotes on Repository records.\n\n## Acceptance\n\n- `git config --global --get-regexp insteadof` is empty on feta, udder and kiwi.\n- No host git or SSH config names `forgejo-manchego`.\n- The lab-hosted governors provision cleanly.\n\nBackground: reports/lab-forge-transport-fix-2026-09-25.md (project-map); #1955, #1962.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1969/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1969/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2291","id":5646722826,"node_id":"I_kwDORel_088AAAABUJInCg","number":2291,"title":"Issue-tracker incremental refresh exhausts the operator''s GitHub quota: per-checkout duplicate polling, no conditional requests","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T12:51:30Z","updated_at":"2026-09-30T12:51:30Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\nOn 2026-09-30 the operator''s GitHub REST quota (user 752137, 5,000/hr) hit **0** at 12:44Z. After the 12:47 reset, usage ran at about **5,200/hr sustained** (129 calls in 90 seconds), so it refills and drains every hour.\n\nSampling `gh` child processes on each host shows the consumer is **kiwi''s flotillad** (`~/.local/opt/flotilla-fleet/current/bin/flotillad --timeout 0`, r375). Feta and udder showed none. The calls are the issue tracker''s incremental refresh:\n\n```\ngh api --include repos/<owner>/<repo>/issues?state=all&since=<~1 min ago>&sort=updated&direction=desc&per_page=50\n```\n\nIn a 30-second sample: `flotilla-org/cleat` ×4; `rjwittams/zellij`, `rjwittams/pi`, `rjwittams/katzensteg`, `rjwittams/ghostty` ×2 each; plus wheelhouse, spyglass, porthole, luchs, jackstay and others. **The same repo is polled several times with different `since` stamps within seconds**, which suggests one refresher per checkout or observation root, not one per repository identity.\n\n## Why it matters\n\n- Quota exhaustion blocks the operator''s own `gh` use and every daemon-side GitHub observation on that account. A daemon that can''t observe change requests doesn''t notice merges, so convoys don''t land. (The 2026-09-26 exhaustion was aggregator PR polling, fixed by #2047; this is the issue-tracker path.)\n- It scales with the number of observed checkouts, not with activity.\n\n## Ask\n\n1. Refresh issues **once per repository identity** (per forge repository), however many checkouts or observation roots map to it, and share the result.\n2. Use **conditional requests**: send `If-None-Match` / `If-Modified-Since` with the stored ETag. A 304 doesn''t count against the primary rate limit, and the replay fixtures already capture etags.\n3. **Budget and back off:** read `x-ratelimit-remaining` from the `--include` headers, back off below a threshold, and surface a host condition, not silence.\n4. Make the poll interval proportional to activity and demand: longer for repos nobody''s viewing or governing.\n5. A test with a replay or fake GitHub client: two checkouts of one repo, one refresh per interval, and a 304 path that consumes no quota.\n\nRelated: #2047 (the PR-polling version of this), ADR 0019 (forge access and demand-placed observation), the #2017–#2019 rate-limit cluster.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2291/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2278","id":5645026767,"node_id":"I_kwDORel_088AAAABUHhFzw","number":2278,"title":"Decision-ledger artifact put fails daemon-side GitHub projection: gh auth login / GH_TOKEN missing on the placement host","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-09-30T10:29:31Z","updated_at":"2026-09-30T12:47:19Z","closed_at":"2026-09-30T12:47:19Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\nWheelhouse convoy `precise-scrolling-2` (convoy-3dfae654280a46008e5ce2f803aebe26, wheelhouse#116, PR wheelhouse#127) finished its work and ran `flotilla artifact put --kind decision-ledger`. The crew reports:\n\n> flotilla artifact put --kind decision-ledger validates the file but its daemon-side GitHub projection fails with gh auth login / GH_TOKEN missing. Crew injected gh credentials authenticate successfully; exporting GH_TOKEN for flotilla does not fix daemon authentication.\n\nThe crew stored the ledger as a `brief` artifact (`artifact-47e471e34c15ecbc2d829cd283b0217f0297ed6de683582acd53697a92c4b077`, about `decision-ledger-submission-blocked`) and stalled with reason `infra`. The convoy was placed as `docker-crew-image-feta` on feta, so the daemon doing the projection is feta''s.\n\n## Why it matters\n\nThe decision ledger is the settlement audit trail (ADR 0017): the governor reads it on the PR before settling. If the daemon that projects it has no GitHub credential, every crew on that host stalls at settlement even when its PR is green and merged. This is distinct from #2197, which is about duplicate comments on retry after a successful forge write.\n\n## Ask\n\n- Give the daemon-side projection a credential it can use: either the host''s configured crew App credential for the destination repository (it is minted per convoy already, see `Minted credential repository scope` in crew briefs), or fall back to letting the crew project the comment with its injected credential and hand the daemon the comment URL to record.\n- Make `artifact put` report clearly which side failed and with what, so a crew does not try to fix it by exporting `GH_TOKEN` in its own shell.\n- Until fixed, document in the crew brief that a failed ledger projection is a settlement flag, not a stall: the crew posts the ledger as a `## Decision ledger` PR comment itself and completes with that URL.\n\nFiled by the wheelhouse standing governor. Related: #2197, #2277 (the stall''s delivery to the governor also failed), #2048, #2107.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2278/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2290","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2290/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2290/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2290/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2290","id":5646428243,"node_id":"PR_kwDORel_088AAAABF5KYQA","number":2290,"title":"fix: project decision ledgers with scoped GitHub credential","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":4,"created_at":"2026-09-30T12:28:26Z","updated_at":"2026-09-30T12:43:56Z","closed_at":"2026-09-30T12:43:53Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2290","html_url":"https://github.com/flotilla-org/flotilla/pull/2290","diff_url":"https://github.com/flotilla-org/flotilla/pull/2290.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2290.patch","merged_at":"2026-09-30T12:43:53Z"},"body":"## Summary\n\n- Project GitHub decision ledger comments with the staged `github-crew-pr` token file in the crew environment for lookup and posting, without reading the token in the daemon.\n- Name missing or empty credentials and distinguish forge projection failures from artifact storage failures.\n- Cover projection without ambient gh auth and missing or empty staged credentials; document the temporary settlement fallback in crew briefs.\n\n## Validation\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked` (includes stored-record corpus)\n\nNo resource or stored-data schema changed; no out-of-repo resource authors need updates.\n\nCloses #2278\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2290/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/re