nee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2289","html_url":"https://github.com/flotilla-org/flotilla/pull/2289","diff_url":"https://github.com/flotilla-org/flotilla/pull/2289.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2289.patch","merged_at":"2026-09-30T12:38:46Z"},"body":"Follow-up to #2285 and #2286. This addresses the remaining stored-data concern from the review of #2286.\n\nThe merged #2285 implementation stored `status.attention` with source `supervisor-turn-delivery`. #2286 stopped writing that attention but no longer cleared existing stored values. A convoy that received a pending turn between those versions could retain a stale `NeedsYou` state after acknowledgment.\n\n- Clear only the prior-generation delivery attention when the last pending supervisor turn is acknowledged. Other attention remains intact. The one-generation cleanup is marked in code and covered by a status-patch test.\n- Keep the convoy row message short and count multiple pending supervisor turns. Cover the main case where a pending turn exists without prior attention.\n\nVerified locally with `cargo +nightly-2026-03-12 fmt --check`, `CARGO_BUILD_JOBS=2 cargo clippy --workspace --all-targets --locked -- -D warnings`, and `CARGO_BUILD_JOBS=2 cargo test --workspace --locked` (including the stored-record corpus).\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/use