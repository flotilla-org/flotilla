po}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-09-30T11:52:12Z","updated_at":"2026-09-30T12:09:12Z","closed_at":"2026-09-30T12:04:06Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2286","html_url":"https://github.com/flotilla-org/flotilla/pull/2286","diff_url":"https://github.com/flotilla-org/flotilla/pull/2286.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2286.patch","merged_at":"2026-09-30T12:04:06Z"},"body":"Follow-up to #2285 and its review. The original PR merged while these review fixes were being verified.\n\n- Preserve existing convoy attention when a remote supervisor turn is queued or acknowledged. The aggregator derives `NeedsYou` and a short delivery reason from pending turns, including when there is no prior attention.\n- Clear delivery attention written by the merged #2285 implementation when its last pending turn is acknowledged. This is a one-generation cleanup for stored convoy statuses.\n- Continue reconciling other terminal sessions and acknowledgments when one session fails. Report the failed session in the pass result.\n- Extend the multi-host, aggregator, and status-patch tests for these cases.\n\nVerified locally with `cargo +nightly-2026-03-12 fmt --check`, `CARGO_BUILD_JOBS=2 cargo clippy --workspace --all-targets --locked -- -D warnings`, and `CARGO_BUILD_JOBS=2 cargo test --workspace --locked` (including the stored-record corpus).\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2286/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2286/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2277","id":5645018651,"node_id":"I_kwDORel_088AAAABUHgmGw","number":2277,"title":"Crew stall delivery to the standing governor fails: turn-delivery target govern/governor has no durable terminal-session record","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T10:28:47Z","updated_at":"2026-09-30T12:06:01Z","closed_at":"2026-09-30T12:06:01Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\nWheelhouse convoy `precise-scrolling-2` (convoy-3dfae654280a46008e5ce2f803aebe26, wheelhouse#116) stalled at 2026-09-30T09:36:32Z with reason `infra` (its decision-ledger projection failed, see #2197). The stall named the standing governor as supervisor. The convoy''s `stalled` block records:\n\n```\nevidence: supervisor delivery failed: turn-delivery target govern/governor has no durable terminal-session record\nrung: operator\nsupervision_exhausted: true\n```\n\nThe standing governor (convoy-f1cdb7bb6f4a4b0faeeced69051a1939, vessel `govern`, role `governor`, placed on udder as docker-crew-image-udder) was running the whole time and had been taking operator turns in the same session. It never received the stall. The governor found it 50 minutes later by noticing a `needs you` surface state in `flotilla ls` and reading the convoy resource.\n\n## Why it matters\n\nADR 0030 makes the standing governor the supervisor for its island''s stalls. If turn delivery to it fails because its session has no durable terminal-session record, every crew stall skips the governor and lands on the operator, and the governor''s stalled-work handling (`flotilla crew supervise ... resume|convert-to-failed|escalate`) is never exercised. Delivery to task crews via the same path has a related history (#2107).\n\n## Ask\n\n- Make the standing governor''s crew session register a durable terminal-session record at admission, or make turn delivery resolve the target through the live vessel rather than the record, whichever is the intended design.\n- Until then, surface the failed delivery to the governor another way (a message on its next turn, or an attention flag on its own convoy) so a stall is not silent for the supervisor it named.\n- A test: stall a crew whose supervisor is a running standing governor; assert the governor receives the stall message.\n\nFiled by the wheelhouse standing governor. Related: #2107, #2197, ADR 0030.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2277/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2256","id":5643778485,"node_id":"I_kwDORel_088AAAABUGU5tQ","number":2256,"title":"Skill staging: allow SSH sources, stop retrying auth failures, harden redaction","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T08:49:35Z","updated_at":"2026-09-30T12:05:59Z","closed_at":"2026-09-30T12:05:59Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From the final static review of PR #2248 by the claude-review bot: https://github.com/flotilla-org/flotilla/pull/2248\n\nPR #2248 fixed concurrent pinned skill staging. The final review raised several points after the last crew reply, and none of them were answered. Abandoned scratch directories and token files are tracked separately in #2252.\n\n## 1. `ssh://git@host/...` sources are wrongly rejected\n\n`inspect_skill_sources` in `crates/flotilla-daemon/src/agent_material.rs` rejects any `://` repository URL with a non-empty username, via `!url.username().is_empty() || url.password().is_some()`. That rejects ordinary SSH sources such as `ssh://git@github.com/org/repo.git`, not just `https://user:secret@...`.\n\nEvery live source today is `https://`, so no current manifest breaks. The check is still wrong, and it will break the first time an SSH source is authored. The intent is to reject embedded **secrets**. Reject a password on any scheme, plus userinfo on `http`/`https` only, and allow SSH user names. Add tests for `ssh://git@...` (accepted), `https://user:pass@...` (rejected) and `https://user@...` (rejected).\n\n## 2. Retries hold the staging mutex, and auth failures are retried\n\nThe in-process staging mutex is held across the retry sleeps (1s + 2s, plus fetch time), so one failing source blocks every other crew''s staging. A 401/403 falls under \"fetch failed\" and is retried three times, though it can never recover. Changes:\n- treat authentication and authorization failures as terminal;\n- release the lock around the backoff sleeps, or back off outside the critical section, if that is safe for the cache swap.\n\n## 3. Redaction is fragile\n\n- `grep -F -f \"$token_file\"` redacts **every** line if the token file ends in a newline, because the empty pattern matches everything. The writer trims today, but the script shouldn''t depend on that. Read the token as a single pattern, not a pattern file.\n- Redaction applies only to fetch and checkout stderr. `skill_stage_error` appends the full stderr, including `init`, `remote add` and `sparse-checkout` output. Apply the same filter to everything surfaced.\n- Add a test with a trailing-newline token file.\n\n## 4. Test gaps\n\n- Cache invalidation when `repository` or `paths` change for the same name and revision.\n- A partial or corrupt cache entry (missing `.flotilla-ready`) is rebuilt, not trusted.\n- The wrong-revision error.\n- One full-format assertion on `skill_stage_error`, since #2248 loosened the others to `contains`.\n\nNo serialized-shape change is expected. The skill-source manifests come from the fleet generation (all `https://` today), so no companion manifest change is needed.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2256/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2197","id":5628972582,"node_id":"I_kwDORel_088AAAABT4NOJg","number":2197,"title":"Make decision-ledger PR projection retry-safe","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-29T10:20:46Z","updated_at":"2026-09-30T12:05:57Z","closed_at":"2026-09-30T12:05:57Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2187 review by claude-review bot: https://github.com/flotilla-org/flotilla/pull/2187#issuecomment-5888145045\n\nThe decision-ledger artifact put projects a PR comment before its artifact envelope is stored. If the comment succeeds and the resource write fails, a retry can post a duplicate comment because the recorded digest and URL are unavailable.\n\nAdd durable projection state or an outbox so retries converge on one comment. Keep the artifact as the source of truth and preserve the checked-ledger validation before projection.\n\nContext: PR #2187 discloses the current retry window and reuses an existing comment URL when the same artifact digest is already stored. This issue covers the remaining failure window after a successful forge write and before resource storage.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2197/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2259","id":5644302144,"node_id":"I_kwDORel_088AAAABUG03QA","number":2259,"title":"Placement host authors a Vessel and placement snapshot for a convoy it doesn''t own (AuthorshipCollision)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T09:31:13Z","updated_at":"2026-09-30T12:05:54Z","closed_at":"2026-09-30T12:05:54Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What happened\n\nOn 2026-09-30 at 09:19:30Z, with the fleet on r372, the wheelhouse governor (a crew on convoy `convoy-f1cdb7bb6…`) started convoy `convoy-3dfae654280a46008e5ce2f803aebe26` (role `precise-scrolling-2`, project wheelhouse) through **udder**. Udder (`1c8df992…`) is the convoy''s origin root, and the convoy is placed on **feta** (`9ad3ffb1…`) through `docker-crew-image-feta`.\n\nBoth hosts then **authored** the same two home-bound records, a few milliseconds apart:\n\n| Record | udder (origin) | feta (placement host) |\n|---|---|---|\n| `Vessel/flotilla/convoy-3dfae654…-work` | created 09:19:30.081Z, local, phase unset | created 09:19:30.084Z, local on feta, **Ready** (the crew runs on this copy) |\n| `PlacementPolicy/flotilla/placement-snapshot-7977e957d369` | authored locally | authored locally |\n\nBoth feta and udder now report `ResourceReplication/AuthorshipCollision` for both records. The condition is advisory (`ready=true`), so admission isn''t blocked, but the replicator won''t converge them.\n\nThe convoy itself exists only once. It was created on udder at 09:19:30.040Z, and feta and kiwi hold replicas. So feta''s copies were written about 40 ms after the convoy replicated to feta. That is far too close together to be one host replicating the other''s copy, so feta ran its own vessel creation and placement-snapshot authoring for a convoy it doesn''t own.\n\n## Why it matters\n\nThe operator rule is that only the convoy''s origin-root host reconciles it (convoy creation, its Vessels, its placement snapshot). The placement host should only realise a Vessel it received by replication, through the placed-Vessel actuator. Here the placement host authored as well. #2241 / PR #2246 (reuse replicated placement snapshots) doesn''t cover this. It addresses admissions on two origins, and the snapshot half here may have the same root as the Vessel half. The Vessel collision is new.\n\nLog evidence:\n- udder''s `flotillad.jsonl` shows two governor `Starting convoy...` executions, at 09:19:23.49Z and 09:19:29.64Z (`caller_label` = the wheelhouse governor). The first may have failed or been retried, which is worth checking as the trigger.\n- feta''s log has no line naming the convoy. Only `synchronized placed Vessel actuators … created:0` lines appear around 09:19:30, so whatever path authored feta''s Vessel doesn''t log.\n\n## Asks\n\n1. Find which code path on a non-origin host creates a convoy''s Vessel and placement snapshot. Likely candidates:\n   - the convoy reconciler running on replicas;\n   - admission executing on the placement host (a routed `convoy start`, or the governor''s retry landing on feta);\n   - the vessel-placement reconciler creating instead of adopting.\n2. Make authoring origin-only, and add a two-origin `InProcessDaemon` test: origin A admits a convoy placed on host B, the replica arrives at B, and B authors neither the Vessel nor the snapshot while still realising the placed Vessel.\n3. Log Vessel creation with the convoy name and the authoring path, so the next case can be traced.\n4. Describe the safe remediation for existing collisions, where the placement host''s copy is the running one. Should the origin''s copy be deleted, or the placement host''s copy re-homed? The collision message tells the operator to \"delete the other authored copy at its root\", but doesn''t say which copy is safe to delete when the running crew is on the non-origin copy.\n\nThe live collision is left in place (advisory only), and the crew keeps running on feta''s copy.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2259/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2261","id":5644499436,"node_id":"I_kwDORel_088AAAABUHA57A","number":2261,"title":"Convoy clone URL uses a host-local SSH alias remote (https://forgejo-manchego/...) instead of the Forge''s transport","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T09:46:47Z","updated_at":"2026-09-30T12:05:52Z","closed_at":"2026-09-30T12:05:52Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":1,"total_blocking":1},"body":"## What happened\n\nAfter r375 (which carries #2253), the ghostty governor was re-admitted as `convoy-026a1975…` on udder. It stalls in Provisioning, because its ghostty-ops Clone keeps failing and is retried indefinitely:\n\n```\nclone target /home/robert/dev/flotilla-repos/ghostty-ops already exists with origin\nhttps://forgejo.lab.flotilla.work/robert/ghostty-ops, expected https://forgejo-manchego/robert/ghostty-ops\n```\n\n`https://forgejo-manchego/robert/ghostty-ops` isn''t a real URL. `forgejo-manchego` is an **SSH host alias in kiwi''s `~/.ssh/config`**, which points at `manchego.lab.flotilla.work`. Kiwi''s desk checkout `~/dev/ghostty-ops` has `origin = forgejo-manchego:robert/ghostty-ops.git`. Flotilla canonicalises that to `https://forgejo-manchego/...` and records it as the Repository''s **first remote**, meaning `live_remote()`, via the additive `update_remotes`. Admission then freezes `live_remote()` into the convoy''s repository URL. The vessel reconciler (`crates/flotilla-controllers/src/reconcilers/vessel.rs`, `CreateClone`) writes it into `CloneSpec.url` for a clone on **udder**, where the alias means nothing.\n\nThe Repository is already Forge-identified after the #2253 sweep:\n\n- `Repository/8ppvc…`: `identity: {kind: forge, forge_ref: lab, owner: robert, repo_name: ghostty-ops}`\n- `remotes: [https://forgejo-manchego/robert/ghostty-ops, https://forgejo.lab.flotilla.work/robert/ghostty-ops, https://manchego.lab.flotilla.work/robert/ghostty-ops]`\n\n`Forge/lab` declares `hosts: [forgejo-manchego, forgejo.lab.flotilla.work, manchego.lab.flotilla.work]` and `https_url: https://forgejo.lab.flotilla.work`. So flotilla already knows that `forgejo-manchego` is a host alias and what the canonical transport is.\n\n## Root cause\n\nAn observed remote from one host''s own git config is treated as a fleet-wide transport URL. `live_remote()` means \"the remote most recently observed on *some* host\", but provisioning on a *different* host uses it as the clone URL. For a Forge-identified Repository, the URL a provisioned environment clones from should come from the Forge (`https_url` + the repository path, or the forge''s declared git transport), never from a host-local alias.\n\n## Asks\n\n1. For a Forge-identified Repository, derive the convoy repository URL used for Clones, and any other provisioning or transport consumer, from the Forge, not from `remotes.first()`. Audit the `live_remote()` consumers in `in_process.rs`, among them the admission path near the convoy repository URL and the clone expectation in `runtime.rs` (`expected_spec = CloneSpec {…}`). Decide which ones mean *transport URL* and which mean *identity*.\n2. When a remote''s host is one of a Forge''s declared `hosts`, canonicalise it to the Forge''s canonical form when recording it. An alias spelling then never becomes `remotes[0]`. Keep recording additive, and don''t delete existing remotes automatically; `remove_remote` is the operator repair.\n3. Keep existing shared clones valid. A clone whose origin is any of the Forge''s declared hosts for the same `owner/repo` should satisfy the clone-target check, not fail as \"already exists with origin X, expected Y\". At minimum, compare by resolved Forge identity rather than raw URL string.\n4. Test: a Forge Repository whose first remote is an alias spelling, admitted for placement on another host, produces a Clone with the Forge''s canonical URL. An existing clone at the canonical origin is adopted.\n\n## Also observed (same sweep, lower priority)\n\n`Repository/8ppvc…` is now authored **locally on both kiwi and udder**, and each host also holds the other''s replica. Udder''s copy was written at the 09:30 admission, so it''s probably #2253''s admission-time `resolve_forge_identity_in` / `sweep_split_forge_repositories` writing on the admitting host. No AuthorshipCollision is reported for it, so Repository may not be home-bound. Either confirm that dual authorship is harmless for Repository, or make the sweep write at the record''s home. Related: #2259 (Vessel/snapshot dual authorship).\n\nNo stored-shape change is expected. Related: #2243 / PR #2253, #1969 (retire the forgejo-manchego alias), #1955.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2261/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2284","id":5645348388,"node_id":"PR_kwDORel_088AAAABF4TFxg","number":2284,"title":"Fix pinned skill staging auth, retries, and diagnostics","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":7,"created_at":"2026-09-30T10:57:55Z","updated_at":"2026-09-30T12:03:36Z","closed_at":"2026-09-30T12:03:34Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2284","html_url":"https://github.com/flotilla-org/flotilla/pull/2284","diff_url":"https://github.com/flotilla-org/flotilla/pull/2284.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2284.patch","merged_at":"2026-09-30T12:03:34Z"},"body":"Closes #2256.\n\n## Changes\n\n- Accept `ssh://git@host/...` skill repositories while rejecting passwords on all URL schemes and userinfo on HTTP(S).\n- Classify Git 401/403 and other authentication failures as terminal. Retry transient fetch and checkout failures up to three times, with backoff outside the shared in-process staging mutex; each attempt still holds the mutex across cache updates and the destination swap.\n- Redact the token value inside every surfaced Git stderr line, including init, remote, config, sparse checkout, fetch, revision lookup, and checkout. A trailing newline in a token file no longer makes an empty grep pattern erase diagnostics.\n- Cover cache invalidation for repository and path changes, missing ready markers, wrong revisions, and the complete staging error format.\n\n## r375 contained-dispatch incident\n\nTwo of six dispatches failed while fetching `mattpocock-skills` at pinned revision `862f01fd…` with Git exit 128 and blank stderr. The old redaction could erase all stderr when a token file ended with a newline, hiding the underlying Git error. The new redaction retains Git''s message while replacing token text. A regression test stages six crews concurrently with distinct tokens and one simulated Git exit 128; all six complete, and no crew loses another crew''s token.\n\nCode inspection found that skill-source tokens use unique per-mint paths, their writes complete before staging starts, and cleanup is passed only that staging''s token paths. The original remote failure''s exact cause cannot be confirmed from the blank recorded stderr. Unknown Git exit 128 failures now retry without blocking other crews; a recurrence will retain redacted diagnostics.\n\n## Verification\n\n- `cargo +nightly-2026-03-12 fmt --check`\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`\n- `cargo test --workspace --locked`\n\nNo serialized shapes changed. Fleet-generation manifests are the out-of-repo authors of skill sources; their current sources use HTTPS, so no companion manifest change is needed.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2284/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2288","id":5646030409,"node_id":"I_kwDORel_088AAAABUIeWSQ","number":2288,"title":"Mutations on replica copies silently no-op or revert; route to the record''s origin or refuse loudly","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null},{"id":10420764394,"node_id":"LA_kwDORel_088AAAACbSA-6g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/multi-host","name":"multi-host","color":"7B68EE","default":false,"description":"Multi-host peering and networking","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T11:55:37Z","updated_at":"2026-09-30T11:57:56Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015453,"node_id":"IT_kwDOEBMoCM4B6IRd","name":"Bug","description":"An unexpected problem or behavior","color":"red","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nWhether an operation works depends on which host you run it from, and running it from the wrong host fails **silently**. Every replicated record has an origin root (its home host), and only operations performed there take effect. Everywhere else acts on a replica copy, which the replicator then overwrites. From the operator''s side this looks like flakiness.\n\nSeen on 2026-09-30 alone:\n\n1. **`flotilla resource delete convoy <name>` from kiwi returned success**, but the convoy''s origin was feta. The convoy was still there an hour later, until it was deleted again with `--host feta`. Nothing warned that kiwi held only a replica.\n2. **Stall supervision (#2277):** `deliver_standing_turn` looked up the governor''s TerminalSession in the stalled convoy host''s *local* store and failed because the session lives on the governor''s host.\n3. **Vessel and placement-snapshot dual authorship (#2259):** the placement host authored records for a convoy it didn''t own.\n4. Known before today: TerminalSession deletes must run on the session''s home origin root, or the record re-federates back (project memory; #1894).\n\nThe operator also can''t easily predict where the origin is. Convoys dispatched from kiwi with `--fulfilment docker-crew-image-feta` got origin feta. The wheelhouse governor''s crews got origin udder, because the governor runs there.\n\n## Ask\n\nA consistent rule for mutations of replicated records, enforced in one place (the resource client or command layer), not per command:\n\n- **Route by default:** a mutating operation (delete, update, patch, operator actions like abandon, complete and force) addressed to a record whose origin is another host is forwarded to that origin, the same way `--host` works today. The result reports where it ran.\n- **Or refuse loudly** where routing isn''t possible (origin offline, partitioned): \"convoy X is a replica on kiwi; its origin is feta (offline). Retry when feta is reachable, or pass `--host feta`.\" Never report success for a write that will be undone.\n- `resource list` / `get` human output should show each record''s origin, so the operator can see it.\n- Audit controller code paths that do local-store lookups for records that may live elsewhere (the #2277 class), and route through the replica-aware view plus origin routing.\n\nTests: an InProcessDaemon two-host scenario where a delete issued on a non-origin host either takes effect at the origin or fails with the named origin, never silently succeeds and reverts.\n\nRelated: #2259, #2277, #1894, ADR 0016 (overlay replication), the Plane-A freeze (this belongs in resource replication, not peer-merge).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2288/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2267","id":5644948599,"node_id":"I_kwDORel_088AAAABUHcUdw","number":2267,"title":"Map: crew images as a flotilla-owned resource","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992232,"node_id":"LA_kwDORel_088AAAACtHx-KA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:map","name":"wayfinder:map","color":"6F42C1","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-30T10:22:31Z","updated_at":"2026-09-30T11:55:03Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":10,"completed":3,"percent_completed":30},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Destination\n\nThe working system: crews get their images from flotilla.\n- Images are composed from layers (base, harness, capability, per-project).\n- Each image is identified by its resolved inputs.\n- Images are built on demand for the architecture of the host that needs them.\n- Harness releases surface for auto-inclusion or operator approval.\n- The ad hoc lab Forgejo CI build (`.forgejo/workflows/crew-image.yml`), the unused arm64 builds, and the hand-edited `CrewImageBaseline` tag are retired.\n\nAn ADR records the model on the way. It is a milestone, not the end.\n\n## Notes\n\n- **This map carries execution** (owner, 2026-09-30). Decision tickets block the build slices they shape. Build slices go to convoys through the normal crew workflow: PR, shepherd, and Robert merges. Anything a build turns up comes back onto the map as a new ticket or as fog. Don''t stop at a plan.\n- **Substrate work.** Follow CLAUDE.md \"Design and Substrate Work\": prefer the considered cut, and no YAGNI reflex.\n- **Stored data (ADR 0047).** `CrewImageBaseline` and the convoy/vessel records that name images are stored data. The replacement must decode the previous generation. Name any out-of-repo authors (the `.flotilla/crew-image-baseline.yaml` manifest).\n- **Other installations are first-class.** Nothing may require our lab Forgejo CI, and a registry-less single-host installation must work.\n- Skills: `/grilling` and `/domain-modeling` for grilling tickets; `/research` for research tickets. Record rulings with an \"ADR carry:\" line.\n- **Starting point:**\n  - `.flotilla/Dockerfile.crew`: monolithic, multi-stage, ordered by change frequency;\n  - `.flotilla/crew-image-baseline.yaml`: a `CrewImageBaseline`, one tag;\n  - `crates/flotilla-controllers/src/reconcilers/vessel.rs`: resolves the baseline through `DefinitionResolver`;\n  - the Plane-A `ensure_image` in `crates/flotilla-core/src/providers/environment/docker.rs`: Dockerfile-hash tags, built per host;\n  - `FulfilmentGrant::Toolchain(String)`, `Gpu` and friends in `crates/flotilla-resources/src/fulfilment_kind.rs`.\n\n## Decisions so far\n\n- [Research: options for composing crew images from independently versioned layers](https://github.com/flotilla-org/flotilla/issues/2268). Digest-pinned chained images in dependency order (base/toolchains → utilities → harness → project), keeping Dockerfiles and Buildx. Look up prior builds by recipe key; the OCI digest is the identity.\n- [Research: inventory the current crew image](https://github.com/flotilla-org/flotilla/issues/2270). 6.0 GB amd64: toolchains 3.5 GB (cached across harness bumps), harness layer 635 MB. arm64 published but unused. Crew Forgejo credential can''t read the registry (401).\n\n- [Research: why the Plane-A on-demand image build rebuilt constantly](https://github.com/flotilla-org/flotilla/issues/2269). A fresh tag and build per ensure, fixed in April by #572. Rule: key images to complete resolved inputs, independent of invocation, checkout or host, and share them across hosts.\n\n## Not yet specified\n\n- **The ADR:** write it once identity, composition, build location, selection and update policy are decided. It becomes a ticket at that point.\n- **Build slices:** the slices beyond the proving slice (the headless display layer). The implementation order depends on the resource shape and the build-location decisions.\n- **Retirement and cutover:** retire `crew-image.yml`, arm64 and hand-editing the baseline. Plan how running crews move from the baseline tag to composed images, and how `CrewImageBaseline` decodes or migrates across one generation.\n- **Garbage collection:** retention and garbage collection of built images and layers on hosts and in any registry.\n\n## Out of scope\n\n- Non-Docker backends, e.g. Fly sprites or VMs, deferred until after the drydock extraction.\n- GPU passthrough: #2260 says to split it out when a ticket needs it.\n- Host-direct environments: the host is the environment, and there is no image.\n- macOS and Windows container images.\n\n\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2270","id":5644956367,"node_id":"I_kwDORel_088AAAABUHcyzw","number":2270,"title":"Research: inventory the current crew image (layer sizes, change frequency, registry, arm64 use)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992356,"node_id":"LA_kwDORel_088AAAACtHx-pA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:research","name":"wayfinder:research","color":"0E8A16","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false}],"milestone":null,"comments":2,"created_at":"2026-09-30T10:23:13Z","updated_at":"2026-09-30T11:55:02Z","closed_at":"2026-09-30T11:55:02Z","assignee":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":2,"total_blocking":2},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nWhat does the current crew image actually consist of, and where are its natural layer boundaries?\n\nFor the current baseline image (`.flotilla/crew-image-baseline.yaml`), and for the stages of `.flotilla/Dockerfile.crew`:\n\n1. **Layer sizes:** the compressed and uncompressed size of each layer and stage (`docker history`, `crane manifest` or `dive` on feta).\n2. **Change frequency:** how often each input changed over the last 60 days, from the git history of `Dockerfile.crew` and the `crew-image.yml` dispatch inputs (codex, claude-code, tea, cleat, Zig, Rust, Node). Also how often a harness bump was the only change.\n3. **Pull cost:** on each of feta, udder and kiwi, what a cold pull costs today, and what an adapter-only bump costs with layers the host already has.\n4. **Registry:** what the lab Forgejo container registry supports (per-architecture manifests, layer mounting, garbage collection), and whether flotilla already talks to it outside CI.\n5. **arm64:** whether any consumer of the arm64 variant exists.\n\n**Deliverable:** a table and a short findings note on a throwaway `research/crew-image-inventory` branch, with a summary comment on this issue. Read-only: don''t retag, push or change placement policies.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2270/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2268","id":5644955735,"node_id":"I_kwDORel_088AAAABUHcwVw","number":2268,"title":"Research: options for composing crew images from independently versioned layers","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":11617992356,"node_id":"LA_kwDORel_088AAAACtHx-pA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/wayfinder:research","name":"wayfinder:research","color":"0E8A16","default":false,"description":"","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false}],"milestone":null,"comments":2,"created_at":"2026-09-30T10:23:09Z","updated_at":"2026-09-30T11:54:59Z","closed_at":"2026-09-30T11:54:59Z","assignee":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"parent_issue_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2267","issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":2,"total_blocking":2},"body":"Part of #2267 (Map: crew images as a flotilla-owned resource).\n\n## Question\n\nWhat are the options for composing a crew image from independently versioned layers (base, harness, capability, per-project), and what does each cost? For each option, cover these questions:\n\n1. **Rebuild cost:** bumping one harness (for example codex from 0.157 to 0.159) should not rebuild or re-push the language toolchain layers. Does it?\n2. **Toolchain needs:** does it need BuildKit or buildx, a daemon, or root? Does it work with plain `docker` on a fleet host and on a registry-less single host?\n3. **Reproducible identity:** can the output digest, or a key computed before building, be derived from the inputs, so the same inputs give the same image and building can be skipped?\n4. **Architectures:** can it build only the host''s own architecture?\n5. **Layer-level caching:** how does it cache and share layers across hosts, with and without a registry?\n\n**Options to survey:**\n- a multi-stage Dockerfile generated from fragments;\n- chained images (`FROM <base-digest>`) per layer;\n- appending OCI layers onto a base without a rebuild (`crane append` / `crane mutate`, ko-style, `umoci`);\n- BuildKit LLB or `docker buildx bake`;\n- Nix (`dockerTools.buildLayeredImage` / nix2container);\n- anything else credible.\n\nMeasure against today''s `.flotilla/Dockerfile.crew`, whose final stage holds the Rust, Node, Zig and tea layers followed by the harness adapters.\n\n**Deliverable:** a comparison with a recommendation, committed on a throwaway `research/crew-image-composition` branch, with a link to it on this issue. Don''t change production code.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2268/timeline","performed_via_github_app":null,"state_reason":"completed","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285/events","html_url":"https://github.com/flotilla-org/flotilla/pull/2285","id":5645652717,"node_id":"PR_kwDORel_088AAAABF4inzw","number":2285,"title":"fix: deliver supervisor turns to remote governors","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-09-30T11:24:14Z","updated_at":"2026-09-30T11:53:17Z","closed_at":"2026-09-30T11:49:52Z","assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"draft":false,"pull_request":{"url":"https://api.github.com/repos/flotilla-org/flotilla/pulls/2285","html_url":"https://github.com/flotilla-org/flotilla/pull/2285","diff_url":"https://github.com/flotilla-org/flotilla/pull/2285.diff","patch_url":"https://github.com/flotilla-org/flotilla/pull/2285.patch","merged_at":"2026-09-30T11:49:52Z"},"body":"Closes #2277.\n\n## Cause\n\nA standing governor''s `TerminalSession` is authored on its vessel placement host. The admission path creates that durable record through the vessel reconciler, and the existing SQLite restart test verifies that an authored record survives a daemon restart. Turn delivery searched only the convoy home''s local terminal store. For a governor placed on another host, that lookup reports “no durable terminal-session record” even while the authoritative session is running on the placement host. The reported udder placement is consistent with this cross-host gap; the incident''s live store was not available here to inspect.\n\n## Change\n\n- Queue a supervisor turn durably on the governor convoy when its session is not local. The placement host consumes the replicated turn and queues the message on its locally authored terminal session. Delivery confirmation from the terminal status clears the pending turn.\n- Raise convoy attention while delivery is pending, and project its reason and `NeedsYou` state into the visible convoy row. This also covers a session record that has not yet replicated or been recreated.\n- Keep old stored convoy statuses decodable by defaulting the new optional field inside `TurnDeliveryStatus`. No out-of-repo manifest author is known to write convoy status; manifests author specs.\n\n## Verification\n\n- Red reproduction: `standing_governor_on_another_host_receives_a_stalled_crew_turn` failed with the issue''s missing-record error before the change, then passed with the remote queue and acknowledgement path.\n- Red projection: `pending_supervisor_turn_is_visible_on_the_governor_convoy` showed `Working` before the change, then passed with `NeedsYou` and the delivery reason.\n- `cargo +nightly-2026-03-12 fmt --check`: passed.\n- `cargo clippy --workspace --all-targets --locked -- -D warnings`: passed.\n- `cargo test --workspace --locked`: passed, including the stored-record corpus test.\n\nThe turn uses resource replication, so placement-host delivery may follow the next replication and reconciliation pass. The governor convoy shows attention until the terminal confirms delivery.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2285/timeline","performed_via_github_app":null,"state_reason":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2287","id":5645992392,"node_id":"I_kwDORel_088AAAABUIcByA","number":2287,"title":"Wake remote supervisor turn reconciliation from resource watches","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":0,"created_at":"2026-09-30T11:52:20Z","updated_at":"2026-09-30T11:52:31Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #2285 review by claude[bot]: https://github.com/flotilla-org/flotilla/pull/2285#issuecomment-5910198850\n\nRemote supervisor turns are consumed by a periodic pass at `controller_resync_interval`. Replication plus the pass can delay delivery and confirmation. Trigger the same idempotent reconciliation when a convoy replica or terminal-session status changes, while keeping the periodic pass as recovery after missed watches or restarts.\n\nKeep the durable pending turn and acknowledgment behavior from #2285. Add a multi-host test that verifies delivery after the relevant watch event without waiting for a full resync interval.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2287/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074/events","html_url":"https://github.com/flotilla-org/flotilla/issues/2074","id":5601242667,"node_id":"I_kwDORel_088AAAABTdwuKw","number":2074,"title":"brainstorm: layered crew images (toolchain base + agent layer + project layers)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863952,"node_id":"LA_kwDORel_088AAAACactF0A","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/infrastructure","name":"infrastructure","color":"5319E7","default":false,"description":"Build, CI, and tooling","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-27T08:48:59Z","updated_at":"2026-09-30T11:33:47Z","closed_at":"2026-09-30T11:33:47Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Observation (2026-09-27)\nThe crew image is one monolithic build (`.flotilla/Dockerfile.crew`): OS, Rust and Zig toolchains, the ghostty builder stage and terminfo, plus the agent CLIs (claude-code, codex, tea). Bumping a single agent CLI (e.g. to get a Claude Code that knows a new model) means a full multi-arch rebuild through lab CI, and the image lags host binaries (image 2.1.280 vs hosts 2.1.282). That lag pushed a crew to kiwi host-direct today.\n\n## Questions to settle\n- **Layer split:** a slow-moving **toolchain base** (OS, Rust, Zig, ghostty-builder outputs, terminfo); a fast-moving **agent layer** (claude-code / codex / tea at chosen versions); optional **project layers** (per-project deps, #1812).\n- **Composition and pinning:** how the `CrewImageBaseline` (ADR 0039) references a composed image vs separate layer pins. Whether placement policies select an agent-layer version independently.\n- **Rebuild triggers:** agent-layer rebuilds should be cheap and frequent (automatable on npm releases), base rebuilds rare. How lab CI (#1915) and the baseline bump flow change.\n- **Alternatives to layering:** mounting agent CLIs from the host into contained crews (the version-skew and host-dependence tradeoff), or installing them at vessel start with a cache.\n- **Interaction:** #1933 (Zig in image, no baked prefix), #1934 (per-pin build cache), #917 (vessel image top-layer regen), and the placement model-availability brainstorm.\n\nRefs: ADR 0039, #1915, #1812, #1933, #1934, #917.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/2074/timeline","performed_via_github_app":null,"state_reason":"not_planned","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1859","id":5260563715,"node_id":"I_kwDORel_088AAAABOY3VAw","number":1859,"title":"Ownership vs access: convoy-scoped repo attachment and primacy-keyed governor attention","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-26T19:08:59Z","updated_at":"2026-09-30T11:33:45Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Observation (Robert, 2026-08-26)\n\nPre-agent development meant having all the repos checked out and developing on them together. Cross-repo work was frictionless because access wasn''t project-gated. The wheelhouse map effort (wheelhouse#17: nine tickets across four trackers, hand-threaded through per-project governors by the flotilla governor) is the live fixture showing where the current model rubs.\n\nPossible shapes he floated: ad-hoc repo paths added to convoys; more ephemeral projects; more laxity about which repos a project can access. \"Maybe the distinction is which project *owns* a repo path, but it can still get (and its governor should care about) PRs it didn''t decide to do.\"\n\n## What ADR 0020 already gives us\n\nThe ownership/access split exists and is deliberately dull: **primacy** = exactly-one-controller of the Repository (lifecycle, shared infra, default home); **membership claims** = access (any member claim dispatches); **association** = appearance, query-governed. Nothing here needs redesign.\n\n## The two actual gaps\n\n**a) Access is only grantable at standing-project granularity.** A convoy can only touch repos its project claims as members. There is no convoy- or effort-scoped attachment: \"this convoy also gets ~/dev/cleat at pin X\" with credentials via mint-time downscoping (#1792). This is the mechanism half of #1855''s expeditions — an effort borrows repos without the owning projects'' membership lists changing. Ephemeral projects are probably subsumed by expeditions rather than a separate feature.\n\n**b) Governor attention is not wired to primacy.** A PR on an owned repo that arose from another project''s convoy (or a human, or an expedition) should enter the *owning* governor''s attention queue — review duty follows ownership, not convoy origin. Today watcher rows file under the association of what they watch (ADR 0020), which covers appearance but not duty. Touches ADR 0030 (governor entry point) and the demands/attention machinery.\n\n## Relations\n\n- #1855 (efforts/expeditions + operator-seat split) — (a) is its grants half made concrete\n- ADR 0020 (membership, primacy, association), ADR 0030 (governor), #1792 (mint-time downscoped credentials)\n- wheelhouse#17 — the fixture that surfaced this\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1859/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1855","id":5256702142,"node_id":"I_kwDORel_088AAAABOVLovg","number":1855,"title":"Efforts as first-class: expedition-scoped access, and splitting the operator-seat functions","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null},{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":2,"created_at":"2026-08-26T11:55:58Z","updated_at":"2026-09-30T11:33:44Z","closed_at":"2026-09-30T11:33:44Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"Design thread from the operator (2026-08-26), triggered by the wayfinding-access question: governors can''t chart cross-project maps (scoped credentials, by design), everyone-reads-everything is wrong, and one über-manager session doing it all is also wrong. Proposed untying:\n\n**1. Access attaches to undertakings, not agents.** An *effort* (expedition) is a first-class thing: destination, charter, duration, and an effort-scoped grant (the #1792 mint-time downscoping is the mechanism) that widens a steward''s reach for exactly that undertaking and dies with it. Under this model any governor can lead a wayfinding expedition — ''requesting expedition scope'' is a Demand, not a dead end. Standing roles stay narrow at rest.\n\n**2. The operator-seat splits by function.** The current governor-of-governors session decomposes into standing functions matching the nautical meta-agent scheme: fleet operations (generations/deploys/unjamming — most automatable, event-driven), triage-and-dispatch (issue→crew flow, shepherd oversight), credential/infra stewardship (Purser-shaped), cross-project attention (DAG/drift). Each needs only its function''s access. The irreducible remainder is the *ruling partner* — grills, rulings, destination-setting sit with the human by nature; that seat holds the pen, not the other four jobs.\n\n**3. Wayfinding division of labor**: charting = an expedition (capability-heavy, HITL); working the map = distributed to scoped governors/crews as today. Cross-project maps need a portfolio-level tracker home.\n\nNeeds grills before contracts: the effort/expedition resource shape (charter, grant, lifetime, map binding), which function graduates to a standing agent first (fleet-ops is the strongest candidate — this week''s generation cycles were 90% mechanical), and how expedition grants compose with containment. Relates: the meta-agent vision, #1796 (per-source credentials), #1790 (demand declarations), ADR 0030.","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1855/timeline","performed_via_github_app":null,"state_reason":"not_planned","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1754","id":5235415965,"node_id":"I_kwDORel_088AAAABOA4bnQ","number":1754,"title":"Support Definitions-class CRUD through HTTP/Kubernetes backends","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444313,"node_id":"LA_kwDORel_088AAAACaLI2GQ","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/bug","name":"bug","color":"d73a4a","default":true,"description":"Something isn''t working","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T13:42:47Z","updated_at":"2026-09-30T11:33:42Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nAfter `WorkflowTemplate` moves to `ReplicationClass::Definitions` in #1747, its `TypedResolver::create`, `update`, and `delete` paths redirect through `DefinitionResolver`. Definition authoring currently requires `ResourceBackend::local_root()`, which rejects `ResourceBackend::Http` with `HTTP backends cannot author definitions`.\n\nAs a result, the real-Kubernetes paths in `crates/flotilla-resources/examples/k8s_crud.rs` and the ignored `k8s_integration.rs::convoy_controller_roundtrip_and_cel_validation` test can no longer perform `WorkflowTemplate` CRUD through `HttpBackend::from_kubeconfig`.\n\nThis is not exercised by normal CI and does not affect #1747''s local/replica reconciler fix, but it conflicts with real Kubernetes as an intended backing-store target.\n\n## Expected\n\nDefinitions-class CRUD should have a supported semantic for a pure HTTP/Kubernetes backend, and the example plus real-cluster integration test should exercise it.\n\n## Context\n\nFound by the final automated review on #1747: https://github.com/flotilla-org/flotilla/pull/1747#issuecomment-5396061143\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1754/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1755","id":5235430339,"node_id":"I_kwDORel_088AAAABOA5Tww","number":1755,"title":"Definitions-class resources cannot be authored through an HTTP/Kubernetes backend","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T13:44:11Z","updated_at":"2026-09-30T11:33:40Z","closed_at":"2026-09-30T11:33:40Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #1747 review (final round): making `WorkflowTemplate` `ReplicationClass::Definitions` means all its authoring paths call `local_root()`, which is a hard error for `ResourceBackend::Http` (\"HTTP backends cannot author definitions\"). The `k8s_crud.rs` example and the `#[ignore]`d `k8s_integration.rs` roundtrip both drive WorkflowTemplate CRUD against a real cluster and now fail at runtime — uncaught by CI (env-gated/ignored).\n\nADR 0002 names real Kubernetes as an intended later backing store; #1747 silently forecloses that for definitions-class kinds. Needs either: definitions authoring semantics for single-source-of-truth backends (where the store itself is the one root, so local_root has a natural answer), or an explicit ruling that definitions-class kinds are federation-only with the example/test updated to say so. Applies to every Definitions-class kind, not just WorkflowTemplate.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1755/timeline","performed_via_github_app":null,"state_reason":"not_planned","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1750","id":5234848790,"node_id":"I_kwDORel_088AAAABOAV0Fg","number":1750,"title":"Compact deleted definition records for prepared workflow snapshots","user":{"login":"flotilla-crew[bot]","id":309902803,"node_id":"BOT_kgDOEni90w","avatar_url":"https://avatars.githubusercontent.com/u/269690888?v=4","gravatar_id":"","url":"https://api.github.com/users/flotilla-crew%5Bbot%5D","html_url":"https://github.com/apps/flotilla-crew","followers_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/followers","following_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/following{/other_user}","gists_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/gists{/gist_id}","starred_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/subscriptions","organizations_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/orgs","repos_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/repos","events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/events{/privacy}","received_events_url":"https://api.github.com/users/flotilla-crew%5Bbot%5D/received_events","type":"Bot","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T12:44:44Z","updated_at":"2026-09-30T11:33:38Z","closed_at":null,"assignee":null,"author_association":"CONTRIBUTOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Problem\n\nAfter #1742 moves `WorkflowTemplate` to `ReplicationClass::Definitions`, prepared workflow snapshot GC writes a convergent `$deleted` definition record instead of physically removing the local row. This is correct for fleet convergence and prevents replica resurrection, but every distinct content-addressed `workflow-snapshot-*` spec can leave durable causal state indefinitely.\n\n## Scope\n\nDesign safe compaction for deleted Definitions records once every relevant replica has observed the tombstone (or establish a bounded-retention alternative). This should cover local objects, replica rows, events, and tombstones without allowing an offline root to resurrect a deleted definition.\n\n## Context\n\nRaised during review of #1747. A raw hard-delete bypass in `PreparedSnapshotGarbageCollector` is not safe: another root can still retain and later replay the definition. This requires a definitions-level causal compaction policy rather than a snapshot-specific delete shortcut.","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1750/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1751","id":5234972971,"node_id":"I_kwDORel_088AAAABOAdZKw","number":1751,"title":"Definitions-view template listing is a full CRDT merge scan per project reconcile","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10347495064,"node_id":"LA_kwDORel_088AAAACaMI-mA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/from-review","name":"from-review","color":"BFD4F2","default":false,"description":"Issue filed from PR review feedback","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-24T12:58:20Z","updated_at":"2026-09-30T11:33:36Z","closed_at":"2026-09-30T11:33:36Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":null,"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"From PR #1747 review (final round): the ops-entry stale-template cleanup sweep (`reconcile_project_operational_entries`) lists WorkflowTemplates through the Definitions view, which merges local + all replica sources for every template *and* every still-live prepared workflow snapshot, once per project reconcile. Fine at current fleet scale; flagged as worth watching. Interacts with #1750 (snapshot tombstone compaction) — compaction shrinks the scan''s input.\n\nNot urgent — file under efficiency; revisit when template/snapshot counts grow or reconcile latency shows up.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1751/timeline","performed_via_github_app":null,"state_reason":"not_planned","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1928","id":5552130498,"node_id":"I_kwDORel_088AAAABSu7Jwg","number":1928,"title":"Admission-time dispatch decision layer: one context bundle → model, harness, convoy topology, placement; pluggable deciders (static / router / reasoning)","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":3,"created_at":"2026-09-23T10:34:00Z","updated_at":"2026-09-30T11:33:34Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## The cut\n\nDispatch-time choices — which model, which harness/adapter, what convoy topology, which placement, how much review — are today each hardcoded or hand-passed in different ways (capability table for adapter, `--agent` for model, static workflow-template vessel set for topology). They are all the **same kind of thing**: a decision made at convoy admission, from context, that could be static, routed, or reasoned. We should set them up **similarly**, behind one layer, rather than growing a bespoke path per decision.\n\nRobert, 2026-09-23: \"we can use that kind of thing (with the right context about the whole task/fleet/model and harness guidance) decide quite a few things in one shot (convoy topology — ''do we need a windows test vessel''). … we don''t have to decide everything one way (periodically refreshed static dispatch could work fine for some stuff, a fuller reasoning llm maybe needed for more complex ones), but we probably want to set it all up similarly.\"\n\n## Shape\n\nAn **admission-time dispatch decision layer**: given a common **context bundle**, produce a **decision bundle**, via a **pluggable decider** per decision-class.\n\n**Context bundle** (assembled once at admission):\n- Task: issue body/labels, repo(s), change scope, cross-platform/vision/tool needs, prior-attempt outcomes.\n- Fleet: hosts, their OSes, capacity, which adapters/images each offers, current load.\n- Catalog + guidance: available models & harnesses and their guidance (cost/latency/capability), project/governor policy.\n\n**Decision bundle** (some or all, in one shot):\n- Crew **model** per capability — #1927 (governor→fable, code→opus static; Jev-routed later).\n- **Adapter/harness** per capability — generalizes today''s static capability table (code→codex; claude-code when codex pool broken).\n- **Convoy topology** — the vessel set: e.g. add a **Windows/macOS test vessel** when the task needs cross-platform verification, a review vessel, extra coders for a wide task.\n- **Placement policy** — which host/policy per vessel (OS/capability constraints, load).\n- Possibly: review stance, concurrency, retry-escalation.\n\n**Pluggable deciders (one interface, chosen per class / per complexity):**\n- **Static, periodically-refreshed** rules — cheap, deterministic; fine for stable decisions (the per-role model default is this).\n- **Fast router / classifier** — Jev-style (see #1927 comment): well-defined decision space, cheap, fast.\n- **Full reasoning LLM** — for complex/novel topology; plausibly the **governor** itself.\n- Common interface + **fallback chain** (reasoning → router → static floor), so a missing key/decider degrades to a sane default, never a hard fail. Mirrors jev-router''s `JevDecider`-else-`RulesDecider`.\n\n## Why one layer (substrate argument)\n\n- The context bundle is expensive to assemble and identical across decisions — assemble once, decide many.\n- A single decider call can make **jointly-consistent** choices (a Windows test vessel *and* a placement that has a Windows host *and* the right harness there) — separate paths can''t see each other''s choices.\n- Recording is uniform: the workflow snapshot already stores effective adapter/model at admission; extend it to the whole decision bundle for **audit/replay/determinism** (record decider identity + inputs + outputs).\n- Guardrails compose in one place: a decider can''t pick a host without the required OS/adapter, can''t exceed project policy.\n\n## Relationship to existing work\n- **#1927** — model selection — becomes the first decision-class instance (static default = the floor; Jev = the router decider).\n- **Capability table** (adapter selection) — folds in as another class (currently static; see [[feedback_dispatch_engine_from_table]]).\n- **Meta-agents** — this is squarely Quartermaster/Bosun territory (provisioning/topology decisions); see the meta-agent vision. The \"full reasoning decider\" may just be a meta-agent.\n- Adjacent: convoy topology is defined statically by the workflow template today; this makes it a decision.\n\n## Open questions\n- One decision call emitting the whole bundle, vs per-class calls sharing the context? (Lean: one bundle for consistency, but classes can opt into cheaper independent deciders.)\n- Where it lives: admission / a reconciler / a new `DispatchPlan` resource that the convoy admission consumes?\n- Is the governor the reasoning decider, or is it separate middleware the governor invokes?\n- How the decision bundle is represented and recorded (extend the workflow snapshot vs a first-class `DispatchPlan`).\n- Determinism & guardrails: bound the decider to policy; make decisions replayable.\n\n## Not yet\nBrainstorm — this is the framing/cut, not an implementation. First concrete slice is #1927''s static per-role default; topology-as-decision (the Windows-test-vessel case) is the second worth prototyping once the interface exists.\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1928/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1501","id":5151291171,"node_id":"I_kwDORel_088AAAABMwp3Iw","number":1501,"title":"Issue-driven crew engine selection: labels drive capability-table lookup","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10346444324,"node_id":"LA_kwDORel_088AAAACaLI2JA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/enhancement","name":"enhancement","color":"a2eeef","default":true,"description":"New feature or request","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-14T11:48:51Z","updated_at":"2026-09-30T11:33:32Z","closed_at":"2026-09-30T11:33:32Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Parent\n\n#1440 ruling (2026-08-14), point 2.\n\n## The idea\n\nEngine/model choice per convoy should not be an inline governor judgment (context-poisoning risk, and it''s a rarity when genuinely needed). Direction sketched by Robert:\n\n- **Labels on the issue drive a lookup in the capability table** — e.g. a label (or issue type) maps to a capability row, which names adapter + model. Dispatch reads the issue, not the dispatcher''s mood.\n- **Where selection genuinely needs judgment**, it is a *separate call with its own context* (issue body + table + budget facts), not a decision made inline by an agent mid-way through other work.\n- Composes with the \"more adaptive later\" direction: per-project defaults, budget-driven switching.\n\nNeeds design: label vocabulary vs capability keys, where the mapping lives (WorkflowTemplate? capability table? project spec?), and what the selection call''s contract is.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1501/timeline","performed_via_github_app":null,"state_reason":"not_planned","pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1879","id":5440075581,"node_id":"I_kwDORel_088AAAABRED3PQ","number":1879,"title":"Harness-specific behaviour as one adapter with named aspects, not per-command branching","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10362697938,"node_id":"LA_kwDORel_088AAAACaao40g","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/vision","name":"vision","color":"D4C5F9","default":false,"description":"Long-term direction","archived_at":null,"archived_by":null}],"state":"open","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-09-13T12:38:24Z","updated_at":"2026-09-30T11:33:29Z","closed_at":null,"assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32035970,"node_id":"IT_kwDOEBMoCM4B6NSC","name":"Brainstorm","description":"Needs brainstorming","color":"purple","created_at":"2026-03-20T23:03:42Z","updated_at":"2026-03-20T23:03:42Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## What to design (Brainstorm — grill before building)\n\nPrompted by #1875: a codex background delegate ran `flotilla crew complete` and the daemon could not tell it from the top-level crew session. For codex there is a precise tell (`CODEX_THREAD_ID` on every exec''d command; the thread''s rollout opens with a `subagent.thread_spawn` source), but it is harness-specific, and the same will be true of the next facts crew verbs need from a harness: which session to resume after a premature exit, whether the caller is inside a tool call or between turns, which model/thread produced an artifact.\n\nThe repo already carries two harness-specific seams, both healthy in isolation:\n\n- `HarnessHookParser` (`crates/flotilla-core/src/agents/hooks.rs`) — normalises what a harness *emits* (native hook payloads → `AgentHookEvent`).\n- `AgentMaterialAdapter` (`crates/flotilla-daemon/src/agent_material.rs`) — provisions what a harness *needs* (config home, credentials, skills).\n\nThe risk is a third trait for what a harness *is doing at call time*, then a fourth, each with its own codex/claude/gemini impl and `match harness` branches inside individual commands. Robert''s framing (2026-09-13): harness-specific behaviour across commands needs a single hook-like aspect, not sprawl.\n\nShape to grill:\n\n- **One harness adapter per `AgentHarness`, several named aspects.** The adapter is the unit of registration; aspects are optional capabilities it may implement (material, hook parsing, caller context, session resume). A harness that lacks a tell for an aspect says so explicitly, and the consuming policy treats \"unknown\" as a first-class answer.\n- **Commands consume normalised facts, never harness identity.** A crew verb sees a `CallerContext { harness, session, class: TopLevel | Delegate | Unknown }` resolved once at the boundary where the contained launcher''s call enters the daemon; no command matches on \"codex\".\n- **Where resolution runs.** In the contained launcher (has the caller''s env, can read the rollout under the mounted codex home) versus in the daemon (trusts a context the CLI sends in its envelope). Same trust domain either way, but it decides whether the adapter code lives crew-side or daemon-side.\n- **Which existing seams fold in.** Does `HarnessHookParser` become the \"events\" aspect of the same adapter, and does the material adapter''s `requires_skills_for_prepare`-style policy move with it? Or do the two stay where they are and only the registry is shared?\n- **What the ledger invariant leaves for the hook.** #1875 makes ledger-less completion refusable without any harness knowledge. The harness aspect only improves the *message* and catches delegates that do post a ledger. Decide whether that is worth a resolution path at all, or whether \"unknown\" plus the ledger is the whole answer for non-codex harnesses.\n\nOut of scope: any new harness integration; the design is for how the existing three (codex, claude-code, gemini parser stub) and their aspects are organised.\n\nRelation: #1875 (ledger invariant, codex tell recorded there), #1876 (caller identity at the socket), #1216 (re-engagement / session resume is the next consumer of the same aspect).\n","closed_by":null,"reactions":{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/reactions","total_count":0,"+1":0,"-1":0,"laugh":0,"hooray":0,"confused":0,"heart":0,"rocket":0,"eyes":0},"timeline_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1879/timeline","performed_via_github_app":null,"state_reason":null,"pinned_comment":null},{"url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1489","repository_url":"https://api.github.com/repos/flotilla-org/flotilla","labels_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1489/labels{/name}","comments_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1489/comments","events_url":"https://api.github.com/repos/flotilla-org/flotilla/issues/1489/events","html_url":"https://github.com/flotilla-org/flotilla/issues/1489","id":5146989052,"node_id":"I_kwDORel_088AAAABMsjR_A","number":1489,"title":"Review agent adapter machinery for duplicated seeding/delivery patterns","user":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","received_events_url":"https://api.github.com/users/rjwittams/received_events","type":"User","user_view_type":"public","site_admin":false},"labels":[{"id":10364863924,"node_id":"LA_kwDORel_088AAAACactFtA","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/refactor","name":"refactor","color":"FBCA04","default":false,"description":"Code restructuring for maintainability","archived_at":null,"archived_by":null},{"id":10429583487,"node_id":"LA_kwDORel_088AAAACbabQfw","url":"https://api.github.com/repos/flotilla-org/flotilla/labels/provider","name":"provider","color":"411f2f","default":false,"description":"related to provider infra or implementation.","archived_at":null,"archived_by":null}],"state":"closed","locked":false,"assignees":[],"milestone":null,"comments":1,"created_at":"2026-08-14T00:26:41Z","updated_at":"2026-09-30T11:33:28Z","closed_at":"2026-09-30T11:33:28Z","assignee":null,"author_association":"COLLABORATOR","issue_field_values":[],"type":{"id":32015452,"node_id":"IT_kwDOEBMoCM4B6IRc","name":"Task","description":"A specific piece of work","color":"yellow","created_at":"2026-03-20T09:49:51Z","updated_at":"2026-03-20T09:49:51Z","is_enabled":true},"active_lock_reason":null,"sub_issues_summary":{"total":0,"completed":0,"percent_completed":0},"issue_dependencies_summary":{"blocked_by":0,"total_blocked_by":0,"blocking":0,"total_blocking":0},"body":"## Why\n\nOperator suspicion (2026-08-14), worth a deliberate pass once the current wave settles: per-agent adapter machinery is accreting parallel implementations of the same jobs, and the third or fourth agent CLI will copy-paste whichever it finds first.\n\nConcrete suspects already in-tree:\n- **Config-home seeding**: codex slot leasing seeds `CODEX_HOME` per slot (#1235); claude now seeds `CLAUDE_CONFIG_DIR/.claude.json` non-secret state (`hasCompletedOnboarding`, workspace trust, settings overlay — #1488). Same shape — isolated per-crew config home, pre-answered bring-up — two implementations.\n- **Credential delivery**: `claude-oauth` (process-env token), `github-app` (installation token), `forgejo` consumers; per-adapter admission checks (#1488 added the claude one — do codex/others fail fast the same way, or hang?).\n- **Bring-up contracts**: \"reaches its prompt with no interactive step, or errors by name\" is now a claude-specific guarantee; it should be an adapter trait obligation with per-adapter implementations.\n- Prior art: the multi-crew agent config seeding research (docs/research, #1200/#1118) already tabulated per-CLI config resolution, auth minima, and isolation mechanisms — the review should reconcile implementations against that table rather than re-deriving.\n\n## What to do\n\nA review-then-extract pass, not a rewrite: inventory the per-adapter machinery (seeding, delivery, admission, bring-up verification, model/flavor selection), name the shared seams (likely: per-crew config-home provisioning as a trait obligation; credential injection as consumer-adapter composition; a bring-up contract test run against every adapter), and extract only what two-plus adapters already duplicate. Output: a short findings doc plus the extraction issues, sized as convoys.\n\n## Blocked by\n\nNothing hard; sensibly after #1488 and the #1475 cull land so the review sees the settled shapes.\n","closed_by":{"login":"rjwittams","id":752137,"node_id":"MDQ6VXNlcjc1MjEzNw==","avatar_url":"https://avatars.githubusercontent.com/u/752137?v=4","gravatar_id":"","url":"https://api.github.com/users/rjwittams","html_url":"https://github.com/rjwittams","followers_url":"https://api.github.com/users/rjwittams/followers","following_url":"https://api.github.com/users/rjwittams/following{/other_user}","gists_url":"https://api.github.com/users/rjwittams/gists{/gist_id}","starred_url":"https://api.github.com/users/rjwittams/starred{/owner}{/repo}","subscriptions_url":"https://api.github.com/users/rjwittams/subscriptions","organizations_url":"https://api.github.com/users/rjwittams/orgs","repos_url":"https://api.github.com/users/rjwittams/repos","events_url":"https://api.github.com/users/rjwittams/events{/privacy}","recei