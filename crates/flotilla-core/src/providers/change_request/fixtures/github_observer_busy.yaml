    cwd: /
    stdout: "HTTP/2.0 200 OK\nAccess-Control-Allow-Origin: *\r\nAccess-Control-Expose-Headers: ETag, Link, Location, Retry-After, X-GitHub-OTP, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Used, X-RateLimit-Resource, X-RateLimit-Reset, X-OAuth-Scopes, X-Accepted-OAuth-Scopes, X-Poll-Interval, X-GitHub-Media-Type, X-GitHub-SSO, X-GitHub-Request-Id, Deprecation, Sunset, Warning\r\nContent-Security-Policy: default-src 'none'\r\nContent-Type: application/json; charset=utf-8\r\nDate: Fri, 02 Oct 2026 08:46:24 GMT\r\nReferrer-Policy: origin-when-cross-origin, strict-origin-when-cross-origin\r\nServer: github.com\r\nStrict-Transport-Security: max-age=31536000; includeSubdomains; preload\r\nVary: Accept-Encoding, Accept, X-Requested-With\r\nX-Content-Type-Options: nosniff\r\nX-Frame-Options: deny\r\nX-Github-Edge-Region: uksouth\r\nX-Github-Media-Type: github.v4; format=json\r\nX-Github-Request-Id: 6B78:345052:4E20AC:574DEB:6ABF6F5F\r\nX-Ratelimit-Limit: 5000\r\nX-Ratelimit-Remaining: 4919\r\nX-Ratelimit-Reset: 1790933151\r\nX-Ratelimit-Resource: graphql\r\nX-Ratelimit-Used: 81\r\nX-Xss-Protection: 0\r\n\r\n{\"data\":{\"repository\":{\"pr2320\":{\"title\":\"fix: wake crews for unaddressed PR review feedback\",\"state\":\"MERGED\",\"isDraft\":false,\"headRefOid\":\"1256f96194276ce7b7c7d4fa614d6782dbf1fabf\",\"reviewDecision\":null,\"mergeable\":\"UNKNOWN\",\"author\":{\"login\":\"flotilla-crew\"},\"reviewRequests\":{\"pageInfo\":{\"hasNextPage\":false},\"nodes\":[]},\"comments\":{\"pageInfo\":{\"hasPreviousPage\":false,\"startCursor\":\"Y3Vyc29yOnYyOpHPAAAAAWCZg1c=\"},\"nodes\":[{\"databaseId\":5915640663,\"createdAt\":\"2026-09-30T16:44:01Z\",\"author\":{\"login\":\"claude\",\"__typename\":\"Bot\"},\"body\":\"## Review (static)\\n\\nThe approach fits: it reuses the batched GraphQL observation, surfaces truncation as an error, and adds test coverage for the main paths. I found a few behavioural concerns.\\n\\n### 1. Superseded `CHANGES_REQUESTED` reviews stay actionable (likely regression)\\n`crates/flotilla-core/src/change_request_observer.rs`, in `parse_gh_observation`:\\n\\n```rust\\nreviews.is_some_and(|items| items.iter().any(|review| review[\\\"state\\\"] == \\\"CHANGES_REQUESTED\\\" && unaddressed(review)))\\n```\\n\\n- Review history is append-only. A reviewer who requests changes and later approves leaves the old review in `reviews` with state `CHANGES_REQUESTED`. Only `reviewDecision` reflects the latest state.\\n- Once `reviews` is present, `reviewDecision` is ignored (the `reviews.is_none()` fallback). That PR stays `actionable_at_head == true` until the crew posts a marker, even though it is approved.\\n- Before this PR the code used `reviewDecision == CHANGES_REQUESTED`, which handled this case.\\n- Suggested fix: consider only each reviewer's latest non-`COMMENTED` review. Or require `reviewDecision == CHANGES_REQUESTED` as well for the formal-review branch. Add a test for request-changes followed by approve.\\n\\n### 2. Every non-crew comment after head is actionable\\n- Any comment or review not authored by `flotilla-crew` with a timestamp after the head commit counts as unaddressed.\\n- That includes other bots (codecov, github-actions, dependabot) and the human author's own \\\"thanks\\\" or \\\"LGTM\\\" comments.\\n- Each one wakes the crew until it writes a `pr-shepherd-addresses:` marker.\\n- The crew can't sensibly mark every such comment, so this could cause wake loops. Consider an allowlist or denylist of authors, ignoring `APPROVED` and `COMMENTED` reviews with empty bodies, and ignoring bot authors unless configured.\\n\\n### 3. Head cutoff uses `committedDate`\\n- Comparing against `commits.last.committedDate` can be wrong. A commit authored or committed locally before a review but pushed after it makes the feedback look stale, so it is silently dropped.\\n- Backdated or rebased commits have the same problem.\\n- The push time would be more robust, for example a `HeadRefForcePushedEvent` or `PullRequestCommit` timeline item. If that is too costly, please document the limitation.\\n- The timestamp comparison is on strings. That is fine for GitHub's `Z` ISO-8601 format, but a comment would help.\\n\\n### 4. Truncation becomes a permanent error\\n- PRs with more than 100 comments, more than 100 reviews or threads, or a thread with more than 10 comments return `Err` on every observation. Long-lived PRs can never recover, and the crew is never woken.\\n- Consider paginating (`before` cursor), or at least filing a follow-up issue. Busy PRs with bot chatter will hit this.\\n- Query cost is also worth a check: up to about 100 + 100 + 100×10 comment nodes with bodies, per PR, in a single batched query across a repo. That risks the GraphQL node and complexity limits and a large payload with many convoys.\\n\\n### Minor\\n- `CREW_GITHUB_LOGIN` is hard-coded. Consider config or environment injection, since a different App name silently disables marker handling.\\n- `leaf_engine.rs` test: `if source == \\\"review\\\"` makes the assertion conditional. Assert per case, or split the test.\\n- The `started_for=` label change in `cli.rs` prints `request.bound`. Check that no other CLI tests depend on the old `bound=` text.\\n- No test covers `APPROVED` after `CHANGES_REQUESTED` (item 1) or a marker ID in a non-crew comment being ignored (the security-relevant path).\\n\\nSchema note: the PR states no serialized resource shape changed. That looks right, since the change is observation-only.\\n\"},{\"databaseId\":5915648560,\"createdAt\":\"2026-09-30T16:44:31Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"## Decision ledger\\n\\n1. **Brief silence:** The review did not define how to decide whether acknowledgment text is substantive feedback.\\n- **Choice:** Ignore empty text and common acknowledgment-only bodies (`thanks`, `thank you`, `lgtm`, `+1`, `approved`), and exclude the PR author's own comments. Keep other human feedback actionable.\\n- **Alternative:** Treat every human comment as actionable, which would wake crews for routine conversation.\\n- **If asking were free:** Which acknowledgment phrases should be ignored by policy?\\n\\n2. **Brief silence:** The review did not specify how to classify bots in GitHub GraphQL.\\n- **Choice:** Query `author.__typename`, exclude Bot authors except the configured claude-review Action login `claude`, and continue trusting address markers only from `flotilla-crew`.\\n- **Alternative:** Maintain a denylist of known bot logins, which would miss newly installed bots.\\n- **If asking were free:** Should configured review bot identities live in repository or host configuration?\\n\\n3. **Brief silence:** The review offered either latest formal review per reviewer or a `reviewDecision` gate for superseded requests.\\n- **Choice:** Use each reviewer's latest non-COMMENTED, non-PENDING review. This preserves actionable requests from one reviewer even if another reviewer approved, and ignores superseded requests.\\n- **Alternative:** Gate all formal requests on aggregate `reviewDecision == CHANGES_REQUESTED`.\\n- **If asking were free:** Should a later approval with substantial text remain actionable as ordinary review feedback?\\n\\n4. **Brief silence:** The issue did not prescribe how to handle review histories longer than a bounded GitHub GraphQL page.\\n- **Choice:** Keep the repository-batched observation request, cap each connection, and report a per-PR observation error if any review page is truncated. Track pagination in #2327.\\n- **Alternative:** Fetch additional pages for individual PRs in this review round, increasing request count and quota use.\\n- **If asking were free:** What additional per-PR pagination budget is acceptable?\\n\\n5. **Brief silence:** The issue did not name the source of the crew GitHub identity for filtering self comments.\\n- **Choice:** Use `flotilla-crew`, the crew App login returned by the GitHub GraphQL Author field; a live response confirmed that GraphQL omits REST's `[bot]` suffix.\\n- **Alternative:** Infer the identity from the PR author or the daemon's GitHub viewer, either of which may be a different account.\\n- **If asking were free:** Should crew forge identity become an explicit configured field when more than one crew App exists?\\n\\n6. **Brief silence:** The issue did not define the timestamp used for “after the head commit.”\\n- **Choice:** Keep the head commit's `committedDate` in the batched GraphQL response, document its push-time limitation, and track a push-time correction in #2326.\\n- **Alternative:** Add timeline reads for push events in this review round.\\n- **If asking were free:** Should review actionability use commit time or the time GitHub accepted the head push?\\n\\n7. **Brief silence:** The issue allowed review text or links in the delivered turn without specifying storage or format.\\n- **Choice:** Include the PR review URL in the existing review-round turn brief.\\n- **Alternative:** Persist comment bodies or URLs in the serialized ChangeRequest status.\\n- **If asking were free:** Is the PR review URL sufficient context for the crew, or should the turn carry direct links to each feedback item?\\n\\n8. **Brief silence:** The issue allowed either renaming `bound=` or adding a discovered marker to `convoy explain`.\\n- **Choice:** Rename the output label to `started_for=` while retaining the serialized field shape.\\n- **Alternative:** Add another printed marker alongside `bound=`.\\n- **If asking were free:** Which label would operators find clearest for a PR named in the convoy spec?\\n\"},{\"databaseId\":5916317339,\"createdAt\":\"2026-09-30T17:27:53Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"Addressed the static review in commit `8567d89f`.\\n\\n1. Formal review actionability now uses each reviewer's latest non-COMMENTED, non-PENDING review. A regression test covers CHANGES_REQUESTED followed by APPROVED, including feedback in the superseded review.\\n2. The GraphQL read now includes PR author, review body, and actor type. We ignore unrelated bots, the PR author's comments, empty reviews, and common acknowledgment-only bodies. The configured `claude` review bot remains actionable. Tests cover bot chatter, empty APPROVED/COMMENTED reviews, and a non-crew marker that cannot suppress feedback.\\n3. The `committedDate` cutoff limitation is documented at the comparison site. Replacing it with GitHub's head push time needs a separate timeline/API design and is tracked in #2326.\\n4. Truncated histories still produce a visible observation error; bounded pagination and query budget are tracked in #2327.\\n\\nThe crew App login remains `flotilla-crew` for this deployment. The `leaf_engine` assertion now checks the review link for both review and non-review cases. I searched the CLI source and tests for `bound=`/`started_for=` and found no test depending on the old output label. No replay fixtures were changed.\\n\\nLocal gates passed: `cargo +nightly-2026-03-12 fmt --check`, `cargo clippy --workspace --all-targets --locked -- -D warnings`, and `cargo test --workspace --locked`.\\n\"},{\"databaseId\":5916321886,\"createdAt\":\"2026-09-30T17:28:11Z\",\"author\":{\"login\":\"claude\",\"__typename\":\"Bot\"},\"body\":\"## Review (static, follow-up)\\n\\nThe earlier concerns are addressed in `8567d89`:\\n- Superseded `CHANGES_REQUESTED` reviews: only each reviewer's latest non-`COMMENTED`/non-`PENDING` review counts, and there is a regression test.\\n- Bot and self chatter: the PR author, unrelated bots, empty reviews, and acknowledgment-only bodies are filtered out. Marker IDs only count when the crew authored them.\\n- `committedDate` cutoff: documented at the comparison site and tracked in #2326.\\n- Truncation and pagination: tracked in #2327.\\n\\nI found no blocking issues. A few small observations on `parse_gh_observation`:\\n\\n1. **Formal `CHANGES_REQUESTED` is not time-gated.** It stays actionable until the reviewer approves or the crew posts a marker, even after the crew pushes a fix. That matches the old `reviewDecision` behaviour, so it is probably intended. A comment saying so would help.\\n2. **Resolved threads still count.** Comments in a resolved `reviewThread` posted after the head commit still wake the crew. If that is unwanted, select `isResolved` in the query and skip resolved threads. Otherwise a short note is enough.\\n3. **`login == \\\"claude\\\"` is hard-coded** next to `CREW_GITHUB_LOGIN`. A human account named `claude` would also match. Consider a named constant, and `__typename == \\\"Bot\\\"` if that login is always a bot.\\n4. **The acknowledgment list is exact-match only.** \\\"Thanks!\\\" or \\\"LGTM.\\\" still wakes the crew. Trimming trailing punctuation would be cheap.\\n5. **The mixed `CHANGES_REQUESTED` and `COMMENTED` case may lack a test.** I couldn't find one for a reviewer whose latest formal review is `APPROVED` but who also has a newer `COMMENTED` body after the head.\\n\\nSchema note: the observation-only change and the \\\"no serialized shape change\\\" statement look right.\\n\\nNothing here should block merge.\"},{\"databaseId\":5916428314,\"createdAt\":\"2026-09-30T17:35:08Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"## Decision ledger\\n\\n1. **Brief silence:** The review did not define how to decide whether acknowledgment text is substantive feedback.\\n- **Choice:** Ignore empty text and common acknowledgment-only bodies (`thanks`, `thank you`, `lgtm`, `+1`, `approved`), and exclude the PR author's own comments. Keep other human feedback actionable.\\n- **Alternative:** Treat every human comment as actionable, which would wake crews for routine conversation.\\n- **If asking were free:** Which acknowledgment phrases should be ignored by policy?\\n\\n2. **Brief silence:** The review did not specify how to classify bots in GitHub GraphQL.\\n- **Choice:** Query `author.__typename`, exclude Bot authors except the configured claude-review Action login `claude`, and continue trusting address markers only from `flotilla-crew`.\\n- **Alternative:** Maintain a denylist of known bot logins, which would miss newly installed bots.\\n- **If asking were free:** Should configured review bot identities live in repository or host configuration?\\n\\n3. **Brief silence:** The review offered either latest formal review per reviewer or a `reviewDecision` gate for superseded requests.\\n- **Choice:** Use each reviewer's latest non-COMMENTED, non-PENDING review. This preserves actionable requests from one reviewer even if another reviewer approved, and ignores superseded requests.\\n- **Alternative:** Gate all formal requests on aggregate `reviewDecision == CHANGES_REQUESTED`.\\n- **If asking were free:** Should a later approval with substantial text remain actionable as ordinary review feedback?\\n\\n4. **Brief silence:** The issue did not prescribe how to handle review histories longer than a bounded GitHub GraphQL page.\\n- **Choice:** Keep the repository-batched observation request, cap each connection, and report a per-PR observation error if any review page is truncated. Track pagination in #2327.\\n- **Alternative:** Fetch additional pages for individual PRs in this review round, increasing request count and quota use.\\n- **If asking were free:** What additional per-PR pagination budget is acceptable?\\n\\n5. **Brief silence:** The issue did not name the source of the crew GitHub identity for filtering self comments.\\n- **Choice:** Use `flotilla-crew`, the crew App login returned by the GitHub GraphQL Author field; a live response confirmed that GraphQL omits REST's `[bot]` suffix.\\n- **Alternative:** Infer the identity from the PR author or the daemon's GitHub viewer, either of which may be a different account.\\n- **If asking were free:** Should crew forge identity become an explicit configured field when more than one crew App exists?\\n\\n6. **Brief silence:** The issue did not define the timestamp used for “after the head commit.”\\n- **Choice:** Keep the head commit's `committedDate` in the batched GraphQL response, document its push-time limitation, and track a push-time correction in #2326.\\n- **Alternative:** Add timeline reads for push events in this review round.\\n- **If asking were free:** Should review actionability use commit time or the time GitHub accepted the head push?\\n\\n7. **Brief silence:** The issue allowed review text or links in the delivered turn without specifying storage or format.\\n- **Choice:** Include the PR review URL in the existing review-round turn brief.\\n- **Alternative:** Persist comment bodies or URLs in the serialized ChangeRequest status.\\n- **If asking were free:** Is the PR review URL sufficient context for the crew, or should the turn carry direct links to each feedback item?\\n\\n8. **Brief silence:** The issue allowed either renaming `bound=` or adding a discovered marker to `convoy explain`.\\n- **Choice:** Rename the output label to `started_for=` while retaining the serialized field shape.\\n- **Alternative:** Add another printed marker alongside `bound=`.\\n- **If asking were free:** Which label would operators find clearest for a PR named in the convoy spec?\\n\"},{\"databaseId\":5917363639,\"createdAt\":\"2026-09-30T18:35:03Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"On finding 1 in https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5916321886: fixed in `1256f961`. The code now explains why a formal `CHANGES_REQUESTED` review remains actionable across head commits until approval or crew acknowledgment. The existing behavior test covers that persistence.\\n\"},{\"databaseId\":5917363939,\"createdAt\":\"2026-09-30T18:35:04Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"On finding 2 in https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5916321886: fixed in `1256f961`. The GraphQL query now selects `isResolved`, and the observer skips resolved threads. A regression test checks both resolved and unresolved threads.\\n\"},{\"databaseId\":5917364350,\"createdAt\":\"2026-09-30T18:35:06Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"On finding 3 in https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5916321886: fixed in `1256f961`. The review bot's GraphQL login is configurable as `[change_request].review_bot_login` in host config, defaulting to `claude`. Bot feedback requires both that login and `__typename == \\\"Bot\\\"`; the configuration is documented and tested.\\n\"},{\"databaseId\":5917364750,\"createdAt\":\"2026-09-30T18:35:07Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"On finding 4 in https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5916321886: fixed in `1256f961`. Acknowledgment matching now trims trailing `!`, `.`, and `?`, so `Thanks!` and `LGTM.` remain routine. Tests cover both examples.\\n\"},{\"databaseId\":5917368158,\"createdAt\":\"2026-09-30T18:35:21Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"On finding 5 in https://github.com/flotilla-org/flotilla/pull/2320#issuecomment-5916321886: fixed in `1256f961`. The regression test covers one reviewer requesting changes, then approving, then posting a newer substantive `COMMENTED` review after head. The later comment wakes the crew; an acknowledgment-only `COMMENTED` body does not. All five findings in this review are now addressed.\\n\\n<!-- pr-shepherd-addresses:5916321886 -->\\n\"},{\"databaseId\":5917369952,\"createdAt\":\"2026-09-30T18:35:28Z\",\"author\":{\"login\":\"claude\",\"__typename\":\"Bot\"},\"body\":\"## Review (static, final)\\n\\nI checked the earlier review threads against the current head (`1256f961`). Every finding raised so far has been addressed or has a follow-up issue:\\n\\n- Superseded `CHANGES_REQUESTED` reviews: fixed by using each reviewer's latest non-`COMMENTED`/non-`PENDING` review, with regression tests.\\n- Bot and self chatter, acknowledgment-only bodies, resolved threads, configurable review-bot login and trailing-punctuation handling: addressed in `1256f961`.\\n- The `committedDate` cutoff is documented and tracked in #2326.\\n- Truncated review history is surfaced as an observation error, with pagination and query budget tracked in #2327.\\n\\nI have no new blocking findings. One residual note: `CREW_GITHUB_LOGIN` is still a hard-coded constant. The decision ledger already flags this, so a config field is a reasonable follow-up if more than one crew App will exist.\\n\\nThe 'no serialized resource shape changed' statement looks right, since this is an observation-only change plus a CLI label rename.\"},{\"databaseId\":5917395598,\"createdAt\":\"2026-09-30T18:36:59Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"Thanks for the final review. The residual `CREW_GITHUB_LOGIN` note is tracked in #2331. The current deployment has one crew GitHub App, so the constant still matches the active marker author; #2331 covers passing the credential's actor identity through the observer when multiple crew Apps are supported. No other findings remain in this review.\\n\\n<!-- pr-shepherd-addresses:5917369952 -->\\n\"},{\"databaseId\":5917447993,\"createdAt\":\"2026-09-30T18:40:25Z\",\"author\":{\"login\":\"flotilla-crew\",\"__typename\":\"Bot\"},\"body\":\"## Decision ledger\\n\\n1. **Brief silence:** The final review noted that the crew App login remains fixed without specifying whether multi-App support is part of this PR.\\n- **Choice:** File #2331 for passing the active credential's actor identity into marker verification when multiple crew Apps are supported; keep the current single-App login for this round.\\n- **Alternative:** Add another host config field now without a second supported crew App or a clear source of identity.\\n- **If asking were free:** Should marker verification follow the active GitHub credential identity rather than a separately configured login?\\n\\n2. **Brief silence:** The review requested configurable review-bot identity without choosing its ownership layer.\\n- **Choice:** Add `change_request.review_bot_login` to host config, defaulting to `claude`; require the configured login to have GitHub GraphQL actor type `Bot`.\\n- **Alternative:** Put the identity in the replicated repository spec or use a fixed login.\\n- **If asking were free:** Should review-bot identity be shared per repository or set independently on each observing host?\\n\\n3. **Brief silence:** The review asked whether resolved threads should still wake crews.\\n- **Choice:** Exclude resolved review threads from actionable feedback, while keeping unresolved threads actionable.\\n- **Alternative:** Keep resolved comments actionable until a crew address marker is posted.\\n- **If asking were free:** Can a resolved thread ever represent work that the crew still needs to acknowledge?\\n\\n4. **Brief silence:** The review noted that formal `CHANGES_REQUESTED` reviews lack a head-time gate.\\n- **Choice:** Preserve their existing persistence across new head commits and document that they end when the reviewer approves or the crew acknowledges them.\\n- **Alternative:** Discard them after the next head commit, which could hide an unresolved formal request.\\n- **If asking were free:** Should a new push alone ever clear a formal change request?\\n\\n5. **Brief silence:** The review suggested trimming trailing punctuation from routine acknowledgments without defining its scope.\\n- **Choice:** Trim trailing `!`, `.`, and `?` before comparing the existing acknowledgment phrases.\\n- **Alternative:** Keep exact matching or classify all short comments as routine.\\n- **If asking were free:** Which punctuation marks should be ignored in acknowledgment-only review text?\\n\\n6. **Brief silence:** The review did not specify the expected outcome after approval followed by a later `COMMENTED` review.\\n- **Choice:** Keep the approval as the latest formal state and treat a newer substantive `COMMENTED` review after head as independent actionable feedback; add a regression test.\\n- **Alternative:** Treat approval as clearing all later comments from the same reviewer.\\n- **If asking were free:** Should later review comments from an approving reviewer always reopen crew attention when substantive?\\n\"}]},\"reviews\":{\"pageInfo\":{\"hasPreviousPage\":false,\"startCursor\":null},\"nodes\":[]},\"reviewThreads\":{\"pageInfo\":{\"hasPreviousPage\":false,\"startCursor\":null},\"nodes\":[]},\"timelineItems\":{\"nodes\":[]},\"commits\":{\"nodes\":[{\"commit\":{\"committedDate\":\"2026-09-30T18:30:47Z\",\"pushedDate\":null,\"statusCheckRollup\":{\"contexts\":{\"nodes\":[{\"conclusion\":\"SKIPPED\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SKIPPED\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"},{\"conclusion\":\"SUCCESS\",\"status\":\"COMPLETED\"}]}}}}]}}}}}"
