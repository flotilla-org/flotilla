  - channel: command
    cmd: test
    args:
    - '-e'
    - '{root}/convoy-new'
    cwd: /
    stdout: ''
    stderr: ''
    exit_code: 0
  - channel: command
    cmd: test
    args:
    - '-e'
    - '{root}/convoy-new'
