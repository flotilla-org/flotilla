# ADR 0060: generic discovery runs, static factory-list assembly over the
# provider type crates and environment management; no composition-root,
# capability or store dependencies.
# See docs/adr/0060-component-crates-and-composition-root.md and ci/build-graph/check.py.
[package]
name = "flotilla-discovery"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-github-providers = { path = "../flotilla-github-providers" }
flotilla-forgejo-providers = { path = "../flotilla-forgejo-providers" }
flotilla-agent = { path = "../flotilla-agent" }
flotilla-ai-utility = { path = "../flotilla-ai-utility" }
flotilla-change-request = { path = "../flotilla-change-request" }
flotilla-cloud-agent = { path = "../flotilla-cloud-agent" }
flotilla-config = { path = "../flotilla-config" }
flotilla-discovery-api = { path = "../flotilla-discovery-api" }
flotilla-environment = { path = "../flotilla-environment" }
flotilla-issue-tracker = { path = "../flotilla-issue-tracker" }
flotilla-paths = { path = "../flotilla-paths" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-terminal = { path = "../flotilla-terminal" }
flotilla-vcs = { path = "../flotilla-vcs" }
async-trait.workspace = true
bon.workspace = true
futures.workspace = true
indexmap.workspace = true
tokio.workspace = true
tracing.workspace = true

[dev-dependencies]
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-discovery-testkit = { path = "../flotilla-discovery-testkit" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
hegeltest = "=0.48.1"
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[lints]
workspace = true
