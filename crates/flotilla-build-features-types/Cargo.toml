[package]
name = "flotilla-build-features-types"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Static feature selections only; every consumer already uses these dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
form_urlencoded = { version = "1" }
hashbrown = { version = "0.16", features = ["raw-entry"] }
indexmap = { version = "2", features = ["serde"] }
num-traits = { version = "0.2", default-features = false, features = ["i128", "libm"] }
percent-encoding = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_core = { version = "1", features = ["alloc"] }

[dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }

[lints]
workspace = true
