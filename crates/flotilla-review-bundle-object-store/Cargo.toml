[package]
name = "flotilla-review-bundle-object-store"
version = "0.1.0"
edition = "2021"
license.workspace = true
[dependencies]
flotilla-crew = { path = "../flotilla-crew" }
flotilla-resources = { path = "../flotilla-resources" }
async-trait.workspace = true
object_store = { version = "0.12", features = ["aws"] }
[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-hmac = { path = "../flotilla-build-features-hmac" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[dev-dependencies]
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
