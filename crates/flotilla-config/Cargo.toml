# ADR 0060: a C-free base crate; only base types, no upward component dependencies.
# See docs/adr/0060-component-crates-and-composition-root.md and ci/build-graph/check.py.
[package]
name = "flotilla-config"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-paths = { path = "../flotilla-paths" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
toml = "0.8"
# Native consumers reach toml through this crate; align toml_edit with the workspace default feature.
toml_edit = "0.22"
tracing = { workspace = true }
url = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
hegeltest = "=0.48.1"
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
