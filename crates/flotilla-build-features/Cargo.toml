[package]
name = "flotilla-build-features"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Host proc-macro features shared by the static layer anchors.
[build-dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[lints]
workspace = true
