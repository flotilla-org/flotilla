[package]
name = "flotilla-inbox"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
bon = { workspace = true }
tracing = { workspace = true }
flotilla-schema = { path = "../flotilla-schema" }
flotilla-state-machines = { path = "../flotilla-state-machines" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
flotilla-schema-sqlite = { path = "../flotilla-schema-sqlite" }
rusqlite = { version = "0.37", features = ["bundled", "functions", "hooks"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
flotilla-inbox-testkit = { path = "../flotilla-inbox-testkit" }
hegeltest = { workspace = true }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
