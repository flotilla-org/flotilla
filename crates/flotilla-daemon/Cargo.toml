[package]
name = "flotilla-daemon"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
aws-lc-provider = ["flotilla-core/aws-lc-provider", "flotilla-resources/aws-lc-provider", "flotilla-credentials/aws-lc-provider", "flotilla-aggregator/aws-lc-provider"]
skip-no-sandbox-tests = ["flotilla-core/skip-no-sandbox-tests", "flotilla-resources/skip-no-sandbox-tests", "flotilla-credentials/skip-no-sandbox-tests", "flotilla-aggregator/skip-no-sandbox-tests"]

[dependencies]
flotilla-paths = { path = "../flotilla-paths" }
flotilla-daemon-api = { path = "../flotilla-daemon-api" }
bon = { workspace = true }
flotilla-aggregator = { path = "../flotilla-aggregator" }
flotilla-controllers = { path = "../flotilla-controllers" }
flotilla-core = { path = "../flotilla-core" }
flotilla-credentials = { path = "../flotilla-credentials" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-relay-protocol = { path = "../flotilla-relay-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-transport = { path = "../flotilla-transport" }
tender = { path = "../tender" }
tokio = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = "0.0.12"
async-trait = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
visibility = "0.1.1"
tempfile = "3"
sha2 = "0.10"
hmac = "0.12"
bytes = "1"
http = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-daemon-testkit = { path = "../flotilla-daemon-testkit" }
flotilla-protocol-testkit = { path = "../flotilla-protocol-testkit" }
flotilla-credentials-testkit = { path = "../flotilla-credentials-testkit" }
flotilla-store-testkit = { path = "../flotilla-store-testkit" }
flotilla-discovery-testkit = { path = "../flotilla-discovery-testkit" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
tokio = { workspace = true, features = ["test-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
bytes = "1"
flotilla-core = { path = "../flotilla-core" }
flotilla-client = { path = "../flotilla-client" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-test-support = { path = "../flotilla-test-support" }
hegeltest = "=0.48.1"
http = "1"
rusqlite = { version = "0.37", features = ["bundled"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-hmac = { path = "../flotilla-build-features-hmac" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-signing = { path = "../flotilla-build-features-signing" }
flotilla-build-features-sqlite = { path = "../flotilla-build-features-sqlite" }
flotilla-build-features-time = { path = "../flotilla-build-features-time" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
