[package]
name = "flotilla-daemon"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
aws-lc-provider = ["flotilla-core/aws-lc-provider", "rigging-tls/aws-lc-provider", "flotilla-credentials/aws-lc-provider", "flotilla-projections/aws-lc-provider"]
skip-no-sandbox-tests = ["flotilla-executor/skip-no-sandbox-tests", "flotilla-core/skip-no-sandbox-tests", "flotilla-store/skip-no-sandbox-tests", "flotilla-store-testkit/skip-no-sandbox-tests", "flotilla-credentials/skip-no-sandbox-tests", "flotilla-projections/skip-no-sandbox-tests"]

[dependencies]
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
flotilla-tracing = { path = "../flotilla-tracing" }
flotilla-cbor = { path = "../flotilla-cbor" }
flotilla-admission = { path = "../flotilla-admission" }
flotilla-crew = { path = "../flotilla-crew" }
flotilla-observation = { path = "../flotilla-observation" }
flotilla-schema-sqlite = { path = "../flotilla-schema-sqlite" }
flotilla-engine-store = { path = "../flotilla-engine-store" }
flotilla-inbox = { path = "../flotilla-inbox" }
flotilla-state-machines = { path = "../flotilla-state-machines" }
flotilla-schema = { path = "../flotilla-schema" }
rigging-condition = { workspace = true }
flotilla-address = { path = "../flotilla-address" }
flotilla-messaging = { path = "../flotilla-messaging" }
flotilla-agent-connector = { path = "../flotilla-agent-connector" }
flotilla-executor = { path = "../flotilla-executor" }
flotilla-config = { path = "../flotilla-config" }
flotilla-environment = { path = "../flotilla-environment" }
flotilla-vessel-delivery = { path = "../flotilla-vessel-delivery" }
flotilla-vcs = { path = "../flotilla-vcs" }
flotilla-terminal = { path = "../flotilla-terminal" }
flotilla-discovery = { path = "../flotilla-discovery" }
flotilla-discovery-api = { path = "../flotilla-discovery-api" }
# Deliberately a production dependency: the dummy fleet is a configured provider
# set (#3206), run by load-test daemons and the shadow cluster, inert without
# daemon.toml [dummy_fleet]; it is not test-support machinery.
flotilla-dummy-fleet = { path = "../flotilla-dummy-fleet" }
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
flotilla-provisioning = { path = "../flotilla-provisioning" }
flotilla-review-bundle-object-store = { path = "../flotilla-review-bundle-object-store" }
flotilla-store-http = { path = "../flotilla-store-http" }
flotilla-store-sqlite = { path = "../flotilla-store-sqlite" }
flotilla-store-memory = { path = "../flotilla-store-memory" }
rigging-tls = { workspace = true }
rigging-http-serve = { workspace = true }
rigging-http-wire = { workspace = true }
flotilla-store = { path = "../flotilla-store" }
flotilla-paths = { path = "../flotilla-paths" }
flotilla-daemon-api = { path = "../flotilla-daemon-api" }
bon = { workspace = true }
flotilla-projections = { path = "../flotilla-projections" }
flotilla-controllers = { path = "../flotilla-controllers" }
flotilla-agent = { path = "../flotilla-agent" }
flotilla-core = { path = "../flotilla-core" }
flotilla-charter = { path = "../flotilla-charter" }
flotilla-credentials = { path = "../flotilla-credentials" }
flotilla-capability-contract = { path = "../flotilla-capability-contract" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-relay-protocol = { path = "../flotilla-relay-protocol" }
flotilla-replication = { path = "../flotilla-replication" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-transport = { path = "../flotilla-transport" }
tender = { path = "../tender" }
tokio = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yml = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { workspace = true, features = ["v4"] }
url = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
futures = "0.3"
tokio-tungstenite = { version = "0.28", features = ["connect", "rustls-tls-webpki-roots"] }
visibility = "0.1.1"
tempfile = { workspace = true }
sha2 = { workspace = true }
hmac = "0.12"
bytes = { workspace = true }
http = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
getrandom = { version = "0.2", default-features = false, features = ["std"] }
subtle = "2"

[target.'cfg(unix)'.dependencies]
drydock.workspace = true
drydock-protocol.workspace = true
flotilla-drydock = { path = "../flotilla-drydock" }

libc = { workspace = true }

[dev-dependencies]
flotilla-provisioning-testkit = { path = "../flotilla-provisioning-testkit" }
drydock-agent.workspace = true
drydock-transport.workspace = true
flotilla-fake-forge = { path = "../flotilla-fake-forge" }
flotilla-forge-github = { path = "../flotilla-forge-github" }
flotilla-forgejo-providers = { path = "../flotilla-forgejo-providers" }
flotilla-github-providers = { path = "../flotilla-github-providers" }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
rigging-replay-testkit = { workspace = true }
flotilla-load-driver = { path = "../flotilla-load-driver" }
flotilla-change-request = { path = "../flotilla-change-request" }
flotilla-issue-tracker = { path = "../flotilla-issue-tracker" }
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-daemon-testkit = { path = "../flotilla-daemon-testkit" }
flotilla-protocol-testkit = { path = "../flotilla-protocol-testkit" }
flotilla-credentials-testkit = { path = "../flotilla-credentials-testkit" }
flotilla-store-testkit = { path = "../flotilla-store-testkit" }
flotilla-discovery-testkit = { path = "../flotilla-discovery-testkit" }
flotilla-orchestration-testkit = { path = "../flotilla-orchestration-testkit" }
flotilla-replay-testkit = { path = "../flotilla-replay-testkit" }
tokio = { workspace = true, features = ["test-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
bytes = { workspace = true }
flotilla-core = { path = "../flotilla-core" }
flotilla-client = { path = "../flotilla-client" }
flotilla-protocol = { path = "../flotilla-protocol" }
flotilla-resources = { path = "../flotilla-resources" }
flotilla-test-support = { path = "../flotilla-test-support" }
hegeltest = { workspace = true }
http = { workspace = true }
rusqlite = { version = "0.37", features = ["bundled"] }
prometheus-parse = "0.2"
# #3663: the content cache model lists a pushed skill archive's files.
tar = { version = "0.4", default-features = false }
flate2 = "1"
rigging-process = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
drydock-host.workspace = true

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-hmac = { path = "../flotilla-build-features-hmac" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-signing = { path = "../flotilla-build-features-signing" }
flotilla-build-features-sqlite = { path = "../flotilla-build-features-sqlite" }
flotilla-build-features-time = { path = "../flotilla-build-features-time" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
