# Maintenance: see docs/measurements/2747-build-graph.md (Maintaining the feature anchors).
[package]
name = "flotilla-build-features-os"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

# Static feature selections only; every consumer already uses these dependencies.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bitflags = { version = "2", default-features = false, features = ["std"] }
once_cell = { version = "1", features = ["std"] }
rustix = { version = "1", features = ["fs", "stdio", "system", "termios"] }

[target.'cfg(target_os = "linux")'.dependencies]
linux-raw-sys = { version = "0.12", default-features = false, features = ["auxvec", "elf", "errno", "general", "ioctl", "no_std", "system"] }

# rustix uses libc/errno on macOS rather than Linux's raw syscall backend.
[target.'cfg(target_os = "macos")'.dependencies]
errno = "0.3"
libc = "0.2"

[dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }

[lints]
workspace = true
