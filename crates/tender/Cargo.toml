[package]
name = "tender"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tokio = { workspace = true }
async-trait = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
hegeltest = "=0.48.1"

[features]
# Dedicated provisioned Linux CI job; normal contracts need neither cleat nor sshd.
ssh-cleat-proof = []

[[test]]
name = "ssh_cleat"
path = "tests/ssh_cleat.rs"
required-features = ["ssh-cleat-proof"]

[lints]
workspace = true
