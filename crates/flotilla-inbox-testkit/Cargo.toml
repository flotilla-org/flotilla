[package]
name = "flotilla-inbox-testkit"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
serde_json = { workspace = true }
flotilla-schema = { path = "../flotilla-schema" }
flotilla-state-machines = { path = "../flotilla-state-machines" }
async-trait = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
flotilla-inbox = { path = "../flotilla-inbox" }

[lints]
workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
