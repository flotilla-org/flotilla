[package]
name = "flotilla-schema"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Backend-neutral storage schema: descriptors, logical rows and the kind registry"

[dependencies]
serde_json = { workspace = true }
flotilla-address = { path = "../flotilla-address" }
flotilla-cbor = { path = "../flotilla-cbor" }
flotilla-schema-derive = { path = "../flotilla-schema-derive" }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = "2"

[dev-dependencies]
hegeltest = { workspace = true }
trybuild = "1"
# Test-only feature anchor (docs/measurements/2747-build-graph.md): hegeltest reaches smallvec
# through parking_lot; select the features the base layer already uses.
smallvec = { version = "1", default-features = false, features = ["const_generics", "const_new"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }
