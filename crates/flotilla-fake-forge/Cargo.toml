# A fake Forgejo service shared by a multi-host rehearsal fleet (#3374). It
# holds one in-memory forge and answers exactly the Forgejo API requests that
# flotilla's Forgejo change-request and issue providers make, refusing others.
[package]
name = "flotilla-fake-forge"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
http.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
hegeltest = "=0.48.1"
serde_yml.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[lints]
workspace = true
