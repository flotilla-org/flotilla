# A fake Forgejo service shared by a multi-host rehearsal fleet (#3374). It
# holds one in-memory forge and answers exactly the Forgejo API requests that
# flotilla's Forgejo change-request and issue providers make, refusing others.
[package]
name = "flotilla-fake-forge"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
flotilla-provider-runtime = { path = "../flotilla-provider-runtime" }
async-trait.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
bytes.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# `string` aligns clap with the workspace feature set (flotilla-commands).
clap = { version = "4", features = ["derive", "string"] }
http.workspace = true
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
reqwest.workspace = true
rustls = { workspace = true, features = ["std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
toml = "0.8"
# The workspace selects toml_edit's default feature; align it, as flotilla-config does.
toml_edit = "0.22"
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url.workspace = true

[dev-dependencies]
hegeltest = "=0.48.1"
serde_yml.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
flotilla-build-features-async = { path = "../flotilla-build-features-async" }
flotilla-build-features-base = { path = "../flotilla-build-features-base" }
flotilla-build-features-http = { path = "../flotilla-build-features-http" }
flotilla-build-features-http-server = { path = "../flotilla-build-features-http-server" }
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
flotilla-build-features-os = { path = "../flotilla-build-features-os" }
flotilla-build-features-tracing = { path = "../flotilla-build-features-tracing" }
flotilla-build-features-types = { path = "../flotilla-build-features-types" }

[lints]
workspace = true
