[package]
name = "flotilla-schema-derive"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "The storage derive: relational tables from Rust types through a closed attribute list"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["extra-traits", "fold", "full", "visit", "visit-mut"] }

[lints]
workspace = true

# Keep native library features stable across build and test commands.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features = { path = "../flotilla-build-features" }
