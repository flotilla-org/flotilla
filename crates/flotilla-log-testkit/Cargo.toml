[package]
name = "flotilla-log-testkit"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "Dev-only scoped log capture for tests that share a binary"

[dependencies]
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["fmt"] }

[lints]
workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
flotilla-build-features-logging = { path = "../flotilla-build-features-logging" }
