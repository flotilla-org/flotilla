[profile.dev]
debug = "line-tables-only"

[workspace]
members = [
    "crates/flotilla-tracing",
    "crates/flotilla-address",
    "crates/flotilla-admission",
    "crates/flotilla-crew",
    "crates/flotilla-agent",
    "crates/flotilla-agent-connector",
    "crates/flotilla-projections",
    "crates/flotilla-provisioning",
    "crates/flotilla-provisioning-testkit",
    "crates/flotilla-build-features",
    "crates/flotilla-capability-contract",
    "crates/flotilla-cbor",
    "crates/flotilla-change-request",
    "crates/flotilla-github-providers",
    "crates/flotilla-forgejo-providers",
    "crates/flotilla-charter",
    "crates/flotilla-client",
    "crates/flotilla-cli",
    "crates/flotilla-ai-utility",
    "crates/flotilla-cloud-agent",
    "crates/flotilla-commands",
    "crates/flotilla-config",
    "crates/flotilla-controllers",
    "crates/flotilla-core",
    "crates/flotilla-executor",
    "crates/flotilla-environment",
    "crates/flotilla-forge-github",
    "crates/flotilla-vcs",
    "crates/flotilla-credentials",
    "crates/flotilla-credentials-testkit",
    "crates/flotilla-daemon",
    "crates/flotilla-daemon-api",
    "crates/flotilla-daemon-testkit",
    "crates/flotilla-discovery",
    "crates/flotilla-discovery-api",
    "crates/flotilla-discovery-testkit",
    "crates/flotilla-drydock",
    "crates/flotilla-dummy-fleet",
    "crates/flotilla-fake-forge",
    "crates/flotilla-forge-forgejo",
    "crates/flotilla-load-driver",
    "crates/flotilla-issue-tracker",
    "crates/flotilla-manifest",
    "crates/flotilla-observation",
    "crates/flotilla-orchestration-testkit",
    "crates/flotilla-paths",
    "crates/flotilla-provider-runtime",
    "crates/flotilla-terminal",
    "crates/flotilla-protocol",
    "crates/flotilla-protocol-testkit",
    "crates/flotilla-relay",
    "crates/flotilla-relay-protocol",
    "crates/flotilla-replication",
    "crates/flotilla-replay-testkit",
    "crates/flotilla-resources",
    "crates/flotilla-schema",
    "crates/flotilla-schema-derive",
    "crates/flotilla-schema-sqlite",
    "crates/flotilla-messaging",
    "crates/flotilla-inbox",
    "crates/flotilla-engine-store",
    "crates/flotilla-inbox-testkit",
    "crates/flotilla-quint-testkit",
    "crates/flotilla-state-machines",
    "crates/flotilla-store",
    "crates/flotilla-store-memory",
    "crates/flotilla-store-sqlite",
    "crates/flotilla-store-http",
    "crates/flotilla-review-bundle-object-store",
    "crates/flotilla-store-testkit",
    "crates/flotilla-test-support",
    "crates/flotilla-transport",
    "crates/flotilla-tui",
    "crates/flotilla-vessel-delivery",
    "crates/tender",
]
exclude = ["crates/flotilla-manifest/fixtures/generator"]
resolver = "2"

[workspace.package]
license = "Apache-2.0 OR MIT"

# When adding dependencies anywhere in the workspace, update the external-crate
# allowlist in clippy.toml (use the library crate name, including any rename).
[workspace.dependencies]
drydock = { git = "https://github.com/flotilla-org/drydock", rev = "eb214c72e0d4753d34c76436c6b2216471ca098d" }
drydock-protocol = { git = "https://github.com/flotilla-org/drydock", rev = "eb214c72e0d4753d34c76436c6b2216471ca098d" }
drydock-agent = { git = "https://github.com/flotilla-org/drydock", rev = "eb214c72e0d4753d34c76436c6b2216471ca098d" }
drydock-transport = { git = "https://github.com/flotilla-org/drydock", rev = "eb214c72e0d4753d34c76436c6b2216471ca098d" }
drydock-host = { git = "https://github.com/flotilla-org/drydock", rev = "eb214c72e0d4753d34c76436c6b2216471ca098d" }
rigging-stream = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
rigging-tls = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
rigging-process = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
rigging-http-client = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
rigging-replay-testkit = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
rigging-http-serve = { git = "https://github.com/flotilla-org/rigging", rev = "8c5fef84c6ce9c01ea56fb680a83986c1f14941d" }
# The condition language (#4108). Pinned ahead of the other rigging crates, which drydock's pin holds back; it
# depends on no other rigging crate.
rigging-condition = { git = "https://github.com/flotilla-org/rigging", rev = "3c60c7ae62a1b93f910b7049d90ae97bf8275837" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
serde_yml = "0.0.12"
tokio-util = "0.7"
hegeltest = "=0.48.1"
minijinja = "2"
futures = "0.3"
sha2 = "0.10"
http = "1"
bytes = "1"
uuid = "1"
libc = { version = "0.2", features = ["extra_traits"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1.44"
indexmap = "2"
color-eyre = "0.6"
rstest = "0.23"
bon = "3"
# Keep the TLS provider explicit so reqwest does not pull aws-lc-sys onto the clean-build critical path.
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider"] }
url = "2"
urlencoding = "2"
strum = { version = "0.28", features = ["derive"] }
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }

[package]
name = "flotilla"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = ["tui"]
tui = ["dep:flotilla-tui", "dep:ratatui"]
aws-lc-provider = ["flotilla-core/aws-lc-provider", "flotilla-daemon/aws-lc-provider"]

# New external crates also belong in clippy.toml's absolute-paths-allowed-crates.
[dependencies]
flotilla-admission = { path = "crates/flotilla-admission" }
flotilla-projections = { path = "crates/flotilla-projections" }
flotilla-config = { path = "crates/flotilla-config" }
flotilla-environment = { path = "crates/flotilla-environment" }
flotilla-vcs = { path = "crates/flotilla-vcs" }
flotilla-charter = { path = "crates/flotilla-charter" }
flotilla-provider-runtime = { path = "crates/flotilla-provider-runtime" }
flotilla-store-memory = { path = "crates/flotilla-store-memory" }
rigging-tls = { workspace = true }
flotilla-store = { path = "crates/flotilla-store" }
flotilla-paths = { path = "crates/flotilla-paths" }
flotilla-daemon-api = { path = "crates/flotilla-daemon-api" }
flotilla-client = { path = "crates/flotilla-client" }
flotilla-commands = { path = "crates/flotilla-commands" }
flotilla-agent = { path = "crates/flotilla-agent" }
flotilla-core = { path = "crates/flotilla-core" }
flotilla-provisioning = { path = "crates/flotilla-provisioning" }
flotilla-manifest = { path = "crates/flotilla-manifest" }
flotilla-protocol = { path = "crates/flotilla-protocol" }
flotilla-resources = { path = "crates/flotilla-resources" }
flotilla-tui = { path = "crates/flotilla-tui", optional = true }
flotilla-cli = { path = "crates/flotilla-cli" }
ratatui = { version = "0.30", optional = true }
tokio = { workspace = true }
color-eyre = { workspace = true }
clap = { version = "4", features = ["derive", "string"] }
bon = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yml = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
toml_edit = "0.22"
libc = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
# #3663: the pre-roll skill probe's private, per-run object cache.
tempfile = { workspace = true }
chrono = { workspace = true }

[target.'cfg(unix)'.dependencies]
flotilla-daemon = { path = "crates/flotilla-daemon" }

[dev-dependencies]
flotilla-discovery-testkit = { path = "crates/flotilla-discovery-testkit" }
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
flotilla-core = { path = "crates/flotilla-core" }
flotilla-test-support = { path = "crates/flotilla-test-support" }
hegeltest = { workspace = true }
tempfile = { workspace = true }

[[example]]
name = "glyph_showcase"
test = false
required-features = ["tui"]

[workspace.lints.clippy]
absolute_paths = "warn"

[lints]
workspace = true

# The daemon and its request-session test harness are Unix-only, like the tests.
[target.'cfg(unix)'.dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
flotilla-daemon-testkit = { path = "crates/flotilla-daemon-testkit" }
flotilla-daemon = { path = "crates/flotilla-daemon" }
