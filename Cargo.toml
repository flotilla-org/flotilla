[profile.dev]
debug = "line-tables-only"

[workspace]
members = [
    "crates/flotilla-aggregator",
    "crates/flotilla-build-features",
    "crates/flotilla-client",
    "crates/flotilla-commands",
    "crates/flotilla-controllers",
    "crates/flotilla-core",
    "crates/flotilla-credentials",
    "crates/flotilla-credentials-testkit",
    "crates/flotilla-daemon",
    "crates/flotilla-daemon-api",
    "crates/flotilla-daemon-testkit",
    "crates/flotilla-discovery-testkit",
    "crates/flotilla-manifest",
    "crates/flotilla-orchestration-testkit",
    "crates/flotilla-paths",
    "crates/flotilla-protocol",
    "crates/flotilla-protocol-testkit",
    "crates/flotilla-relay",
    "crates/flotilla-relay-protocol",
    "crates/flotilla-replay-testkit",
    "crates/flotilla-resources",
    "crates/flotilla-store-testkit",
    "crates/flotilla-test-support",
    "crates/flotilla-transport",
    "crates/flotilla-tui",
    "crates/tender",
]
exclude = ["crates/flotilla-manifest/fixtures/generator"]
resolver = "2"

[workspace.package]
license = "Apache-2.0 OR MIT"

# When adding dependencies anywhere in the workspace, update the external-crate
# allowlist in clippy.toml (use the library crate name, including any rename).
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1.44"
indexmap = "2"
color-eyre = "0.6"
rstest = "0.23"
bon = "3"
# Keep the TLS provider explicit so reqwest does not pull aws-lc-sys onto the clean-build critical path.
reqwest = { version = "0.13.2", default-features = false, features = ["rustls-no-provider"] }
url = "2"
rustls = { version = "0.23.37", default-features = false, features = ["ring"] }

[package]
name = "flotilla"
version = "0.1.0"
edition = "2021"
license.workspace = true

[features]
default = []
aws-lc-provider = ["flotilla-core/aws-lc-provider", "flotilla-daemon/aws-lc-provider"]

# New external crates also belong in clippy.toml's absolute-paths-allowed-crates.
[dependencies]
flotilla-paths = { path = "crates/flotilla-paths" }
flotilla-daemon-api = { path = "crates/flotilla-daemon-api" }
flotilla-client = { path = "crates/flotilla-client" }
flotilla-commands = { path = "crates/flotilla-commands" }
flotilla-core = { path = "crates/flotilla-core" }
flotilla-manifest = { path = "crates/flotilla-manifest" }
flotilla-protocol = { path = "crates/flotilla-protocol" }
flotilla-resources = { path = "crates/flotilla-resources" }
flotilla-tui = { path = "crates/flotilla-tui" }
ratatui = "0.30"
tokio = { workspace = true }
color-eyre = { workspace = true }
clap = { version = "4", features = ["derive"] }
bon = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
serde_yml = "0.0.12"
reqwest = { workspace = true, features = ["json"] }
toml_edit = "0.22"
libc = "0.2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(unix)'.dependencies]
flotilla-daemon = { path = "crates/flotilla-daemon" }

[dev-dependencies]
flotilla-discovery-testkit = { path = "crates/flotilla-discovery-testkit" }
tokio = { workspace = true, features = ["test-util"] }
async-trait = { workspace = true }
flotilla-core = { path = "crates/flotilla-core" }
flotilla-test-support = { path = "crates/flotilla-test-support" }
hegeltest = "=0.48.1"
tempfile = "3"

[[example]]
name = "glyph_showcase"
test = false

[workspace.lints.clippy]
absolute_paths = "warn"

[lints]
workspace = true

# The daemon and its request-session test harness are Unix-only, like the tests.
[target.'cfg(unix)'.dev-dependencies]
flotilla-daemon-testkit = { path = "crates/flotilla-daemon-testkit" }
flotilla-daemon = { path = "crates/flotilla-daemon" }
