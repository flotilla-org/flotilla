name: Prune superseded Rust caches

# main saves a new Rust cache whenever its lockfile changes; the old ones are
# never restored again. Delete them so they don't evict live caches from the
# repository's 10 GB pool.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/caches/prune_rust.py "${{ github.repository }}"
