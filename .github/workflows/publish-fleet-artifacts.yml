name: Publish fleet artifacts

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: fleet-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  linux:
    name: Linux x86_64
    runs-on: [self-hosted, Linux, X64, fleet-release]
    timeout-minutes: 30
    steps:
      - name: Verify release runner capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Build debug-profile binaries
        run: |
          FLOTILLA_BUILD_ID=$(git rev-parse --short=12 "$GITHUB_SHA")
          export FLOTILLA_BUILD_ID
          cargo +stable build --locked --bin flotilla --bin flotillad

      - name: Stage and describe artifacts
        run: |
          RELEASE_TAG="fleet-$GITHUB_SHA"
          WIRE_GENERATION=$(git rev-parse --short=12 "$GITHUB_SHA")
          mkdir -p dist
          install -m 0755 target/debug/flotilla dist/flotilla-linux-x86_64
          install -m 0755 target/debug/flotillad dist/flotillad-linux-x86_64
          dist/flotilla-linux-x86_64 --version | grep -F "wire=${WIRE_GENERATION}"
          dist/flotillad-linux-x86_64 --version | grep -F "wire=${WIRE_GENERATION}"
          scripts/write-artifact-metadata.sh \
            dist/flotilla-linux-x86_64 \
            dist/flotilla-linux-x86_64.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            linux-x86_64 "$WIRE_GENERATION" false
          scripts/write-artifact-metadata.sh \
            dist/flotillad-linux-x86_64 \
            dist/flotillad-linux-x86_64.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            linux-x86_64 "$WIRE_GENERATION" false

      - name: Transfer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-linux-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  darwin:
    name: Darwin arm64
    runs-on: [self-hosted, macOS, ARM64, fleet-release-signing]
    timeout-minutes: 30
    steps:
      - name: Verify release runner capability
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          : "${FLEET_CODESIGN_IDENTITY:?runner environment must provide FLEET_CODESIGN_IDENTITY}"
          signing_probe=$(mktemp)
          trap 'rm -f "$signing_probe"' EXIT
          cp /usr/bin/true "$signing_probe"
          codesign --force --sign "$FLEET_CODESIGN_IDENTITY" "$signing_probe"
          codesign --verify --strict "$signing_probe"

      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Build debug-profile binaries
        run: |
          FLOTILLA_BUILD_ID=$(git rev-parse --short=12 "$GITHUB_SHA")
          export FLOTILLA_BUILD_ID
          cargo +stable build --locked --bin flotilla --bin flotillad

      - name: Sign, verify, and describe artifacts
        run: |
          : "${FLEET_CODESIGN_IDENTITY:?runner environment must provide FLEET_CODESIGN_IDENTITY}"
          RELEASE_TAG="fleet-$GITHUB_SHA"
          WIRE_GENERATION=$(git rev-parse --short=12 "$GITHUB_SHA")
          mkdir -p dist
          install -m 0755 target/debug/flotilla dist/flotilla-darwin-arm64
          install -m 0755 target/debug/flotillad dist/flotillad-darwin-arm64
          for artifact in dist/flotilla-darwin-arm64 dist/flotillad-darwin-arm64; do
            codesign --force --options runtime \
              --entitlements packaging/macos-cli.entitlements \
              --sign "$FLEET_CODESIGN_IDENTITY" \
              "$artifact"
            codesign --verify --strict --verbose=2 "$artifact"
          done
          dist/flotilla-darwin-arm64 --version | grep -F "wire=${WIRE_GENERATION}"
          dist/flotillad-darwin-arm64 --version | grep -F "wire=${WIRE_GENERATION}"
          scripts/write-artifact-metadata.sh \
            dist/flotilla-darwin-arm64 \
            dist/flotilla-darwin-arm64.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            darwin-arm64 "$WIRE_GENERATION" true
          scripts/write-artifact-metadata.sh \
            dist/flotillad-darwin-arm64 \
            dist/flotillad-darwin-arm64.json \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$RELEASE_TAG" \
            darwin-arm64 "$WIRE_GENERATION" true

      - name: Transfer release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fleet-darwin-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [linux, darwin]
    runs-on: [self-hosted, Linux, X64, fleet-release]
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Collect release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fleet-*-${{ github.sha }}
          path: dist
          merge-multiple: true

      - name: Publish immutable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/publish-github-release.sh dist/*
