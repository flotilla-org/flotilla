name: Compose integration

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "rust-toolchain.toml"
      - "ci/toolchain/**"
      - .github/workflows/compose-integration.yml
      - src/main.rs
      - crates/flotilla-client/**
      - crates/flotilla-commands/src/commands/convoy.rs
      - crates/flotilla-core/src/in_process.rs
      - crates/flotilla-core/src/in_process/**
      - crates/flotilla-core/src/admission.rs
      - crates/flotilla-core/tests/in_process_daemon.rs
      - crates/flotilla-daemon/**
      - crates/flotilla-protocol/**
      - crates/flotilla-resources/src/host.rs
      - crates/flotilla-resources/src/fulfilment_kind.rs
      - crates/flotilla-resources/src/placement*.rs
      - crates/flotilla-resources/src/convoy/**
      - crates/flotilla-controllers/src/**
      - tests/integration/**

permissions:
  contents: read

jobs:
  # Compile the binaries once on the runner, where Swatinem/rust-cache keeps
  # incremental dependency artifacts, instead of a from-scratch release build
  # inside Docker for every compose job. The compose jobs package them with the
  # base Dockerfile's thin `dev` target.
  build-binary:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Plain debug profile: flotillad sizes its own tokio worker stacks for
      # unoptimized futures (src/bin/flotillad.rs; issue #2346, fixed by
      # PR #2347), so no opt-level override is needed here.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "compose-integration"
          # PR caches are branch-scoped and only churn the shared pool; main
          # pushes keep the dependency cache warm for every PR.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build flotilla binaries
        run: cargo build --locked --bin flotilla --bin flotillad
      - uses: actions/upload-artifact@v4
        with:
          name: flotilla-binaries
          path: |
            target/debug/flotilla
            target/debug/flotillad
          if-no-files-found: error
          retention-days: 1

  # The compose jobs use the thin `dev` image, so build the cargo-in-Docker
  # `full` target nightly to keep the local default's builder stages working.
  # No layer cache: a whole-workspace build cache would crowd the repo's cache
  # pool for a job that runs once a day.
  full-image:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build full integration base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/integration/docker/base/Dockerfile
          target: full
          push: false

  wedge-regressions:
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read by the compose files, so the fixtures' own `docker compose build`
      # packages the downloaded binaries instead of compiling in Docker.
      FLOTILLA_BASE_TARGET: dev
      FLOTILLA_BIN_DIR: target/debug
    steps:
      - uses: actions/checkout@v7
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: flotilla-binaries
          path: ${{ env.FLOTILLA_BIN_DIR }}
      - name: Restore executable bits
        run: chmod +x "$FLOTILLA_BIN_DIR/flotilla" "$FLOTILLA_BIN_DIR/flotillad"
      - uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build integration base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/integration/docker/base/Dockerfile
          target: ${{ env.FLOTILLA_BASE_TARGET }}
          build-args: FLOTILLA_BIN_DIR=${{ env.FLOTILLA_BIN_DIR }}
          tags: flotilla-base
          load: true
          cache-from: type=gha,scope=compose-integration-wedge-dev
          cache-to: type=gha,mode=max,scope=compose-integration-wedge-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/integration/pyproject.toml
      - name: Install integration test dependencies
        run: python -m pip install ./tests/integration
      - name: Run real-boundary topology and wedge regressions
        run: >-
          python -m pytest -v --timeout=1800
          tests/integration/test_minimal_topology.py
          tests/integration/test_wedge_regressions.py
      - name: Print compose logs
        if: failure()
        run: docker compose -f tests/integration/docker-compose.yml logs --no-color

  hub-spoke:
    if: github.event_name != 'pull_request'
    needs: build-binary
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Read by the compose files, so the fixtures' own `docker compose build`
      # packages the downloaded binaries instead of compiling in Docker.
      FLOTILLA_BASE_TARGET: dev
      FLOTILLA_BIN_DIR: target/debug
    steps:
      - uses: actions/checkout@v7
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v4
        with:
          name: flotilla-binaries
          path: ${{ env.FLOTILLA_BIN_DIR }}
      - name: Restore executable bits
        run: chmod +x "$FLOTILLA_BIN_DIR/flotilla" "$FLOTILLA_BIN_DIR/flotillad"
      - uses: docker/setup-docker-action@v4
        with:
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      # Keep the docker driver: the fixture builds flotilla-base into the host
      # image store before the role images, which resolve it by image name.
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker
      - name: Build integration base image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: tests/integration/docker/base/Dockerfile
          target: ${{ env.FLOTILLA_BASE_TARGET }}
          build-args: FLOTILLA_BIN_DIR=${{ env.FLOTILLA_BIN_DIR }}
          tags: flotilla-base
          load: true
          cache-from: type=gha,scope=compose-integration-hub-spoke-dev
          cache-to: type=gha,mode=max,scope=compose-integration-hub-spoke-dev
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/integration/pyproject.toml
      - name: Install integration test dependencies
        run: python -m pip install ./tests/integration
      - name: Run hub-spoke topology regressions
        run: python -m pytest -v tests/integration/test_hub_spoke_topology.py
      - name: Print compose logs
        if: failure()
        run: >-
          docker compose
          -f tests/integration/docker-compose.hub-spoke.yml
          logs --no-color
