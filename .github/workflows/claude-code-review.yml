name: Claude Code Review
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  review:
    # The shared reviewer (flotilla-org/flotilla#2754, #3709). Crew convoys that
    # review in the vessel opt out with the in-vessel-review label.
    uses: flotilla-org/.github/.github/workflows/claude-review.yml@v1-canary
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    with:
      guidance: "the repository's CLAUDE.md and CODING_STANDARDS.md"
      skip_label: in-vessel-review
      model: claude-opus-5-5
    secrets: inherit
