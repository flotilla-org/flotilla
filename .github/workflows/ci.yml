name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Cached dependency artifacts pay off across runs; short-lived incremental
  # generations cost more to upload and store than they save in CI.
  CARGO_INCREMENTAL: "0"
  # Workspace crates retain file:line backtraces. Build/check commands below
  # also set profile.dev.package."*".debug=0 for third-party dependencies.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check Git operation boundary
        run: |
          python -m pip install -r ci/git-boundary/requirements.txt
          python -m unittest discover -s ci/git-boundary -p test_check.py
          python ci/git-boundary/check.py
      - name: Install temporary nightly formatter
        run: rustup toolchain install nightly-2026-03-12 --profile minimal --component rustfmt
      - name: Test Rust compiler pin contract
        run: ci/toolchain/test-pin.sh
      - name: Check Rust formatting
        run: cargo +nightly-2026-03-12 fmt --check

  script-contracts:
    name: Script contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether script inputs changed
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Pushes to main always run; PRs and merge groups run only when the
          # scripts, CI helpers, crew image or workflows they test changed.
          if [ "$EVENT" = push ] || [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(scripts/|ci/|\.flotilla/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No script, CI, crew image or workflow changes; skipping script contracts."
          fi
      - name: Read stable compiler pin
        if: steps.filter.outputs.run == 'true'
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        if: steps.filter.outputs.run == 'true'
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
      - name: Test target cache policies
        if: steps.filter.outputs.run == 'true'
        run: |
          scripts/test-prune-target.sh
          scripts/test-cargo-sweep-mtime.sh
      - name: Test fleet candidate workflow contract
        if: steps.filter.outputs.run == 'true'
        run: |
          ci/fleet-candidates/test-workflow.sh
          scripts/test-fleet-install.sh
      - name: Test crew image workflow contract
        if: steps.filter.outputs.run == 'true'
        run: ci/crew-image/test-workflow.sh
      - name: Test platform job classification
        if: steps.filter.outputs.run == 'true'
        run: ci/platform-changes/test-classify.sh

  dag-scripts:
    name: DAG scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest scripts.tests.test_dag_fetch
          python3 -m unittest scripts.tests.test_dag_compose

  codex-token-refresh:
    name: codex-token-refresh script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_codex_token_refresh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      - run: cargo --config 'profile.dev.package."*".debug=0' clippy --workspace --all-targets --locked -- -D warnings

  relay-wasm:
    name: Relay Workers target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
          targets: wasm32-unknown-unknown
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "relay-wasm"
      - run: cargo --config 'profile.dev.package."*".debug=0' build -p flotilla-relay --target wasm32-unknown-unknown --locked
      - run: cargo --config 'profile.dev.package."*".debug=0' clippy -p flotilla-relay --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - run: cargo --config 'profile.dev.package."*".debug=0' test --workspace --locked

  changes:
    name: Platform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      macos: ${{ steps.classify.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: classify
        name: Classify Windows and macOS job inputs
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Read labels live rather than from the event payload, so re-running
          # the workflow after adding ci:full honours the label. A failed
          # lookup fails safe by running both jobs.
          full_label=false
          if [ -n "$PR" ]; then
            if labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name'); then
              if printf '%s\n' "$labels" | grep -qx 'ci:full'; then full_label=true; fi
            else
              full_label=true
            fi
          fi
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            git diff "$BASE" HEAD -- '*.rs' > "$RUNNER_TEMP/changes.diff"
          else
            : > "$RUNNER_TEMP/changed-files"
            : > "$RUNNER_TEMP/changes.diff"
          fi
          ci/platform-changes/classify.sh "$EVENT" "$full_label" "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/changes.diff" | tee -a "$GITHUB_OUTPUT"

  windows-client:
    name: Windows client
    runs-on: windows-latest
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-client"
      - run: cargo --config 'profile.dev.package."*".debug=0' clippy -p flotilla-client -p flotilla-manifest -p flotilla-transport --locked -- -D warnings
      - run: cargo --config 'profile.dev.package."*".debug=0' build --bin flotilla --locked
      - name: Run the client on Windows' default 1 MiB main-thread stack
        # Building is not enough: unoptimised clap frames once overflowed the
        # main thread before `main` did anything (#2588). Without a daemon
        # endpoint, `status` must fail cleanly rather than spawn one; the grep
        # matches the refusal in flotilla-client's Windows `connect_unix_message_session`.
        shell: bash
        run: |
          target/debug/flotilla.exe --version
          if target/debug/flotilla.exe status 2> status.err; then
            echo "flotilla status unexpectedly succeeded without a daemon"; exit 1
          fi
          grep -q "no local daemon will be spawned" status.err || { cat status.err; exit 1; }
      - run: "cargo --config 'profile.dev.package.\"*\".debug=0' test -p flotilla-client --locked --lib windows_tests::"
      - name: Test SSH endpoint parsing and failure diagnostics
        run: "cargo --config 'profile.dev.package.\"*\".debug=0' test -p flotilla-client --locked --lib endpoint::"
      - name: Test remote CLI selection and mismatch refusal
        run: |
          cargo --config 'profile.dev.package."*".debug=0' test --locked --bin flotilla remote_
          cargo --config 'profile.dev.package."*".debug=0' test --locked --bin flotilla daemon_endpoint_conflicts
      - name: Test Wheelhouse named-pipe HTTP contract
        run: "cargo --config 'profile.dev.package.\"*\".debug=0' test -p flotilla-manifest --locked --lib sink::tests::"

  macos-peer-identity:
    name: macOS peer identity
    runs-on: macos-latest
    needs: [fmt, changes]
    if: needs.changes.outputs.macos == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Read stable compiler pin
        id: rust-pin
        shell: bash
        run: |
          source ci/toolchain/pin.sh
          echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust-pin.outputs.version }}
          components: rustfmt, clippy, llvm-tools-preview
      - name: Assert compiler pin
        shell: bash
        run: ci/toolchain/assert.sh
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-peer-identity"
      - run: "cargo --config 'profile.dev.package.\"*\".debug=0' test -p flotilla-daemon --locked --lib server::caller::tests::"
