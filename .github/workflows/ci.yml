name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Cached dependency artifacts pay off across runs; short-lived incremental
  # generations cost more to upload and store than they save in CI.
  CARGO_INCREMENTAL: "0"
  # CI needs file:line in backtraces, not full debuginfo — this halves
  # target size and link time for test binaries.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-12
          components: rustfmt
      - name: Test target cache policies
        run: |
          scripts/test-prune-target.sh
          scripts/test-cargo-sweep-mtime.sh
      - name: Test fleet candidate workflow contract
        run: |
          ci/fleet-candidates/test-workflow.sh
          scripts/test-fleet-install.sh
      - name: Test crew image workflow contract
        run: ci/crew-image/test-workflow.sh
      - name: Check Rust formatting
        run: cargo +nightly-2026-03-12 fmt --check

  dag-scripts:
    name: DAG scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 -m unittest scripts.tests.test_dag_fetch
          python3 -m unittest scripts.tests.test_dag_compose

  codex-token-refresh:
    name: codex-token-refresh script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m unittest scripts.tests.test_codex_token_refresh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "clippy"
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  relay-wasm:
    name: Relay Workers target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "relay-wasm"
      - run: cargo build -p flotilla-relay --target wasm32-unknown-unknown --locked
      - run: cargo clippy -p flotilla-relay --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "test"
      - run: cargo test --workspace --locked

  windows-client:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "windows-client"
      - run: cargo check --bin flotilla --locked
      - run: cargo clippy -p flotilla-client -p flotilla-manifest -p flotilla-transport --locked
      - run: cargo build --bin flotilla --locked
      - run: "cargo test -p flotilla-client --locked --lib windows_tests::"
      - name: Test Wheelhouse named-pipe HTTP contract
        run: "cargo test -p flotilla-manifest --locked --lib sink::tests::"

  macos-peer-identity:
    name: macOS peer identity
    runs-on: macos-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "macos-peer-identity"
      - run: "cargo test -p flotilla-daemon --locked --lib server::caller::tests::"
