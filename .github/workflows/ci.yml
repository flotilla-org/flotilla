name: CI

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Cached dependency artifacts pay off across runs; short-lived incremental
  # generations cost more to upload and store than they save in CI.
  CARGO_INCREMENTAL: "0"
  # Workspace crates retain file:line backtraces. Build/check commands below
  # also set profile.dev.package."*".debug=0 for third-party dependencies.
  CARGO_PROFILE_DEV_DEBUG: "line-tables-only"

jobs:
  # In a GitHub PR stack, the expensive jobs run only for the lowest unmerged
  # layer (the next to merge) and the top layer (the whole changeset). Middle
  # layers run the cheap checks; each becomes the lowest layer, and gets the
  # full run, before it merges. Merge a stack one layer at a time or whole:
  # a partial `gh stack merge` would land a middle layer without a full run.
  # The ci:full label forces the full run on any layer; it is read live, so
  # it applies to the next push or a re-run of the workflow.
  stack-scope:
    name: Stack scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
    steps:
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          full=true
          if [ "$EVENT" = pull_request ] && [ "$STACK" != null ]; then
            position=$(jq -r '.position // empty' <<<"$STACK")
            size=$(jq -r '.size // empty' <<<"$STACK")
            stack_base=$(jq -r '.base.ref // empty' <<<"$STACK")
            # A payload missing any field fails safe by running the full set.
            if [ -n "$position" ] && [ -n "$size" ] && [ -n "$stack_base" ] \
              && [ "$position" != "$size" ] && [ "$stack_base" != "$BASE_REF" ]; then
              full=false
              # A failed label lookup fails safe by running the full set.
              if ! labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name') \
                || printf '%s\n' "$labels" | grep -qx 'ci:full'; then
                full=true
              fi
            fi
            echo "stack layer $position of $size (base $BASE_REF, stack base $stack_base): full=$full"
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
        with:
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ci/git-boundary/requirements.txt
      - name: Check Git operation boundary
        run: |
          python -m pip install -r ci/git-boundary/requirements.txt
          python -m unittest discover -s ci/git-boundary -p test_check.py
          python ci/git-boundary/check.py
      - name: Test Rust compiler pin contract
        run: ci/toolchain/test-pin.sh
      - name: Check Rust formatting
        run: cargo fmt --check

  script-contracts:
    name: Script contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether script inputs changed
        id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Pushes to main always run; PRs and merge groups run only when the
          # scripts, CI helpers, crew image or workflows they test changed.
          if [ "$EVENT" = push ] || [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only "$BASE"...HEAD | grep -qE '^(scripts/|ci/|\.flotilla/|\.github/workflows/)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No script, CI, crew image or workflow changes; skipping script contracts."
          fi
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
        if: steps.filter.outputs.run == 'true'
        with:
          components: ''
      - name: Test target cache policies
        if: steps.filter.outputs.run == 'true'
        run: |
          scripts/test-prune-target.sh
          scripts/test-cargo-sweep-mtime.sh
      - name: Test fleet candidate workflow contract
        if: steps.filter.outputs.run == 'true'
        run: |
          ci/fleet-candidates/test-workflow.sh
          scripts/test-fleet-install.sh
      - name: Test crew image workflow contract
        if: steps.filter.outputs.run == 'true'
        run: ci/crew-image/test-workflow.sh
      - name: Set up Python for script contracts
        if: steps.filter.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test platform CI contracts
        if: steps.filter.outputs.run == 'true'
        run: |
          ci/platform-changes/test-classify.sh
          python3 -m unittest discover -s ci/affected -p test_job.py
          python3 -m pip install -r ci/platform-tests/requirements.txt
          ci/platform-tests/test-run.sh
          python3 -m unittest discover -s ci/toolchain -p test_action.py

  cleat-environment:
    name: Cleat launch environment contracts
    runs-on: ubuntu-24.04
    needs: stack-scope
    # Fail safe: a failed scope job leaves the output empty, which runs the job.
    if: ${{ !cancelled() && needs.stack-scope.outputs.full != 'false' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Decide whether launch inputs changed
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          if [ "$EVENT" = push ] || [ -z "$BASE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE"...HEAD | grep -qE '^(crates/.*(terminal|cleat)|crates/flotilla-core/src/providers/discovery/|crates/flotilla-core/Cargo.toml|ci/cleat-environment/|ci/fork-actions/runtime/cleat/|ci/fleet-candidates/cleat-toolchain.sh|ci/toolchain/|rust-toolchain.toml|Cargo.toml|Cargo.lock|.github/workflows/ci.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up pinned Rust
        if: steps.filter.outputs.run == 'true'
        id: rust-pin
        uses: ./ci/toolchain/action
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.filter.outputs.run == 'true'
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          shared-key: cleat-environment
          cache-workspace-crates: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Key pinned cleat binaries
        if: steps.filter.outputs.run == 'true'
        id: cleat-key
        run: echo "key=$(ci/cleat-environment/cache-key.sh)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        if: steps.filter.outputs.run == 'true'
        id: cleat-binaries
        with:
          path: ${{ runner.temp }}/cleat-environment
          key: ${{ steps.cleat-key.outputs.key }}
      - name: Build pinned old and new cleat
        if: steps.filter.outputs.run == 'true' && steps.cleat-binaries.outputs.cache-hit != 'true'
        run: |
          git clone https://github.com/flotilla-org/cleat.git "$RUNNER_TEMP/cleat-source"
          ci/cleat-environment/build.sh "$RUNNER_TEMP/cleat-source" "$RUNNER_TEMP/cleat-environment"
      - name: Run shared fake and real launch contracts
        if: steps.filter.outputs.run == 'true'
        env:
          FLOTILLA_TEST_CLEAT_OLD: ${{ runner.temp }}/cleat-environment/old/cleat
          FLOTILLA_TEST_CLEAT_NEW: ${{ runner.temp }}/cleat-environment/new/cleat
        run: |
          # Record the runner CPU: the contract binaries are cached across runners.
          grep -m1 'model name' /proc/cpuinfo
          grep -m1 -o -E 'avx512f|avx2' /proc/cpuinfo | sort -u | tr '\n' ' '; echo
          ci/cleat-environment/test.sh
      - uses: actions/upload-artifact@v4
        if: always() && steps.filter.outputs.run == 'true'
        with:
          name: cleat-environment-provenance
          path: ${{ runner.temp }}/cleat-environment/*-provenance.txt
          if-no-files-found: warn

  dag-scripts:
    name: DAG scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          python3 -m unittest scripts.tests.test_dag_fetch
          python3 -m unittest scripts.tests.test_dag_compose

  codex-token-refresh:
    name: codex-token-refresh script
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m unittest scripts.tests.test_codex_token_refresh

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - name: Select Clippy packages
        id: packages
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          GH_TOKEN: ${{ github.token }}
        run: bash ci/affected/select-job.sh
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - uses: Swatinem/rust-cache@v2
        if: steps.packages.outputs.selection != 'none'
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: "clippy"
      - if: steps.packages.outputs.selection != 'none'
        run: cargo --config 'profile.dev.package."*".debug=0' clippy --workspace --all-targets --locked -- -D warnings
      - name: Check Windows cfg paths on Linux
        if: steps.packages.outputs.selection != 'none'
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          rustup target add x86_64-pc-windows-gnu
          cargo --config 'profile.dev.package."*".debug=0' check --target x86_64-pc-windows-gnu -p flotilla-client -p flotilla-transport --all-targets --locked
          cargo --config 'profile.dev.package."*".debug=0' check --target x86_64-pc-windows-gnu -p flotilla-resources -p flotilla-protocol -p flotilla-paths -p flotilla-daemon-api --lib --locked

  relay-wasm:
    name: Relay Workers target
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: "relay-wasm"
      - run: cargo --config 'profile.dev.package."*".debug=0' build -p flotilla-relay --target wasm32-unknown-unknown --locked
      - run: cargo --config 'profile.dev.package."*".debug=0' clippy -p flotilla-relay --target wasm32-unknown-unknown --locked -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    # Normal runs take about 10 minutes. A hung test (#3097) otherwise holds a
    # runner for GitHub's six-hour default.
    timeout-minutes: 40
    needs: stack-scope
    if: ${{ !cancelled() && needs.stack-scope.outputs.full != 'false' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A pull request checks out its merge commit, whose first parent is the
      # base branch it merges into: depth 2 is enough to diff against it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      # Selection runs before the cache restore and nextest install, so a pull
      # request without Rust test inputs (selection `none`) skips both and the
      # run step reports success without compiling: Test is a required check.
      - name: Test affected-package selector
        run: python3 -m unittest discover -s ci/affected -p test_selection.py
      - name: Select test packages
        id: packages
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          STACK: ${{ toJSON(github.event.pull_request.stack) }}
          GH_TOKEN: ${{ github.token }}
        run: bash ci/affected/select-job.sh
      # Caches dependency artifacts only (workspace-member artifacts are
      # pruned before save) — the previous whole-target cache reached 4.5GB
      # and thrashed the repo's 10GB cache pool against compose's blobs.
      - if: steps.packages.outputs.selection != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # Bumped when the build profile changes: an exact key hit never saves.
          shared-key: "test-v2"
      # The action verifies the release checksum.
      - if: steps.packages.outputs.selection != 'none'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.149
      - name: Compile, run tests and run doctests (separate timings)
        env:
          SELECTION: ${{ steps.packages.outputs.selection }}
        run: ci/affected/run.sh "$SELECTION"

  changes:
    name: Platform changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      windows: ${{ steps.classify.outputs.windows }}
      macos: ${{ steps.classify.outputs.macos }}
      quint: ${{ steps.classify.outputs.quint }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        name: Classify Windows, macOS and Quint job inputs
        env:
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          # In a PR stack, diff against the stack's base so the top layer's
          # platform jobs cover the whole changeset.
          BASE: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          # Read labels live rather than from the event payload, so re-running
          # the workflow after adding ci:full honours the label. A failed
          # lookup fails safe by running both jobs.
          full_label=false
          if [ -n "$PR" ]; then
            if labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name'); then
              if printf '%s\n' "$labels" | grep -qx 'ci:full'; then full_label=true; fi
            else
              full_label=true
            fi
          fi
          if [ -n "$BASE" ]; then
            git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
            git diff "$BASE" HEAD -- '*.rs' > "$RUNNER_TEMP/changes.diff"
          else
            : > "$RUNNER_TEMP/changed-files"
            : > "$RUNNER_TEMP/changes.diff"
          fi
          ci/platform-changes/classify.sh "$EVENT" "$full_label" "$RUNNER_TEMP/changed-files" "$RUNNER_TEMP/changes.diff" | tee -a "$GITHUB_OUTPUT"

  quint-scenarios:
    name: Quint scenarios
    runs-on: ubuntu-latest
    needs: [changes, stack-scope]
    if: ${{ !cancelled() && needs.changes.outputs.quint == 'true' && needs.stack-scope.outputs.full != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: echo "QUINT_RUN_DIR=$RUNNER_TEMP/quint-fast" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.quint
          key: quint-0.33.0-apalache-0.62.1
      - name: Install pinned Quint
        run: |
          npm install --prefix "$RUNNER_TEMP/quint" @informalsystems/quint@0.33.0
          echo "$RUNNER_TEMP/quint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check scenarios
        run: ci/quint/with-server.sh specs/primitives/check.sh --part scenarios
      - uses: actions/upload-artifact@v4
        with:
          name: quint-scenarios
          path: ${{ runner.temp }}/quint-fast/*.itf.json
          if-no-files-found: error
          retention-days: 1

  quint-graphs:
    name: Quint graph export
    runs-on: ubuntu-latest
    needs: [changes, stack-scope]
    if: ${{ !cancelled() && needs.changes.outputs.quint == 'true' && needs.stack-scope.outputs.full != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: echo "QUINT_RUN_DIR=$RUNNER_TEMP/quint-fast" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.quint
          key: quint-0.33.0-apalache-0.62.1
      - name: Install pinned Quint
        run: |
          npm install --prefix "$RUNNER_TEMP/quint" @informalsystems/quint@0.33.0
          echo "$RUNNER_TEMP/quint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check graph export
        run: ci/quint/with-server.sh specs/primitives/check.sh --part graphs
      - uses: actions/upload-artifact@v4
        with:
          name: quint-graphs
          path: ${{ runner.temp }}/quint-fast/graphs/*.graph.json
          if-no-files-found: error
          retention-days: 1

  quint-mutants:
    name: Quint mutants
    runs-on: ubuntu-latest
    needs: [changes, stack-scope]
    if: ${{ !cancelled() && needs.changes.outputs.quint == 'true' && needs.stack-scope.outputs.full != 'false' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: echo "QUINT_RUN_DIR=$RUNNER_TEMP/quint-fast" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.quint
          key: quint-0.33.0-apalache-0.62.1
      - name: Install pinned Quint
        run: |
          npm install --prefix "$RUNNER_TEMP/quint" @informalsystems/quint@0.33.0
          echo "$RUNNER_TEMP/quint/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Check mutants
        run: ci/quint/with-server.sh specs/primitives/check.sh --part mutants
      - name: Check runner contracts
        run: specs/primitives/check.sh --part contracts

  quint-engine:
    name: Quint engine conformance
    runs-on: ubuntu-latest
    needs: [quint-scenarios, quint-graphs]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: echo "QUINT_RUN_DIR=$RUNNER_TEMP/quint-fast" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ steps.rust-pin.outputs.version }}
          # rust-cache's key hashes only the lockfile and manifests. Include
          # the other inputs' content in shared-key (which overrides key) so
          # main can save a fresh immutable cache when any of them change.
          shared-key: quint-engine-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml', 'ci/quint/**', 'specs/primitives/*conformance.sh', 'specs/primitives/check.sh') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: quint-scenarios
          path: ${{ runner.temp }}/quint-fast
      - uses: actions/download-artifact@v4
        with:
          name: quint-graphs
          path: ${{ runner.temp }}/quint-fast/graphs
      - name: Check engine conformance and replay
        run: specs/primitives/check.sh --part engine

  quint-store:
    name: Quint store conformance
    runs-on: ubuntu-latest
    needs: [quint-scenarios, quint-graphs]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: echo "QUINT_RUN_DIR=$RUNNER_TEMP/quint-fast" >> "$GITHUB_ENV"
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust-${{ steps.rust-pin.outputs.version }}
          # rust-cache's key hashes only the lockfile and manifests. Include
          # the other inputs' content in shared-key (which overrides key) so
          # main can save a fresh immutable cache when any of them change.
          shared-key: quint-store-${{ hashFiles('.github/workflows/ci.yml', 'Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', '.cargo/config.toml', 'ci/quint/**', 'specs/primitives/*conformance.sh', 'specs/primitives/check.sh') }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/download-artifact@v4
        with:
          name: quint-scenarios
          path: ${{ runner.temp }}/quint-fast
      - uses: actions/download-artifact@v4
        with:
          name: quint-graphs
          path: ${{ runner.temp }}/quint-fast/graphs
      - name: Check store conformance and replay
        run: specs/primitives/store-conformance.sh "$QUINT_RUN_DIR"

  quint:
    # Preserve the required-check name. Every selected shard must succeed;
    # always() also runs this gate when a failed producer skips its consumers.
    name: Quint quick tier
    runs-on: ubuntu-latest
    needs: [changes, stack-scope, quint-scenarios, quint-graphs, quint-mutants, quint-engine, quint-store]
    if: ${{ always() }}
    steps:
      - name: Require every selected Quint part
        env:
          SELECTED: ${{ needs.changes.outputs.quint }}
          FULL: ${{ needs.stack-scope.outputs.full }}
          RESULTS: ${{ toJSON(needs) }}
        run: |
          if [ "$SELECTED" = true ] && [ "$FULL" != false ]; then
            jq -e '[to_entries[] | select(.key | startswith("quint-")) | .value.result] | length > 0 and all(. == "success")' <<< "$RESULTS"
          fi

  windows-client:
    name: Windows client
    env:
      RUSTFLAGS: "-D warnings"
    runs-on: windows-latest
    needs: [changes, stack-scope]
    if: ${{ !cancelled() && needs.changes.outputs.windows == 'true' && needs.stack-scope.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          shared-key: "windows-client"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo --config 'profile.dev.package."*".debug=0' clippy -p flotilla-client -p flotilla-manifest -p flotilla-transport --locked -- -D warnings
      - run: cargo --config 'profile.dev.package."*".debug=0' build --bin flotilla --locked
      - name: Run the client on Windows' default 1 MiB main-thread stack
        # Building is not enough: unoptimised clap frames once overflowed the
        # main thread before `main` did anything (#2588). Without a daemon
        # endpoint, `status` must fail cleanly rather than spawn one; the grep
        # matches the refusal in flotilla-client's Windows `connect_unix_message_session`.
        shell: bash
        run: |
          target/debug/flotilla.exe --version
          if target/debug/flotilla.exe status 2> status.err; then
            echo "flotilla status unexpectedly succeeded without a daemon"; exit 1
          fi
          grep -q "no local daemon will be spawned" status.err || { cat status.err; exit 1; }
      - name: Check TUI targets
        run: cargo --config 'profile.dev.package."*".debug=0' check -p flotilla-tui --all-targets --locked
      - name: Run selected Windows tests
        shell: bash
        run: ci/platform-tests/run.sh windows

  macos-peer-identity:
    name: macOS peer identity
    runs-on: macos-latest
    needs: [fmt, changes, stack-scope]
    if: ${{ !cancelled() && needs.fmt.result == 'success' && needs.changes.outputs.macos == 'true' && needs.stack-scope.outputs.full != 'false' }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up pinned Rust
        id: rust-pin
        uses: ./ci/toolchain/action
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ steps.rust-pin.outputs.version }}
          shared-key: "macos-peer-identity"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Run selected macOS tests
        shell: bash
        run: |
          SELECTOR_TEST_BASH=/bin/bash ci/platform-tests/test-run.sh
          ci/platform-tests/run.sh macos
