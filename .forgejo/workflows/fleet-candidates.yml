name: Build fleet candidates

on:
  workflow_dispatch:
    inputs:
      flotilla_sha:
        description: Exact 40-character commit from flotilla-org/flotilla
        required: true
        type: string
      cleat_sha:
        description: Exact 40-character commit from flotilla-org/cleat
        required: true
        type: string
      mattpocock_skills_sha:
        description: Exact 40-character commit from the lab mattpocock-skills fork
        required: true
        type: string
      rjw_skills_sha:
        description: Exact 40-character commit from the lab rjw-skills fork
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fleet-candidates-${{ inputs.flotilla_sha }}-${{ inputs.cleat_sha }}-${{ inputs.mattpocock_skills_sha }}-${{ inputs.rjw_skills_sha }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  FLEET_ORCHESTRATION_SHA: ${{ forgejo.sha }}
  FLEET_FLOTILLA_SHA: ${{ inputs.flotilla_sha }}
  FLEET_CLEAT_SHA: ${{ inputs.cleat_sha }}
  FLEET_MATTPOCOCK_SKILLS_SHA: ${{ inputs.mattpocock_skills_sha }}
  FLEET_RJW_SKILLS_SHA: ${{ inputs.rjw_skills_sha }}

jobs:
  linux:
    name: Linux x86_64 candidate
    runs-on: debian-12
    timeout-minutes: 120
    steps:
      - name: Bootstrap the pinned worker environment
        shell: bash
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install --no-install-recommends --yes \
            build-essential ca-certificates clang cmake curl git nodejs \
            patchelf pkg-config python3 xz-utils

          git init orchestration
          git -C orchestration remote add origin https://github.com/flotilla-org/flotilla.git
          git -C orchestration fetch --depth=1 origin "$FLEET_ORCHESTRATION_SHA"
          test "$(git -C orchestration rev-parse FETCH_HEAD)" = "$FLEET_ORCHESTRATION_SHA"
          git -C orchestration checkout --detach FETCH_HEAD

      - name: Restore dependency and compiler caches
        uses: https://code.forgejo.org/actions/cache/restore@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            .fleet-cache/toolchains
            .fleet-cache/cargo
            sources/flotilla/target
            sources/cleat/target
            sources/cleat/.tools/ghostty-src/.zig-cache
          key: fleet-linux-v1-${{ inputs.flotilla_sha }}-${{ inputs.cleat_sha }}
          restore-keys: |
            fleet-linux-v1-

      - name: Build and verify the coordinated candidate
        env:
          # Read-only access to private pinned skill sources; no project write scope.
          GH_TOKEN: ${{ secrets.SKILL_SOURCES_READ_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          source orchestration/ci/fleet-candidates/setup-linux-toolchain.sh
          orchestration/ci/fleet-candidates/build-candidate.sh

      - name: Validate project-map manifests against the Linux candidate
        shell: bash
        env:
          # project-map lives on lab Forgejo. The token belongs to the read-only
          # fleet-reader account, which needs read access to robert/project-map.
          PROJECT_MAP_READ_USER: fleet-reader
          PROJECT_MAP_READ_TOKEN: ${{ secrets.PROJECT_MAP_READ_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$PROJECT_MAP_READ_TOKEN"
          git init project-map
          git -C project-map remote add origin https://forgejo.lab.flotilla.work/robert/project-map.git
          auth="AUTHORIZATION: basic $(printf '%s:%s' "$PROJECT_MAP_READ_USER" "$PROJECT_MAP_READ_TOKEN" | base64 -w 0)"
          GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0=http.https://forgejo.lab.flotilla.work/.extraheader \
            GIT_CONFIG_VALUE_0="$auth" \
            git -C project-map fetch --depth=1 origin main
          git -C project-map checkout --detach FETCH_HEAD
          # build-candidate.sh removes the staged bundle after archiving it, so
          # validate with the binary from the archive that will be promoted.
          candidate_root="$(mktemp -d)"
          tar -C "$candidate_root" -xzf dist/fleet-candidate-linux-x86_64-gnu2.36.tar.gz
          "$candidate_root/fleet-candidate-linux-x86_64-gnu2.36/bin/flotilla" resource validate project-map/flotilla-manifests/ \
            --skill-catalog "$candidate_root/fleet-candidate-linux-x86_64-gnu2.36/share/flotilla/skills/.flotilla-skill-catalog.json"

      - name: Upload seven-day Linux candidate
        uses: https://code.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: fleet-candidate-linux-x86_64-gnu2.36
          path: dist/
          retention-days: 7
          if-no-files-found: error

      - name: Save dependency and compiler caches
        if: always()
        uses: https://code.forgejo.org/actions/cache/save@6f8efc29b200d32929f49075959781ed54ec270c
        with:
          path: |
            .fleet-cache/toolchains
            .fleet-cache/cargo
            sources/flotilla/target
            sources/cleat/target
            sources/cleat/.tools/ghostty-src/.zig-cache
          key: fleet-linux-v1-${{ inputs.flotilla_sha }}-${{ inputs.cleat_sha }}

  darwin:
    name: Darwin arm64 candidate
    runs-on: darwin-aarch64
    timeout-minutes: 120
    steps:
      - name: Check out the orchestration scripts
        shell: /bin/bash -e {0}
        run: |
          set -euo pipefail
          git init orchestration
          git -C orchestration remote add origin https://github.com/flotilla-org/flotilla.git
          git -C orchestration fetch --depth=1 origin "$FLEET_ORCHESTRATION_SHA"
          test "$(git -C orchestration rev-parse FETCH_HEAD)" = "$FLEET_ORCHESTRATION_SHA"
          git -C orchestration checkout --detach FETCH_HEAD

      - name: Verify the credential-free worker
        shell: /bin/bash -e {0}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          security find-identity -v -p codesigning | grep -Eq '^[[:space:]]*0 valid identities found[[:space:]]*$'
          test -z "${FLEET_CODESIGN_IDENTITY:-}"
          test -z "${FORGEJO_ADMIN_TOKEN:-}"

      - name: Build and verify the coordinated candidate
        env:
          # Read-only access to private pinned skill sources; no project write scope.
          GH_TOKEN: ${{ secrets.SKILL_SOURCES_READ_TOKEN }}
        shell: /bin/bash -e {0}
        run: orchestration/ci/fleet-candidates/build-candidate.sh

      - name: Upload seven-day Darwin candidate
        uses: https://code.forgejo.org/actions/upload-artifact@a8a3f3ad30e3422c9c7b888a15615d19a852ae32
        with:
          name: fleet-candidate-darwin-aarch64
          path: dist/
          retention-days: 7
          if-no-files-found: error
