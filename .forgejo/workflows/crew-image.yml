name: Build crew image

on:
  workflow_dispatch:
    inputs:
      codex_version:
        description: '@openai/codex npm version'
        required: true
        type: string
        default: '0.156.1'
      claude_code_version:
        description: '@anthropic-ai/claude-code npm version'
        required: true
        type: string
        default: '2.1.280'
      tea_version:
        description: tea (Forgejo/Gitea CLI) release version
        required: true
        type: string
        default: '0.16.0'
      cleat_ref:
        description: Exact 40-character commit from flotilla-org/cleat
        required: true
        type: string
        default: '2f154566eb0e5ea3e70abbda2327f211ea183c2b'
      zig_version:
        description: "Zig version matching cleat_ref's ghostty-vt toolchain pin (see issue 1881)"
        required: true
        type: string
        default: '0.16.0'

permissions:
  contents: read

concurrency:
  group: crew-image-${{ inputs.codex_version }}-${{ inputs.claude_code_version }}-${{ inputs.tea_version }}-${{ inputs.cleat_ref }}-${{ inputs.zig_version }}
  cancel-in-progress: false

env:
  CREW_IMAGE_REPOSITORY: forgejo.lab.flotilla.work/image-builder/flotilla-crew

jobs:
  build:
    name: Build and push the crew image
    runs-on: crew-image-builder
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: https://data.forgejo.org/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Verify the buildx builder covers both platforms
        shell: bash
        run: |
          set -euo pipefail
          inspection="$(docker buildx inspect --bootstrap)"
          echo "$inspection"
          echo "$inspection" | grep -q 'linux/amd64'
          echo "$inspection" | grep -q 'linux/arm64'

      # The tag must be collision-proof against two same-day, same-commit
      # dispatches that differ only in their version inputs (the primary use
      # case docs/crew-image.md describes: "a routine bump is just
      # overriding the one input that changed"). Folding an input hash in
      # keeps distinct content from ever landing under one tag, without a
      # registry round-trip to allocate a sequence number.
      - name: Compute the release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          short_sha="$(printf '%s' "${FORGEJO_SHA}" | cut -c1-8)"
          input_hash="$(
            printf '%s\n' \
              "$CODEX_VERSION" "$CLAUDE_CODE_VERSION" "$TEA_VERSION" "$CLEAT_REF" "$ZIG_VERSION" \
              | sha256sum | cut -c1-8
          )"
          tag="$(date -u +%Y-%m-%d).${short_sha}.${input_hash}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
        env:
          FORGEJO_SHA: ${{ forgejo.sha }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          TEA_VERSION: ${{ inputs.tea_version }}
          CLEAT_REF: ${{ inputs.cleat_ref }}
          ZIG_VERSION: ${{ inputs.zig_version }}

      - name: Log in to the lab registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "${IMAGE_BUILDER_TOKEN}" \
            | docker login forgejo.lab.flotilla.work --username image-builder --password-stdin
        env:
          IMAGE_BUILDER_TOKEN: ${{ secrets.IMAGE_BUILDER_TOKEN }}

      # Dispatch inputs are free-form strings from workflow_dispatch. Pass
      # them through env: and reference as "$VAR" rather than interpolating
      # "${{ inputs.* }}" straight into this script's text — the latter
      # would let a crafted input break out of the --build-arg literal and
      # execute arbitrary commands on this host-execution runner, which also
      # holds the just-logged-in registry credential.
      - name: Build and push the multi-arch crew image
        shell: bash
        run: |
          set -euo pipefail
          image="${CREW_IMAGE_REPOSITORY}:${IMAGE_TAG}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file .flotilla/Dockerfile.crew \
            --build-arg CODEX_VERSION="${CODEX_VERSION}" \
            --build-arg CLAUDE_CODE_VERSION="${CLAUDE_CODE_VERSION}" \
            --build-arg TEA_VERSION="${TEA_VERSION}" \
            --build-arg CLEAT_REF="${CLEAT_REF}" \
            --build-arg ZIG_VERSION="${ZIG_VERSION}" \
            --tag "$image" \
            --push \
            .
          echo "CREW_IMAGE=${image}" >> "$GITHUB_ENV"
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          CODEX_VERSION: ${{ inputs.codex_version }}
          CLAUDE_CODE_VERSION: ${{ inputs.claude_code_version }}
          TEA_VERSION: ${{ inputs.tea_version }}
          CLEAT_REF: ${{ inputs.cleat_ref }}
          ZIG_VERSION: ${{ inputs.zig_version }}

      # The Dockerfile's own build-time RUN steps (claude/codex/tea --version,
      # the clang+lld C-toolchain link-and-run check) already gate every
      # platform during the build above. This step re-pulls the pushed
      # manifest and re-runs the adapter checks against the exact bytes that
      # were published, on the runner's native architecture.
      - name: Verify the pushed image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "$CREW_IMAGE"
          docker run --rm "$CREW_IMAGE" claude --version
          docker run --rm "$CREW_IMAGE" codex --version
          docker run --rm "$CREW_IMAGE" tea --version
          docker run --rm "$CREW_IMAGE" python3 --version
          # Crew runs with a host-mapped, non-root UID. Exercise lookup and an
          # ordinary curses consumer there, without setting TERM globally.
          docker run --rm --user 12345:12345 "$CREW_IMAGE" sh -c '
            set -eu
            infocmp xterm-ghostty >/dev/null
            infocmp xterm-256color >/dev/null
            TERM=xterm-ghostty python3 -c "import curses; curses.setupterm(); assert curses.tigetnum(\"colors\") >= 256"
            TERM=xterm-256color python3 -c "import curses; curses.setupterm(); assert curses.tigetnum(\"colors\") >= 256"
          '

      - name: Report the pushed tag
        shell: bash
        run: |
          set -euo pipefail
          echo "Pushed ${CREW_IMAGE}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "The fleet crew-image baseline bump (one apply) is a follow-on, human-triggered step; see docs/crew-image.md." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # This is a host-execution runner (RUNNERS.md §4), not a fresh
      # container per run: without this, the token docker login wrote to
      # this account's ~/.docker/config.json would persist on disk across
      # dispatches instead of living only for this job.
      - name: Log out of the lab registry
        if: always()
        shell: bash
        run: docker logout forgejo.lab.flotilla.work
