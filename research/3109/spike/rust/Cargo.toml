[package]
name = "convoy-spike"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Deliberately drifted implementation, to prove the MBT link fails on drift.
mutant = []
# Over-permissive drift: abandon accepted from Landed (I6). MBT cannot see it.
mutant_abandon_landed = []

[dependencies]

[dev-dependencies]
quint-connect = "0.1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
stateright = "0.31"
