name: Pinned Rust setup
description: Install the repository compiler pin and assert the active compiler
inputs:
  components:
    description: Additional rustup components (comma-separated)
    default: rustfmt, clippy, llvm-tools-preview
  targets:
    description: Additional rustup targets (comma-separated)
    default: ''
outputs:
  version:
    description: Exact compiler version from rust-toolchain.toml
    value: ${{ steps.pin.outputs.version }}
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: |
        source ci/toolchain/pin.sh
        echo "version=$(read_rust_pin rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.version }}
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}
    - shell: bash
      run: ci/toolchain/assert.sh
