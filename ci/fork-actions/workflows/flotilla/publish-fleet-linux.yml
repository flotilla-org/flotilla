name: Publish fleet artifacts (Linux)

on:
  push:
    branches:
      - main

concurrency:
  group: fleet-release-${{ forgejo.repository }}-${{ forgejo.sha }}-linux
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"
  FLEET_REPOSITORY: ${{ forgejo.repository }}
  FLEET_COMMIT_SHA: ${{ forgejo.sha }}
  FLEET_SERVER_URL: ${{ forgejo.server_url }}
  FLEET_API_URL: ${{ forgejo.api_url }}

jobs:
  linux:
    name: Linux x86_64
    runs-on: fleet-release-linux-x64
    timeout-minutes: 30
    steps:
      - name: Verify release runner capability
        run: |
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64

      - name: Check out exact source revision
        uses: https://data.forgejo.org/actions/checkout@v6
        with:
          clean: false
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ forgejo.sha }}

      - name: Verify and clean source revision
        run: |
          test "$(git rev-parse HEAD)" = "$FLEET_COMMIT_SHA"
          git clean -ffdx -e target/

      - name: Build debug-profile binaries
        run: |
          FLOTILLA_BUILD_ID=$(git rev-parse --short=12 "$FLEET_COMMIT_SHA")
          export FLOTILLA_BUILD_ID
          cargo +stable build --locked --bin flotilla --bin flotillad

      - name: Test and describe artifacts
        run: |
          RELEASE_TAG="fleet-$FLEET_COMMIT_SHA"
          WIRE_GENERATION=$(git rev-parse --short=12 "$FLEET_COMMIT_SHA")
          mkdir -p dist
          install -m 0755 target/debug/flotilla dist/flotilla-linux-x86_64
          install -m 0755 target/debug/flotillad dist/flotillad-linux-x86_64
          dist/flotilla-linux-x86_64 --version | grep -F "wire=${WIRE_GENERATION}"
          dist/flotillad-linux-x86_64 --version | grep -F "wire=${WIRE_GENERATION}"
          ci/fork-actions/runtime/write-artifact-metadata.sh \
            dist/flotilla-linux-x86_64 \
            dist/flotilla-linux-x86_64.json \
            "$FLEET_REPOSITORY" "$FLEET_COMMIT_SHA" "$RELEASE_TAG" \
            linux-x86_64 "$WIRE_GENERATION" false
          ci/fork-actions/runtime/write-artifact-metadata.sh \
            dist/flotillad-linux-x86_64 \
            dist/flotillad-linux-x86_64.json \
            "$FLEET_REPOSITORY" "$FLEET_COMMIT_SHA" "$RELEASE_TAG" \
            linux-x86_64 "$WIRE_GENERATION" false

      # Publishing adapter: all Forgejo release creation and asset upload is isolated here.
      - name: Publish Forgejo Release assets
        env:
          FORGEJO_TOKEN: ${{ forgejo.token }}
        run: |
          ci/fork-actions/runtime/publish-forgejo-release.sh \
            --expect flotilla-linux-x86_64 \
            --expect flotilla-linux-x86_64.json \
            --expect flotillad-linux-x86_64 \
            --expect flotillad-linux-x86_64.json \
            --expect flotilla-darwin-arm64 \
            --expect flotilla-darwin-arm64.json \
            --expect flotillad-darwin-arm64 \
            --expect flotillad-darwin-arm64.json \
            -- dist/*
